name: AudioNaut beta
on:
  pull_request:
    paths:
      - 'xtrata-2.0/public/audionaut-beta/**'
      - 'xtrata-2.0/src/audionaut-beta/**'
      - 'xtrata-2.0/functions/audionaut-beta/**'
      - 'xtrata-2.0/functions/api/audionaut-beta/**'
      - 'xtrata-2.0/vite.audionaut-beta.config.ts'
      - '.github/workflows/audionaut-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta-workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: xtrata-2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xtrata-2.0/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:audionaut-beta
      - run: node public/audionaut-beta/tools/pro-suite.mjs
