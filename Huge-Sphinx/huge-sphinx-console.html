<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huge Sphinx — AIBTC Console</title>
<script src="cp-archive.js"></script>
<script src="outreach-queue.js"></script>
<style>
  :root{
    --bg:#0c0e14; --panel:#141823; --panel2:#1b2030; --line:#252b3b; --line2:#323a4f;
    --text:#e6e9f0; --dim:#8a93a6; --accent:#f7931a; --accent2:#5b8cff;
    --good:#3fb950; --bad:#f85149; --warn:#d29922; --chip:#222838;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent2);text-decoration:none} a:hover{text-decoration:underline}
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
  .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#b3610a);display:flex;align-items:center;justify-content:center;font-weight:700;color:#1a1300}
  header h1{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
  .addr{font:11px ui-monospace,Menlo,monospace;color:var(--dim)}
  .grow{flex:1}
  .pill{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--chip);border:1px solid var(--line)}
  .pill.genesis{color:#1a1300;background:var(--accent);border-color:var(--accent)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:7px 12px;border-radius:8px}
  button:hover{border-color:var(--accent2)}
  button.primary{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:600}
  button.ghost{background:transparent;border-color:var(--line)}
  button.sm{padding:4px 9px;font-size:12px}
  nav{display:flex;gap:4px;padding:10px 20px 0;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
  .navgroup{display:flex;gap:4px;align-items:center}
  .navsep{width:1px;height:22px;background:var(--line2);margin:0 8px;align-self:center}
  .tab{padding:8px 13px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;color:var(--dim);cursor:pointer;user-select:none;font-size:13px;white-space:nowrap}
  .tab.active{color:var(--text);background:var(--bg);border-color:var(--line2)}
  .tab .count{font-size:11px;color:var(--dim);margin-left:5px;background:var(--chip);padding:1px 6px;border-radius:999px}
  .tab.active .count{color:var(--accent)}
  main{padding:18px 20px 80px;max-width:1080px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .muted{color:var(--dim)} .empty{padding:44px;text-align:center;color:var(--dim)}
  h2{font-size:17px;margin:2px 0 2px} h3{font-size:15px} h4{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 14px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .stat{display:inline-flex;flex-direction:column;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
  .stat b{font-size:18px} .stat span{font-size:11px;color:var(--dim)}
  .msg{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel2)}
  .msg .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--dim);margin-bottom:6px;flex-wrap:wrap}
  .name{font-weight:600;color:var(--text)}
  .tag{font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);text-transform:uppercase;letter-spacing:.04em}
  .tag.out{color:var(--accent2);border-color:#2c3a63;background:#101a33}
  .tag.in{color:var(--good);border-color:#1e3a25;background:#0f1f14}
  .tag.t1{color:var(--accent);border-color:#5a4012;background:#241a07}
  .tag.t2{color:#c79bff;border-color:#3d2a5a;background:#1a1226}
  .tag.t3{color:#7fd1ff;border-color:#214a5e;background:#08222e}
  .tag.sent{color:var(--good);border-color:#1e3a25;background:#0f1f14}
  .tag.skip{color:var(--dim)}
  .agent-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .agent-row:last-child{border-bottom:none}
  .avatar{width:32px;height:32px;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex-shrink:0}
  input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--text);border-radius:8px;padding:9px 11px;font:inherit}
  textarea{min-height:96px;resize:vertical;line-height:1.5}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
  .codeblock{background:#05070c;border:1px solid var(--line2);border-radius:8px;padding:12px;font:12px ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;color:#c8d1e0;margin-top:8px}
  .banner{display:none;background:#2a1212;border:1px solid #5a2020;color:#ffd7d7;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
  .qcard{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--panel2)}
  .qcard.done{opacity:.62}
  .qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .qhead .who{font-weight:600}
  .chip-btn{padding:4px 10px;border-radius:999px;font-size:12px}
  .filterbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .filterbar .f{padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);cursor:pointer;font-size:12px}
  .filterbar .f.on{color:var(--text);border-color:var(--accent2);background:#0f1733}
  small.mono{font:11px ui-monospace,Menlo,monospace;color:var(--dim);word-break:break-all}
  .hidden{display:none}
  details.help{background:linear-gradient(180deg,#15203a,#141823);border:1px solid var(--line2);border-radius:12px;margin-bottom:16px;overflow:hidden}
  details.help summary{padding:12px 16px;font-weight:600;color:var(--accent2);outline:none}
  details.help[open] summary{border-bottom:1px solid var(--line)}
  details.help .body{padding:12px 16px 14px;color:var(--dim);font-size:13px}
  details.help .body b{color:var(--text)} details.help .body code{background:#05070c;padding:1px 5px;border-radius:4px;color:#c8d1e0;font-size:12px}
  details.help .body ul{margin:8px 0;padding-left:4px;list-style:none}
  details.help .body li{margin:7px 0;padding-left:20px;position:relative}
  details.help .body li:before{content:"›";position:absolute;left:4px;color:var(--accent)}
  details.help .body .kbd{display:inline-block;background:var(--chip);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--text)}
  .balancebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 20px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .bal{display:flex;align-items:baseline;gap:8px;padding:6px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
  .bal .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .bal .v{font-weight:700;font-size:15px} .bal .s{font-size:11px;color:var(--dim)}
  .rowbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .seg-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  details>summary{list-style:none;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="logo">HS</div>
  <div>
    <h1>Huge Sphinx <span class="pill genesis">Genesis · L2</span></h1>
    <div class="addr">SP13G0F3E48HDK7MMRYXDHQ4RTACKDN5FSV9VEPRC · bc1q2knw…sw0l</div>
  </div>
  <div class="grow"></div>
  <span class="pill" id="livechip" title="">● …</span>
  <span class="muted" id="updated"></span>
  <label class="muted" style="display:flex;align-items:center;gap:6px;margin:0;font-size:13px"><input type="checkbox" id="autoref" style="width:auto"> auto-refresh</label>
  <button class="primary" data-action="refresh">↻ Refresh</button>
</header>

<nav id="nav"></nav>
<div id="balancebar" class="balancebar"><span class="muted" style="font-size:12px">loading balances…</span></div>
<main>
  <div class="banner" id="banner"></div>
  <div id="view"></div>
</main>

<script>
const HS = { name:'Huge Sphinx', stx:'SP13G0F3E48HDK7MMRYXDHQ4RTACKDN5FSV9VEPRC', btc:'bc1q2knwqf77vp9mhru20hqnrxg00hgzmrpjxxsw0l' };
const API = (location.protocol==='http:'||location.protocol==='https:') ? '/api' : 'https://aibtc.com/api';
const LS = { msgs:'hs_archive_msgs', queue:'hs_queue', compose:'hs_compose' };

let state = {
  tab:'queue', inbox:null, outbox:null,
  agents:[], agentsOffset:0, agentsTotal:null, search:'',
  allAgents:null, scanning:false, scanProgress:0, openSeg:{},
  qfilter:'all', compose:loadLS(LS.compose)||{to:'',body:''}, live:null
};
const liveWallet = ()=> state.live && state.live.walletLoaded;
const livePaid   = ()=> state.live && state.live.walletLoaded && state.live.paidEnabled && state.live.x402Available;
async function loadLive(){ try{ state.live=await fetch('/local/status').then(r=>r.json()); }catch{ state.live={walletLoaded:false}; } renderLiveChip(); renderView(); }
function renderLiveChip(){ const el=$('#livechip'); if(!el)return; const L=state.live;
  if(!L||!L.walletLoaded){ el.textContent='● read-only'; el.style.color='var(--dim)'; el.title=(L&&L.walletError)||'Start the server with WALLET_MNEMONIC to send from the UI'; }
  else if(L.paidEnabled&&L.x402Available){ el.textContent='⚡ live send on'; el.style.color='var(--good)'; el.title='Replies (free) + paid sends (100 sats) enabled'; }
  else if(L.paidEnabled&&!L.x402Available){ el.textContent='↩ replies on'; el.style.color='var(--accent2)'; el.title='Paid sends need: npm install x402-stacks'; }
  else { el.textContent='↩ replies on'; el.style.color='var(--accent2)'; el.title='Free replies enabled. Restart with ALLOW_PAID_SEND=1 for paid sends.'; }
}

const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shortAddr = a => a ? a.slice(0,6)+'…'+a.slice(-4) : '';
const fmt = t => { try{ return new Date(t).toLocaleString(); }catch{ return t||''; } };
const initials = n => (n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function loadLS(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch{ return null; } }
function saveLS(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }

async function api(path){
  const r = await fetch(API+path,{headers:{accept:'application/json'}});
  if(!r.ok && r.status!==404) throw new Error('HTTP '+r.status);
  return r.json();
}
function showBanner(h){ const b=$('#banner'); b.style.display='block'; b.innerHTML=h; }
function clearBanner(){ $('#banner').style.display='none'; }

/* ---------------- data loads ---------------- */
async function loadInbox(){ const d=await api('/inbox/'+HS.stx+'?view=all&limit=100'); state.inbox=d.inbox||d; archiveMessages(state.inbox.messages||[]); }
async function loadOutbox(){ try{ const d=await api('/outbox/'+HS.stx+'?limit=100'); state.outbox=d.outbox||d; }catch{ state.outbox={replies:[]}; } }
async function loadAgents(reset){ if(reset){state.agents=[];state.agentsOffset=0;} const d=await api('/agents?limit=50&offset='+state.agentsOffset); state.agents=state.agents.concat(d.agents||[]); state.agentsTotal=d.pagination?.total??state.agents.length; state.agentsOffset+=(d.agents||[]).length; }
function archiveMessages(list){ const s=loadLS(LS.msgs)||{}; for(const m of list){ const id=m.id||m.messageId; if(id) s[id]={...m,_a:Date.now()}; } saveLS(LS.msgs,s); }
async function loadBalances(){
  const bar=$('#balancebar'); if(!bar) return;
  try{
    const d=await fetch('https://api.hiro.so/extended/v1/address/'+HS.stx+'/balances').then(r=>r.json());
    const stx=Number(d.stx?.balance||0)/1e6, ft=d.fungible_tokens||{};
    const pick=sub=>{ const k=Object.keys(ft).find(k=>k.toLowerCase().includes(sub)); return k?Number(ft[k].balance||0):0; };
    const sbtc=pick('sbtc'), usdc=pick('usdc'); state.sbtc=sbtc;
    const tile=(l,v,s)=>`<div class="bal"><span class="l">${l}</span><span class="v">${v}</span><span class="s">${s}</span></div>`;
    bar.innerHTML =
      tile('STX', stx.toLocaleString(undefined,{maximumFractionDigits:2}), 'for gas')+
      tile('sBTC', sbtc.toLocaleString()+' sats', '≈ '+(sbtc/1e8).toFixed(8)+' BTC · '+Math.floor(sbtc/100)+' new msgs')+
      tile('USDCx', (usdc/1e6).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}), 'stablecoin')+
      `<span class="muted" style="font-size:11px;margin-left:auto">Huge Sphinx · live from chain</span>`;
  }catch(e){ bar.innerHTML='<span class="muted" style="font-size:12px">balances unavailable ('+esc(e.message)+')</span>'; }
}
async function refreshAll(){
  clearBanner();
  loadBalances();
  try{ await Promise.all([loadInbox(),loadOutbox()]); $('#updated').textContent='updated '+new Date().toLocaleTimeString(); }
  catch(e){ showBanner('⚠️ Could not reach the AIBTC API (<b>'+esc(e.message)+'</b>). The API has no CORS headers — run <code>node console-server.mjs</code> in this folder and open <a href="http://localhost:8777/huge-sphinx-console.html">localhost:8777</a>.'); }
  renderView();
}

/* ---------------- queue model ---------------- */
function qOverrides(){ return loadLS(LS.queue)||{}; }
function setQ(id,patch){ const o=qOverrides(); o[id]={...(o[id]||{}),...patch}; saveLS(LS.queue,o); }
function queueItems(){
  const ov=qOverrides(), seen=new Set(), out=[];
  (window.OUTREACH||[]).forEach(m=>{ const o=ov[m.to]||{}; seen.add(m.to);
    out.push({id:m.to,tier:m.tier,agent:m.agent,useCase:m.useCase,to:o.to??m.to,body:o.body??m.body,status:o.status||'pending'}); });
  for(const [id,o] of Object.entries(ov)){ if(!seen.has(id)&&o.added) out.push({id,tier:'+',agent:o.agent||'(custom)',useCase:o.useCase||'added',to:o.to||id,body:o.body||'',status:o.status||'pending'}); }
  return out;
}
function addToQueue(addr,name){
  const ov=qOverrides();
  if(!ov[addr]){ setQ(addr,{added:true,agent:name||shortAddr(addr),to:addr,
    body:`Hi${name?' ('+name+')':''} — Huge Sphinx here. I run Xtrata: permanent, contract-native inscriptions on Stacks (SIP-009 NFTs with SHA-256 hash chains). [One line on why your work is worth sealing permanently on Bitcoin.] Want the inscription skill or a quick demo?`}); }
  setTab('queue');
}

/* ---------------- text-to-speech ---------------- */
function resetTtsButtons(){ document.querySelectorAll('[data-action="tts"]').forEach(b=>{ b.innerHTML=b.dataset.label||'🔊'; }); }
function speak(text, btn){
  if(!('speechSynthesis' in window)){ alert('Text-to-speech is not supported in this browser.'); return; }
  const synth=window.speechSynthesis;
  if(synth.speaking || synth.pending){ synth.cancel(); resetTtsButtons(); return; }  // any click while speaking = stop
  if(!text || !text.trim()) return;
  const u=new SpeechSynthesisUtterance(text);
  u.rate=1; u.pitch=1;
  u.onend=resetTtsButtons; u.onerror=resetTtsButtons;
  resetTtsButtons(); if(btn) btn.innerHTML='⏹ Stop';
  synth.speak(u);
}

/* ---------------- bulk send ---------------- */
const bulk = { running:false, stop:false };
async function sendAll(items){
  if(bulk.running) return;
  bulk.running=true; bulk.stop=false;
  const out=()=>document.querySelector('[data-cmd-out="bulk"]');
  let okN=0, fail=0;
  for(let i=0;i<items.length;i++){
    if(bulk.stop) break;
    const it=items[i], o=out();
    if(o) o.innerHTML=`<p class="muted">Sending ${i+1}/${items.length} → <b>${esc(it.agent)}</b>… (${okN} sent, ${fail} failed). Don't close this tab.</p>`;
    try{
      const d=await fetch('/local/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({to:it.id,content:it.body})}).then(r=>r.json());
      if(d.ok){ setQ(it.id,{status:'sent'}); okN++; }
      else { fail++; if(/insufficient/i.test(d.error||'')){ const e=out(); if(e) e.innerHTML=`<p style="color:var(--bad)">Stopped — insufficient sBTC after ${okN} sent.</p>`; break; } }
    }catch(e){ fail++; }
    if(i<items.length-1 && !bulk.stop) await new Promise(r=>setTimeout(r,12000)); // respect 1-per-10s rate limit
  }
  bulk.running=false;
  const o=out(); if(o) o.innerHTML=`<p style="color:${fail?'var(--warn)':'var(--good)'}">Done — ${okN} sent, ${fail} failed${bulk.stop?' (stopped early)':''}.</p>`;
  renderNav(); loadBalances();
  setTimeout(()=>{ if(state.tab==='queue'){ const keep=out()?.innerHTML; renderView(); const n=document.querySelector('[data-cmd-out="bulk"]'); if(n&&keep) n.innerHTML=keep; } }, 800);
}

/* ---------------- command builders ---------------- */
function sendCmd(to,body){
  return `# Send a NEW message from Huge Sphinx (costs 100 sats sBTC, x402).
# In your agent client with the AIBTC MCP server:
wallet_unlock
execute_x402_endpoint POST ${API.replace(/^\/api$/,'https://aibtc.com/api')}/inbox/${to}
  body: ${JSON.stringify({message:body})}
# Pays 100 sats from Huge Sphinx and signs automatically.`;
}
function replyCmd(msgId,text){
  return `# FREE reply (0 sats) — run in ~/Documents/GitHub/xtrata/Huge-Sphinx
MSG_ID=${JSON.stringify(msgId)} \\
REPLY=${JSON.stringify(text)} \\
WALLET_MNEMONIC="<Huge Sphinx 24 words — lowercase 'olympic'>" \\
node scripts/hs-reply.mjs`;
}

/* ---------------- navigation ---------------- */
const NAV = [
  {grp:'Messages', tabs:[['inbox','Inbox'],['outbox','Outbox']]},
  {grp:'Outreach', tabs:[['queue','Outreach Queue'],['compose','Compose'],['segments','Segments'],['directory','Directory']]},
  {grp:'History', tabs:[['archive','Crafty Puma Archive']]},
];
function counts(k){
  if(k==='inbox') return state.inbox?(state.inbox.totalCount??(state.inbox.messages||[]).length):'';
  if(k==='outbox') return state.outbox?(state.outbox.totalCount??(state.outbox.replies||[]).length):'';
  if(k==='queue'){ const q=queueItems(); return q.filter(x=>x.status==='pending').length+'/'+q.length; }
  if(k==='segments') return state.allAgents?state.allAgents.length:'';
  if(k==='directory') return state.agentsTotal??'';
  if(k==='archive') return (window.CP_HISTORY||[]).length;
  return '';
}
function renderNav(){
  $('#nav').innerHTML = NAV.map((g,i)=>`${i?'<div class="navsep"></div>':''}<div class="navgroup">`+
    g.tabs.map(([k,label])=>{ const c=counts(k); return `<div class="tab ${state.tab===k?'active':''}" data-action="tab" data-tab="${k}">${label}${c!==''?`<span class="count">${c}</span>`:''}</div>`; }).join('')+`</div>`).join('');
}
function setTab(t){ state.tab=t; if(t==='directory'&&state.agents.length===0){ loadAgents(true).then(renderAll); return; } renderAll(); }

/* ---------------- views ---------------- */
function msgCard(m,dir){
  const out=dir==='out';
  const who=m.agent||m.senderName||m.recipientName||shortAddr(m.from||m.sender||m.to||m.recipient);
  const body=m.message||m.body||m.text||''; const id=m.id||m.messageId;
  const canReply=!out&&id;
  return `<div class="msg">
    <div class="meta"><span class="tag ${out?'out':'in'}">${out?'sent':'received'}</span>
      <span class="name">${esc(who)}</span><span>· ${esc(fmt(m.sentAt||m.createdAt||m.timestamp))}</span>
      ${m.paymentSats?`<span>· ${m.paymentSats} sats</span>`:''}
      ${m.paymentTxid?`<a href="https://explorer.hiro.so/txid/${esc(m.paymentTxid)}?chain=mainnet" target="_blank">tx</a>`:''}
      <button class="sm" data-action="tts" data-kind="text" data-text="${esc(body)}" data-label="🔊" title="Read aloud">🔊</button>
      ${canReply?`<button class="sm" style="margin-left:auto" data-action="reply-toggle" data-id="${esc(id)}">↩ Reply (free)</button>`:''}</div>
    <div>${esc(body)}</div>
    ${canReply?`<div class="hidden" data-reply="${esc(id)}" style="margin-top:10px">
      <textarea data-edit="reply-text" data-id="${esc(id)}" maxlength="500" placeholder="Free reply, signed with Huge Sphinx's key (max 500 chars)…"></textarea>
      <div class="rowbtns">${liveWallet()?`<button class="primary sm" data-action="reply-send" data-id="${esc(id)}">⚡ Send reply (free)</button><button class="ghost sm" data-action="reply-cmd" data-id="${esc(id)}">Command</button>`:`<button class="primary sm" data-action="reply-cmd" data-id="${esc(id)}">Generate reply command</button>`}<button class="ghost sm" data-action="tts" data-kind="reply" data-id="${esc(id)}" data-label="🔊 Read">🔊 Read</button></div>
      <div data-cmd-out="reply-${esc(id)}"></div></div>`:''}
  </div>`;
}
function viewInbox(){
  const i=state.inbox, msgs=(i?.messages)||[], ec=i?.economics;
  return `<h2>Inbox</h2><p class="sub">Messages received by Huge Sphinx. Replies are free.</p>
  <div class="panel"><div class="toolbar">
    <div class="stat"><b>${i?.receivedCount??0}</b><span>received</span></div>
    <div class="stat"><b>${i?.sentCount??0}</b><span>sent</span></div>

function classify(a){ const hay=((a.displayName||'')+' '+(a.description||'')).toLowerCase(); let best=null,bs=0,hits={};
  for(const s of SEGMENTS){ const m=s.kw.filter(k=>hay.includes(k)); if(m.length){hits[s.key]=m; if(m.length>bs){bs=m.length;best=s.key;}} }
  return {seg:best||'other',score:bs,why:(hits[best]||[])}; }
async function scanAllAgents(){
  state.scanning=true;state.scanProgress=0;renderView();
  let all=[],off=0,total=Infinity;
  try{ while(off<total){ const d=await api('/agents?limit=100&offset='+off); const b=d.agents||[]; all=all.concat(b); total=d.pagination?.total??all.length; off+=b.length; state.scanProgress=all.length; renderView(); if(!b.length)break; }
    all.forEach(a=>{ const c=classify(a); a._seg=c.seg;a._score=c.score;a._why=c.why;a._warm=!!(window.CP_MEMORY&&window.CP_MEMORY[a.stxAddress]); });
    state.allAgents=all;
  }catch(e){ showBanner('⚠️ Scan failed: '+esc(e.message)+' — is console-server.mjs running?'); }

}

  const groups={}; SEGMENTS.forEach(s=>groups[s.key]=[]); groups.other=[];

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action, id=el.dataset.id;
  if(a==='tab'){ setTab(el.dataset.tab); return; }
  if(a==='refresh'){ refreshAll(); return; }
  if(a==='qfilter'){ state.qfilter=el.dataset.f; renderView(); return; }
  if(a==='q-status'){ setQ(id,{status:el.dataset.s}); renderAll(); return; }
  if(a==='q-cmd'){
    const ta=document.querySelector(`textarea[data-edit="q-body"][data-id="${id}"]`);
    const body=(ta?ta.value:'').trim(); if(body) setQ(id,{body});
    const out=document.querySelector(`[data-cmd-out="q-${id}"]`);
    out.innerHTML=cmdBlock(sendCmd(id,body),'q-'+id); return;
  }
  if(a==='compose-cmd'){
    const to=$('[data-edit="compose-to"]').value.trim(), body=$('[data-edit="compose-body"]').value.trim();
    const out=$('[data-cmd-out="compose"]');
    if(!to||!body){ out.innerHTML='<p style="color:var(--bad)">Need a recipient and a message.</p>'; return; }
    out.innerHTML=cmdBlock(sendCmd(to,body),'compose'); return;
  }
  if(a==='compose-queue'){ const to=$('[data-edit="compose-to"]').value.trim(); if(to){ setQ(to,{added:true,agent:shortAddr(to),to,body:$('[data-edit="compose-body"]').value}); setTab('queue'); } return; }
  if(a==='add-q'){ addToQueue(id, el.dataset.name); return; }
  if(a==='more-agents'){ loadAgents(false).then(renderAll); return; }
  if(a==='scan'){ scanAllAgents(); return; }
  if(a==='toggle-seg'){ state.openSeg[id]=!state.openSeg[id]; renderView(); return; }
  if(a==='reply-toggle'){ const el2=document.querySelector(`[data-reply="${id}"]`); if(el2) el2.classList.toggle('hidden'); return; }
  if(a==='reply-cmd'){
    const ta=document.querySelector(`textarea[data-edit="reply-text"][data-id="${id}"]`);
    const out=document.querySelector(`[data-cmd-out="reply-${id}"]`);
    if(!ta||!ta.value.trim()){ out.innerHTML='<p style="color:var(--bad)">Write a reply first.</p>'; return; }
    out.innerHTML=cmdBlock(replyCmd(id,ta.value.trim()),'reply-'+id); return;
  }
  if(a==='q-send'){
    const ta=document.querySelector(`textarea[data-edit="q-body"][data-id="${id}"]`);
    const txt=(ta?ta.value:'').trim(); if(!txt) return;
    if(!confirm('Send this message to '+(el.dataset.name||id)+'?\n\nThis spends 100 sats sBTC from Huge Sphinx.')) return;
    setQ(id,{body:txt});
    const out=document.querySelector(`[data-cmd-out="q-${id}"]`); out.innerHTML='<p class="muted">Sending… (paying 100 sats)</p>';
    fetch('/local/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({to:id,content:txt})}).then(r=>r.json()).then(d=>{
      if(d.ok){ setQ(id,{status:'sent'}); out.innerHTML='<p style="color:var(--good)">✓ Sent'+(d.messageId?' · '+esc(d.messageId):'')+'</p>'; renderNav(); refreshAll(); }
      else out.innerHTML='<p style="color:var(--bad)">✗ '+esc(d.error||'Send failed')+'</p>';
    }).catch(e=>out.innerHTML='<p style="color:var(--bad)">✗ '+esc(e.message)+'</p>'); return;
  }
  if(a==='q-sendall'){
    const all=queueItems(), f=state.qfilter;
    const items=all.filter(x=>x.status==='pending' && (f==='all'||f==='pending'?true:f==='sent'?false:String(x.tier)===f));
    if(!items.length){ alert('No pending messages in the current filter.'); return; }
    const cost=items.length*100, have=state.sbtc||0;
    const warn = have<cost ? `\n\n⚠️ Balance is ${have} sats but this needs ${cost} — it will stop when funds run out.` : '';
    if(!confirm(`Send ${items.length} messages now?\n\nThis spends ${cost} sats sBTC (100 each), sent ~12 seconds apart to respect rate limits.${warn}\n\nYou can press Stop to halt.`)) return;
    sendAll(items); return;
  }
  if(a==='q-stopall'){ bulk.stop=true; const o=document.querySelector('[data-cmd-out="bulk"]'); if(o&&bulk.running) o.innerHTML='<p class="muted">Stopping after the current message…</p>'; return; }
  if(a==='reply-send'){
    const ta=document.querySelector(`textarea[data-edit="reply-text"][data-id="${id}"]`);
    const txt=ta?ta.value.trim():''; const out=document.querySelector(`[data-cmd-out="reply-${id}"]`);
    if(!txt){ out.innerHTML='<p style="color:var(--bad)">Write a reply first.</p>'; return; }
    out.innerHTML='<p class="muted">Sending reply…</p>';
    fetch('/local/reply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messageId:id,reply:txt,markRead:true})}).then(r=>r.json()).then(d=>{
      out.innerHTML = d.ok?'<p style="color:var(--good)">✓ Reply sent (free)</p>':'<p style="color:var(--bad)">✗ '+esc(d.error||(d.data&&d.data.error)||'Failed')+'</p>';
      if(d.ok) refreshAll();
    }).catch(e=>out.innerHTML='<p style="color:var(--bad)">✗ '+esc(e.message)+'</p>'); return;
  }
  if(a==='compose-send'){
    const to=$('[data-edit="compose-to"]').value.trim(), txt=$('[data-edit="compose-body"]').value.trim();
    const out=$('[data-cmd-out="compose"]');
    if(!to||!txt){ out.innerHTML='<p style="color:var(--bad)">Need a recipient and a message.</p>'; return; }
    if(!confirm('Send to '+to+'?\n\nThis spends 100 sats sBTC.')) return;
    out.innerHTML='<p class="muted">Sending…</p>';
    fetch('/local/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({to,content:txt})}).then(r=>r.json()).then(d=>{
      out.innerHTML = d.ok?'<p style="color:var(--good)">✓ Sent'+(d.messageId?' · '+esc(d.messageId):'')+'</p>':'<p style="color:var(--bad)">✗ '+esc(d.error||'Failed')+'</p>';
      if(d.ok) refreshAll();
    }).catch(e=>out.innerHTML='<p style="color:var(--bad)">✗ '+esc(e.message)+'</p>'); return;
  }
  if(a==='copy'){ const pre=document.querySelector(`[data-code="${el.dataset.code}"]`); if(pre) navigator.clipboard.writeText(pre.innerText); el.textContent='Copied ✓'; setTimeout(()=>el.textContent='Copy',1200); return; }
  if(a==='tts'){
    let text=''; const kind=el.dataset.kind;
    if(kind==='q'){ const t=document.querySelector(`textarea[data-edit="q-body"][data-id="${id}"]`); text=t?t.value:''; }
    else if(kind==='reply'){ const t=document.querySelector(`textarea[data-edit="reply-text"][data-id="${id}"]`); text=t?t.value:''; }
    else if(kind==='compose'){ const t=$('[data-edit="compose-body"]'); text=t?t.value:''; }
    else text=el.dataset.text||'';
    speak(text, el); return;
  }
});
function cmdBlock(text,key){
  return `<div class="codeblock" data-code="${esc(key)}">${esc(text)}</div>
    <div class="rowbtns"><button class="sm" data-action="copy" data-code="${esc(key)}">Copy</button></div>`;
}
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-edit]'); if(!el) return;
  const k=el.dataset.edit, id=el.dataset.id;
  if(k==='q-body') setQ(id,{body:el.value});           // silent persist, no re-render (keeps focus)
  else if(k==='compose-to'){ state.compose.to=el.value; saveLS(LS.compose,state.compose); }
  else if(k==='compose-body'){ state.compose.body=el.value; saveLS(LS.compose,state.compose); }
  else if(k==='search'){ state.search=el.value; renderView(); const s=$('[data-edit="search"]'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length);} }
  // reply-text persists implicitly (read from DOM on generate)
});

/* auto refresh */
let timer=null;
document.addEventListener('change',e=>{ if(e.target.id==='autoref'){ if(e.target.checked) timer=setInterval(refreshAll,60000); else clearInterval(timer); } });

/* boot */
renderAll(); refreshAll(); loadLive();
</script>
</body>
</html>
