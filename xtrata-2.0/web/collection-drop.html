<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Xtrata Collection Drops</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #0f0f0e;
        color: #f4f1ea;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
        background: radial-gradient(circle at top, #242016 0, #0f0f0e 34rem);
      }
      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 38px 0 72px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        margin: 4px 0 10px;
        font-size: clamp(2rem, 6vw, 4.4rem);
        letter-spacing: -0.055em;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 1.22rem;
      }
      p {
        color: #c8c1b7;
        line-height: 1.58;
      }
      a {
        color: #f5cf60;
      }
      code,
      dd,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      .lede {
        max-width: 780px;
        font-size: 1.05rem;
      }
      .eyebrow {
        margin: 0 0 7px;
        color: #e3bd51;
        font-size: 0.74rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .card {
        margin-top: 16px;
        padding: clamp(18px, 4vw, 28px);
        border: 1px solid #39362f;
        border-radius: 16px;
        background: rgba(22, 21, 19, 0.96);
        box-shadow: 0 14px 48px rgba(0, 0, 0, 0.16);
      }
      .card--success {
        border-color: #4b714d;
      }
      .card--muted {
        border-color: #302e2a;
        background: rgba(18, 18, 17, 0.92);
      }
      dl {
        display: grid;
        grid-template-columns: minmax(150px, 0.42fr) minmax(0, 1fr);
        gap: 8px 18px;
        margin: 14px 0 20px;
      }
      dt {
        color: #918a81;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
        color: #e9e4da;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .field {
        display: grid;
        gap: 7px;
        margin: 14px 0;
        color: #bcb5aa;
        font-size: 0.9rem;
      }
      input {
        width: 100%;
        min-width: 0;
        padding: 11px 12px;
        border: 1px solid #48443d;
        border-radius: 9px;
        background: #0b0b0a;
        color: #f4f1ea;
        font: inherit;
      }
      input:focus {
        outline: 2px solid #b9902f;
        outline-offset: 1px;
      }
      .checks,
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 16px;
        align-items: center;
        margin: 12px 0 18px;
      }
      .check {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        color: #d2cbc0;
      }
      .check input {
        width: auto;
      }
      button,
      .button-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 14px;
        border: 1px solid #e8dfce;
        border-radius: 9px;
        background: #f4f1ea;
        color: #151411;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        text-decoration: none;
      }
      button.secondary {
        border-color: #49453e;
        background: #1b1a18;
        color: #eee8dd;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.46;
      }
      .ok {
        color: #8cdb91;
      }
      .warn {
        color: #f3ca5c;
      }
      .fail {
        color: #ff907c;
      }
      .muted {
        color: #8f887f;
      }
      .banner {
        padding: 12px 14px;
        border-radius: 10px;
      }
      .banner--error {
        border: 1px solid #71392e;
        background: #2a1714;
        color: #ff9a86;
      }
      .banner--success {
        border: 1px solid #395b3b;
        background: #132016;
        color: #9ce3a0;
      }
      pre {
        max-height: 340px;
        overflow: auto;
        margin: 15px 0 0;
        padding: 14px;
        border: 1px solid #35322d;
        border-radius: 10px;
        background: #090908;
        color: #d9d2c8;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .log {
        font-size: 0.78rem;
        line-height: 1.55;
      }
      @media (max-width: 660px) {
        main {
          width: min(100% - 24px, 1080px);
          padding-top: 24px;
        }
        .fields {
          grid-template-columns: 1fr;
          gap: 0;
        }
        dl {
          grid-template-columns: 1fr;
          gap: 4px;
        }
        dd {
          margin-bottom: 9px;
        }
        button,
        .button-link {
          width: 100%;
        }
        .actions {
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Restricted · Mainnet · Drops v1.1</p>
        <h1>Collection Drops</h1>
        <p class="lede">
          A separate campaign pathway for multi-batch collections. Access is limited to the main
          Xtrata signer and the current owner of <code>jim.btc</code>. The working public Drops v1.0
          page is not changed by this console.
        </p>
      </header>
      <div id="app" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/collection-drop.ts"></script>
  </body>
</html>
