/* ===================== TEST STUB — window.ParallaxLAYRAccount =====================

   Same interface as the room's account (acquire, ready, machine, openGame, saveGame…), its own storage key,

  const KEY = 'dogarmy.test.layr.v1', START = 100000, listeners = new Set(), meta = new WeakMap();
  let draft = null;
  const amount = v => { if (!Number.isFinite(v) || v < 0) throw Error('Invalid LAYR amount.'); return Math.round(v * 100) / 100; };
  const read = () => { let r = null; try { r = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {} if (!r || typeof r !== 'object') r = { bank: START, layrGames: {} }; r.bank = typeof r.bank === 'number' ? r.bank : START; r.layrGames = r.layrGames || {}; return r; };
  const write = r => { r.bank = amount(r.bank); r.layrMode = 'test-stub'; localStorage.setItem(KEY, JSON.stringify(r)); };
  const publish = () => listeners.forEach(fn => { try { fn(); } catch (e) {} });
  const balance = () => draft ? draft.bank : read().bank;
  const serialize = st => { const s = JSON.parse(JSON.stringify(st)); delete s.balance; return s; };

  window.ParallaxLAYRAccount = Object.freeze({
    version: 'test-stub-1', mode: 'test-stub', onChainConnected: false, testStub: true,
    acquire: async () => true, ready: () => true, error: () => '', balance,
    machine(id, engine) { const api = { ...engine }; api.fresh = () => attach(engine.fresh(), id); api.load = raw => attach(engine.load(raw), id); for (const n of ['start', 'settle', 'pick', 'respin', 'collect', 'endFree', 'gamble']) if (typeof engine[n] === 'function') api[n] = (st, ...a) => transact(st, () => engine[n](st, ...a)); return Object.freeze(api); },
    openGame(id, engine) { const saved = read().layrGames[id]; return attach(engine.load(saved && saved.state), id, saved ? saved.revision : 0); },
    saveGame(state) { if (draft) return true; commit(state, read(), balance()); return true; },
    saveRoom(values) { const r = read(); Object.assign(r, values); write(r); publish(); return true; },
    bindRoom() {}, subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    roomState() { const r = read(); return { bank: r.bank, hands: 0, net: 0 }; },
    snapshot() { return { balance: balance(), currency: 'LAYR', mode: 'test-stub', onChainConnected: false, available: true, games: Object.keys(read().layrGames) }; },
    testReset() { const r = read(); r.bank = START; write(r); publish(); }
  });
})();
window.PX_DEV_LAB = true;   // the standalone test page always offers the Bonus Lab and the test panel
</script>
