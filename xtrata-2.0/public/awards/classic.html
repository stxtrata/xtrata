<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xtrata Music · Classic Record</title>
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
body{display:grid;place-items:center}
.a{position:relative;width:min(100vw,100vh);aspect-ratio:1;--t:#3fd0c9;--e:#6fe3c4;color:var(--e);background:radial-gradient(55% 42% at 50% 47%,color-mix(in srgb,var(--t) 36%,transparent),transparent 72%),radial-gradient(90% 40% at 50% 100%,color-mix(in srgb,var(--e) 20%,transparent),transparent 75%),#05060a}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.c{filter:drop-shadow(0 0 .6vmin var(--e))}
.r{position:absolute;left:31%;top:28%;width:38%;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 5vmin color-mix(in srgb,var(--t) calc(.55*100%),transparent),0 0 1vmin #fff8;animation:h 6s ease-in-out infinite}
.r>*{position:absolute;inset:0;border-radius:50%}
.s{background:conic-gradient(#050608,#2b313b,#0b0d11,#050608,#3a414d,#0b0d11,#050608,#2b313b,#050608);animation:s 14s linear infinite}
.g{background:repeating-radial-gradient(circle,rgba(255,255,255,.07) 0 .9px,transparent 1px 3.2px);-webkit-mask:radial-gradient(circle,transparent 19%,#000 20%);mask:radial-gradient(circle,transparent 19%,#000 20%)}
.h{background:conic-gradient(from 20deg,transparent 0 8%,#fff7 12%,transparent 17% 58%,#fff5 62%,transparent 67%);mix-blend-mode:screen;animation:s 9s linear infinite reverse}
.l{inset:34%!important;background:radial-gradient(circle,#7df0e8 0 20%,#2bb8b0 55%,#167a75);box-shadow:0 0 0 .35vmin #0005,inset 0 0 1.2vmin #0006;color:#06302e;display:grid;place-items:center}
.l svg{position:static;width:66%;height:66%}
.m{--cw:currentColor;--cb:currentColor;--co:currentColor}
.f{mix-blend-mode:multiply;opacity:.55}
@keyframes s{to{transform:rotate(1turn)}}
@keyframes h{50%{transform:translateY(-1.2%)}}
@media (prefers-reduced-motion:reduce){.r,.s,.h{animation:none}}
text{font:700 26px ui-sans-serif,system-ui,sans-serif;letter-spacing:3px;fill:var(--t);text-anchor:middle}
</style>

<script>/* ?n=412 engraves the player's number on the plaque */
