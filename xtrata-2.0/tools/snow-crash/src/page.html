testEl.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k, T = engine.test; if (!T) { out('Test hooks are off.'); return; }
  if (k.startsWith('twins:')) out(T.setTwins(k.slice(6))); else if (k === 'power') { T.setPower(true); out('Powered on.'); } else if (k === 'reduced') { const on = !T.state().reduced; T.setReduced(on); out('Reduced motion ' + (on ? 'on' : 'off')); } else if (k === 'state') out(T.state()); else out('force ' + k + ': ' + T.force(k)); });
$('simBtn').onclick = async () => { const n = Math.max(1000, Number($('simN').value) || 1e6), t = performance.now(); out('Running ' + fmt(n) + ' spins…'); const r = await engine.test.sim(n, 1, (d, tot, rtp) => { out(`${fmt(d)} / ${fmt(tot)} spins · running RTP ${(rtp * 100).toFixed(3)}%`); }); out(`${fmt(r.spins)} spins · RTP ${(r.rtp * 100).toFixed(3)}% (design 94.38%) · ${((performance.now() - t) / 1000).toFixed(1)}s`); };

try { await engine.activate(); } catch (e) { fail(String(e.message || e)); return; }
window.__sc = { engine, THREE, model, camera, scene, parts, setView, cam: () => cam, ui: () => engine.ui(), toggleTest, frame };
document.documentElement.setAttribute('data-ready', '1');
