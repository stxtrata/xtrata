<script>/* One existing LAYR account for the room and every cabinet.

(() => {

    const raw = localStorage.getItem(KEY),legacy=raw===null?localStorage.getItem(LEGACY_KEY):null,r = raw ? JSON.parse(raw) : legacy ? JSON.parse(legacy) : {};
