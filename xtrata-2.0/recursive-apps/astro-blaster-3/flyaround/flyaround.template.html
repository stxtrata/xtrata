<!doctype html><html><head><meta charset="utf-8"><title>Astro Blaster 3: cabinet fly-around</title>
<style>html,body{margin:0;height:100%;background:#05040f;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head><body>
<script>@@THREE@@</script>
<script>@@CABINET@@</script>
<script>
/* Fly-around of the Astro Blaster 3 cabinet (the same model and art the arcade uses). Plays as a loop in a browser; for the screen it is captured frame by frame:
   window.XA_FLY.ready (promise) then window.XA_FLY.frame(t) with t in 0..1 draws exactly that frame, so a GIF can be made from it (make-flyaround.py). */
(function () {
  var SIDE = '@@SIDE@@', MARQUEE = '@@MARQUEE@@';
  var W = innerWidth, H = innerHeight;
  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.setPixelRatio(1); document.body.appendChild(renderer.domElement);
  renderer.outputEncoding = THREE.sRGBEncoding;
  var scene = new THREE.Scene(); scene.background = new THREE.Color(0x07051a); scene.fog = new THREE.Fog(0x07051a, 6, 16);
  var camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 40);
  scene.add(new THREE.HemisphereLight(0xaab4ff, 0x1a0630, 0.9));
  var key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(2, 4, 3); scene.add(key);
  var mag = new THREE.PointLight(0xff2d95, 1.4, 9); mag.position.set(-2.2, 1.4, 1.2); scene.add(mag);
  var cy = new THREE.PointLight(0x00dcff, 1.4, 9); cy.position.set(2.2, 1.2, -1.2); scene.add(cy);
  var floor = new THREE.Mesh(new THREE.CircleGeometry(5, 64), new THREE.MeshStandardMaterial({ color: 0x120a2a, roughness: 0.35, metalness: 0.6 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
  var ring = new THREE.Mesh(new THREE.RingGeometry(1.5, 1.56, 96), new THREE.MeshBasicMaterial({ color: 0x00dcff })); ring.rotation.x = -Math.PI / 2; ring.position.y = 0.005; scene.add(ring);
  var stars = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xffffff, size: 0.03 })); var sp = [];
  for (var i = 0; i < 260; i++) { var a = (i * 2.399) % 6.283, r = 6 + (i * 37 % 40) / 10, y = 0.3 + (i * 53 % 50) / 12; sp.push(Math.cos(a) * r, y, Math.sin(a) * r); }
  stars.geometry.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3)); scene.add(stars);
  var cab = window.XA_CAB3D.astro3.build(THREE, { lighting: false, art: { side: SIDE, marquee: MARQUEE } });
  scene.add(cab.group);
  var box = new THREE.Box3().setFromObject(cab.group); cab.group.position.z = -(box.min.z + box.max.z) / 2;
  // attract screen
  var cv = document.createElement('canvas'); cv.width = 256; cv.height = 278; var cx = cv.getContext('2d'); var tex = new THREE.CanvasTexture(cv); cab.setScreenTexture(tex); cab.screen.material.toneMapped = false;
  function paintScreen(t) {
    cx.fillStyle = '#04021a'; cx.fillRect(0, 0, 256, 278);
    for (var i = 0; i < 60; i++) { var x = (i * 97) % 256, y = ((i * 53) + t * 600 * (0.4 + (i % 5) * 0.2)) % 278; cx.fillStyle = i % 7 ? '#fff' : '#00dcff'; cx.fillRect(x, y, 2, 2); }
    cx.textAlign = 'center'; cx.fillStyle = '#ffc800'; cx.font = 'bold 26px monospace'; cx.fillText('ASTRO', 128, 96); cx.fillText('BLASTER 3', 128, 128);
    if (Math.floor(t * 8) % 2 === 0) { cx.fillStyle = '#fff'; cx.font = 'bold 16px monospace'; cx.fillText('PRESS START', 128, 200); }
    cx.fillStyle = '#00dcff'; cx.font = '12px monospace'; cx.fillText('TOP 10 ON BITCOIN', 128, 250); tex.needsUpdate = true;
  }
  // camera path over t in 0..1: one full orbit, rising and falling, with a push-in on the marquee and the screen
  function cam(t) {
    var ang = Math.PI / 2 + t * Math.PI * 2;                       // starts in front (+Z)
    var push = 0.5 - 0.5 * Math.cos(t * Math.PI * 4);              // two push-ins per loop
    var r = 5.3 - 1.1 * push, h = 1.35 + 0.5 * Math.sin(t * Math.PI * 2 + 0.6) + 0.1 * push;
    camera.position.set(Math.cos(ang) * r, h, Math.sin(ang) * r); camera.lookAt(0, 1.15, 0);
    mag.position.set(Math.cos(ang + 2.4) * 2.6, 1.5, Math.sin(ang + 2.4) * 2.6); cy.position.set(Math.cos(ang - 2.4) * 2.6, 1.3, Math.sin(ang - 2.4) * 2.6);
  }
  function frame(t) { t = ((t % 1) + 1) % 1; cam(t); paintScreen(t); stars.rotation.y = t * 0.6; ring.scale.setScalar(1 + 0.04 * Math.sin(t * 25)); renderer.render(scene, camera); }
  var ready = cab.ready.then(function () { frame(0); });
  window.XA_FLY = { ready: ready, frame: frame };
  ready.then(function () { var t0 = performance.now(); (function loop() { frame(((performance.now() - t0) / 1000) / 12); requestAnimationFrame(loop); })(); });
})();
</script></body></html>
