      var hgt = stack[x % stack.length];
      for (var y = 0; y < hgt; y++) {
        drawCell(ctx, ox + x * size, h - (y + 1) * size, size, palette[(x * 3 + y) % 7], 0.9);
      }
    }
    var cyc = (t * 0.7) % 1;
    var type = TYPES[Math.floor(t * 0.7) % 7];
    var m = ROT[type][Math.floor(t * 1.4) % 4];
    var px = ox + Math.floor(cols / 2 - 1) * size;
    var py = -size * 2 + cyc * (h - size * 6);
    for (var yy = 0; yy < m.length; yy++) for (var xx = 0; xx < m.length; xx++) if (m[yy][xx]) {
      drawCell(ctx, px + xx * size, py + yy * size, size, COLORS[type]);
    }
  }

  XA.registerGame({
    id: 'xa_block_drop',
    order: 2,
    title: 'Block Drop',
    tagline: 'Stack, clear, survive the speed-up.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'blocks',
    controls: '←→ move · ↑/X rotate · Z counter · Space drop · C hold',
    create: create,
    attract: attract
  });
})(window);
</script>
<script>/* game-cave-diver.js */
/*
 * Xtrata Arcade cartridge #3 — CAVE DIVER
 * One button: hold to swim up, release to sink. Thread an endless cave that
 * narrows and speeds up; grab pearls for a combo, skim walls for CLOSE bonus.
 * Contract game-id: xa_cave_diver (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-cave-diver');
  var U = XA.util;

  var W = 600, H = 400, COL = 12, PLAYER_X = 150, R = 9;
  var ACCENT = '#ff9a3f', WALL = '#19c3b0', PEARL = '#ffe66d', JELLY = '#ff4fd8';

  function create(api) {
    var rng = api.rng;
    var cols = [];          // { top, bot } per COL-wide world column
    var firstCol = 0;       // world index of cols[0]
    var center = H / 2, drift = 0;
    var dist = 0, speed = 190;
    var y = H / 2, vy = 0;
    var started = false, dead = false, deadT = 0;
    var pearls = [], jellies = [];
    var pickups = 0, bonus = 0, chain = 0, closeCd = 0, bubbleT = 0;
    var t = 0;

    function gapFor(d) { return U.lerp(250, 118, U.clamp(d / 14000, 0, 1)); }
    function genCol(index) {
      var d = index * COL;
      drift += (rng() - 0.5) * 3.2;
      drift *= 0.94;
      center += drift;
      var gap = gapFor(d);
      var margin = 26;
      center = U.clamp(center, margin + gap / 2, H - margin - gap / 2);
      var wobble = Math.sin(index * 0.35) * 6;
      var c = { top: center - gap / 2 + wobble, bot: center + gap / 2 + wobble };
      // Spawn pickups and hazards inside the gap.
      if (index > 40 && rng() < 0.045) {
        pearls.push({ x: d, y: U.lerp(c.top + 22, c.bot - 22, rng()), got: false });
      }
      if (d > 2500 && rng() < 0.012 + U.clamp(d / 60000, 0, 0.02)) {
        jellies.push({ x: d, baseY: (c.top + c.bot) / 2, amp: (c.bot - c.top) * 0.28, phase: rng() * 6, r: 11 });
      }
      return c;
    }
    function colAt(worldX) {
      var i = Math.floor(worldX / COL) - firstCol;
      return cols[U.clamp(i, 0, cols.length - 1)];
    }
    function fill() {
      var need = Math.ceil((dist + W + COL * 4) / COL);
      while (firstCol + cols.length < need) cols.push(genCol(firstCol + cols.length));
      var drop = Math.floor((dist - COL * 4) / COL) - firstCol;
      if (drop > 0) { cols.splice(0, drop); firstCol += drop; }
      pearls = pearls.filter(function (p) { return p.x > dist - 40; });
      jellies = jellies.filter(function (j) { return j.x > dist - 40; });
    }
    for (var i = 0; i < 40; i++) cols.push(genCol(i));
    center = H / 2;
    fill();

    function die() {
      dead = true;
      api.fx.burst(PLAYER_X, y, ACCENT, 36, 230, 0.9);
      api.fx.burst(PLAYER_X, y, '#bfefff', 20, 120, 1.1);
      api.shake(12);
      api.audio.tone(200, 0.4, { type: 'sawtooth', slide: 0.3, vol: 0.28 });
      api.audio.noise(0.35, { vol: 0.25, cutoff: 900 });
    }

    return {
      update: function (dt) {
        t += dt;
        var inp = api.input;
        var hold = inp.held('hold') || inp.held('a') || inp.held('up');
        inp.takeSwipes();
        if (dead) { deadT += dt; if (deadT > 1) api.gameOver(); return; }
        if (!started) {
          y = H / 2 + Math.sin(t * 3) * 8;
          if (hold) { started = true; vy = -120; api.audio.tone(600, 0.08, { type: 'triangle', vol: 0.15 }); }
          return;
        }
        // physics
        vy += (hold ? -1450 : 1050) * dt;
        vy = U.clamp(vy, -380, 420);
        y += vy * dt;
        speed = Math.min(430, 190 + dist * 0.012);
        dist += speed * dt;
        fill();

        var wx = dist + PLAYER_X;
        // wall collision: sample three columns under the player
        var near = 999;
        for (var k = -1; k <= 1; k++) {
          var c = colAt(wx + k * R);
          if (y - R < c.top || y + R > c.bot) { die(); return; }
          near = Math.min(near, y - R - c.top, c.bot - (y + R));
        }
        closeCd -= dt;
        if (near < 7 && closeCd <= 0) {
          closeCd = 1.1;
          bonus += 15;
          api.fx.text(PLAYER_X + 30, y - 18, 'CLOSE +15', '#bfefff', 11);
          api.audio.tone(900, 0.05, { type: 'sine', vol: 0.12 });
        }
        // pearls
        pearls.forEach(function (p) {
          if (p.got) return;
          var dx = p.x - wx, dy = p.y - y;
          if (dx * dx + dy * dy < (R + 9) * (R + 9)) {
            p.got = true;
            chain = Math.min(10, chain + 1);
            var pts = 20 * chain;
            pickups += pts;
            api.fx.burst(PLAYER_X + dx, p.y, PEARL, 16, 150);
            api.fx.text(PLAYER_X + dx, p.y - 16, '+' + pts + (chain > 1 ? ' x' + chain : ''), PEARL, 12);
            api.audio.tone(700 + chain * 60, 0.07, { type: 'square', vol: 0.16 });
          } else if (dx < -30 && !p.missed) {
            p.missed = true;
            if (chain > 1) api.fx.text(PLAYER_X, y + 22, 'CHAIN LOST', '#8899aa', 10);
            chain = 0;
          }
        });
        // jellies
        for (var j = 0; j < jellies.length; j++) {
          var jl = jellies[j];
          var jy = jl.baseY + Math.sin(t * 1.6 + jl.phase) * jl.amp;
          var ddx = jl.x - wx, ddy = jy - y;
          if (ddx * ddx + ddy * ddy < (R + jl.r - 2) * (R + jl.r - 2)) { die(); return; }
        }
        // distance score: 1 point per 10px travelled
        api.setScore(Math.floor(dist / 10) + pickups + bonus);
        bubbleT += dt;
        if (bubbleT > 0.05) {
          bubbleT = 0;
          api.fx.trail(PLAYER_X - 12, y + (Math.random() - 0.5) * 6, 'rgba(190,240,255,0.8)', -speed * 0.4, -20 - Math.random() * 30);
        }
        api.setStatus(Math.floor(dist / 10) + ' m' + (chain > 1 ? '  CHAIN x' + chain : ''));
      },

      render: function (ctx) {
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#031526');
        g.addColorStop(1, '#010812');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // far parallax rocks
        ctx.fillStyle = 'rgba(25,195,176,0.07)';
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (var x = 0; x <= W; x += 20) {
          var px = x + dist * 0.25;
          ctx.lineTo(x, H - 60 - Math.sin(px * 0.01) * 30 - Math.sin(px * 0.023) * 18);
        }
        ctx.lineTo(W, H);
        ctx.fill();
        // light rays
        ctx.save();
        ctx.globalAlpha = 0.05;
        ctx.fillStyle = '#9fe8ff';
        for (var r = 0; r < 4; r++) {
          var rx = ((r * 190 - dist * 0.1) % (W + 200) + W + 200) % (W + 200) - 100;
          ctx.beginPath();
          ctx.moveTo(rx, 0); ctx.lineTo(rx + 60, 0); ctx.lineTo(rx - 40, H); ctx.lineTo(rx - 90, H);
          ctx.fill();
        }
        ctx.restore();

        // cave walls
        var offset = dist - firstCol * COL;
        function wall(isTop) {
          ctx.beginPath();
          ctx.moveTo(-COL, isTop ? 0 : H);
          for (var i = 0; i < cols.length; i++) {
            var sx = i * COL - offset;
            if (sx < -COL * 2 || sx > W + COL * 2) continue;
            ctx.lineTo(sx, isTop ? cols[i].top : cols[i].bot);
          }
          ctx.lineTo(W + COL, isTop ? 0 : H);
          ctx.closePath();
        }
        ctx.save();
        [true, false].forEach(function (isTop) {
          var wg = ctx.createLinearGradient(0, isTop ? 0 : H, 0, H / 2);
          wg.addColorStop(0, '#04241f');
          wg.addColorStop(1, '#0b4a42');
          ctx.fillStyle = wg;
          wall(isTop);
          ctx.fill();
          ctx.strokeStyle = WALL; ctx.lineWidth = 2; ctx.shadowColor = WALL; ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.shadowBlur = 0;
        });
        ctx.restore();

        // pearls
        pearls.forEach(function (p) {
          if (p.got) return;
          var sx = p.x - dist;
          if (sx < -20 || sx > W + 20) return;
          ctx.save();
          ctx.shadowColor = PEARL; ctx.shadowBlur = 14; ctx.fillStyle = PEARL;
          ctx.beginPath();
          var s = 7 + Math.sin(t * 5 + p.x) * 1.2;
          ctx.moveTo(sx, p.y - s); ctx.lineTo(sx + s, p.y); ctx.lineTo(sx, p.y + s); ctx.lineTo(sx - s, p.y);
          ctx.fill();
          ctx.restore();
        });
        // jellies
        jellies.forEach(function (jl) {
          var sx = jl.x - dist;
          if (sx < -30 || sx > W + 30) return;
          var jy = jl.baseY + Math.sin(t * 1.6 + jl.phase) * jl.amp;
          ctx.save();
          ctx.shadowColor = JELLY; ctx.shadowBlur = 16;
          ctx.fillStyle = 'rgba(255,79,216,0.8)';
          ctx.beginPath();
          ctx.arc(sx, jy, jl.r, Math.PI, 0);
          ctx.lineTo(sx + jl.r, jy + 2);
          ctx.lineTo(sx - jl.r, jy + 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,79,216,0.6)'; ctx.lineWidth = 1.5;
          for (var k = -1; k <= 1; k++) {
            ctx.beginPath();
            ctx.moveTo(sx + k * 6, jy + 2);
            ctx.quadraticCurveTo(sx + k * 6 + Math.sin(t * 6 + k) * 4, jy + 10, sx + k * 6, jy + 18);
            ctx.stroke();
          }
          ctx.restore();
        });

        // the carp
        if (!dead) {
          ctx.save();
          ctx.translate(PLAYER_X, y);
          ctx.rotate(U.clamp(vy / 900, -0.5, 0.5));
          ctx.shadowColor = ACCENT; ctx.shadowBlur = 14;
          ctx.fillStyle = ACCENT;
          ctx.beginPath();
          ctx.ellipse(0, 0, 13, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          var wag = Math.sin(t * 18) * 4;
          ctx.beginPath();
          ctx.moveTo(-10, 0); ctx.lineTo(-21, -7 + wag); ctx.lineTo(-21, 7 + wag);
          ctx.closePath();
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#fff3e0';
          ctx.beginPath(); ctx.ellipse(2, 2, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#05060f';
          ctx.beginPath(); ctx.arc(7, -2.5, 1.8, 0, 7); ctx.fill();
          ctx.restore();
        }
        if (!started && !dead) {
          ctx.save();
          ctx.globalAlpha = 0.6 + Math.sin(t * 5) * 0.4;
          U.glowText(ctx, 'HOLD TO SWIM', W / 2, H / 2 + 60, 16, '#bfefff');
          ctx.restore();
        }
      }
    };
  }

  function attract(ctx, w, h, t) {
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#031526'); g.addColorStop(1, '#010812');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    var off = t * 60;
    function edge(isTop) {
      ctx.beginPath();
      ctx.moveTo(0, isTop ? 0 : h);
      for (var x = 0; x <= w; x += 6) {
        var c = h / 2 + Math.sin((x + off) * 0.018) * h * 0.14;
        var gap = h * 0.5 + Math.sin((x + off) * 0.05) * h * 0.04;
        ctx.lineTo(x, isTop ? c - gap / 2 : c + gap / 2);
      }
      ctx.lineTo(w, isTop ? 0 : h);
      ctx.closePath();
      ctx.fillStyle = '#083a34';
      ctx.fill();
      ctx.strokeStyle = WALL; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.save();
    ctx.shadowColor = WALL; ctx.shadowBlur = 8;
    edge(true); edge(false);
    ctx.restore();
    var px = w * 0.3;
    var py = h / 2 + Math.sin((px + off) * 0.018) * h * 0.14;
    ctx.save();
    ctx.shadowColor = ACCENT; ctx.shadowBlur = 10; ctx.fillStyle = ACCENT;
    ctx.beginPath(); ctx.ellipse(px, py, 8, 5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(px - 6, py); ctx.lineTo(px - 13, py - 5 + Math.sin(t * 16) * 2); ctx.lineTo(px - 13, py + 5 + Math.sin(t * 16) * 2); ctx.fill();
    ctx.restore();
  }

  XA.registerGame({
    id: 'xa_cave_diver',
    order: 3,
    title: 'Cave Diver',
    tagline: 'Hold to swim. Let go to sink.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'hold',
    controls: 'Hold Space / ↑ / tap-and-hold',
    create: create,
    attract: attract
  });
})(window);
</script>
<script>/* game-orbit-merge.js */
/*
 * Xtrata Arcade cartridge #4 — ORBIT MERGE
 * Drop planets into the jar. Two of the same kind touching merge into the
 * next size up; keep the jar below the red line. Two suns merging collapse
 * into a supernova bonus.
 * Contract game-id: xa_orbit_merge (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-orbit-merge');
  var U = XA.util;

  var W = 420, H = 600;
  var LEFT = 26, RIGHT = W - 26, FLOOR = H - 22, DANGER = 118, DROP_Y = 64;
  var ACCENT = '#b98cff';
  // tier: radius, colour, name, merge points
  var TIERS = [
    { r: 13, c: '#9fb4ff', n: 'Moon' },
    { r: 18, c: '#ff8fb1', n: 'Pluto' },
    { r: 24, c: '#ffd166', n: 'Mercury' },
    { r: 31, c: '#7bf1a8', n: 'Mars' },
    { r: 38, c: '#4dd6ff', n: 'Venus' },
    { r: 46, c: '#3a86ff', n: 'Earth' },
    { r: 55, c: '#c77dff', n: 'Neptune' },
    { r: 64, c: '#ffb86b', n: 'Saturn', ring: true },
    { r: 74, c: '#ff7a59', n: 'Jupiter' },
    { r: 86, c: '#ffe36e', n: 'Sun', glow: true }
  ];
  var POINTS = TIERS.map(function (_, i) { return (i + 1) * (i + 2) / 2 * 2; }); // 2,6,12,20,…
  var G = 1500, SUB = 4;

  function planet(ctx, x, y, t, tier, alpha) {
    var d = TIERS[tier];
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    if (d.ring) {
      ctx.strokeStyle = 'rgba(255,220,160,0.75)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(x, y, d.r * 1.35, d.r * 0.38, -0.35, Math.PI, Math.PI * 2); ctx.stroke();
    }
    ctx.shadowColor = d.c;
    ctx.shadowBlur = d.glow ? 30 : 12;
    var g = ctx.createRadialGradient(x - d.r * 0.35, y - d.r * 0.4, d.r * 0.1, x, y, d.r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.18, d.c);
    g.addColorStop(1, 'rgba(10,8,30,0.95)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, d.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    if (tier === 5) { // Earth: a couple of continents
      ctx.fillStyle = 'rgba(123,241,168,0.55)';
      ctx.beginPath(); ctx.ellipse(x - d.r * 0.2, y - d.r * 0.1, d.r * 0.32, d.r * 0.2, 0.6, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + d.r * 0.35, y + d.r * 0.3, d.r * 0.2, d.r * 0.13, -0.4, 0, 7); ctx.fill();
    }
    if (tier === 8) { // Jupiter bands
      ctx.strokeStyle = 'rgba(80,30,10,0.35)'; ctx.lineWidth = d.r * 0.12;
      [-0.35, 0.05, 0.4].forEach(function (k) {
        var w = Math.sqrt(1 - k * k) * d.r;
        ctx.beginPath(); ctx.moveTo(x - w * 0.95, y + k * d.r); ctx.lineTo(x + w * 0.95, y + k * d.r); ctx.stroke();
      });
    }
    if (d.ring) {
      ctx.strokeStyle = 'rgba(255,220,160,0.9)';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(x, y, d.r * 1.35, d.r * 0.38, -0.35, 0, Math.PI); ctx.stroke();
    }
    ctx.restore();
  }

  function create(api) {
    var rng = api.rng;
    var orbs = [];
    var nextId = 1;
    var aimX = W / 2;
    var lastMoved = api.pointer().moved;
    var current = pickTier(), next = pickTier();
    var cooldown = 0;
    var dangerT = 0;
    var chain = 0, chainT = 0;
    var over = false, overT = 0;
    var t = 0;
    var stars = [];
    for (var i = 0; i < 60; i++) stars.push({ x: rng() * W, y: rng() * H, s: rng() * 1.5 + 0.3, p: rng() * 6 });

    function pickTier() {
      var r = rng();
      return r < 0.34 ? 0 : r < 0.62 ? 1 : r < 0.82 ? 2 : r < 0.95 ? 3 : 4;
    }
    function clampAim(x) {
      var r = TIERS[current].r;
      return U.clamp(x, LEFT + r + 1, RIGHT - r - 1);
    }
    function drop() {
      if (cooldown > 0 || over) return;
      var r = TIERS[current].r;
      orbs.push({ id: nextId++, tier: current, x: clampAim(aimX), y: DROP_Y, vx: 0, vy: 60, age: 0, pop: 0 });
      api.audio.tone(260 + current * 20, 0.08, { type: 'triangle', vol: 0.14 });
      current = next;
      next = pickTier();
      cooldown = 0.45;
      aimX = clampAim(aimX);
    }
    function merge(a, b) {
      a.dead = b.dead = true;
      var tier = a.tier + 1;
      var x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
      chain = chainT > 0 ? chain + 1 : 1;
      chainT = 1.2;
      var mult = Math.min(4, 1 + (chain - 1) * 0.5);
      if (tier >= TIERS.length) {
        var nova = Math.round(1000 * mult);
        api.addScore(nova);
        api.fx.burst(x, y, '#ffe36e', 80, 360, 1.3);
        api.fx.burst(x, y, '#ffffff', 40, 220, 1);
        api.fx.text(x, y, 'SUPERNOVA +' + nova, '#ffe36e', 18);
        api.shake(16);
        api.audio.arp([523, 659, 784, 1047, 1319], 0.07, { type: 'square', vol: 0.22 });
        return;
      }
      var pts = Math.round(POINTS[tier] * mult);
      api.addScore(pts);
      var o = { id: nextId++, tier: tier, x: x, y: y, vx: (a.vx + b.vx) / 2, vy: Math.min(a.vy, b.vy) - 60, age: 1, pop: 1 };
      orbs.push(o);
      api.fx.burst(x, y, TIERS[tier].c, 12 + tier * 3, 120 + tier * 20);
      api.fx.text(x, y - TIERS[tier].r - 6, '+' + pts + (chain > 1 ? ' x' + mult : ''), TIERS[tier].c, 11 + Math.min(tier, 6));
      api.shake(Math.min(10, tier * 1.2));
      api.audio.tone(330 * Math.pow(1.122, tier), 0.14, { type: 'sine', vol: 0.2, slide: 1.5 });
      if (tier >= 6) api.fx.text(W / 2, 150, TIERS[tier].n.toUpperCase() + '!', TIERS[tier].c, 16);
    }

    function physics(h) {
      var i, j, a, b;
      for (i = 0; i < orbs.length; i++) {
        a = orbs[i];
        a.vy += G * h;
        a.vx *= 0.999; a.vy *= 0.999;
        a.x += a.vx * h; a.y += a.vy * h;
      }
      for (var iter = 0; iter < 3; iter++) {
        for (i = 0; i < orbs.length; i++) {
          a = orbs[i];
          if (a.dead) continue;
          for (j = i + 1; j < orbs.length; j++) {
            b = orbs[j];
            if (b.dead) continue;
            var ra = TIERS[a.tier].r, rb = TIERS[b.tier].r;
            var dx = b.x - a.x, dy = b.y - a.y;
            var min = ra + rb;
            var d2 = dx * dx + dy * dy;
            if (d2 >= min * min) continue;
            if (a.tier === b.tier) { merge(a, b); break; }
            var d = Math.sqrt(d2) || 0.01;
            var nx = dx / d, ny = dy / d, overlap = min - d;
            var ma = ra * ra, mb = rb * rb, tot = ma + mb;
            a.x -= nx * overlap * (mb / tot); a.y -= ny * overlap * (mb / tot);
            b.x += nx * overlap * (ma / tot); b.y += ny * overlap * (ma / tot);
            var vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
            if (vn < 0) {
              var jimp = -(1.15) * vn / (1 / ma + 1 / mb);
              a.vx -= jimp / ma * nx; a.vy -= jimp / ma * ny;
              b.vx += jimp / mb * nx; b.vy += jimp / mb * ny;
            }
          }
        }
        for (i = 0; i < orbs.length; i++) {
          a = orbs[i];
          var r = TIERS[a.tier] ? TIERS[a.tier].r : 0;
          if (a.x - r < LEFT) { a.x = LEFT + r; a.vx = Math.abs(a.vx) * 0.25; }
          if (a.x + r > RIGHT) { a.x = RIGHT - r; a.vx = -Math.abs(a.vx) * 0.25; }
          if (a.y + r > FLOOR) { a.y = FLOOR - r; a.vy = -Math.abs(a.vy) * 0.2; a.vx *= 0.97; }
        }
      }
      if (orbs.some(function (o) { return o.dead; })) orbs = orbs.filter(function (o) { return !o.dead; });
    }

    function gameOver() {
      over = true;
      api.shake(12);
      api.audio.tone(180, 0.6, { type: 'sawtooth', slide: 0.3, vol: 0.28 });
      orbs.forEach(function (o, k) {
        setTimeout(function () { api.fx.burst(o.x, o.y, TIERS[o.tier].c, 10, 160); }, k * 25);
      });
    }

    return {
      update: function (dt) {
        t += dt;
        var inp = api.input;
        inp.takeSwipes();
        if (over) { overT += dt; if (overT > 1.4) api.gameOver(); return; }
        cooldown -= dt;
        if (chainT > 0) chainT -= dt;

        // Aim: pointer when it moves, otherwise keys.
        var p = api.pointer();
        if (p.moved !== lastMoved) { lastMoved = p.moved; aimX = p.x; }
        if (inp.held('left')) aimX -= 330 * dt;
        if (inp.held('right')) aimX += 330 * dt;

        // Drop: key press, or release of a touch/click inside the jar.
        if (inp.hit('release')) drop();
        if (inp.hit('a') || inp.hit('down') || inp.hit('up')) drop();

        var h = dt / SUB;
        for (var s = 0; s < SUB; s++) physics(h);
        orbs.forEach(function (o) { o.age += dt; if (o.pop > 0) o.pop = Math.max(0, o.pop - dt * 4); });

        // Over the line: only settled planets count, and only if they stay there.
        var above = orbs.some(function (o) { return o.age > 1.2 && o.y - TIERS[o.tier].r < DANGER && Math.abs(o.vy) < 120; });
        dangerT = above ? dangerT + dt : Math.max(0, dangerT - dt * 2);
        if (dangerT > 2.2) gameOver();

        var biggest = orbs.reduce(function (m, o) { return Math.max(m, o.tier); }, 0);
        api.setStatus('NEXT ' + TIERS[next].n.toUpperCase() + '   BIGGEST ' + TIERS[biggest].n.toUpperCase());
      },

      render: function (ctx) {
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#0b0726'); g.addColorStop(1, '#03020c');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        stars.forEach(function (s) {
          ctx.globalAlpha = 0.35 + Math.sin(t * 2 + s.p) * 0.3;
          ctx.fillStyle = '#fff';
          ctx.fillRect(s.x, s.y, s.s, s.s);
        });
        ctx.globalAlpha = 1;

        // jar
        ctx.save();
        ctx.fillStyle = 'rgba(185,140,255,0.05)';
        ctx.fillRect(LEFT, DANGER - 30, RIGHT - LEFT, FLOOR - DANGER + 30);
        ctx.strokeStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 14; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(LEFT - 1.5, DANGER - 40); ctx.lineTo(LEFT - 1.5, FLOOR + 1.5);
        ctx.lineTo(RIGHT + 1.5, FLOOR + 1.5); ctx.lineTo(RIGHT + 1.5, DANGER - 40);
        ctx.stroke();
        ctx.restore();

        // danger line
        var warn = dangerT > 0;
        ctx.save();
        ctx.setLineDash([8, 8]);
        ctx.strokeStyle = warn ? 'rgba(255,77,109,' + (0.5 + Math.sin(t * 20) * 0.5) + ')' : 'rgba(255,77,109,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(LEFT, DANGER); ctx.lineTo(RIGHT, DANGER); ctx.stroke();
        ctx.restore();

        // aim guide + held planet
        if (!over) {
          var ax = clampAim(aimX);
          ctx.save();
          ctx.strokeStyle = 'rgba(255,255,255,0.14)';
          ctx.setLineDash([3, 7]);
          ctx.beginPath(); ctx.moveTo(ax, DROP_Y); ctx.lineTo(ax, FLOOR); ctx.stroke();
          ctx.restore();
          planet(ctx, ax, DROP_Y, t, current, cooldown > 0 ? 0.35 : 1);
        }
        orbs.forEach(function (o) {
          var r = TIERS[o.tier].r;
          if (o.pop > 0) {
            ctx.save();
            ctx.translate(o.x, o.y);
            var k = 1 + o.pop * 0.18;
            ctx.scale(k, k);
            planet(ctx, 0, 0, t, o.tier);
            ctx.restore();
          } else planet(ctx, o.x, o.y, t, o.tier);
          void r;
        });

        // next preview
        ctx.save();
        ctx.fillStyle = 'rgba(200,210,255,0.55)';
        ctx.font = '700 10px ui-monospace, Menlo, Consolas, monospace';
        ctx.textAlign = 'right';
        ctx.fillText('NEXT', RIGHT - 34, 26);
        ctx.restore();
        ctx.save();
        ctx.translate(RIGHT - 12, 22);
        ctx.scale(0.6, 0.6);
        planet(ctx, 0, 0, t, next);
        ctx.restore();

        if (warn && !over) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, dangerT);
          U.glowText(ctx, 'TOO HIGH!', W / 2, DANGER - 18, 14, '#ff4d6d');
          ctx.restore();
        }
      }
    };
  }

  function attract(ctx, w, h, t) {
    ctx.fillStyle = '#07051a';
    ctx.fillRect(0, 0, w, h);
    var s = h / 300;
    var pile = [[0.25, 0.86, 6], [0.62, 0.84, 7], [0.42, 0.62, 5], [0.8, 0.6, 4], [0.14, 0.64, 3], [0.55, 0.47, 2], [0.3, 0.44, 1]];
    ctx.save();
    ctx.strokeStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 8; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(w * 0.04, h * 0.25); ctx.lineTo(w * 0.04, h * 0.97); ctx.lineTo(w * 0.96, h * 0.97); ctx.lineTo(w * 0.96, h * 0.25); ctx.stroke();
    ctx.restore();
    pile.forEach(function (p) {
      ctx.save();
      ctx.translate(p[0] * w, p[1] * h);
      ctx.scale(s * 0.62, s * 0.62);
      planet(ctx, 0, 0, t, p[2]);
      ctx.restore();
    });
    var fall = (t * 0.6) % 1;
    ctx.save();
    ctx.translate(w * (0.5 + Math.sin(t) * 0.25), h * (0.08 + fall * 0.3));
    ctx.scale(s * 0.62, s * 0.62);
    planet(ctx, 0, 0, t, Math.floor(t * 0.6) % 4);
    ctx.restore();
  }

  XA.registerGame({
    id: 'xa_orbit_merge',
    order: 4,
    title: 'Orbit Merge',
    tagline: 'Match planets. Grow a sun.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'hint',
    touchHint: 'DRAG TO AIM · LIFT YOUR FINGER TO DROP',
    controls: 'Mouse to aim, click to drop · or ←→ and Space',
    create: create,
    attract: attract
  });
})(window);

<script>/* game-block-runner.js */
/*
 * Xtrata Arcade cartridge #5 — BLOCK RUNNER
 * An endless one-button runner: an orange block hops across the chain.
 * Tap to jump (hold for height), duck under drones, grab data bits.
 * Contract game-id: xa_block_runner (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-block-runner');
  var U = XA.util;

  var W = 600, H = 340, GROUND = 284, PX = 92;
  var ACCENT = '#ff9f1c', BIT = '#3ff0ff', HAZARD = '#ff4d6d', DRONE = '#c77dff';
  var SIZE = 30, DUCK = 17;

  function create(api) {
    var rng = api.rng;
    var y = GROUND - SIZE, vy = 0, grounded = true, ducking = false, duckT = 0, jumpBuffer = 0, milestone = 500;
    var dist = 0, speed = 330, bonus = 0;
    var obstacles = [], bits = [];
    var nextGap = 520;
    var dead = false, deadT = 0, started = false;
    var spin = 0, t = 0, bitChain = 0;
    var skyline = [];
    for (var i = 0; i < 24; i++) skyline.push({ w: 30 + rng() * 50, h: 40 + rng() * 110, gap: 4 + rng() * 16 });

    function h() { return ducking && grounded ? DUCK : SIZE; }

    function spawn() {
      var x = dist + W + 40;
      var roll = rng();
      if (dist > 900 && roll < 0.22) {
        // Drone at head height: duck (or time a jump over it).
        obstacles.push({ kind: 'drone', x: x, y: GROUND - 44 - rng() * 6, w: 38, h: 16 });
      } else if (dist > 3000 && roll < 0.36) {
        obstacles.push({ kind: 'block', x: x, y: GROUND - 34, w: 30, h: 34 });
        obstacles.push({ kind: 'block', x: x + 30, y: GROUND - 52, w: 30, h: 52 });
      } else {
        var bh = 26 + Math.floor(rng() * 3) * 12;
        var bw = rng() < 0.3 ? 46 : 26;
        obstacles.push({ kind: rng() < 0.4 ? 'spike' : 'block', x: x, y: GROUND - bh, w: bw, h: bh });
      }
      // A little arc of data bits over some obstacles.
      if (rng() < 0.45) {
        var ox = x + 10;
        for (var k = 0; k < 4; k++) bits.push({ x: ox - 40 + k * 28, y: GROUND - 90 - Math.sin(k / 3 * Math.PI) * 30, got: false });
      }
      var min = 250 + speed * 0.35, max = min + 300;
      nextGap = min + rng() * (max - min);
    }

    function die() {
      dead = true;
      api.fx.burst(PX + SIZE / 2, y + h() / 2, ACCENT, 34, 240, 0.9);
      api.fx.burst(PX + SIZE / 2, y + h() / 2, '#ffffff', 12, 160, 0.6);
      api.shake(11);
      api.audio.tone(160, 0.35, { type: 'square', slide: 0.4, vol: 0.28 });
      api.audio.noise(0.25, { vol: 0.2 });
    }

    return {
      update: function (dt) {
        t += dt;
        var inp = api.input;
        var sw = inp.takeSwipes();
        if (dead) { deadT += dt; if (deadT > 0.9) api.gameOver(); return; }

        var jumpPressed = inp.hit('a') || inp.hit('up') || inp.hit('hold');
        var jumpHeld = inp.held('a') || inp.held('up') || inp.held('hold');
        if (sw.indexOf('down') >= 0) duckT = 0.55;
        if (duckT > 0) duckT -= dt;
        var wantDuck = inp.held('down') || duckT > 0;
        if (!started) {
          if (jumpPressed) started = true; else { spin = Math.sin(t * 4) * 0.1; return; }
        }

        if (jumpPressed) jumpBuffer = 0.12;
        if (jumpBuffer > 0) jumpBuffer -= dt;
        if (grounded && jumpBuffer > 0) {
          grounded = false; vy = -640; jumpBuffer = 0; duckT = 0; wantDuck = false;
          y = GROUND - SIZE;
          api.audio.tone(520, 0.08, { type: 'square', vol: 0.12, slide: 1.6 });
        }
        if (!grounded) {
          // Variable jump: short tap = short hop. Duck in the air = fast fall.
          var grav = vy < 0 && jumpHeld ? 1500 : 2900;
          if (wantDuck) grav = 4200;
          vy += grav * dt;
          y += vy * dt;
          if (y + SIZE >= GROUND) {
            grounded = true; vy = 0;
            api.fx.burst(PX + SIZE / 2, GROUND, 'rgba(255,159,28,0.7)', 6, 70, 0.3);
          }
        }
        ducking = wantDuck;
        var hh = h();
        if (grounded) y = GROUND - hh;
        spin = grounded ? 0 : spin + dt * 9;

        speed = Math.min(820, 330 + dist * 0.018);
        dist += speed * dt;
        nextGap -= speed * dt;
        if (nextGap <= 0) spawn();

        var px0 = PX + 4, px1 = PX + SIZE - 4, py0 = y + 4, py1 = y + hh - 1;
        for (var i = 0; i < obstacles.length; i++) {
          var o = obstacles[i];
          var sx = o.x - dist;
          var inset = o.kind === 'spike' ? 6 : 2;
          if (px1 > sx + inset && px0 < sx + o.w - inset && py1 > o.y + inset && py0 < o.y + o.h) { die(); return; }
          if (!o.passed && sx + o.w < PX) {
            o.passed = true;
            if (o.kind === 'drone' && ducking) { bonus += 10; api.fx.text(PX + 20, y - 14, 'DUCK +10', DRONE, 10); }
          }
        }
        for (var j = 0; j < bits.length; j++) {
          var b = bits[j];
          if (b.got) continue;
          var bx = b.x - dist;
          if (bx > px0 - 8 && bx < px1 + 8 && b.y > py0 - 8 && b.y < py1 + 8) {
            b.got = true;
            bitChain++;
            var pts = 5 * Math.min(bitChain, 8);
            bonus += pts;
            api.fx.burst(bx, b.y, BIT, 8, 90, 0.4);
            if (bitChain % 4 === 0) api.fx.text(bx, b.y - 12, 'CHAIN ' + bitChain, BIT, 10);
            api.audio.tone(880 + (bitChain % 8) * 60, 0.05, { type: 'square', vol: 0.1 });
          } else if (bx < PX - 20 && !b.missed) { b.missed = true; bitChain = 0; }
        }
        obstacles = obstacles.filter(function (o) { return o.x - dist > -120; });
        bits = bits.filter(function (b) { return b.x - dist > -40; });

        var metres = Math.floor(dist / 10);
        api.setScore(metres + bonus);
        if (metres >= milestone) {
          api.fx.text(W / 2, 80, milestone + ' m', ACCENT, 16);
          milestone += 500;
          api.audio.arp([523, 784], 0.07, { type: 'triangle', vol: 0.15 });
        }
        api.setStatus(metres + ' m  ·  ' + Math.round(speed / 10) + ' km/h' + (bitChain > 1 ? '  ·  BITS x' + bitChain : ''));
      },

      render: function (ctx) {
        // Sky shifts slowly between dusk and night as you run.
        var phase = (Math.sin(dist / 6000) + 1) / 2;
        var g = ctx.createLinearGradient(0, 0, 0, GROUND);
        g.addColorStop(0, phase > 0.5 ? '#07081c' : '#1a0b2e');
        g.addColorStop(1, phase > 0.5 ? '#141238' : '#3a1440');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // sun / moon
        ctx.save();
        ctx.shadowColor = '#ff9f1c'; ctx.shadowBlur = 30;
        ctx.fillStyle = phase > 0.5 ? 'rgba(220,230,255,0.85)' : 'rgba(255,159,28,0.8)';
        ctx.beginPath(); ctx.arc(470, 80, 26, 0, 7); ctx.fill();
        ctx.restore();

        // skyline: a chain of stacked blocks
        var sx = -((dist * 0.2) % 1400);
        ctx.fillStyle = 'rgba(120,90,255,0.18)';
        for (var rep = 0; rep < 2; rep++) {
          var x = sx + rep * 1400;
          skyline.forEach(function (b) {
            ctx.fillRect(x, GROUND - b.h, b.w, b.h);
            x += b.w + b.gap;
          });
        }
        // ground
        ctx.fillStyle = '#0a0a18';
        ctx.fillRect(0, GROUND, W, H - GROUND);
        ctx.save();
        ctx.strokeStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 10; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, GROUND + 1); ctx.lineTo(W, GROUND + 1); ctx.stroke();
        ctx.restore();
        ctx.fillStyle = 'rgba(255,159,28,0.25)';
        var off = dist % 40;
        for (var k = 0; k < W / 40 + 2; k++) ctx.fillRect(k * 40 - off, GROUND + 14, 18, 2);
        off = (dist * 1.4) % 90;
        for (k = 0; k < W / 90 + 2; k++) ctx.fillRect(k * 90 - off, GROUND + 34, 30, 2);

        // bits
        bits.forEach(function (b) {
          if (b.got) return;
          var bx = b.x - dist;
          ctx.save();
          ctx.translate(bx, b.y);
          ctx.rotate(t * 3);
          ctx.shadowColor = BIT; ctx.shadowBlur = 10; ctx.fillStyle = BIT;
          ctx.fillRect(-4, -4, 8, 8);
          ctx.restore();
        });

        // obstacles
        obstacles.forEach(function (o) {
          var ox = o.x - dist;
          if (ox > W + 60 || ox < -80) return;
          ctx.save();
          if (o.kind === 'spike') {
            ctx.fillStyle = HAZARD; ctx.shadowColor = HAZARD; ctx.shadowBlur = 12;
            var n = Math.max(1, Math.round(o.w / 13));
            var sw = o.w / n;
            ctx.beginPath();
            for (var s = 0; s < n; s++) {
              ctx.moveTo(ox + s * sw, o.y + o.h);
              ctx.lineTo(ox + s * sw + sw / 2, o.y);
              ctx.lineTo(ox + (s + 1) * sw, o.y + o.h);
            }
            ctx.fill();
          } else if (o.kind === 'drone') {
            var bob = Math.sin(t * 8 + o.x) * 2;
            ctx.fillStyle = DRONE; ctx.shadowColor = DRONE; ctx.shadowBlur = 14;
            U.roundRect(ctx, ox, o.y + bob, o.w, o.h, 5); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillRect(ox + 6, o.y + bob + 5, 5, 5);
            ctx.strokeStyle = 'rgba(199,125,255,0.8)'; ctx.lineWidth = 2;
            var pr = Math.sin(t * 40) * 9;
            ctx.beginPath(); ctx.moveTo(ox + o.w / 2 - pr, o.y + bob - 4); ctx.lineTo(ox + o.w / 2 + pr, o.y + bob - 4); ctx.stroke();
          } else {
            ctx.fillStyle = '#23254a'; ctx.strokeStyle = '#6a7bff'; ctx.shadowColor = '#6a7bff'; ctx.shadowBlur = 10; ctx.lineWidth = 2;
            ctx.fillRect(ox, o.y, o.w, o.h);
            ctx.strokeRect(ox + 1, o.y + 1, o.w - 2, o.h - 2);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(106,123,255,0.35)';
            for (var yy = o.y + 12; yy < o.y + o.h; yy += 12) { ctx.beginPath(); ctx.moveTo(ox + 2, yy); ctx.lineTo(ox + o.w - 2, yy); ctx.stroke(); }
          }
          ctx.restore();
        });

        // runner
        if (!dead) {
          var hh = h();
          ctx.save();
          ctx.translate(PX + SIZE / 2, y + hh / 2);
          ctx.rotate(grounded ? 0 : spin);
          ctx.shadowColor = ACCENT; ctx.shadowBlur = 16;
          ctx.fillStyle = ACCENT;
          ctx.fillRect(-SIZE / 2, -hh / 2, SIZE, hh);
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          ctx.fillRect(-SIZE / 2, -hh / 2, SIZE, 4);
          ctx.fillStyle = '#05060f';
          ctx.fillRect(4, -hh / 2 + 6, 5, hh > 20 ? 6 : 3);
          ctx.restore();
          if (grounded && started) api.fx.trail(PX, GROUND - 2, 'rgba(255,159,28,0.6)', -speed * 0.3, -20);
        }
        if (!started && !dead) {
          ctx.save();
          ctx.globalAlpha = 0.6 + Math.sin(t * 5) * 0.4;
          U.glowText(ctx, 'TAP OR SPACE TO RUN', W / 2, 140, 15, '#ffd9a8');
          ctx.restore();
        }
      }
    };
  }

  function attract(ctx, w, h, t) {
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#1a0b2e'); g.addColorStop(1, '#3a1440');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = 'rgba(120,90,255,0.2)';

      var x = ((i * w * 0.11 - t * 20) % (w * 1.3) + w * 1.3) % (w * 1.3) - bw;
      ctx.fillRect(x, gy - bh, bw, bh);
    }
    ctx.save();
    ctx.strokeStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 8; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
    ctx.restore();
    var cyc = (t * 0.8) % 1;
    var ox = w * (1.1 - cyc * 1.3);
    ctx.fillStyle = HAZARD;
    ctx.beginPath(); ctx.moveTo(ox, gy); ctx.lineTo(ox + h * 0.06, gy - h * 0.12); ctx.lineTo(ox + h * 0.12, gy); ctx.fill();
    var px = w * 0.2, size = h * 0.1;
    var dx = ox - px;
    var jump = dx < size * 2.2 && dx > -size * 1.5 ? Math.sin((1 - (dx + size * 1.5) / (size * 3.7)) * Math.PI) : 0;
    ctx.save();
    ctx.shadowColor = ACCENT; ctx.shadowBlur = 12; ctx.fillStyle = ACCENT;
    ctx.translate(px + size / 2, gy - size / 2 - Math.max(0, jump) * h * 0.25);
    ctx.rotate(Math.max(0, jump) * Math.PI);
    ctx.fillRect(-size / 2, -size / 2, size, size);
    ctx.restore();
  }

  XA.registerGame({
    id: 'xa_block_runner',
    order: 5,
    title: 'Block Runner',
    tagline: 'Jump the blocks. Duck the drones.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'hint',
    touchHint: 'TAP TO JUMP · HOLD FOR HEIGHT · SWIPE DOWN TO DUCK',
    controls: 'Space / ↑ jump (hold for height) · ↓ duck',
    create: create,
    attract: attract
  });
})(window);
</script>
<script>/* game-brick-breaker.js */
/*
 * Xtrata Arcade cartridge #6 — BRICK BREAKER
 * Paddle, ball, bricks. Tough bricks take several hits, power-ups drop from
 * broken bricks, consecutive hits without touching the paddle build a combo.
 * Clear the wall to go up a level; three lives.
 * Contract game-id: xa_brick_breaker (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-brick-breaker');
  var U = XA.util;

  var W = 480, H = 600;
  var COLS = 10, BW = 44, BH = 18, GAP = 2, TOP = 76;
  var BX0 = (W - COLS * (BW + GAP) + GAP) / 2;
  var PY = 556, PH = 12, BALL_R = 6;
  var ACCENT = '#ff3fa4';
  var HP_COLORS = ['', '#3ff0ff', '#ffd23f', '#ff4d6d', '#b04dff'];
  var POWERS = {
    wide: { c: '#39ff88', l: 'W' },
    multi: { c: '#3ff0ff', l: 'M' },
    slow: { c: '#ffd23f', l: 'S' },
    life: { c: '#ff3fa4', l: '+' }
  };

  function create(api) {
    var rng = api.rng;
    var level = 1, lives = 3;
    var bricks = [];
    var balls = [];
    var drops = [];
    var paddle = { x: W / 2, w: 84, target: 84 };
    var wideT = 0, slowT = 0;
    var combo = 0;
    var lastMoved = api.pointer().moved;
    var over = false, overT = 0, clearT = 0;
    var t = 0;

    function baseSpeed() { return Math.min(560, 330 + (level - 1) * 28); }

    function buildLevel() {
      bricks = [];
      var rows = Math.min(9, 5 + Math.floor((level - 1) / 2));
      var pattern = (level - 1) % 4;
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < COLS; c++) {
          var keep = true;
          if (pattern === 1) keep = (r + c) % 2 === 0 || r < 2;
          if (pattern === 2) keep = Math.abs(c - 4.5) + r * 0.6 < 6.5;
          if (pattern === 3) keep = c % 3 !== 1 || r % 2 === 0;
          if (!keep) continue;
          var hp = 1;
          var toughChance = Math.min(0.7, 0.08 * level);
          if (r < 2 && rng() < toughChance) hp = 2 + (rng() < 0.08 * level ? 1 : 0);
          if (level >= 4 && r === 0 && rng() < 0.25) hp = 4;
          bricks.push({ x: BX0 + c * (BW + GAP), y: TOP + r * (BH + GAP), hp: hp, max: hp, flash: 0 });
        }
      }
    }
    function resetBall() {
      balls = [{ x: paddle.x, y: PY - BALL_R - 1, vx: 0, vy: 0, stuck: true }];
      combo = 0;
    }
    function launch(b) {
      var ang = (-90 + (rng() - 0.5) * 30) * Math.PI / 180;
      var sp = baseSpeed();
      b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp; b.stuck = false;
      api.audio.tone(660, 0.06, { type: 'square', vol: 0.12 });
    }
    buildLevel();
    resetBall();

    function hitBrick(br, b) {
      br.hp--;
      br.flash = 0.12;
      combo++;
      var mult = 1 + Math.min(combo - 1, 10) * 0.1;
      var cx = br.x + BW / 2, cy = br.y + BH / 2;
      if (br.hp <= 0) {
        var pts = Math.round(10 * br.max * level * mult);
        api.addScore(pts);
        api.fx.burst(cx, cy, HP_COLORS[Math.min(br.max, 4)], 14, 160, 0.5);
        if (combo >= 3) api.fx.text(cx, cy, '+' + pts, '#fff', 10);
        api.audio.tone(440 + Math.min(combo, 16) * 40, 0.05, { type: 'square', vol: 0.12 });
        if (rng() < 0.11) {
          var kinds = ['wide', 'multi', 'slow', 'wide', 'multi'];
          if (rng() < 0.12) kinds = ['life'];
          drops.push({ x: cx, y: cy, kind: kinds[Math.floor(rng() * kinds.length)] });
        }
      } else {
        api.addScore(Math.round(5 * level));
        api.audio.tone(300, 0.04, { type: 'triangle', vol: 0.1 });
      }
      void b;
    }

    // Move one ball by (dx, dy); returns false if it fell out.
    function stepBall(b, h) {
      b.x += b.vx * h; b.y += b.vy * h;
      if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); }
      if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); }
      if (b.y < BALL_R + 30) { b.y = BALL_R + 30; b.vy = Math.abs(b.vy); }
      // paddle
      var half = paddle.w / 2;
      if (b.vy > 0 && b.y + BALL_R >= PY && b.y + BALL_R <= PY + PH + 8 && b.x > paddle.x - half - BALL_R && b.x < paddle.x + half + BALL_R) {
        var off = U.clamp((b.x - paddle.x) / half, -1, 1);
        var ang = (-90 + off * 62) * Math.PI / 180;
        var sp = Math.min(640, Math.hypot(b.vx, b.vy) * 1.012);
        b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
        b.y = PY - BALL_R;
        combo = 0;
        api.audio.tone(220, 0.05, { type: 'square', vol: 0.12 });
        api.fx.burst(b.x, PY, ACCENT, 6, 80, 0.3);
      }
      // bricks: resolve at most one per substep
      for (var i = 0; i < bricks.length; i++) {
        var br = bricks[i];
        if (br.hp <= 0) continue;
        var nx = U.clamp(b.x, br.x, br.x + BW), ny = U.clamp(b.y, br.y, br.y + BH);
        var dx = b.x - nx, dy = b.y - ny;
        if (dx * dx + dy * dy > BALL_R * BALL_R) continue;
        var penX = Math.min(Math.abs(b.x - br.x), Math.abs(br.x + BW - b.x));
        var penY = Math.min(Math.abs(b.y - br.y), Math.abs(br.y + BH - b.y));
        if (dx === 0 && dy === 0) { if (penX < penY) b.vx = -b.vx; else b.vy = -b.vy; }
        else if (Math.abs(dx) > Math.abs(dy)) b.vx = dx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
        else b.vy = dy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy);
        hitBrick(br, b);
        break;
      }
      return b.y < H + 20;
    }

    function loseLife() {
      lives--;
      api.shake(8);
      api.audio.tone(200, 0.4, { type: 'sawtooth', slide: 0.4, vol: 0.25 });
      paddle.target = 84; wideT = 0; slowT = 0; drops = [];
      if (lives <= 0) {
        over = true;
        api.fx.burst(paddle.x, PY, ACCENT, 40, 220, 1);
        return;
      }
      api.fx.text(W / 2, H / 2, lives + (lives === 1 ? ' LIFE LEFT' : ' LIVES LEFT'), '#fff', 14);
      resetBall();
    }

    return {
      update: function (dt) {
        t += dt;
        var inp = api.input;
        var sw = inp.takeSwipes();
        if (over) { overT += dt; if (overT > 1.1) api.gameOver(); return; }

        // Paddle: pointer when it moves, otherwise keys.
        var p = api.pointer();
        if (p.moved !== lastMoved) { lastMoved = p.moved; paddle.x = p.x; }
        if (inp.held('left')) paddle.x -= 560 * dt;
        if (inp.held('right')) paddle.x += 560 * dt;
        paddle.w += (paddle.target - paddle.w) * Math.min(1, dt * 10);
        paddle.x = U.clamp(paddle.x, paddle.w / 2 + 4, W - paddle.w / 2 - 4);

        if (wideT > 0) { wideT -= dt; if (wideT <= 0) paddle.target = 84; }
        if (slowT > 0) slowT -= dt;

        if (clearT > 0) {
          clearT -= dt;
          balls.forEach(function (b) { if (b.stuck) b.x = paddle.x; });
          if (clearT <= 0) { level++; buildLevel(); resetBall(); api.fx.text(W / 2, H / 2, 'LEVEL ' + level, '#ffd23f', 18); }
          return;
        }

        var launchNow = inp.hit('a') || inp.hit('up') || sw.indexOf('tap') >= 0;
        balls.forEach(function (b) {
          if (b.stuck) { b.x = paddle.x; b.y = PY - BALL_R - 1; if (launchNow) launch(b); }
        });

        var slow = slowT > 0 ? 0.65 : 1;
        var sub = 3;
        for (var s = 0; s < sub; s++) {
          balls = balls.filter(function (b) { return b.stuck || stepBall(b, dt * slow / sub); });
        }
        balls.forEach(function (b) { if (!b.stuck) api.fx.trail(b.x, b.y, 'rgba(255,255,255,0.5)', 0, 0); });
        if (!balls.length) { loseLife(); return; }

        // power-up drops
        drops = drops.filter(function (d) {
          d.y += 150 * dt;
          if (d.y > PY - 6 && d.y < PY + PH + 6 && Math.abs(d.x - paddle.x) < paddle.w / 2 + 10) {
            var pw = POWERS[d.kind];
            api.fx.burst(d.x, PY, pw.c, 16, 140);
            api.audio.arp([523, 784], 0.05, { type: 'triangle', vol: 0.16 });
            if (d.kind === 'wide') { paddle.target = 134; wideT = 12; api.fx.text(d.x, PY - 20, 'WIDE', pw.c, 11); }
            if (d.kind === 'slow') { slowT = 10; api.fx.text(d.x, PY - 20, 'SLOW', pw.c, 11); }
            if (d.kind === 'life') { lives = Math.min(5, lives + 1); api.fx.text(d.x, PY - 20, '+1 LIFE', pw.c, 11); }
            if (d.kind === 'multi') {
              api.fx.text(d.x, PY - 20, 'MULTI', pw.c, 11);
              var src = balls.filter(function (b) { return !b.stuck; })[0];
              if (src) for (var k = 0; k < 2 && balls.length < 8; k++) {
                var a = Math.atan2(src.vy, src.vx) + (k ? 0.45 : -0.45);
                var sp = Math.hypot(src.vx, src.vy);
                balls.push({ x: src.x, y: src.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, stuck: false });
              }
            }
            return false;
          }
          return d.y < H + 20;
        });

        bricks.forEach(function (br) { if (br.flash > 0) br.flash -= dt; });
        if (bricks.every(function (br) { return br.hp <= 0; })) {
          var bonus = 250 * level + lives * 100;
          api.addScore(bonus);
          api.fx.text(W / 2, H / 2 - 30, 'WALL CLEARED +' + bonus, '#39ff88', 15);
          api.audio.arp([523, 659, 784, 1047], 0.08, { type: 'square', vol: 0.2 });
          balls = balls.slice(0, 1);
          balls[0].stuck = true;
          clearT = 1.6;
        }
        var left = bricks.filter(function (br) { return br.hp > 0; }).length;
        api.setStatus('LV ' + level + '  ·  LIVES ' + lives + '  ·  BRICKS ' + left + (combo > 2 ? '  ·  COMBO ' + combo : ''));
      },

      render: function (ctx) {
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#12051f'); g.addColorStop(1, '#05030c');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(255,63,164,0.07)';
        ctx.beginPath();
        for (var x = 0; x <= W; x += 24) { ctx.moveTo(x + 0.5, 30); ctx.lineTo(x + 0.5, H); }
        ctx.stroke();
        // top rail
        ctx.save();
        ctx.strokeStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 12; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(W, 30); ctx.stroke();
        ctx.restore();
        // lives
        for (var l = 0; l < lives; l++) {
          ctx.fillStyle = ACCENT;
          U.roundRect(ctx, 12 + l * 26, 11, 20, 7, 3); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '700 11px ui-monospace, Menlo, Consolas, monospace';
        ctx.textAlign = 'right';
        ctx.fillText('LEVEL ' + level, W - 12, 19);

        bricks.forEach(function (br) {
          if (br.hp <= 0) return;
          var col = br.flash > 0 ? '#ffffff' : HP_COLORS[Math.min(br.hp, 4)];
          ctx.save();
          ctx.shadowColor = col; ctx.shadowBlur = 8;
          ctx.fillStyle = col;
          ctx.globalAlpha = 0.35 + 0.65 * (br.hp / br.max);
          ctx.fillRect(br.x, br.y, BW, BH);
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255,255,255,0.3)';
          ctx.fillRect(br.x, br.y, BW, 3);
          if (br.max > 1) {
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            for (var k = 0; k < br.hp; k++) ctx.fillRect(br.x + 5 + k * 6, br.y + BH - 6, 4, 3);
          }
          ctx.restore();
        });

        drops.forEach(function (d) {
          var pw = POWERS[d.kind];
          ctx.save();
          ctx.shadowColor = pw.c; ctx.shadowBlur = 12; ctx.fillStyle = pw.c;
          U.roundRect(ctx, d.x - 14, d.y - 8, 28, 16, 8); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#05030c';
          ctx.font = '900 11px ui-monospace, Menlo, Consolas, monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(pw.l, d.x, d.y + 1);
          ctx.restore();
        });

        // paddle
        ctx.save();
        ctx.shadowColor = wideT > 0 ? '#39ff88' : ACCENT; ctx.shadowBlur = 18;
        ctx.fillStyle = wideT > 0 ? '#39ff88' : ACCENT;
        U.roundRect(ctx, paddle.x - paddle.w / 2, PY, paddle.w, PH, 6); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        U.roundRect(ctx, paddle.x - paddle.w / 2 + 4, PY + 2, paddle.w - 8, 3, 2); ctx.fill();
        ctx.restore();

        balls.forEach(function (b) {
          ctx.save();
          ctx.shadowColor = slowT > 0 ? '#ffd23f' : '#ffffff'; ctx.shadowBlur = 14;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, 7); ctx.fill();
          ctx.restore();
        });
        if (balls.length === 1 && balls[0].stuck && !over && clearT <= 0) {
          ctx.save();
          ctx.globalAlpha = 0.6 + Math.sin(t * 5) * 0.4;
          U.glowText(ctx, 'TAP OR SPACE TO LAUNCH', W / 2, PY - 60, 13, '#ffd0ea');
          ctx.restore();
        }
      }
    };
  }

  function attract(ctx, w, h, t) {
    ctx.fillStyle = '#0d0418';
    ctx.fillRect(0, 0, w, h);
    var cols = 8, bw = w / cols;
    for (var r = 0; r < 4; r++) for (var c = 0; c < cols; c++) {
      if ((r * 3 + c * 5 + Math.floor(t * 0.5)) % 7 === 0) continue;
      ctx.fillStyle = HP_COLORS[1 + ((r + c) % 3)];
      ctx.globalAlpha = 0.85;
      ctx.fillRect(c * bw + 2, h * 0.12 + r * h * 0.07, bw - 4, h * 0.055);
    }
    ctx.globalAlpha = 1;
    var bx = w / 2 + Math.sin(t * 1.9) * w * 0.4;
    var by = h * 0.55 + Math.abs(Math.sin(t * 2.6)) * -h * 0.25 + h * 0.2;
    var px = w / 2 + Math.sin(t * 1.9) * w * 0.35;
    ctx.save();
    ctx.shadowColor = ACCENT; ctx.shadowBlur = 12; ctx.fillStyle = ACCENT;
    U.roundRect(ctx, px - w * 0.1, h * 0.88, w * 0.2, h * 0.035, 4); ctx.fill();
    ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx, by, h * 0.025, 0, 7); ctx.fill();
    ctx.restore();
  }

  XA.registerGame({
    id: 'xa_brick_breaker',
    order: 6,
    title: 'Brick Breaker',
    tagline: 'Smash the wall. Catch the power-ups.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'hint',
    touchHint: 'DRAG TO MOVE THE PADDLE · TAP TO LAUNCH',
    controls: 'Mouse or ←→ to move · Space to launch',
    create: create,
    attract: attract
  });
})(window);
