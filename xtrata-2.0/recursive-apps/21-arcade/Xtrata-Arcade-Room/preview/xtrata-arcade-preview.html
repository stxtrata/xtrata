  }

  // --- walls: outline every wall face that touches open floor, `d` px inside
  // the wall. Ends are trimmed at convex corners and extended at concave ones
  // so neighbouring faces join into one continuous neon line.
  function wallTile(m, x, y) { return x < 0 || x >= COLS || y < 0 || y >= ROWS || m.grid[y].charAt(x) === '#'; }
  function traceWalls(g, m, d) {
    g.beginPath();
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
      if (!wallTile(m, x, y)) continue;
      var X = x * T, Y = y * T;
      var up = wallTile(m, x, y - 1), dn = wallTile(m, x, y + 1), lf = wallTile(m, x - 1, y), rt = wallTile(m, x + 1, y);
      if (!up) {
        g.moveTo(!lf ? X + d : wallTile(m, x - 1, y - 1) ? X - d : X, Y + d);
        g.lineTo(!rt ? X + T - d : wallTile(m, x + 1, y - 1) ? X + T + d : X + T, Y + d);
      }
      if (!dn) {
        g.moveTo(!lf ? X + d : wallTile(m, x - 1, y + 1) ? X - d : X, Y + T - d);
        g.lineTo(!rt ? X + T - d : wallTile(m, x + 1, y + 1) ? X + T + d : X + T, Y + T - d);
      }
      if (!lf) {
        g.moveTo(X + d, !up ? Y + d : wallTile(m, x - 1, y - 1) ? Y - d : Y);
        g.lineTo(X + d, !dn ? Y + T - d : wallTile(m, x - 1, y + 1) ? Y + T + d : Y + T);
      }
      if (!rt) {
        g.moveTo(X + T - d, !up ? Y + d : wallTile(m, x + 1, y - 1) ? Y - d : Y);
        g.lineTo(X + T - d, !dn ? Y + T - d : wallTile(m, x + 1, y + 1) ? Y + T + d : Y + T);
      }
    }
  }
  // Pre-rendered once per maze (and once more in white for the clear flash).
  var wallCache = {};
  function wallLayer(m, flash) {
    var key = m.index + (flash ? 'f' : 'n');
    if (wallCache[key]) return wallCache[key];
    var c = makeCanvas(W, ROWS * T), g = c.getContext('2d');
    var outer = flash ? '#ffffff' : m.theme.wall, inner = flash ? '#ffffff' : m.theme.inner;
    g.lineCap = 'round'; g.lineJoin = 'round';
    // faint body between the lines
    g.fillStyle = hexA(flash ? '#ffffff' : m.theme.wall, flash ? 0.12 : 0.06);
    for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) if (wallTile(m, x, y)) g.fillRect(x * T, y * T, T, T);
    // outer line: wide soft glow, then a crisp core
    g.save(); g.shadowColor = outer; g.shadowBlur = 12; g.strokeStyle = outer; g.lineWidth = 2.6;
    traceWalls(g, m, 3); g.stroke(); g.restore();
    g.strokeStyle = outer; g.lineWidth = 1.6; traceWalls(g, m, 3); g.stroke();
    // inner line: thinner and paler, the second rail of the double line
    g.save(); g.shadowColor = outer; g.shadowBlur = 6; g.strokeStyle = inner; g.globalAlpha = 0.75; g.lineWidth = 1;
    traceWalls(g, m, 7); g.stroke(); g.restore();
    // tunnel floors get a faint tint so the wrap reads as a passage
    m.tunnelRows.forEach(function (ty) {
      for (var tx = 0; tx < COLS; tx++) if (m.grid[ty].charAt(tx) === '=') {
        var grd = g.createLinearGradient(0, ty * T, 0, ty * T + T);
        grd.addColorStop(0, hexA(outer, 0)); grd.addColorStop(0.5, hexA(outer, 0.12)); grd.addColorStop(1, hexA(outer, 0));
        g.fillStyle = grd; g.fillRect(tx * T, ty * T, T, T);
      }
    });
    wallCache[key] = c;
    return c;
  }

  // --- pellets: a small glow sprite per colour, stamped with drawImage
  var dotCache = {};
  function dotSprite(color) {
    if (dotCache[color]) return dotCache[color];
    var c = makeCanvas(14, 14), g = c.getContext('2d');
    g.shadowColor = color; g.shadowBlur = 6; g.fillStyle = color;
    g.fillRect(5, 5, 4, 4);
    g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,0.8)'; g.fillRect(6, 6, 2, 2);
    dotCache[color] = c;
    return c;
  }

  // --- the muncher: a block with two trap jaws hinged at the back, drawn
  // facing right and turned (mirrored for left so its eye stays on top).
  function drawMuncher(ctx, x, y, s, dir, open, color) {
    ctx.save();
    ctx.translate(x, y);
    if (dir === 'left') ctx.scale(-1, 1);
    else if (dir === 'up') ctx.rotate(-Math.PI / 2);
    else if (dir === 'down') ctx.rotate(Math.PI / 2);
    ctx.scale(s / 20, s / 20);
    ctx.translate(-7, 0);                          // the hinge
    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 12;
    U.roundRect(ctx, -2.5, -7, 8, 14, 3); ctx.fill();   // hinge block keeps the back closed
    jaw(-1, -open);
    jaw(1, open);
    ctx.restore();
    function jaw(side, ang) {
      ctx.save();
      ctx.rotate(ang);
      U.roundRect(ctx, -2.5, side < 0 ? -9.5 : 0, 19, 9.5, 4); ctx.fill();
      ctx.save();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.8)';     // teeth along the biting edge, interleaved
      for (var tx = side < 0 ? 5 : 7; tx < 15; tx += 4) {
        ctx.beginPath(); ctx.moveTo(tx, 0); ctx.lineTo(tx + 2.4, 0); ctx.lineTo(tx + 1.2, -side * 2.4); ctx.fill();
      }
      if (side < 0) {                              // the eye rides the upper jaw
        ctx.fillStyle = '#ffffff'; ctx.fillRect(4, -7.5, 4.5, 4.5);
        ctx.fillStyle = '#05060f'; ctx.fillRect(6.3, -6.5, 2.2, 2.4);
      }
      ctx.restore();
      ctx.restore();
    }
  }

  // --- glitch body: a squared-off block with an animated hem whose shape
  // is part of each personality.
  function glitchBody(ctx, hem, t, ph) {
    ctx.beginPath();
    ctx.moveTo(-9, 5);
    ctx.lineTo(-9, -6);
    ctx.quadraticCurveTo(-9, -10, -5, -10);
    ctx.lineTo(5, -10);
    ctx.quadraticCurveTo(9, -10, 9, -6);
    ctx.lineTo(9, 5);
    var i, f;
    if (hem === 'saw') {                           // BYTER: marching teeth
      f = Math.floor(t * 8 + ph);
      for (i = 0; i <= 6; i++) ctx.lineTo(9 - i * 3, 5 + ((i + f) % 2 ? 4.5 : 0));
    } else if (hem === 'square') {                 // MIRROR: square wave
      f = Math.floor(t * 6 + ph);
      for (i = 0; i < 6; i++) { var hy = 5 + ((i + f) % 2) * 4; ctx.lineTo(9 - i * 3, hy); ctx.lineTo(6 - i * 3, hy); }
    } else if (hem === 'noise') {                  // STATIC: never the same twice (visual only)
      for (i = 0; i <= 9; i++) ctx.lineTo(9 - i * 2, 5 + Math.random() * 4.5);
    } else {                                       // PREFETCH / frightened: soft ripple
      for (i = 0; i <= 12; i++) ctx.lineTo(9 - i * 1.5, 6.5 + 2.2 * Math.sin(i * 1.1 + t * 9 + ph));
    }
    ctx.closePath();
  }

  // look: 'scatter' | 'chase' | 'shy' | 'pen' | 'fright' | 'flash' | 'eyes' | 'frozen'
  function drawGlitch(ctx, x, y, s, p, look, dir, t, ph) {
    var v = DIRS[dir] || [0, 0];
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s / 20, s / 20);
    if (look !== 'eyes') {
      var fr = look === 'fright' || look === 'flash';
      var col = look === 'fright' ? FRIGHT_BLUE : look === 'flash' ? FRIGHT_FLASH : p.color;
      // tearing: every so often the body slips sideways for a frame or two
      var tear = !fr && ((t * 1.7 + ph) % 3) < 0.06 ? 3 : 0;
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 10;
      ctx.save(); ctx.translate(tear, 0);
      glitchBody(ctx, fr ? 'sine' : p.hem, t, ph);
      ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(-6, -9, 7, 1.6);
      if (fr) { frightFace(ctx, look, t); ctx.restore(); return; }
      accessory(ctx, p, t, col);
      if (p.id === 'static' || tear) {             // scanline slices
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(-9, -2 + Math.sin(t * 23 + ph) * 5, 18, 1.5);
        ctx.fillStyle = col;
        ctx.fillRect(-9 + (Math.random() < 0.3 ? 2 : 0), 1 + Math.sin(t * 17) * 3, 18, 1.5);
      }
      if (look === 'frozen') {
        ctx.fillStyle = 'rgba(190,240,255,0.5)';
        glitchBody(ctx, 'square', 0, 0); ctx.fill();
        ctx.strokeStyle = '#e8fbff'; ctx.lineWidth = 1; ctx.stroke();
      }
    }
    eyes(ctx, p, look, v, t);
    ctx.restore();
  }
  function accessory(ctx, p, t, col) {
    ctx.fillStyle = col;
    if (p.id === 'byter') {                        // two horn pixels
      ctx.beginPath(); ctx.moveTo(-7, -9); ctx.lineTo(-5.5, -14); ctx.lineTo(-3.5, -9.5); ctx.fill();
      ctx.beginPath(); ctx.moveTo(7, -9); ctx.lineTo(5.5, -14); ctx.lineTo(3.5, -9.5); ctx.fill();
    } else if (p.id === 'prefetch') {              // antenna with a blinking tip
      ctx.strokeStyle = col; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(1, -10); ctx.lineTo(3, -15); ctx.stroke();
      ctx.fillStyle = Math.floor(t * 4) % 2 ? '#ffffff' : col;
      ctx.fillRect(2, -17, 3, 3);
    } else if (p.id === 'mirror') {                // a small fin on each side
      ctx.fillRect(-11, -3, 2, 5); ctx.fillRect(9, -3, 2, 5);
    }
  }
  function eyes(ctx, p, look, v, t) {
    var mood = look;
    if (p.id === 'mirror' && look !== 'eyes') {    // MIRROR wears a visor instead of eyes
      ctx.fillStyle = '#0a0a1c';
      U.roundRect(ctx, -8, -7, 16, 6, 2.5); ctx.fill();
      ctx.fillStyle = mood === 'chase' ? '#ffffff' : '#bff8ff';
      var sw = mood === 'chase' ? 4 : 3, sh = mood === 'chase' ? 1.4 : 2.2;
      ctx.fillRect(-5 + v[0] * 2 - sw / 2 + 1, -4.6 + v[1] - sh / 2 + 0.5, sw, sh);
      ctx.fillRect(3 + v[0] * 2 - sw / 2 + 1, -4.6 + v[1] - sh / 2 + 0.5, sw, sh);
      if (mood === 'pen') { ctx.fillStyle = p.color; ctx.fillRect(-8, -7, 16, 3); }
      return;
    }
    var big = p.id === 'prefetch' ? 1 : 0;          // PREFETCH squints with one oversized scope eye
    var jit = p.id === 'static' && look !== 'eyes' ? (Math.random() - 0.5) * 1.2 : 0;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-7, -7, 5, 6);
    ctx.fillRect(1, -7 - big, 5 + big, 6 + big);
    ctx.fillStyle = look === 'eyes' ? '#2a3cff' : '#05060f';
    ctx.fillRect(-5.5 + v[0] * 1.6 + jit, -5 + v[1] * 1.6, 2.5, 3);
    ctx.fillRect(2.5 + v[0] * 1.6 + jit + big * 0.5, -5 - big * 0.5 + v[1] * 1.6, 2.5, 3);
    if (big && look !== 'eyes') { ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 0.8; ctx.strokeRect(0.5, -8.5, 7, 8); }
    if (look === 'eyes') return;
    ctx.strokeStyle = '#05060f'; ctx.lineWidth = 1.4;
    if (mood === 'pen') {                           // sleepy lids
      ctx.fillStyle = p.color; ctx.fillRect(-7, -7.5, 5, 3.4); ctx.fillRect(1, -8.5, 6, 3.6);
    } else if (mood === 'chase') {                  // angry brows
      ctx.beginPath(); ctx.moveTo(-8, -9.5); ctx.lineTo(-2.5, -7.4); ctx.moveTo(7.5, -9.5); ctx.lineTo(1.5, -7.4); ctx.stroke();
      if (p.id === 'byter') {                       // and a jagged grin
        ctx.beginPath(); ctx.moveTo(-5, 2);
        for (var i = 1; i <= 5; i++) ctx.lineTo(-5 + i * 2, i % 2 ? 0.5 : 2);
        ctx.stroke();
      }
    } else if (mood === 'shy') {                    // worried brows + an 'o'
      ctx.beginPath(); ctx.moveTo(-7.5, -8); ctx.lineTo(-2.5, -9.8); ctx.moveTo(6.5, -8); ctx.lineTo(1.5, -9.8); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 2.2, 1.5, 0, 7); ctx.stroke();
    }
  }
  function frightFace(ctx, look, t) {
    var ink = look === 'flash' ? '#ff3355' : '#ffe9c8';
    ctx.fillStyle = ink;
    ctx.fillRect(-5, -5, 3, 3); ctx.fillRect(2, -5, 3, 3);
    ctx.strokeStyle = ink; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-7, 2.5);
    for (var i = 1; i <= 7; i++) ctx.lineTo(-7 + i * 2, 2.5 + (i % 2 ? -1.6 : 0) + Math.sin(t * 20) * 0.3);
    ctx.stroke();
  }

  // --- bonus items and power-ups: small vector icons
  function drawIcon(ctx, icon, x, y, s, color, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s / 20, s / 20);
    ctx.fillStyle = color; ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10; ctx.lineWidth = 2;
    var i;
    if (icon === 'bit') {
      ctx.rotate(Math.sin(t * 3) * 0.2);
      ctx.strokeRect(-6, -6, 12, 12); ctx.fillRect(-2.5, -2.5, 5, 5);
    } else if (icon === 'chip') {
      ctx.fillRect(-6, -6, 12, 12);
      for (i = -1; i <= 1; i++) { ctx.fillRect(-9, i * 4 - 0.8, 3, 1.6); ctx.fillRect(6, i * 4 - 0.8, 3, 1.6); ctx.fillRect(i * 4 - 0.8, -9, 1.6, 3); ctx.fillRect(i * 4 - 0.8, 6, 1.6, 3); }
      ctx.shadowBlur = 0; ctx.fillStyle = '#05060f'; ctx.fillRect(-3, -3, 6, 6);
    } else if (icon === 'disk') {
      ctx.beginPath(); ctx.moveTo(-7, -8); ctx.lineTo(5, -8); ctx.lineTo(8, -5); ctx.lineTo(8, 8); ctx.lineTo(-7, 8); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#05060f'; ctx.fillRect(-4, -8, 8, 5); ctx.fillStyle = '#ffffff'; ctx.fillRect(-4, 2, 9, 5);
    } else if (icon === 'key') {
      ctx.beginPath(); ctx.arc(-4, 0, 4, 0, 7); ctx.stroke();
      ctx.fillRect(0, -1, 9, 2.4); ctx.fillRect(5, 1, 1.8, 3); ctx.fillRect(8, 1, 1.8, 4);
    } else if (icon === 'cart') {
      ctx.fillRect(-7, -6, 14, 14); ctx.fillRect(-5, -9, 10, 3);
      ctx.shadowBlur = 0; ctx.fillStyle = '#05060f'; ctx.fillRect(-5, -3, 10, 6);
      ctx.fillStyle = color; for (i = 0; i < 4; i++) ctx.fillRect(-5 + i * 3, 5, 1.5, 3);
    } else if (icon === 'orb') {
      ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, 7); ctx.fill();
      ctx.lineWidth = 1.4; ctx.beginPath(); ctx.ellipse(0, 0, 9.5, 3, -0.4 + Math.sin(t * 2) * 0.1, 0, 7); ctx.stroke();
    } else if (icon === 'crown') {
      ctx.beginPath(); ctx.moveTo(-8, 6); ctx.lineTo(-8, -5); ctx.lineTo(-4, 0); ctx.lineTo(0, -7); ctx.lineTo(4, 0); ctx.lineTo(8, -5); ctx.lineTo(8, 6); ctx.closePath(); ctx.fill();
    } else if (icon === 'layers') {
      for (i = 2; i >= 0; i--) {
        ctx.globalAlpha = 1 - i * 0.25;
        ctx.beginPath(); ctx.moveTo(0, -8 + i * 5); ctx.lineTo(8, -4 + i * 5); ctx.lineTo(0, 0 + i * 5); ctx.lineTo(-8, -4 + i * 5); ctx.closePath(); ctx.fill();
      }
    } else if (icon === 'boost') {
      ctx.beginPath(); ctx.moveTo(2, -9); ctx.lineTo(-6, 1); ctx.lineTo(-1, 1); ctx.lineTo(-3, 9); ctx.lineTo(6, -2); ctx.lineTo(1, -2); ctx.closePath(); ctx.fill();
    } else if (icon === 'freeze') {
      ctx.rotate(t * 0.8); ctx.lineWidth = 1.8;
      for (i = 0; i < 3; i++) {
        ctx.rotate(Math.PI / 3);
        ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
        ctx.moveTo(5, 0); ctx.lineTo(7, -2.5); ctx.moveTo(5, 0); ctx.lineTo(7, 2.5);
        ctx.moveTo(-5, 0); ctx.lineTo(-7, -2.5); ctx.moveTo(-5, 0); ctx.lineTo(-7, 2.5);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // --- warp gate: counter-rotating rings; `hot` flares right after a jump
  function drawGate(ctx, x, y, color, t, hot, spin) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10 + hot * 16;
    ctx.lineWidth = 2;
    for (var r = 0; r < 3; r++) {
      ctx.beginPath();
      var a = t * (r % 2 ? -3 : 3) * spin + r;
      ctx.arc(0, 0, 3 + r * 2.8 + hot * 2, a, a + 4.2);
      ctx.stroke();
    }
    ctx.fillStyle = hexA(color, 0.35 + hot * 0.5);
    ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, 7); ctx.fill();
    ctx.restore();
  }

  /* ==================================================================
   * 8. THE GAME
   * ================================================================== */
  function create(api) {
    var rng = api.rng;                             // gameplay randomness only
    var level = 1, lives = 3, loop = 0, maze = MAZE_LIST[0];
    var dots = [], left = 0, total = 1;
    var player, glitches = [];
    var phaseIdx = 0, phaseT = 0, chase = false;
    var frightT = 0, eatChain = 0, freezeT = 0, boostT = 0;
    var item = null, plan = [], planIdx = 0, itemsTaken = [];
    var dying = 0, readyT = 1.2, clearT = 0, over = false, overT = 0;
    var showTargets = false, extraGiven = false, munchFlip = false;
    var gateFlash = {}, t = 0;

    function tuning() { return TUNING[Math.min(level, TUNING.length) - 1]; }
    function itemFor(lv) { return ITEMS[Math.min(lv, ITEMS.length) - 1]; }
    function px(x) { return x * T + T / 2; }
    function py(y) { return TOP + y * T + T / 2; }

    /* ---------------------------------------------------- level setup */
    function resetDots() {
      dots = []; left = 0;
      for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
        var c = maze.grid[y].charAt(x);
        dots.push(c === '.' ? 1 : c === 'o' ? 2 : 0);
        if (isPellet(c)) left++;
      }
      total = Math.max(1, left);
    }
    function resetActors() {
      player = { x: maze.start.x, y: maze.start.y, dir: 'left', want: 'left', mouth: 0, warpCd: 0, warpLock: null };
      var rel = tuning().release;
      glitches = GLITCHES.map(function (p, i) {
        var home = i === 0 ? maze.exit : maze.pen[i - 1];
        return { i: i, p: p, x: home.x, y: home.y, dir: i === 0 ? 'left' : 'up',
          state: i === 0 ? 'active' : 'pen', release: rel[i], scared: false, shy: false, target: null, ph: i * 1.7 };
      });
      phaseIdx = 0; phaseT = 0; chase = false;
      frightT = 0; freezeT = 0; boostT = 0; eatChain = 0;
      item = null;
    }
    function startLevel(n) {
      level = n;
      maze = MAZE_LIST[(n - 1) % MAZE_LIST.length];
      loop = Math.floor((n - 1) / MAZE_LIST.length);
      resetDots();
      resetActors();
      plan = itemPlan(n); planIdx = 0;
      readyT = n === 1 ? 1.2 : 1.9;
      playSong(n === 1 ? 1.2 : 0.9);
    }

    /* ---------------------------------------------------------- music */
    var powerOn = false, freezeOn = false, boostOn = false, lastInt = -1;
    function baseBpm() { return maze.music.bpm + loop * 4; }
    function playSong(fade) {
      var m = M();
      if (!m) return;
      m.play(mazeSong(maze, loop), { fade: fade, intensity: 0.08 });
      powerOn = false; freezeOn = false; boostOn = false; lastInt = -1;
    }
    // Everything here is guarded so the engine only hears about changes.
    function syncMusic() {
      var m = M();
      if (!m) return;
      var pw = frightT > 0 && dying <= 0;
      if (pw !== powerOn) {
        powerOn = pw;
        m.setScale(pw ? 'phrygian' : maze.music.scale);
        m.setTempo(pw ? baseBpm() + 24 : baseBpm(), 0.4);
        m.setTrack('frantic', pw ? true : null);
      }
      var fz = freezeT > 0 && dying <= 0;
      if (fz !== freezeOn) {
        freezeOn = fz;
        m.setFilter(fz ? 1200 : 18000, fz ? 0.25 : 0.6);
        m.setTrack('ice', fz ? true : null);
      }
      var bs = boostT > 0 && dying <= 0;
      if (bs !== boostOn) { boostOn = bs; m.setTrack('turbo', bs ? true : null); }
      var it = Math.round(U.clamp(0.08 + (1 - left / total) * 0.95, 0, 1) * 20) / 20;
      if (it !== lastInt) { lastInt = it; m.setIntensity(it); }
    }
    function jingle(seq, inst, fallback) {
      if (M()) M().stinger(seq, { inst: inst, quantize: '16', octave: 1, gain: 0.6 });
      else api.audio.arp(fallback, 0.05, { type: 'square', vol: 0.15 });
    }

    startLevel(1);

    /* ------------------------------------------------------- movement */
    function speedPlayer() {
      return tuning().player * (boostT > 0 ? 1.28 : 1) * (frightT > 0 ? 1.06 : 1);
    }
    function speedGlitch(g) {
      var tu = tuning();
      if (g.state === 'eyes') return EYES_SPEED;
      var s = tu.glitch;
      if (g.scared) s *= FRIGHT_SPEED;
      else if (g.p.id === 'byter' && left <= tu.rageAt) s *= RAGE_BOOST;
      if (tileAt(maze, Math.round(g.x), Math.round(g.y)) === '=') s *= TUNNEL_SPEED;
      return s;
    }
    function atCenter(e) { return Math.abs(e.x - Math.round(e.x)) < 1e-6 && Math.abs(e.y - Math.round(e.y)) < 1e-6; }
    function canGo(e, d, forGlitch) {
      var v = DIRS[d];
      return !!v && walkable(tileAt(maze, Math.round(e.x) + v[0], Math.round(e.y) + v[1]), forGlitch);
    }
    // Move an actor `dist` tiles along the grid; `decide(e)` runs at each tile centre.
    function advance(e, dist, decide, forGlitch) {
      for (var guard = 0; guard < 12 && dist > 1e-6; guard++) {
        if (atCenter(e)) {
          e.x = Math.round(e.x); e.y = Math.round(e.y);
          if (e.x < 0) e.x += COLS; else if (e.x >= COLS) e.x -= COLS;   // tunnel wrap
          decide(e);
          if (!e.dir || !canGo(e, e.dir, forGlitch)) return;
        }
        var v = DIRS[e.dir], s = v[0] || v[1];
        var cur = v[0] ? e.x : e.y;
        var target = s > 0 ? Math.floor(cur + 1e-9) + 1 : Math.ceil(cur - 1e-9) - 1;
        var toNext = Math.abs(target - cur);
        var step = Math.min(dist, toNext);
        if (v[0]) e.x += s * step; else e.y += s * step;
        dist -= step;
        if (Math.abs(e.x - Math.round(e.x)) < 1e-6) e.x = Math.round(e.x);
        if (Math.abs(e.y - Math.round(e.y)) < 1e-6) e.y = Math.round(e.y);
        if (step < toNext) return;
      }
    }
    function wrapDist(a, b) {
      var dx = Math.abs(a.x - b.x);
      if (dx > COLS / 2) dx = COLS - dx;
      return Math.hypot(dx, a.y - b.y);
    }

    /* --------------------------------------------------------- player */
    function decidePlayer(p) {
      var twin = maze.twin[cellKey(p.x, p.y)];
      if (twin && p.warpCd <= 0) { warp(p, twin); return; }
      if (p.want && canGo(p, p.want, false)) p.dir = p.want;
      eatAt(p.x, p.y);
    }
    function warp(p, twin) {
      var fromX = px(p.x), fromY = py(p.y);
      // Come out facing away from the gate. A key still held from the way
      // in is ignored until released, so holding it can't bounce you back.
      p.warpLock = p.dir;
      p.x = twin.x; p.y = twin.y; p.dir = twin.out; p.want = twin.out; p.warpCd = 0.6;
      gateFlash[cellKey(twin.x, twin.y)] = 1;
      api.fx.burst(fromX, fromY, maze.theme.gate, 12, 120, 0.4);
      api.fx.burst(px(p.x), py(p.y), '#ffffff', 12, 120, 0.4);
      api.audio.noise(0.32, { cutoff: 2600, vol: 0.14 });
      api.audio.tone(200, 0.3, { type: 'sine', slide: 4, vol: 0.12 });
      if (M()) M().note('bell', 7, { chord: true, gain: 0.4, quantize: '16' });
    }
    function eatAt(x, y) {
      var i = y * COLS + x, kind = dots[i];
      if (!kind) return;
      dots[i] = 0;
      left--;
      if (kind === 2) {
        api.addScore(50);
        startFright();
      } else {
        api.addScore(10);
        munchFlip = !munchFlip;
        api.audio.tone(munchFlip ? 520 : 440, 0.03, { type: 'triangle', vol: 0.07 });
      }
      maybeSpawnItem();
      syncMusic();
      if (left <= 0) mazeCleared();
    }

    /* ---------------------------------------------------- fright mode */
    function startFright() {
      frightT = tuning().fright;
      eatChain = 0;
      glitches.forEach(function (g) {
        if (g.state === 'eyes' || g.state === 'entering') return;
        g.scared = true;
        if (g.state === 'active') g.dir = OPP[g.dir] || g.dir;
      });
      api.audio.arp([392, 523, 392, 523], 0.05, { type: 'square', vol: 0.14 });
    }
    function eatGlitch(g) {
      eatChain++;
      var pts = 100 * Math.pow(2, Math.min(eatChain, 4));
      api.addScore(pts);
      api.fx.text(px(g.x), py(g.y), String(pts), '#3ff0ff', 12);
      api.fx.burst(px(g.x), py(g.y), g.p.color, 16, 140);
      if (M()) {
        // a ladder that climbs with every glitch eaten in this power run
        var b0 = (eatChain - 1) * 2;
        M().stinger([{ deg: b0 }, { deg: b0 + 2, at: 1 }, { deg: b0 + 4, at: 2, steps: 3 }], { inst: 'arp', quantize: '16', octave: 1, gain: 0.6 });
      } else api.audio.arp([800, 1200, 1600], 0.04, { type: 'square', vol: 0.16 });
      g.state = 'eyes';
      g.scared = false;
    }

    /* ------------------------------------------------ glitch behaviour */
    function scatterOrChase(dt) {
      if (frightT > 0) return;                     // the phase clock pauses while frightened
      var seq = tuning().phases;
      if (phaseIdx >= seq.length) return;          // final chase: no more scatters
      phaseT += dt;
      if (phaseT < seq[phaseIdx]) return;
      phaseT -= seq[phaseIdx];
      phaseIdx++;
      var was = chase;
      chase = phaseIdx % 2 === 1 || phaseIdx >= seq.length;
      // every phase change makes the glitches turn around - the tell to watch for
      if (chase !== was) glitches.forEach(function (g) { if (g.state === 'active' && !g.scared) g.dir = OPP[g.dir] || g.dir; });
    }
    function targetFor(g) {
      if (g.state === 'eyes') return maze.exit;
      if (!chase) { g.shy = false; return HOMES[g.p.home]; }
      var b = glitches[0];
      return CHASE_RULES[g.p.id](g, { px: Math.round(player.x), py: Math.round(player.y), dir: player.dir, byter: { x: Math.round(b.x), y: Math.round(b.y) } });
    }
    function decideGlitch(g) {
      var x = g.x, y = g.y;
      if (g.state === 'eyes' && x === maze.exit.x && y === maze.exit.y) { g.state = 'entering'; g.dir = 'down'; return; }
      var options = ORDER.filter(function (d) { return d !== OPP[g.dir] && canGo(g, d, true); });
      if (!options.length) options = ORDER.filter(function (d) { return canGo(g, d, true); });
      if (!options.length) return;
      if (g.scared) { g.dir = options[rng.int(options.length)]; g.target = null; return; }
      var tg = targetFor(g), best = options[0], bestD = 1e9;
      g.target = tg;
      options.forEach(function (d) {
        var v = DIRS[d], dd = Math.pow(x + v[0] - tg.x, 2) + Math.pow(y + v[1] - tg.y, 2);
        if (dd < bestD) { bestD = dd; best = d; }
      });
      g.dir = best;
    }
    // Pen choreography is scripted: slide to the door column, rise out, and
    // (as eyes) sink back to the middle of the pen.
    function moveToward(g, tx, ty, dist) {
      var dx = tx - g.x, dy = ty - g.y;
      if (Math.abs(dx) > 1e-6) { var sx = Math.min(Math.abs(dx), dist); g.x += Math.sign(dx) * sx; g.dir = dx < 0 ? 'left' : 'right'; dist -= sx; }
      if (dist > 0 && Math.abs(dy) > 1e-6) { var sy = Math.min(Math.abs(dy), dist); g.y += Math.sign(dy) * sy; g.dir = dy < 0 ? 'up' : 'down'; }
      return Math.abs(tx - g.x) < 1e-6 && Math.abs(ty - g.y) < 1e-6;
    }
    function updateGlitch(g, dt) {
      if (g.state === 'pen') {
        g.release -= dt;
        if (g.release <= 0) g.state = 'leaving';
        return;
      }
      if (g.state === 'leaving') {
        if (moveToward(g, maze.exit.x, maze.exit.y, PEN_SPEED * (g.scared ? 0.7 : 1) * dt)) {
          g.x = maze.exit.x; g.y = maze.exit.y; g.state = 'active'; g.dir = 'left';
        }
        return;
      }
      if (g.state === 'entering') {
        var mid = maze.pen[0];
        if (moveToward(g, mid.x, mid.y, EYES_SPEED * 0.6 * dt)) { g.state = 'pen'; g.release = 0.6; g.dir = 'up'; }
        return;
      }
      if (freezeT > 0 && g.state === 'active') return;
      advance(g, speedGlitch(g) * dt, decideGlitch, true);
    }
    function lookOf(g) {
      if (g.state === 'eyes' || g.state === 'entering') return 'eyes';
      if (g.scared) return frightT < 2 && Math.floor(t * 8) % 2 ? 'flash' : 'fright';
      if (g.state === 'pen') return 'pen';
      if (freezeT > 0 && g.state === 'active') return 'frozen';
      if (g.state === 'leaving') return 'scatter';
      if (chase && g.shy) return 'shy';
      return chase ? 'chase' : 'scatter';
    }
    function modeOf(g) {
      if (g.state !== 'active') return g.state;
      if (g.scared) return 'fright';
      if (freezeT > 0) return 'frozen';
      return chase ? (g.shy ? 'shy' : 'chase') : 'scatter';
    }
    function checkContacts() {
      for (var i = 0; i < glitches.length; i++) {
        var g = glitches[i];
        var live = g.state === 'active' || (g.state === 'leaving' && g.y <= maze.door.y);
        if (!live || wrapDist(g, player) >= 0.65) continue;
        if (g.scared) eatGlitch(g);
        else { loseLife(); return; }
      }
    }

    /* ---------------------------------------------------------- items */
    function maybeSpawnItem() {
      if (item || planIdx >= plan.length) return;
      if (1 - left / total < plan[planIdx].at) return;
      item = { kind: plan[planIdx].kind, x: maze.fruit.x, y: maze.fruit.y, life: ITEM_LIFE };
      planIdx++;
    }
    function takeItem() {
      var x = px(item.x), y = py(item.y);
      if (item.kind === 'fruit') {
        var it = itemFor(level);
        api.addScore(it.value);
        itemsTaken.push(it.icon);
        if (itemsTaken.length > 6) itemsTaken.shift();
        api.fx.text(x, y - 6, '+' + it.value, it.color, 12);
        api.fx.burst(x, y, it.color, 18, 150);
        jingle([{ deg: 0 }, { deg: 4, at: 1 }, { deg: 7, at: 2 }, { deg: 9, at: 3, steps: 3 }], 'bell', [659, 784, 988]);
      } else {
        var pu = POWERUPS[item.kind];
        api.fx.text(x, y - 6, pu.label, pu.color, 12);
        api.fx.burst(x, y, pu.color, 22, 170);
        if (item.kind === 'freeze') {
          freezeT = pu.dur;
          jingle([{ deg: 7 }, { deg: 4, at: 1 }, { deg: 2, at: 2 }, { deg: 0, at: 3, steps: 4 }], 'bell', [988, 784, 659, 523]);
        } else {
          boostT = pu.dur;
          jingle([{ deg: 0 }, { deg: 2, at: 1 }, { deg: 4, at: 2 }, { deg: 7, at: 3, steps: 3 }], 'lead', [523, 659, 784, 1047]);
        }
        syncMusic();
      }
      item = null;
    }

    /* --------------------------------------------------- life + death */
    function loseLife() {
      dying = DEATH_TIME;
      api.shake(8);
      api.audio.tone(500, 0.9, { type: 'sawtooth', slide: 0.15, vol: 0.25, delay: 0.35 });
      if (M()) M().duck(0.6, 1.6);
      syncMusic();
    }
    function mazeCleared() {
      clearT = CLEAR_TIME;
      item = null;
      frightT = 0; freezeT = 0; boostT = 0;
      glitches.forEach(function (g) { g.scared = false; });
      syncMusic();
      api.fx.text(W / 2, py(maze.fruit.y), 'MAZE CLEAR', ACCENT, 18);
      if (M()) M().stinger([{ deg: 0 }, { deg: 2, at: 1 }, { deg: 4, at: 2 }, { deg: 7, at: 4 }, { deg: 6, at: 6 }, { deg: 7, at: 7, steps: 6 }],
        { inst: 'pluck', quantize: 'beat', octave: 1, gain: 0.55, params: { wave: 'square', decay: 0.3 } });
      else api.audio.arp([523, 659, 784, 1047], 0.08, { type: 'square', vol: 0.2 });
    }

    /* ----------------------------------------------------------- input */
    function readInput() {
      var inp = api.input;
      // Buffered: the wanted direction is kept until a junction allows it.
      if (player.warpLock && !inp.held(player.warpLock)) player.warpLock = null;
      ['up', 'down', 'left', 'right'].forEach(function (d) {
        if (inp.hit(d) || (inp.held(d) && d !== player.warpLock)) player.want = d;
      });
      inp.takeSwipes().forEach(function (s) { if (DIRS[s]) player.want = s; });
      if (inp.hit('a')) showTargets = !showTargets;
    }

    /* ----------------------------------------------------------- update */
    function update(dt) {
      t += dt;
      readInput();
      for (var k in gateFlash) { gateFlash[k] -= dt * 2; if (gateFlash[k] <= 0) delete gateFlash[k]; }
      if (over) { overT += dt; if (overT > 1.4) api.gameOver(); return; }
      syncMusic();
      if (dying > 0) {
        dying -= dt;
        if (dying <= 0) {
          lives--;
          if (lives <= 0) { over = true; return; }
          resetActors(); readyT = 1.4;
        }
        return;
      }
      if (clearT > 0) {
        clearT -= dt;
        if (clearT <= 0) startLevel(level + 1);
        return;
      }
      if (readyT > 0) { readyT -= dt; return; }

      // muncher (instant reverse between tiles, buffered turns at centres)
      if (player.want === OPP[player.dir]) player.dir = player.want;
      if (player.warpCd > 0) player.warpCd -= dt;
      advance(player, speedPlayer() * dt, decidePlayer, false);
      player.mouth += dt * 16;
      if (clearT > 0) return;                      // the last pellet ends the frame

      // timers
      if (frightT > 0) {
        frightT -= dt;
        if (frightT <= 0) { frightT = 0; glitches.forEach(function (g) { g.scared = false; }); }
      }
      if (freezeT > 0) freezeT = Math.max(0, freezeT - dt);
      if (boostT > 0) boostT = Math.max(0, boostT - dt);
      scatterOrChase(dt);

      checkContacts();
      if (dying <= 0) {
        glitches.forEach(function (g) { updateGlitch(g, dt); });
        checkContacts();
      }

      if (item) {
        item.life -= dt;
        if (wrapDist(item, player) < 0.6) takeItem();
        else if (item.life <= 0) item = null;
      }
      if (!extraGiven && api.getScore() >= EXTRA_LIFE_AT) {
        extraGiven = true; lives++;
        api.fx.text(W / 2, TOP + 40, 'EXTRA LIFE', ACCENT, 14);
        jingle([{ deg: 0 }, { deg: 4, at: 1 }, { deg: 7, at: 2 }, { deg: 11, at: 3 }, { deg: 14, at: 4, steps: 4 }], 'pluck', [523, 659, 784, 988, 1047]);
      }
      var extra = frightT > 0 ? '  \u00b7  POWER ' + frightT.toFixed(1) : freezeT > 0 ? '  \u00b7  FREEZE ' + freezeT.toFixed(1) : boostT > 0 ? '  \u00b7  BOOST ' + boostT.toFixed(1) : '';
      api.setStatus('LEVEL ' + level + '  \u00b7  ' + maze.name + '  \u00b7  LIVES ' + lives + '  \u00b7  PELLETS ' + left + extra);
    }

    /* ----------------------------------------------------------- render */
    // Draw something at column x, plus its wrapped twin when it pokes
    // through a tunnel mouth.
    function wrapped(x, fn) {
      fn(px(x));
      if (x < 0.6) fn(px(x + COLS));
      if (x > COLS - 1.6) fn(px(x - COLS));
    }
    function render(ctx) {
      var th = maze.theme;
      var pulse = M() ? M().pulse(6) : 0;
      ctx.fillStyle = th.bg;
      ctx.fillRect(0, 0, W, H);
      var flash = clearT > 0 && clearT < CLEAR_TIME - 0.3 && Math.floor(t * 7) % 2;
      ctx.drawImage(wallLayer(maze, flash), 0, TOP);
      renderDoorAndGates(ctx, th);
      renderDots(ctx, th, pulse);
      if (item) renderItem(ctx);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, TOP, W, ROWS * T); ctx.clip();
      var hideGlitches = (dying > 0 && dying < DEATH_TIME - 0.45) || (clearT > 0 && clearT < CLEAR_TIME - 0.4) || over;
      if (!hideGlitches) {
        if (showTargets) renderTargets(ctx);
        glitches.forEach(function (g) { renderGlitch(ctx, g); });
      }
      renderPlayer(ctx);
      ctx.restore();
      renderHud(ctx, th);
    }
    function renderDoorAndGates(ctx, th) {
      ctx.fillStyle = '#ff8fd8';
      ctx.fillRect(maze.door.x * T + 2, TOP + maze.door.y * T + T / 2 - 1.5, T - 4, 3);
      maze.gates.forEach(function (g) {
        var hot = gateFlash[cellKey(g.x, g.y)] || 0;
        drawGate(ctx, px(g.x), py(g.y), th.gate, t, hot, g.id === '2' ? -1 : 1);
      });
    }
    function renderDots(ctx, th, pulse) {
      var spr = dotSprite(th.pellet);
      for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
        var k = dots[y * COLS + x];
        if (k === 1) ctx.drawImage(spr, px(x) - 7, py(y) - 7);
        else if (k === 2) {
          var r = 4.5 + pulse * 2.5;
          ctx.save();
          ctx.translate(px(x), py(y)); ctx.rotate(t * 1.5);
          ctx.fillStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 10 + pulse * 10;
          ctx.fillRect(-r, -r, r * 2, r * 2);
          ctx.shadowBlur = 0; ctx.fillStyle = '#fff8d8'; ctx.fillRect(-r * 0.4, -r * 0.4, r * 0.8, r * 0.8);
          ctx.restore();
        }
      }
    }
    function renderItem(ctx) {
      if (item.life < 2.5 && Math.floor(t * 8) % 2) return;       // blink before vanishing
      var bob = Math.sin(t * 4) * 1.5;
      if (item.kind === 'fruit') { var it = itemFor(level); drawIcon(ctx, it.icon, px(item.x), py(item.y) + bob, 18, it.color, t); }
      else { var pu = POWERUPS[item.kind]; drawIcon(ctx, pu.icon, px(item.x), py(item.y) + bob, 18, pu.color, t); }
    }
    function renderGlitch(ctx, g) {
      var look = lookOf(g);
      var bob = g.state === 'pen' ? Math.sin(t * 6 + g.i) * 3 : 0;
      wrapped(g.x, function (x) { drawGlitch(ctx, x, py(g.y) + bob, 20, g.p, look, g.dir, t, g.ph); });
    }
    function renderTargets(ctx) {
      glitches.forEach(function (g) {
        if (g.state !== 'active' || g.scared) return;
        g.target = targetFor(g);                   // live, so the marker never lags
        var tx = U.clamp(px(g.target.x), 4, W - 4), ty = U.clamp(py(g.target.y), TOP + 4, TOP + ROWS * T - 4);
        ctx.save();
        ctx.strokeStyle = hexA(g.p.color, 0.45); ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(px(g.x), py(g.y)); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = g.p.color; ctx.lineWidth = 2; ctx.shadowColor = g.p.color; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.moveTo(tx - 5, ty - 5); ctx.lineTo(tx + 5, ty + 5); ctx.moveTo(tx + 5, ty - 5); ctx.lineTo(tx - 5, ty + 5); ctx.stroke();
        ctx.restore();
      });
    }
    function renderPlayer(ctx) {
      var open = Math.abs(Math.sin(player.mouth)) * 0.45;
      if (readyT > 0 && !dying) open = 0.25;
      if (dying > 0) {
        if (dying > DEATH_TIME - 0.45) { wrapped(player.x, function (x) { drawMuncher(ctx, x, py(player.y), 20, player.dir, 0.1, ACCENT); }); return; }
        renderDerez(ctx);
        return;
      }
      if (over) return;
      wrapped(player.x, function (x) { drawMuncher(ctx, x, py(player.y), 20, player.dir, open, boostT > 0 ? '#fff4b8' : ACCENT); });
      if (boostT > 0 && Math.random() < 0.6) {
        var v = DIRS[player.dir];
        api.fx.trail(px(player.x) - v[0] * 9, py(player.y) - v[1] * 9, ACCENT, -v[0] * 30, -v[1] * 30);
      }
    }
    // Death: the muncher splits into scanline slices that drift apart and fade.
    function renderDerez(ctx) {
      var prog = U.clamp(1 - dying / (DEATH_TIME - 0.45), 0, 1);
      if (prog >= 1) return;
      var cx = px(player.x), cy = py(player.y);
      for (var k = 0; k < 7; k++) {
        ctx.save();
        ctx.beginPath(); ctx.rect(cx - 14, cy - 10 + k * 3, 28, 3); ctx.clip();
        ctx.globalAlpha = 1 - prog;
        ctx.translate((k % 2 ? 1 : -1) * prog * (6 + k * 3), -prog * k * 2);
        drawMuncher(ctx, cx, cy, 20, player.dir, 0.2 + prog * 1.2, prog > 0.5 ? '#ffffff' : ACCENT);
        ctx.restore();
      }
    }
    function renderHud(ctx, th) {
      for (var l = 0; l < Math.min(lives, 6); l++) drawMuncher(ctx, 14 + l * 20, 15, 13, 'right', 0.35, ACCENT);
      U.glowText(ctx, maze.name, W / 2, showTargets ? 12 : 15, 10, th.wall, 'center', 700);
      ctx.fillStyle = 'rgba(200,210,255,0.65)';
      ctx.font = '700 11px ui-monospace, Menlo, Consolas, monospace';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText('LV ' + level, W - 8, 16);
      for (var i = 0; i < itemsTaken.length; i++) {
        var it = ITEMS.filter(function (x) { return x.icon === itemsTaken[i]; })[0];
        drawIcon(ctx, it.icon, W - 52 - i * 16, 15, 12, it.color, 0);
      }
      if (showTargets) {
        ctx.fillStyle = 'rgba(200,210,255,0.55)'; ctx.font = '700 8px ui-monospace, Menlo, Consolas, monospace'; ctx.textAlign = 'center';
        ctx.fillText('TARGET VIEW', W / 2, 27);
      }
      var cy = py(maze.fruit.y);
      if (readyT > 0 && !over && !dying && !clearT) {
        ctx.save();
        ctx.fillStyle = hexA(th.bg, 0.8); ctx.fillRect(W / 2 - 90, cy - 30, 180, 44);
        ctx.restore();
        U.glowText(ctx, 'LEVEL ' + level, W / 2, cy - 17, 12, th.wall);
        U.glowText(ctx, 'READY!', W / 2, cy + 2, 14, ACCENT);
      }
      if (over) U.glowText(ctx, 'GAME OVER', W / 2, cy, 18, '#ff4d6d');
    }

    return {
      // Read-only test hook: what is on screen right now.
      debug: function () {
        return {
          level: level, maze: maze.name, mazeIndex: maze.index, mazes: MAZE_LIST.length, pellets: left, lives: lives,
          mode: frightT > 0 ? 'fright' : chase ? 'chase' : 'scatter', phase: phaseIdx,
          player: { x: player.x, y: player.y, dir: player.dir, want: player.want },
          item: item ? { kind: item.kind, x: item.x, y: item.y } : null, freeze: freezeT > 0, boost: boostT > 0,
          glitches: glitches.map(function (g) { return { name: g.p.name, mode: modeOf(g), x: +g.x.toFixed(2), y: +g.y.toFixed(2), dir: g.dir }; }),
          ready: readyT > 0, dead: dying > 0 || over, cleared: clearT > 0, over: over
        };
      },
      update: update,
      render: render
    };
  }

  /* ==================================================================
   * 9. ATTRACT PREVIEW: muncher chased along a neon corridor, grabs the
   *    core, turns and chases the glitches back.
   * ================================================================== */
  function attract(ctx, w, h, t) {
    var bg = '#04040f', wall = '#4d7bff';
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    var cell = Math.max(10, Math.min(h / 5, w / 11));
    var cy = h * 0.52, half = cell * 0.95;
    // double-line corridor
    ctx.save();
    ctx.lineCap = 'round';
    [[half, 2.2, wall, 10], [half + 5, 1, '#a9c1ff', 4]].forEach(function (L) {
      ctx.strokeStyle = L[2]; ctx.lineWidth = L[1]; ctx.shadowColor = wall; ctx.shadowBlur = L[3];
      ctx.beginPath(); ctx.moveTo(4, cy - L[0]); ctx.lineTo(w - 4, cy - L[0]); ctx.moveTo(4, cy + L[0]); ctx.lineTo(w - 4, cy + L[0]); ctx.stroke();
    });
    ctx.restore();
    var cyc = t % 9, coreX = w * 0.86, gap = cell * 1.15;
    var mx, dir, gx = [], looks = [];
    if (cyc < 4.5) {                               // chased: glitches hot on the muncher's heels
      var u = cyc / 4.5;
      mx = -cell + u * (coreX + cell);
      dir = 'right';
      for (var i = 0; i < 4; i++) { gx.push(mx - cell * 1.5 - i * gap + Math.sin(t * 5 + i) * 1.5); looks.push('chase'); }
      ctx.fillStyle = '#ffe9a8';                   // pellets ahead of the muncher, then the core
      for (var p = cell * 0.5; p < coreX - cell * 0.5; p += cell * 0.7) if (p > mx + cell * 0.3) ctx.fillRect(p - 2, cy - 2, 4, 4);
      var pulse = 1 + Math.sin(t * 8) * 0.25;
      ctx.save(); ctx.translate(coreX, cy); ctx.rotate(t * 1.5);
      ctx.fillStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 12;
      ctx.fillRect(-cell * 0.22 * pulse, -cell * 0.22 * pulse, cell * 0.44 * pulse, cell * 0.44 * pulse);
      ctx.restore();
    } else {                                       // powered up: turn and eat them one by one
      var v = (cyc - 4.5) / 4.5, fleeK = 0.55 * coreX, chaseK = coreX + 2 * cell;
      mx = coreX - v * chaseK;
      dir = 'left';
      for (var j = 0; j < 4; j++) {
        var start = coreX - cell * 1.5 - j * gap;
        var vEat = (cell * 1.2 + j * gap) / (chaseK - fleeK);
        if (v < vEat) { gx.push(start - v * fleeK); looks.push(v > 0.7 && Math.floor(t * 8) % 2 ? 'flash' : 'fright'); }
        else { gx.push(start - vEat * fleeK + (v - vEat) * w * 1.3); looks.push('eyes'); }   // eyes race home
      }
    }
    GLITCHES.forEach(function (gp, k) {
      drawGlitch(ctx, gx[k], cy, cell * 0.9, gp, looks[k], looks[k] === 'eyes' ? 'right' : dir, t, k * 1.7);
    });
    drawMuncher(ctx, mx, cy, cell * 0.9, dir, Math.abs(Math.sin(t * 12)) * 0.45, ACCENT);
    // roll call: one name at a time, under its glitch
    var tag = Math.floor(t / 1.1) % GLITCHES.length;
    if (cyc < 4.5 && gx[tag] > cell * 0.8) {
      ctx.save();
      ctx.font = '700 ' + Math.max(8, Math.round(cell * 0.3)) + 'px ui-monospace, Menlo, Consolas, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = GLITCHES[tag].color;
      ctx.fillText(GLITCHES[tag].name, gx[tag], cy + half + cell * 0.45);
      ctx.restore();
    }
  }

  XA.registerGame({
    id: 'xa_maze_muncher',
    order: 13,
    title: 'Maze Muncher',
    tagline: 'Five mazes. Four glitches. One appetite.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'dpad',
    controls: 'Arrows / WASD to steer \u00b7 swipe on mobile \u00b7 Space shows glitch targets',
    create: create,
    attract: attract
  });
})(window);
</script>
<script>/* game-invader-wave.js */
/*
 * Xtrata Arcade cartridge #14 - INVADER WAVE (v2)
 * A marching formation of pixel invaders speeds up as it thins out. Hide
 * behind bunkers that crumble pixel by pixel, shoot the mystery ship for
 * power-ups and clear every wave before it lands.
 *
 *   formations  a readable data table (block, chevron, diamond, split
 *               columns, stagger, fortress, wings, swarm) that loops harder
 *   enemy kinds GRUNT (march + shoot), DIVER (breaks ranks, swoops, returns),
 *               SHIELDED (front shield soaks hits), SPLITTER (breaks into two
 *               minis), BOMBER (slow, wide bunker-busting bombs)
 *   power-ups   DOUBLE / TRIPLE shot, RAPID fire, PIERCING laser, SHIELD,
 *               WINGMAN drone - dropped by the mystery ship and the boss
 *   boss        every 5th wave a MOTHERSHIP: two gun pods guard its core;
 *               bullet fans, diving escorts and a telegraphed sweeping laser
 *   look        CRT: cached glowing pixel sprites, scanlines, vignette,
 *               starfield, pixel explosions, screen flashes
 * Contract game-id: xa_invader_wave (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-invader-wave');
  var U = XA.util;
  var M = function () { return XA.music; };
  var TAU = Math.PI * 2;

  /* ================================================================ playfield */

  var sprCache = {};

    for (var y = 0; y < rows.length; y++) {
      for (var x = 0; x < rows[y].length; x++) {
        if (rows[y].charAt(x) !== '#') continue;
        g.fillStyle = color; g.fillRect(x * px, y * px, px, px);

        g.fillStyle = 'rgba(255,255,255,0.28)'; g.fillRect(x * px, y * px, px, Math.max(1, Math.round(px / 3)));

        else if (a.state === 'return') updateReturn(a, dt);
        else if (a.state === 'free') updateMini(a, dt);
        if (!a.dead && a.state !== 'form' && player.inv <= 0 && touchesPlayer(a)) { killAlien(a, false); hurtPlayer(); }
      }
    }

    /* -------------------------------------------------------------- kills */
    function killAlien(a, scored) {
      if (a.dead) return;
      a.dead = true;
      var L = lookOf(a.kind, a.v), cx = a.x + a.w / 2;
      var diving = a.state === 'dive' || a.state === 'escort';
      if (scored) addPts(L.pts * mult() * (diving ? 2 : 1), cx, a.y, diving ? '#ffd23f' : '#ffffff');
      pixelBurst(L.art, frameOf(a), a.x, a.y, L.c, PIX, a.kind === 'b' ? 1.4 : 1);
      api.audio.noise(0.12, { vol: 0.16, cutoff: 2400 });
      if (a.kind === 'b') { ring(cx, a.y + a.h / 2, L.c, 30); api.shake(3); }
      if (a.kind === 'p') spawnMinis(a);
    }
    function hitShield(a, d) {
      a.shield = Math.max(0, a.shield - d);
      a.flash = 0.12;
      var sy = a.y + a.h + 4;
      sparks(a.x + a.w / 2, sy, SHIELD_C, 6, 110);
      if (a.shield > 0) {
        api.audio.tone(1500, 0.04, { type: 'triangle', vol: 0.08 });
        if (M()) M().note('bell', 1, { octave: -1, gain: 0.2 });
      } else {
        addPts(10, a.x + a.w / 2, sy, SHIELD_C);
        sparks(a.x + a.w / 2, sy, SHIELD_C, 14, 170);
        api.audio.noise(0.1, { vol: 0.12, cutoff: 5200 });
      }
    }

    /* ------------------------------------------------------------- player */
    function addShot(x, y, vx, pierce, fromDrone) {
      shots.push({ x: x, y: y, vx: vx, pierce: !!pierce, drone: !!fromDrone, hit: pierce ? [] : null });
    }
    function tryFire(dt, inp) {
      fireCd -= dt;
      if (fireCd > 0 || !(inp.held('a') || inp.held('up') || inp.held('hold'))) return;
      var spread = power.triple > 0 ? 3 : power.double > 0 ? 2 : 1;
      var own = 0;
      for (var i = 0; i < shots.length; i++) if (!shots[i].drone) own++;
      if (own + spread > spread * (power.rapid > 0 ? 4 : 2)) return;
      var pierce = power.pierce > 0, y = PY - 14;
      if (spread === 1) addShot(player.x, y, 0, pierce);
      else if (spread === 2) { addShot(player.x - 7, y, 0, pierce); addShot(player.x + 7, y, 0, pierce); }
      else { addShot(player.x, y, 0, pierce); addShot(player.x - 5, y, -95, pierce); addShot(player.x + 5, y, 95, pierce); }
      fireCd = power.rapid > 0 ? RAPID_CD : FIRE_CD;
      player.recoil = 1;
      api.audio.tone(pierce ? 1300 : 900, 0.06, { type: 'square', vol: power.rapid > 0 ? 0.05 : 0.08, slide: 0.4 });
      // quiet in-key tick (every other shot under rapid fire)
      if (M() && (power.rapid <= 0 || mus.shotN % 2 === 0)) M().note('arp', [0, 2, 4][mus.shotN % 3], { chord: true, octave: 2, gain: 0.12 });
      mus.shotN++;
    }
    function updateDrone(dt) {
      if (power.drone <= 0) return;
      var side = player.x > W / 2 ? -1 : 1;
      drone.x += (U.clamp(player.x + side * 40, 14, W - 14) - drone.x) * Math.min(1, dt * 6);
      drone.fireT -= dt;
      if (drone.fireT <= 0) { drone.fireT = 0.5; addShot(drone.x, PY - 20, 0, false, true); }
    }
    function updatePlayer(dt, inp) {
      if (!player.alive) {
        player.respawn -= dt;
        if (player.respawn <= 0 && !over) {
          player.alive = true; player.inv = RESPAWN_INV; player.x = W / 2;
          bombs.length = 0;
        }
        return;
      }
      var mv = (inp.held('right') ? 1 : 0) - (inp.held('left') ? 1 : 0);
      player.x = U.clamp(player.x + mv * PLAYER_SPEED * dt, 20, W - 20);
      if (player.inv > 0) player.inv -= dt;
      player.recoil = Math.max(0, player.recoil - dt * 8);
      for (var k in power) if (power[k] > 0) power[k] = Math.max(0, power[k] - dt);
      tryFire(dt, inp);
      updateDrone(dt);
    }
    function explodePlayer() {
      player.alive = false; player.respawn = 1.8;
      pixelBurst('cannon', 0, player.x - 16.5, PY - 10.5, ACCENT, PIX, 1.6);
      ring(player.x, PY, ACCENT, 60);
      api.shake(10);
      screenFlash(LASER_C, 0.5);
      api.audio.noise(0.6, { vol: 0.3, cutoff: 900 });
      for (var k in power) power[k] = 0;
      player.shield = false;
    }
    function hurtPlayer() {
      if (!player.alive || player.inv > 0 || over) return;
      if (player.shield) {
        player.shield = false; player.inv = 1.1;
        ring(player.x, PY, POWERS.shield.c, 44);
        screenFlash(POWERS.shield.c, 0.35);
        api.audio.tone(520, 0.25, { type: 'triangle', vol: 0.16, slide: 0.5 });
        api.fx.text(player.x, PY - 34, 'SHIELD DOWN', POWERS.shield.c, 10);
        return;
      }
      explodePlayer();
      lives--;
      if (lives <= 0) over = true;
      else if (M()) M().duck(0.5, 1.2);
    }

    /* -------------------------------------------------------- player shots */
    function shotVsAliens(s, y0) {
      for (var k = 0; k < aliens.length; k++) {
        var a = aliens[k];
        if (a.dead || a.grace > 0 || (s.hit && s.hit.indexOf(a) >= 0)) continue;
        // the front shield sits under the body and takes the hit first
        if (a.shield > 0 && segHits(s, y0, a.x - 3, a.x + a.w + 3, a.y + a.h + 1, a.y + a.h + 8)) {
          hitShield(a, s.pierce ? a.shield : 1);
          if (!s.pierce) return true;
        }
        if (segHits(s, y0, a.x, a.x + a.w, a.y, a.y + a.h)) {
          killAlien(a, true);
          if (!s.pierce) return true;
          s.hit.push(a);
        }
      }
      return false;
    }
    function shotVsUfo(s) {
      if (!ufo || Math.abs(s.x - ufo.x) > 24 || Math.abs(s.y - UFO_Y) > 12) return false;
      killUfo();
      return true;
    }
    function shotVsBombs(s) {
      for (var i = bombs.length - 1; i >= 0; i--) {
        var b = bombs[i];
        if (b.type === 'orb') continue;                 // boss fans cannot be shot down
        var hw = b.type === 'wide' ? 8 : 5;
        if (Math.abs(b.x - s.x) < hw && Math.abs(b.y - s.y) < 12) {
          bombs.splice(i, 1);
          addPts(b.type === 'wide' ? 15 : 5);
          sparks(b.x, b.y, b.type === 'wide' ? WIDE_C : ZIG_C, 8, 120);
          return !s.pierce;
        }
      }
      return false;
    }
    function updateShots(dt) {
      for (var i = shots.length - 1; i >= 0; i--) {
        var s = shots[i], y0 = s.y;
        s.y -= SHOT_SPEED * dt; s.x += s.vx * dt;
        if (s.y < 20 || s.x < -6 || s.x > W + 6) { shots.splice(i, 1); continue; }
        if (bunkerSweep(s.x, y0, s.y, 1)) { shots.splice(i, 1); continue; }
        if (shotVsAliens(s, y0) || shotVsBoss(s, y0) || shotVsUfo(s) || shotVsBombs(s)) shots.splice(i, 1);
      }
    }

    /* --------------------------------------------------------- enemy shots */
    var BOMB_HALF = { zig: 12, wide: 19, orb: 13 };     // hit half-widths vs the cannon
    var BOMB_BITE = { zig: 1, wide: 4, orb: 1 };        // crater radius in bunker cells
    function updateBombs(dt) {
      for (var i = bombs.length - 1; i >= 0; i--) {
        var b = bombs[i], y0 = b.y;
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.y > GROUND || b.x < -10 || b.x > W + 10) {
          if (b.y > GROUND) sparks(b.x, GROUND, b.type === 'wide' ? WIDE_C : '#ffd08a', b.type === 'wide' ? 10 : 3, 80);
          bombs.splice(i, 1); continue;
        }
        if (bunkerSweep(b.x, y0, b.y, BOMB_BITE[b.type])) {
          if (b.type === 'wide') { ring(b.x, b.y, WIDE_C, 22); api.shake(2); }
          bombs.splice(i, 1); continue;
        }
        if (player.alive && Math.abs(b.x - player.x) < BOMB_HALF[b.type] && b.y > PY - 14 && b.y < PY + 8) {
          bombs.splice(i, 1);
          hurtPlayer();
        }
      }
    }

    /* ------------------------------------------------ mystery ship + drops */
    function updateUfo(dt) {
      if (boss) { ufo = null; return; }
      if (!ufo) {
        ufoT -= dt;
        if (ufoT <= 0 && clearT <= 0) { var fl = rng() < 0.5; ufo = { x: fl ? -30 : W + 30, v: fl ? 105 : -105 }; }
        return;
      }
      ufo.x += ufo.v * dt;
      if (!M() && Math.floor(t * 12) % 2) api.audio.tone(ufo.x % 40 < 20 ? 700 : 620, 0.03, { type: 'sine', vol: 0.03 });
      if (ufo.x < -50 || ufo.x > W + 50) { ufo = null; ufoT = 16 + rng() * 10; }
    }
    function killUfo() {
      addPts([50, 100, 150, 300][Math.floor(rng() * 4)], ufo.x, UFO_Y - 10, UFO_C);
      pixelBurst('ufo', 0, ufo.x - 24, UFO_Y - 10, UFO_C, PIX, 1.3);
      ring(ufo.x, UFO_Y, UFO_C, 50);
      screenFlash(UFO_C, 0.25);
      api.audio.arp([1047, 784, 1047], 0.05, { type: 'square', vol: 0.16 });
      dropCapsule(ufo.x, UFO_Y + 6);
      ufo = null; ufoT = 16 + rng() * 10;
    }
    function pickPower() {
      var total = 0, k;
      for (k = 0; k < POWER_ORDER.length; k++) total += POWERS[POWER_ORDER[k]].weight;
      var r = rng() * total;
      for (k = 0; k < POWER_ORDER.length; k++) {
        r -= POWERS[POWER_ORDER[k]].weight;
        if (r < 0) return POWER_ORDER[k];
      }
      return 'double';
    }
    function dropCapsule(x, y, kind) {
      if (caps.length >= 3) return;
      caps.push({ kind: kind || pickPower(), x: U.clamp(x, 20, W - 20), y: y, t: 0 });
    }
    function updateCaps(dt) {
      for (var i = caps.length - 1; i >= 0; i--) {
        var c = caps[i];
        c.t += dt; c.y += 78 * dt;
        if (player.alive && Math.abs(c.x - player.x) < 24 && c.y > PY - 22 && c.y < PY + 10) {
          caps.splice(i, 1); applyPower(c.kind); continue;
        }
        if (c.y > GROUND + 8) caps.splice(i, 1);
      }
    }
    function applyPower(k) {
      var P = POWERS[k];
      if (k === 'shield') player.shield = true;
      else {
        if (k === 'double') power.triple = 0;
        if (k === 'triple') power.double = 0;
        if (k === 'drone' && power.drone <= 0) { drone.x = player.x; drone.fireT = 0.2; }
        power[k] = P.time;
      }
      powStack = t - powTextT < 0.9 ? powStack + 1 : 0;
      powTextT = t;
      api.fx.text(U.clamp(player.x, 100, W - 100), PY - 46 - powStack * 16, P.name, P.c, 11);
      ring(player.x, PY, P.c, 40);
      screenFlash(P.c, 0.18);
      var m = M();
      if (m) m.stinger(P.jingle.map(function (d, i) { return { deg: d, at: i }; }), { inst: P.inst, quantize: '16', octave: 1, gain: 0.35 });
      else api.audio.arp([660, 880, 1100], 0.06, { type: 'square', vol: 0.14 });
    }

    /* ---------------------------------------------------------- mothership */
    function spawnBoss() {
      bossN++;
      var podHp = 10 + (bossN - 1) * 4, coreHp = 26 + (bossN - 1) * 8;
      boss = { x: W / 2, y: -70, enter: 2.8, phase: 1, t: 0, hullFlash: 0,
        pods: [{ dx: -POD_DX, hp: podHp, max: podHp, flash: 0 }, { dx: POD_DX, hp: podHp, max: podHp, flash: 0 }],
        core: { hp: coreHp, max: coreHp, flash: 0 },
        fanT: 1.5, escT: 6, lasT: 3.5, las: null, charge: null, turn: 0, dying: 0, boomT: 0 };
      formation.name = 'MOTHERSHIP';
      ufo = null;
      showBanner('WAVE ' + wave, 'WARNING', 'MOTHERSHIP MK ' + bossN + ' \u00b7 DESTROY THE GUN PODS', LASER_C, null, true);
      api.shake(6);
      screenFlash(LASER_C, 0.3);
      var m = M();
      if (m) {
        m.play(bossSong(bossN, keyFor(wave - 1)), { fade: 1.2, intensity: 0.3 });
        mus.boss = true; resetMusicGuards();
        m.note('riser', 0, { dur: 2.2, gain: 0.45 });
      } else api.audio.tone(110, 0.9, { type: 'sawtooth', vol: 0.12, slide: 0.5 });
    }
    function podAlive(k) { return boss.pods[k].hp > 0; }
    function bossHp() { return boss.pods[0].hp + boss.pods[1].hp + boss.core.hp; }
    function bossMax() { return boss.pods[0].max + boss.pods[1].max + boss.core.max; }
    function updateBoss(dt) {
      var b = boss, P = BOSS_PHASES[b.phase];
      b.t += dt;
      b.hullFlash = Math.max(0, b.hullFlash - dt);
      b.core.flash = Math.max(0, b.core.flash - dt);
      b.pods[0].flash = Math.max(0, b.pods[0].flash - dt);
      b.pods[1].flash = Math.max(0, b.pods[1].flash - dt);
      if (b.dying > 0) { updateBossDeath(dt); return; }
      if (b.enter > 0) {
        b.enter -= dt;
        b.y += (BOSS_Y - b.y) * Math.min(1, dt * 1.6);
        return;
      }
      if (b.las) updateLaser(b, dt);
      else {
        b.x += (W / 2 + Math.sin(b.t * P.sway) * 150 - b.x) * Math.min(1, dt * 2);
        b.y += (BOSS_Y + Math.sin(b.t * 1.3) * 6 - b.y) * Math.min(1, dt * 3);
        if (b.charge) {
          b.charge.t -= dt;
          if (b.charge.t <= 0) { fireFan(b, P); b.charge = null; }
        } else {
          b.fanT -= dt;
          if (b.fanT <= 0) { b.fanT = P.fanEvery; b.charge = { t: 0.4, pod: b.phase === 1 ? nextPod(b) : -1 }; }
        }
        if (P.laserEvery && !b.charge) {
          b.lasT -= dt;
          if (b.lasT <= 0 && player.alive) startLaser(b, P);
        }
      }
      b.escT -= dt;
      if (b.escT <= 0) { b.escT = P.escortEvery; spawnEscorts(b, P.escortN); }
    }
    function nextPod(b) {
      b.turn++;
      var k = b.turn % 2;
      return podAlive(k) ? k : 1 - k;
    }
    function fanOrigin(b, pod) {
      if (pod >= 0 && podAlive(pod)) return { x: b.x + b.pods[pod].dx, y: b.y + POD_DY + 13 };
      return { x: b.x, y: b.y + CORE_DY + CORE_R };
    }
    // A fan of orbs aimed at the cannon; in overload every other fan is a straight curtain.
    function fireFan(b, P) {
      var o = fanOrigin(b, b.charge ? b.charge.pod : -1);
      var aim = U.clamp(Math.atan2(PY - o.y, player.x - o.x), Math.PI * 0.22, Math.PI * 0.78);
      if (b.phase === 3 && b.turn % 2) aim = Math.PI / 2;
      b.turn++;
      for (var k = 0; k < P.fanN; k++) fireOrb(o.x, o.y, aim + (k / (P.fanN - 1) - 0.5) * P.fanSpread, P.fanSpeed);
      sparks(o.x, o.y, ORB_C, 8, 90);
      var m = M();
      if (m) m.note('pluck', [0, 4, 7][b.turn % 3], { octave: 0, gain: 0.35, params: { cutoff: 1400 } });
      else api.audio.tone(330, 0.12, { type: 'square', vol: 0.08, slide: 0.7 });
    }
    function spawnEscorts(b, n) {
      var have = 0, i;
      for (i = 0; i < aliens.length; i++) if (!aliens[i].dead && aliens[i].state === 'escort') have++;
      n = Math.min(n, 4 - have);
      for (i = 0; i < n; i++) {
        var a = makeAlien('d', 0, 0);
        a.x = b.x - a.w / 2 + (i - (n - 1) / 2) * 44;
        a.y = b.y + 10;
        startDive(a, true);
        a.side = i < n / 2 ? -1 : 1;
        aliens.push(a);
      }
    }
    // Laser: glide to an edge, telegraph the swept zone, sweep, cool down.
    // The zone always covers the cannon's half and never the far side.
    function startLaser(b, P) {
      var left = player.x < W / 2, reach = W * P.laserReach;
      b.las = { st: 'move', t: 0, x0: left ? 64 : W - 64, x1: left ? reach : W - reach, end: GROUND, beep: 0 };
    }
    function updateLaser(b, dt) {
      var L = b.las;
      L.t += dt;
      if (L.st === 'move') {
        b.x += (L.x0 - b.x) * Math.min(1, dt * 5);
        if (L.t >= LASER_MOVE) { L.st = 'tele'; L.t = 0; }
      } else if (L.st === 'tele') {
        b.x += (L.x0 - b.x) * Math.min(1, dt * 8);
        L.beep -= dt;
        if (L.beep <= 0) { L.beep = 0.22; api.audio.tone(880, 0.07, { type: 'square', vol: 0.07 }); }
        if (L.t >= LASER_TELE) {
          L.st = 'fire'; L.t = 0;
          api.shake(5); screenFlash(LASER_C, 0.3);
          api.audio.tone(70, LASER_FIRE, { type: 'sawtooth', vol: 0.12 });
          api.audio.noise(0.5, { vol: 0.2, cutoff: 1600 });
        }
      } else if (L.st === 'fire') {
        var f = Math.min(1, L.t / LASER_FIRE), e = f * f * (3 - 2 * f);
        b.x = L.x0 + (L.x1 - L.x0) * e;
        L.end = laserEnd(b.x);
        if (L.end >= PY - 14 && Math.abs(player.x - b.x) < LASER_HALF + 12) hurtPlayer();
        if (Math.random() < 0.7) sparks(b.x + (Math.random() - 0.5) * 12, L.end, Math.random() < 0.5 ? '#ffffff' : LASER_C, 1, 160);
        if (f >= 1) { L.st = 'cool'; L.t = 0; }
      } else if (L.t >= LASER_COOL) {
        b.las = null;
        b.lasT = BOSS_PHASES[b.phase].laserEvery;
        b.fanT = Math.min(b.fanT, 0.8);
      }
    }
    function clankAt(x, y) {
      sparks(x, y, '#e6e0ff', 4, 140);
      api.audio.tone(1700, 0.03, { type: 'triangle', vol: 0.05 });
    }
    function hullAt(x, y) {
      var col = Math.floor((x - (boss.x - HULL_W / 2)) / BOSS_PIX), row = Math.floor((y - (boss.y - HULL_H / 2)) / BOSS_PIX);
      var rows = ART.hull[0];
      return row >= 0 && row < rows.length && col >= 0 && col < rows[0].length && rows[row].charAt(col) === '#';
    }
    function shotVsBoss(s, y0) {
      var b = boss;
      if (!b || b.dying > 0 || s.y > b.y + 60 || y0 < b.y - 40) return false;
      var dmg = s.pierce ? 2 : 1;
      for (var k = 0; k < 2; k++) {
        if (!podAlive(k)) continue;
        var px = b.x + b.pods[k].dx, py = b.y + POD_DY;
        if (segHits(s, y0, px - 15, px + 15, py - 13, py + 13)) {
          if (b.enter > 0) clankAt(s.x, s.y); else damagePod(k, dmg);
          return true;
        }
      }
      var cy = b.y + CORE_DY;
      if (b.phase >= 2 && segHits(s, y0, b.x - CORE_R, b.x + CORE_R, cy - CORE_R, cy + CORE_R)) { damageCore(dmg); return true; }
      if (hullAt(s.x, s.y) || hullAt(s.x, (s.y + y0) / 2)) { clankAt(s.x, s.y); return true; }
      return false;
    }
    function damagePod(k, d) {
      var p = boss.pods[k], x = boss.x + p.dx, y = boss.y + POD_DY;
      p.hp = Math.max(0, p.hp - d); p.flash = 0.08;
      sparks(x, y + 10, '#ffd08a', 4, 120);
      api.audio.tone(260 + p.hp * 25, 0.05, { type: 'square', vol: 0.07 });
      if (p.hp > 0) return;
      addPts(400 * bossN, x, y, '#ffd23f');
      pixelBurst('pod', 0, x - 15, y - 12, POD_C, BOSS_PIX, 1.4);
      ring(x, y, POD_C, 64);
      api.shake(9); screenFlash('#ffd08a', 0.4);
      api.audio.noise(0.5, { vol: 0.3, cutoff: 1100 });
      dropCapsule(x, y + 14);
      if (!podAlive(0) && !podAlive(1)) setBossPhase(2);
    }
    function damageCore(d) {
      var b = boss;
      b.core.hp = Math.max(0, b.core.hp - d); b.core.flash = 0.08;
      sparks(b.x, b.y + CORE_DY + 8, '#ffffff', 5, 140);
      api.audio.tone(180 + b.core.hp * 12, 0.05, { type: 'square', vol: 0.08 });
      if (b.core.hp <= 0) { bossDie(); return; }
      if (b.phase === 2 && b.core.hp <= b.core.max * 0.5) setBossPhase(3);
    }
    function setBossPhase(n) {
      var P = BOSS_PHASES[n];
      boss.phase = n;
      boss.fanT = 1.4; boss.lasT = 2.4; boss.charge = null;
      boss.hullFlash = 0.15;
      showBanner('MOTHERSHIP MK ' + bossN, P.name, P.sub, n === 3 ? LASER_C : '#ffd23f', null, n === 3);
      screenFlash('#ffffff', 0.45);
      api.shake(8);
      api.audio.noise(0.4, { vol: 0.22, cutoff: 1400 });
      var m = M();
      if (m) m.stinger([{ deg: 0 }, { deg: 4, at: 1 }, { deg: 7, at: 2, steps: 3 }], { inst: 'lead', quantize: '8', octave: 1, gain: 0.35, params: { wave: 'sawtooth', cutoff: 2600 } });
    }
    function bossDie() {

      ctx.fillStyle = '#02030a'; ctx.fillRect(0, y - 44, W, 84);
      ctx.fillStyle = b.color; ctx.fillRect(0, y - 44, W, 1); ctx.fillRect(0, y + 39, W, 1);
      ctx.globalAlpha = a;
      if (b.top) U.glowText(ctx, b.top, W / 2, y - 28, 8, '#9fb4ff');
      if (b.kind) {
        var L = lookOf(b.kind, 0), s = sprite(L.art, Math.floor(t * 3) % 2, L.c);
        ctx.font = '800 16px "Press Start 2P", ui-monospace, Menlo, Consolas, monospace';
        var tw = ctx.measureText(b.title).width;
        var lx = W / 2 - tw / 2 - s.w - 14, rx = W / 2 + tw / 2 + 14, sy = y - 4 - s.h / 2;
        blit(ctx, s, lx, sy, 0.8, 1, a);
        blit(ctx, s, rx, sy, 0.8, 1, a);
        if (b.kind === 's') { drawShieldBar(ctx, lx, sy + s.h + 2, s.w, 1, false, 0); drawShieldBar(ctx, rx, sy + s.h + 2, s.w, 1, false, 0); }
        ctx.globalAlpha = a;
      }

      if (b.sub) U.glowText(ctx, b.sub, W / 2, y + 24, 8, '#ffd23f');

    }
    function drawCrt(ctx) {
      if (flash.a > 0.01) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = flash.a * 0.35;
        ctx.fillStyle = flash.c; ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';

      ctx.drawImage(rollBand(), 0, (t * 60) % (H + 140) - 70, W, 64);
      ctx.drawImage(crtOverlay(W, H), 0, 0);

    if (M()) M().play(song(KEY), { fade: 1.2, intensity: 0 });

    /* ================================================== public interface */
    return {
      update: function (dt) {
        t += dt;
        var inp = api.input;
        inp.takeSwipes();
        stepVisuals(dt);
        if (over) { overT += dt; if (overT > 1.4) api.gameOver(); return; }
        crumbleT -= dt;
        if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
        updatePlayer(dt, inp);
        updateShots(dt);
        updateBombs(dt);
        updateCaps(dt);
        updateUfo(dt);
        if (clearT > 0) {

          if (boss) updateBoss(dt);

        status();
      },

      render: function (ctx) {
        var pulse = M() ? M().pulse(6) : 0, gA = 0.45 + pulse * 0.25;
        ctx.save();
        drawBackground(ctx);
        drawBunkers(ctx);
        if (boss) drawBoss(ctx, gA);
        drawAliens(ctx, gA);
        drawUfo(ctx, gA);
        drawCaps(ctx);
        drawShots(ctx);
        drawBombs(ctx);
        drawPlayer(ctx, gA);
        drawBits(ctx);
        drawHud(ctx, gA);
        drawBanner(ctx);
        drawCrt(ctx);
        ctx.restore();
      },

      // Read-only snapshot for tests.
      debug: function () {
        var kinds = {}, n = 0, diving = 0;
        for (var i = 0; i < aliens.length; i++) {
          var a = aliens[i];
          if (a.dead) continue;
          n++;
          kinds[a.kind] = (kinds[a.kind] || 0) + 1;
          if (a.state === 'dive' || a.state === 'escort') diving++;

        var pw = {};
        for (var k in power) pw[k] = Math.round(power[k] * 10) / 10;
        pw.shield = player.shield;
        return {
          wave: wave, formation: formation.name, invaders: n, kinds: kinds, diving: diving,
          boss: boss ? { hp: bossHp(), max: bossMax(), phase: boss.phase, pods: (podAlive(0) ? 1 : 0) + (podAlive(1) ? 1 : 0),
            laser: boss.las ? boss.las.st : null, dying: boss.dying > 0 } : null,
          power: pw, lives: lives, dead: !player.alive, over: over, ufo: !!ufo,
          capsules: caps.map(function (c) { return c.kind; }), bunkerCells: bunkerCells(), bombs: bombs.length

      }
    };
  }

  /* ================================================================= attract */
  var ATTRACT_ROWS = [
    [['bomber', '#ff5a4f'], ['diver', '#ffd23f'], ['shielded', '#6f8bff'], ['splitter', '#ff9f1c']],
    [['gruntA', '#ff3fa4']],
    [['gruntB', '#b04dff']],
    [['gruntC', '#3ff0ff']]
  ];
  function attract(ctx, w, h, t) {
    ctx.save();
    ctx.fillStyle = '#02030a';
    ctx.fillRect(0, 0, w, h);
    var k, r, c;
    for (k = 0; k < 50; k++) {
      var sx = (k * 97.3) % w, sy = (k * 53.7 + t * (6 + (k % 3) * 8)) % h;
      ctx.fillStyle = 'rgba(190,210,255,' + (0.25 + 0.25 * Math.sin(t * 2 + k)) + ')';
      ctx.fillRect(sx, sy, k % 4 === 0 ? 2 : 1, k % 4 === 0 ? 2 : 1);
    }

    var cols = Math.max(3, Math.min(8, Math.floor((w * 0.86) / cell)));
    var ox = (w - cols * cell) / 2 + Math.sin(t * 1.5) * w * 0.05;
    var frame = Math.floor(t * 3) % 2;

      for (c = 0; c < cols; c++) {
        var e = ATTRACT_ROWS[r][c % ATTRACT_ROWS[r].length], s = sprite(e[0], frame, e[1]);
        blit(ctx, s, ox + c * cell + (cell - s.w * sc) / 2, h * 0.14 + r * CH * sc, 0.55, sc);
      }

    var dt = (t % 4) / 4, dx = w * 0.5 + Math.sin(dt * TAU) * w * 0.32, dy = h * 0.2 + Math.sin(dt * Math.PI) * h * 0.45;
    blit(ctx, sprite('diver', Math.floor(t * 8) % 2, '#ffd23f'), dx - 15 * sc, dy, 0.7, sc);
    // mystery ship
    var ux = ((t * 50) % (w + 120)) - 60;
    blit(ctx, sprite('ufo', Math.floor(t * 8) % 2, UFO_C), ux - 24 * sc, h * 0.04, 0.6, sc);
    // bunkers
    var bk = intactBunker();
    for (k = 0; k < 3; k++) blit(ctx, bk, w * (0.2 + k * 0.3) - BW * sc / 2, h * 0.62, 0.45, sc);
    // cannon firing
    var cx = w / 2 + Math.sin(t * 2) * w * 0.3, cyy = h * 0.76;
    blit(ctx, sprite('cannon', 0, ACCENT), cx - 16.5 * sc, cyy, 0.6, sc);
    var shy = cyy - ((t * h * 0.9) % (h * 0.7));
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(160,255,220,0.35)'; ctx.fillRect(cx - 3 * sc, shy - 4, 6 * sc, 16 * sc);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(cx - sc, shy - 2, 2 * sc, 11 * sc);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(crtOverlay(w, h), 0, 0, w, h);
    ctx.restore();
  }

  XA.registerGame({
    id: 'xa_invader_wave',
    order: 14,
    title: 'Invader Wave',
    tagline: 'Hold the line. Clear the sky.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'shooter',
    controls: '\u2190\u2192 move \u00b7 Space fire (hold to keep firing)',
    create: create,
    attract: attract
  });
})(window);
</script>
<script>/* game-helix-drop.js */
/*
 * Xtrata Arcade cartridge #15 — HELIX DROP
 * A ball bounces on a spiral tower of rings. Spin the tower so the ball
 * drops through the gaps; avoid the red segments. Fall through three rings
 * without bouncing and the ball ignites, smashing whatever it lands on.
 * Contract game-id: xa_helix_drop (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-helix-drop');
  var U = XA.util;
  var M = function () { return XA.music; };

  var W = 400, H = 600, CX = W / 2;
  var R = 150, RI = 34, SQ = 0.32, SEG = 12, STEP = Math.PI * 2 / SEG, GAP_Y = 118, BALL_R = 11;
  var FRONT = Math.PI / 2, MID = (R + RI) / 2;
  var ACCENT = '#ff9f1c', SAFE = '#3ff0ff', DANGER = '#ff2d55';

  // Music: C# minor drum & bass at 170 - half-time drums while shallow, full
  // two-step break deeper down. Each gap fallen through plays the next note
  // of a descending run (reset on landing); an ignited ball opens the filter
  // and adds a riser until it lands.
  var CLOSED = 4200;
  function song() {
    return {
      bpm: 170, key: 49, scale: 'minor', chords: [0, 0, 5, 6], seed: 15, filter: CLOSED,
      tracks: [
        { name: 'pad', inst: 'pad', layer: 0, gain: 0.34, chord: true, octave: 0, params: { cutoff: 1000, attack: 0.8, release: 1.5 },
          fn: function (i) { return i.stepInBar === 0 && i.bar % 2 === 0 ? [{ deg: 0, steps: 32 }, { deg: 2, steps: 32 }, { deg: 4, steps: 32 }] : null; } },
        { name: 'sub', inst: 'sub', layer: 0.08, gain: 0.5, chord: true, octave: -1, pattern: '0 - - - - - - - . . 0 - - - - .' },
        { name: 'hkick', inst: 'kick', layer: 0.15, maxLayer: 0.5, gain: 0.6, pattern: 'x.........x.....' },
        { name: 'hsnare', inst: 'snare', layer: 0.15, maxLayer: 0.5, gain: 0.4, pattern: '........x.......' },
        { name: 'hat', inst: 'hat', layer: 0.3, gain: 0.25, pattern: '..x...x...x...xx' },
        { name: 'kick', inst: 'kick', layer: 0.5, gain: 0.6, pattern: 'x.........x.....' },
        { name: 'snare', inst: 'snare', layer: 0.5, gain: 0.42, pattern: '....x..x.x..x...' },
        { name: 'reese', inst: 'bass', layer: 0.62, gain: 0.3, chord: true, octave: -1, params: { cutoff: 500, q: 2 },
          pattern: '0 - - - - - . 0 - - . 2 - - 1 -' },
        { name: 'shaker', inst: 'shaker', layer: 0.72, gain: 0.3, pattern: 'x.xxx.xxx.xxx.xx' },
        { name: 'stab', inst: 'bell', layer: 0.85, gain: 0.25, chord: true, octave: 1,
          fn: function (i) { return i.stepInBar === 6 || (i.stepInBar === 14 && i.bar % 2) ? [{ deg: 4, vel: 0.6 }, { deg: 7, vel: 0.5 }] : null; } }
      ]
    };
  }

  function create(api) {
    var rng = api.rng;
    var rings = [];                 // { y, kinds:[0 plate,1 gap,2 danger], broken, splats:[] }
    var rot = 0;
    var ball = { y: -60, vy: 0 };
    var nextRing = 0, cam = -200, combo = 0, passed = 0;
    var lastPX = null, lastMoved = api.pointer().moved;
    var over = false, overT = 0, t = 0;

    function makeRing(k) {
      var kinds = new Array(SEG).fill(0);
      var gapLen = k < 10 ? 2 : (rng() < 0.6 ? 2 : 1);
      var g0 = Math.floor(rng() * SEG);
      if (k === 0) g0 = 7;          // first gap starts away from the ball
      for (var i = 0; i < gapLen; i++) kinds[(g0 + i) % SEG] = 1;
      var danger = k < 3 ? 0 : Math.min(5, 1 + Math.floor(k / 7));
      for (var d = 0; d < danger; d++) {
        var s = Math.floor(rng() * SEG);
        if (kinds[s] === 0 && !(k < 6 && s === 3)) kinds[s] = 2;
      }
      // the ring the ball starts on must be safe under it
      if (k === 0) kinds[3] = 0;
      return { y: k * GAP_Y, kinds: kinds, broken: 0, splats: [] };
    }
    function ring(k) { while (rings.length <= k) rings.push(makeRing(rings.length)); return rings[k]; }
    for (var i = 0; i < 12; i++) ring(i);
    var run = 0, fireOn = false, lastInt = -1;
    if (M()) M().play(song(), { fade: 1.2, intensity: 0 });
    // ignited ball: open the filter + riser; any landing closes it again
    function setFire(on) {
      if (on === fireOn) return;
      fireOn = on;
      var m = M();
      if (!m) return;
      m.setFilter(on ? 16000 : CLOSED, on ? 0.25 : 0.5);
      if (on) m.note('riser', 0, { dur: 0.8, gain: 0.4 });
    }
    function landed() {
      run = 0;
      setFire(false);
      var m = M();
      if (!m) return;
      var it = Math.round(U.clamp(0.1 + passed / 55, 0, 1) * 20) / 20;
      if (it !== lastInt) { lastInt = it; m.setIntensity(it); }
    }

    function segUnderBall() {
      var local = ((FRONT - rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      return Math.floor(local / STEP) % SEG;
    }
    function landOn(rg, k) {
      var s = segUnderBall();
      var kind = rg.kinds[s];
      var sy = rg.y;
      if (kind === 1) {
        passed++;
        combo++;
        var pts = 10 * combo;
        api.addScore(pts);
        if (combo > 1) api.fx.text(CX + 40, sy - cam - 10, '+' + pts, combo >= 3 ? ACCENT : '#fff', 11 + Math.min(combo, 5));
        var m = M();
        if (m) {
          // a cascade: every gap in one fall is the next note down the scale
          m.note('pluck', 9 - Math.min(run, 16), { octave: 0, gain: 0.7, params: { decay: 0.35 } });
          run++;
          setFire(combo >= 3);
        } else api.audio.tone(300 + Math.min(combo, 12) * 60, 0.06, { type: 'triangle', vol: 0.12 });
        nextRing = k + 1;
        return false;
      }
      if (combo >= 3) {
        // fireball smash
        rg.broken = 1;
        passed++;
        api.addScore(20 + combo * 5);
        api.fx.burst(CX, sy - cam + MID * SQ, ACCENT, 40, 260, 0.8);
        api.fx.text(CX, sy - cam - 20, 'SMASH', ACCENT, 15);
        api.shake(7);
        api.audio.noise(0.25, { vol: 0.28, cutoff: 1400 });
        if (M()) M().note('sub', 0, { octave: -2, dur: 0.4, gain: 0.8 });
        combo = 0;
        landed();
        nextRing = k + 1;
        ball.vy = -520;
        return true;
      }
      if (kind === 2) {
        over = true;
        api.fx.burst(CX, sy - cam + MID * SQ, DANGER, 36, 220, 0.9);
        api.shake(12);
        api.audio.tone(160, 0.5, { type: 'sawtooth', slide: 0.3, vol: 0.28 });
        setFire(false);
        return true;
      }
      // normal bounce
      ball.y = sy - BALL_R;
      ball.vy = -600;
      combo = 0;
      landed();
      var local = ((FRONT - rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      rg.splats.push(local);
      if (rg.splats.length > 5) rg.splats.shift();
      api.audio.tone(180, 0.05, { type: 'square', vol: 0.1 });
      api.fx.burst(CX, sy - cam + MID * SQ, SAFE, 6, 80, 0.3);
      return true;
    }

    return {
      // Read-only test hook.
      debug: function () { return { seg: segUnderBall(), kinds: ring(nextRing).kinds.slice(), passed: passed }; },
      update: function (dt) {
        t += dt;
        var inp = api.input;
        inp.takeSwipes();
        // rotate: keys, or drag horizontally (mouse or touch)
        if (inp.held('left')) rot -= 3.4 * dt;
        if (inp.held('right')) rot += 3.4 * dt;
        var p = api.pointer();
        if (p.down) {
          if (lastPX !== null && p.moved !== lastMoved) rot += (p.x - lastPX) * 0.014;
          lastPX = p.x;
        } else lastPX = null;
        lastMoved = p.moved;

        if (over) { overT += dt; if (overT > 1.2) api.gameOver(); return; }

        var prevBottom = ball.y + BALL_R;
        ball.vy = Math.min(900, ball.vy + 1900 * dt);
        ball.y += ball.vy * dt;
        var bottom = ball.y + BALL_R;
        // check rings crossed this frame
        for (var k = nextRing; k < nextRing + 3; k++) {
          var rg = ring(k);
          if (rg.broken) { if (k === nextRing) nextRing++; continue; }
          if (prevBottom <= rg.y && bottom >= rg.y && ball.vy > 0) {
            if (landOn(rg, k)) break;
          }
        }
        // keep a lookahead of rings and let the camera trail the ball
        ring(nextRing + 10);
        cam += ((ball.y - 210) - cam) * Math.min(1, dt * 6);
        rings.forEach(function (rg) { if (rg.broken > 0 && rg.broken < 2) rg.broken = Math.min(2, rg.broken + dt * 2); });
        api.setStatus('RINGS ' + passed + (combo >= 3 ? '  ·  ON FIRE' : combo > 1 ? '  ·  COMBO ' + combo : ''));
      },

      render: function (ctx) {
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#1a0a2e'); g.addColorStop(1, '#070312');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        var first = Math.max(0, Math.floor((cam - 80) / GAP_Y)), last = Math.floor((cam + H + 80) / GAP_Y);
        var i, k;
        function segPath(sy, a0, a1, lift) {
          ctx.beginPath();
          var n = 6;
          for (i = 0; i <= n; i++) {
            var a = a0 + (a1 - a0) * i / n;
            ctx.lineTo(CX + Math.cos(a) * R, sy + lift + Math.sin(a) * R * SQ);
          }
          for (i = n; i >= 0; i--) {
            var b = a0 + (a1 - a0) * i / n;
            ctx.lineTo(CX + Math.cos(b) * RI, sy + lift + Math.sin(b) * RI * SQ);
          }
          ctx.closePath();
        }
        function drawRing(k, frontHalf) {
          var rg = rings[k];
          if (!rg || rg.broken >= 2) return;
          var sy = rg.y - cam;
          var alpha = rg.broken ? 1 - rg.broken / 2 : 1;
          for (var s = 0; s < SEG; s++) {
            var kind = rg.kinds[s];
            if (kind === 1) continue;
            var a0 = s * STEP + rot, a1 = a0 + STEP;
            var mid = (a0 + a1) / 2;
            var isFront = Math.sin(mid) > 0;
            if (isFront !== frontHalf) continue;
