      label.textContent = 'Connect';
      b.title = 'Connect a Stacks wallet to post high scores';
    }
  }
  async function onWalletClick() {
    XA.audio.unlock();
    if (walletStatus.address) { S.disconnect(); return; }
    if (walletStatus.route === 'none') {
      openInfo('View-only here',
        'This copy of the arcade cannot reach a wallet, so you can play and see the boards but not post scores. ' +
        'Open the arcade on Xtrata to post.', S.runtimeUrl());
      return;
    }
    try { await S.connect(); } catch (e) { openInfo('Wallet not connected', e.message || String(e)); }
  }

  async function refreshCabinet(cab, force) {
    var g = cab.game;
    $('.xa-pb', cab.el).textContent = fmtBest(g, g.mode);
    var board = await S.getTop10(g.id, g.mode, force);
    boards[bk(g)] = board;
    var el = $('.xa-top1', cab.el);
    if (!board.ok) { el.textContent = 'offline'; el.title = board.error || ''; return; }
    var top = board.entries[0];
    el.textContent = top ? fmtVal(g.mode, top.score) + ' ' + top.name : 'be first';
    el.title = top ? top.name + ' · ' + top.player : 'No scores yet';
  }

  /* ----------------------------------------------------- scoreboard */
  function closeModal() {
    if (modalEl) { modalEl.remove(); modalEl = null; }
  }
  function modal(card) {
    closeModal();
    modalEl = h('div', { class: 'xa-modal', role: 'dialog', 'aria-modal': 'true', onclick: function (e) {
      if (e.target === modalEl) closeModal();
    } }, [card]);
    rootEl.appendChild(modalEl);
    var f = card.querySelector('button');
    if (f) f.focus();
  }
  function openInfo(title, text, link) {
    modal(h('div', { class: 'xa-card' }, [
      h('h3', { text: title }),
      h('p', { class: 'xa-verdict', text: text }),
      link ? h('p', { class: 'xa-note' }, [h('a', { href: link, target: '_blank', rel: 'noopener', style: 'color:var(--xa-cyan)', text: 'Open on xtrata.xyz ↗' })]) : null,
      h('div', { class: 'xa-card-foot' }, [h('span'), h('button', { class: 'xa-btn', type: 'button', onclick: closeModal, text: 'Close' })])
    ]));
  }
  function boardList(board, game, highlight, mode) {
    mode = mode || (game && game.mode) || 'score';
    if (!board) return h('div', { class: 'xa-empty', text: 'Loading…' });
    if (!board.ok) return h('div', { class: 'xa-error', text: 'Couldn’t reach the leaderboard right now. It isn’t empty — try again in a moment.' });
    if (!board.entries.length) return h('div', { class: 'xa-empty', text: 'No scores yet. The first run that lands here is permanent until someone beats it.' });
    return h('ol', { class: 'xa-board' }, board.entries.map(function (e) {
      var you = walletStatus.address && e.player === walletStatus.address;
      return h('li', { class: you || (highlight && highlight === e.rank) ? 'is-you' : '' }, [
        h('span', { class: 'xa-rank', text: '#' + e.rank }),
        h('span', { class: 'xa-who' }, [h('b', { text: e.name }), h('small', { text: S.shortAddress(e.player) + (you ? ' · you' : '') })]),
        h('span', { class: 'xa-pts', text: fmtVal(mode, e.score) })
      ]);
    }));
  }
  function openBoards(gameId, mode) {
    var game = XA.games.filter(function (g) { return g.id === gameId; })[0] || XA.games[0];
    var modes = [game.mode].concat(game.variants.map(function (v) { return v.mode; }));
    if (modes.indexOf(mode) < 0) mode = game.mode;
    var key = bk(game, mode);
    var body = h('div', {}, [boardList(boards[key], game, 0, mode)]);
    var tabs = h('div', { class: 'xa-tabs', role: 'tablist' }, XA.games.map(function (g) {
      return h('button', { class: 'xa-tab', role: 'tab', type: 'button', style: '--c:' + g.color,
        'aria-selected': g.id === game.id ? 'true' : 'false', onclick: function () { openBoards(g.id); } }, [g.title]);
    }));
    var modeTabs = modes.length > 1 ? h('div', { class: 'xa-mode-tabs', role: 'tablist', 'aria-label': game.title + ' boards' }, modes.map(function (m) {
      return h('button', { class: 'xa-mode-tab', role: 'tab', type: 'button', 'data-mode': m,
        'aria-selected': m === mode ? 'true' : 'false', onclick: function () { openBoards(game.id, m); } },
        [(m === 'time' ? '⏱ ' : '') + modeLabel(game, m)]);
    })) : null;
    var foot = h('div', { class: 'xa-card-foot' }, [
      h('span', { text: 'Your best: ' + fmtBest(game, mode) }),
      h('span', {}, [
        h('button', { class: 'xa-btn', type: 'button', style: 'margin-right:8px', onclick: async function () {
          body.replaceChildren(boardList(null));
          boards[key] = await S.getTop10(game.id, mode, true);
          body.replaceChildren(boardList(boards[key], game, 0, mode));
        } }, ['↻ Refresh']),
        h('button', { class: 'xa-btn', type: 'button', onclick: closeModal }, ['Close'])
      ])
    ]);
    modal(h('div', { class: 'xa-card', style: '--c:' + game.color }, [h('h3', { text: 'High scores' }), tabs, modeTabs, body, foot]));
    if (!boards[key]) S.getTop10(game.id, mode).then(function (b) {
      boards[key] = b;
      if (modalEl && body.isConnected) body.replaceChildren(boardList(b, game, 0, mode));
    });
  }

  /* ------------------------------------------------------- session */
  function startGame(id, variantKey) {
    XA.audio.unlock();
    closeModal();
    var game = XA.games.filter(function (g) { return g.id === id; })[0];
    if (!game) return;
    var variant = variantOf(game, variantKey);
    var mode = variant ? variant.mode : game.mode;
    endSession();
    if (XA.music) { XA.music.stop(0.15); XA.music.clearListeners(); }

    var canvas = h('canvas', { 'aria-label': game.title + ' playfield' });
    var stage = h('div', { class: 'xa-stage' }, [canvas]);
    var scoreEl = h('b', { id: 'xa-score', text: '0' });
    var bestEl = h('b', { text: fmtBest(game, mode) });
    var hiEl = h('b', { text: '…' });
    var statusEl = h('div', { class: 'xa-status', 'aria-live': 'polite' });
    var pauseBtn = h('button', { class: 'xa-icon', type: 'button', 'aria-label': 'Pause', text: '❚❚', onclick: function () { togglePause(); } });
    gameEl = h('section', { class: 'xa-game', style: '--c:' + game.color }, [
      h('div', { class: 'xa-hud' }, [
        h('button', { class: 'xa-icon', type: 'button', 'aria-label': 'Back to the arcade', text: '◀', onclick: function () { endSession(); } }),
        h('span', { class: 'xa-title', text: game.title + (variant ? ' · ' + variant.label : '') }),
        h('div', { class: 'xa-hud-stats' }, [
          h('div', {}, [h('small', { text: mode === 'time' ? 'TIME' : 'SCORE' }), scoreEl]),
          h('div', {}, [h('small', { text: 'BEST' }), bestEl]),
          h('div', {}, [h('small', { text: 'CHAIN #1' }), hiEl])
        ]),
        pauseBtn
      ]),
      statusEl,
      stage
    ]);
    var input = XA.createInput(stage);
    var pads = buildPads(game.touch, input, game);
    if (pads) gameEl.appendChild(pads);
    rootEl.appendChild(gameEl);
    roomEl.setAttribute('aria-hidden', 'true');

    var seed = U.newSeed();
    var fx = XA.createFx();
    session = {
      game: game, variant: variant, mode: mode, completed: false, canvas: canvas, ctx: canvas.getContext('2d'), stage: stage, input: input, fx: fx,
      score: 0, shake: 0, state: 'countdown', countdown: 3.0, acc: 0, seed: seed,
      scoreEl: scoreEl, statusEl: statusEl, hiEl: hiEl, scale: 1, overlay: null, startedAt: Date.now()
    };
    var s = session;
    var api = {
      W: game.size.w, H: game.size.h, input: input, audio: XA.audio, fx: fx,
      rng: U.rng(seed), seed: seed,
      shake: function (n) { s.shake = Math.max(s.shake, n); },
      addScore: function (n) { if (s.state === 'play') s.score += Math.max(0, Math.floor(n)); },
      setScore: function (n) { if (s.state === 'play') s.score = Math.max(0, Math.floor(n)); },
      getScore: function () { return s.score; },
      setStatus: function (t) { if (s.statusEl.textContent !== t) s.statusEl.textContent = t; },
      gameOver: function () { if (s.state === 'play') finish(); },
      // Which board this run is for. In 'time' mode the score is the elapsed
      // time in centiseconds (lower wins): keep it current with setScore and
      // call finish() on completion. gameOver() without finish() is a DNF.
      mode: mode,
      variant: variant ? variant.key : null,
      finish: function () { if (s.state === 'play') { s.completed = true; finish(); } },
      // Pointer in playfield units. `moved` increments on every move/press, so a
      // game can tell "the pointer is steering" from "the keys are steering".
      pointer: function () {
        var p = input.pointer, r = canvas.getBoundingClientRect();
        return { x: (p.x - r.left) / s.scale, y: (p.y - r.top) / s.scale, down: p.down, moved: p.moved };
      }
    };
    s.instance = game.create(api);
    fit();
    showCountdown();
    S.getTop10(game.id, mode).then(function (b) {
      boards[bk(game, mode)] = b;
      if (session !== s) return;
      hiEl.textContent = b.ok ? (b.entries[0] ? fmtVal(mode, b.entries[0].score) : '—') : 'offline';
    });
  }

  function buildPads(kind, input, game) {
    var coarse = root.matchMedia && root.matchMedia('(pointer: coarse)').matches;
    if (!coarse && !/[?&]pads=1/.test(root.location.search || '')) return null;
    function pad(name, label, cls) {
      var b = h('button', { class: 'xa-pad ' + (cls || '') + ' ' + name, type: 'button', 'aria-label': name, text: label });
      function down(e) { e.preventDefault(); XA.audio.unlock(); b.classList.add('is-down'); input.press(name); try { b.setPointerCapture(e.pointerId); } catch (x) {} }
      function up() { b.classList.remove('is-down'); input.release(name); }
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('lostpointercapture', up);
      b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      return b;
    }
    if (kind === 'dpad') {
      return h('div', { class: 'xa-pads' }, [
        h('div', { class: 'xa-pad-hint', text: 'SWIPE OR USE THE PAD' }),
        h('div', { class: 'xa-pad-group xa-dpad' }, [pad('up', '▲'), pad('left', '◀'), pad('down', '▼'), pad('right', '▶')])
      ]);
    }
    if (kind === 'blocks') {
      return h('div', { class: 'xa-pads' }, [
        h('div', { class: 'xa-pad-group xa-row' }, [pad('left', '◀'), pad('down', '▼'), pad('right', '▶')]),
        h('div', { class: 'xa-pad-group xa-grid2' }, [pad('b', '⟲'), pad('c', '⟳'), pad('d', 'HOLD', 'xa-wide'), pad('a', '⤓')])
      ]);
    }
    if (kind === 'lander') {
      return h('div', { class: 'xa-pads' }, [
        h('div', { class: 'xa-pad-group xa-row' }, [pad('left', '⟲'), pad('right', '⟳')]),
        h('div', { class: 'xa-pad-group xa-row' }, [pad('up', 'THRUST', 'xa-wide')])
      ]);
    }
    if (kind === 'shooter') {
      return h('div', { class: 'xa-pads' }, [
        h('div', { class: 'xa-pad-group xa-row' }, [pad('left', '◀'), pad('right', '▶')]),
        h('div', { class: 'xa-pad-group xa-row' }, [pad('a', 'FIRE', 'xa-wide')])
      ]);
    }
    if (kind === 'ship') {
      return h('div', { class: 'xa-pads' }, [
        h('div', { class: 'xa-pad-group xa-row' }, [pad('left', '⟲'), pad('right', '⟳')]),
        h('div', { class: 'xa-pad-group xa-row' }, [pad('up', 'THRUST', 'xa-wide'), pad('a', 'FIRE', 'xa-wide')])
      ]);
    }
    if (kind === 'hint') {
      return h('div', { class: 'xa-pads' }, [h('div', { class: 'xa-pad-hint', text: game.touchHint || '' })]);
    }
    if (kind === 'hold') {
      return h('div', { class: 'xa-pads' }, [h('div', { class: 'xa-pad-hint', text: 'TOUCH AND HOLD ANYWHERE ON THE SCREEN TO SWIM' })]);
    }
    return null;
  }

  function fit() {
    if (!session) return;
    var s = session, g = s.game;
    var rect = s.stage.getBoundingClientRect();
    var availW = Math.max(100, rect.width - 20), availH = Math.max(100, rect.height - 12);
    var scale = Math.min(availW / g.size.w, availH / g.size.h);
    var dpr = Math.min(root.devicePixelRatio || 1, 2.5);
    s.scale = scale;
    s.dpr = dpr;
    s.canvas.style.width = Math.floor(g.size.w * scale) + 'px';
    s.canvas.style.height = Math.floor(g.size.h * scale) + 'px';
    s.canvas.width = Math.floor(g.size.w * scale * dpr);
    s.canvas.height = Math.floor(g.size.h * scale * dpr);
  }

  function setOverlay(el) {
    if (!session) return;
    if (session.overlay) session.overlay.remove();
    session.overlay = el;
    if (el) session.stage.appendChild(el);
  }
  function showCountdown() {
    var n = h('div', { class: 'xa-countdown', text: '3' });
    setOverlay(h('div', { class: 'xa-overlay', style: 'background:rgba(3,4,12,.35)' }, [n]));
    session.countEl = n;
    XA.audio.tone(440, 0.1, { type: 'square', vol: 0.15 });
  }

  function togglePause(force) {
    var s = session;
    if (!s) return;
    if (s.state === 'play' && force !== false) {
      s.state = 'paused';
      if (XA.music) XA.music.pause();
      s.input.reset();
      setOverlay(h('div', { class: 'xa-overlay', 'data-xa-ui': '1' }, [h('div', { class: 'xa-over xa-pause' }, [
        h('h3', { text: 'PAUSED' }),
        h('div', { class: 'xa-over-actions' }, [
          h('button', { class: 'xa-btn xa-btn-play', style: '--c:' + s.game.color, type: 'button', onclick: function () { togglePause(); } }, ['Resume']),
          h('button', { class: 'xa-btn', type: 'button', onclick: endSession }, ['Quit'])
        ])
      ])]));
      $('.xa-overlay button', s.stage).focus();
    } else if (s.state === 'paused' && force !== true) {
      s.state = 'play';
      s.acc = 0;
      s.input.reset();
      if (XA.music) XA.music.resume();
      setOverlay(null);
    }
  }

  function endSession() {
    if (!session) return;
    session.input.destroy();
    session = null;
    if (XA.music) { XA.music.stop(0.35); XA.music.clearListeners(); }
    if (gameEl) { gameEl.remove(); gameEl = null; }
    roomEl.removeAttribute('aria-hidden');
    cabinets.forEach(function (c) { refreshCabinet(c); });
    var btn = $('[data-play]');
    if (btn) btn.focus();
  }

  /* --------------------------------------------------- game over */
  function insertRank(board, score, mode) {
    if (!board || !board.ok) return 0;
    for (var i = 0; i < 10; i++) {
      var e = board.entries[i];
      if (!e) return i + 1;
      if (mode === 'time' ? score < e.score : score > e.score) return i + 1;
    }
    return 0;
  }

  async function finish() {
    var s = session;
    s.state = 'over';
    s.input.reset();
    // Games may already have stopped their music (e.g. their own death cue).
    if (XA.music && XA.music.isPlaying()) XA.music.tapeStop(1.3);
    var g = s.game, mode = s.mode, vkey = s.variant ? s.variant.key : null;
    var score = s.score;
    var dnf = mode === 'time' && !s.completed;
    if (dnf) score = 0;
    var prevBest = localBest(g, mode);
    var best = recordLocal(g, mode, score);
    var isPb = score > 0 && (mode === 'time' ? (!prevBest || score < prevBest) : score > prevBest);
    XA.audio.arp(isPb ? [523, 659, 784, 1047] : [392, 330, 262], 0.09, { type: 'triangle', vol: 0.2 });

    var verdict = h('p', { class: 'xa-verdict', text: 'Checking the on-chain board…' });
    var submitBox = h('div', { class: 'xa-submit xa-hidden' });
    var again = h('button', { class: 'xa-btn xa-btn-play', style: '--c:' + g.color, type: 'button', onclick: function () { startGame(g.id, vkey); } }, ['↻ Play again']);
    setOverlay(h('div', { class: 'xa-overlay', 'data-xa-ui': '1' }, [h('div', { class: 'xa-over' }, [
      h('h3', { text: dnf ? 'DID NOT FINISH' : mode === 'time' ? 'FINISHED' : 'GAME OVER' }),
      h('div', { class: 'xa-final', text: dnf ? '—' : fmtVal(mode, score) }),
      isPb ? h('span', { class: 'xa-badge', text: '★ NEW PERSONAL BEST' }) : h('span', { class: 'xa-note', text: 'Best ' + fmtBest(g, mode) }),
      verdict,
      submitBox,
      h('div', { class: 'xa-over-actions' }, [again, h('button', { class: 'xa-btn', type: 'button', onclick: endSession }, ['◀ Arcade'])])
    ])]));
    again.focus();

    if (dnf) { verdict.textContent = 'Finish the run to set a time for the board.'; return; }
    if (!(score > 0)) { verdict.textContent = 'Score something to get on the board.'; return; }
    var board = await S.getTop10(g.id, mode, true);
    if (session !== s) return;
    boards[bk(g, mode)] = board;
    var rank = insertRank(board, score, mode);
    if (!board.ok) {
      verdict.textContent = 'Couldn’t check the leaderboard right now — you can still try to post.';
    } else if (rank) {
      verdict.replaceChildren('That run makes the top 10 at ', h('b', { text: '#' + rank }), '. Post it on-chain to keep it until someone beats it.');
    } else {
      var tenth = board.entries[9];
      verdict.textContent = mode === 'time'
        ? 'The top 10 starts at ' + fmtVal(mode, tenth.score) + '. ' + fmtVal(mode, score - tenth.score + 1) + ' faster to get on the board.'
        : 'The top 10 starts at ' + U.fmt(tenth.score) + '. ' + U.fmt(tenth.score - score + 1) + ' more to get on the board.';
      return;
    }
    buildSubmit(submitBox, s, score, rank);
  }

  function buildSubmit(box, s, score, rank) {
    var g = s.game;
    var st = S.status();
    box.classList.remove('xa-hidden');
    if (st.route === 'none') {
      box.replaceChildren(
        h('p', { class: 'xa-note', style: 'margin:0', text: 'This copy of the arcade can’t reach a wallet, so this score can’t be posted from here. Open the arcade on Xtrata to post your runs.' }),
        h('a', { class: 'xa-btn', href: S.runtimeUrl(), target: '_blank', rel: 'noopener', style: 'display:block;text-align:center;text-decoration:none;margin-top:10px' }, ['Open on xtrata.xyz ↗'])
      );
      return;
    }
    var name = h('input', { class: 'xa-name', id: 'xa-name', maxlength: '12', autocomplete: 'off', spellcheck: 'false',
      value: U.store('name') || '', placeholder: 'AAA', 'aria-describedby': 'xa-name-note' });
    name.addEventListener('input', function () {
      var c = S.cleanName(name.value).toUpperCase();
      if (c !== name.value) name.value = c;
    });
    var msg = h('p', { class: 'xa-msg', 'aria-live': 'polite' });
    var btn = h('button', { class: 'xa-btn xa-btn-primary', type: 'button' }, ['Post score on-chain']);
    var feeNote = h('p', { class: 'xa-note', id: 'xa-name-note', text: '3–12 letters or numbers. Your wallet will ask you to confirm.' });
    S.getFee().then(function (f) {
      if (f.ok) feeNote.textContent = '3–12 letters or numbers. Fee ' + (Number(f.value) / 1e6) + ' STX plus network fee, capped by a post-condition.';
    });
    btn.addEventListener('click', async function () {
      var n = S.cleanName(name.value).toUpperCase();
      if (n.length < 3) { msg.className = 'xa-msg is-err'; msg.textContent = 'Name needs at least 3 characters.'; name.focus(); return; }
      U.store('name', n);
      btn.disabled = true; name.disabled = true;
      msg.className = 'xa-msg'; msg.textContent = 'Check your wallet to confirm…';
      try {
        var r = await S.submit({ gameId: g.id, mode: s.mode, score: score, name: n });
        if (r.ok) {
          var tx = r.txid ? (/^0x/.test(r.txid) ? r.txid : '0x' + r.txid) : '';
          msg.className = 'xa-msg is-ok';
          msg.replaceChildren('Submitted! It shows on the board once the transaction confirms. ',
            tx ? h('a', { href: 'https://explorer.hiro.so/txid/' + tx + '?chain=' + S.config().network, target: '_blank', rel: 'noopener', text: 'View transaction ↗' }) : '');
          btn.textContent = 'Posted ✓';
          XA.audio.arp([784, 988, 1175, 1568], 0.07, { type: 'square', vol: 0.18 });
        } else if (r.needsRuntime) {
          msg.className = 'xa-msg is-err';
          msg.replaceChildren(r.reason + ' ', h('a', { href: r.runtimeUrl, target: '_blank', rel: 'noopener', text: 'Open the secure runtime ↗' }));
          btn.disabled = false; name.disabled = false;
        }
      } catch (e) {
        msg.className = 'xa-msg is-err';
        msg.textContent = (e && e.message) || 'The wallet did not sign.';
        btn.disabled = false; name.disabled = false;
      }
    });
    box.replaceChildren(h('label', { for: 'xa-name', text: 'NAME ON THE BOARD' }), name, feeNote, btn, msg);
  }

  /* ---------------------------------------------------------- loop */
  var STEP = 1 / 60;
  var attractT = 0, attractAcc = 0;
  function frame(ts) {
    raf = root.requestAnimationFrame(frame);
    var dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
    lastTs = ts;
    if (session) runSession(dt);
    else runAttract(dt);
  }
  function runAttract(dt) {
    attractT += dt;
    attractAcc += dt;
    if (attractAcc < 1 / 30) return;
    attractAcc = 0;
    cabinets.forEach(function (c) {
      var r = c.canvas.getBoundingClientRect();
      if (!r.width) return;
      var dpr = Math.min(root.devicePixelRatio || 1, 2);
      var w = Math.round(r.width * dpr), hgt = Math.round(r.height * dpr);
      if (c.canvas.width !== w || c.canvas.height !== hgt) { c.canvas.width = w; c.canvas.height = hgt; }
      c.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      try { c.game.attract(c.ctx, r.width, r.height, attractT); } catch (e) {}
    });
  }
  function runSession(dt) {
    var s = session;
    var g = s.game;
    if (s.state === 'countdown') {
      var before = Math.ceil(s.countdown);
      s.countdown -= dt;
      var now = Math.ceil(s.countdown);
      if (now !== before && now > 0) { s.countEl.textContent = String(now); XA.audio.tone(440, 0.1, { type: 'square', vol: 0.15 }); }
      if (s.countdown <= 0) {
        s.state = 'play';
        s.input.reset();
        setOverlay(null);
        XA.audio.tone(880, 0.16, { type: 'square', vol: 0.18 });
      }
    } else if (s.state === 'play') {
      if (s.input.hit('pause')) { togglePause(); }
      else {
        s.acc += dt;
        var steps = 0;
        while (s.acc >= STEP && steps < 6 && session === s && s.state === 'play') {
          s.instance.update(STEP);
          s.input.endFrame();
          s.fx.update(STEP);
          s.acc -= STEP;
          steps++;
        }
      }
    } else if (s.state === 'over') {
      s.fx.update(dt);
    }
    if (session !== s) return;
    var shown = fmtVal(s.mode, s.score);
    if (s.scoreEl.textContent !== shown) s.scoreEl.textContent = shown;

    var ctx = s.ctx, k = s.scale * s.dpr;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    if (s.shake > 0.1) {
      ctx.translate((Math.random() - 0.5) * s.shake, (Math.random() - 0.5) * s.shake);
      s.shake *= Math.pow(0.02, dt);
    } else s.shake = 0;
    ctx.save();
    ctx.beginPath(); ctx.rect(-20, -20, g.size.w + 40, g.size.h + 40); ctx.clip();
    s.instance.render(ctx);
    s.fx.draw(ctx);
    ctx.restore();
  }

  /* ---------------------------------------------------------- boot */
  function boot(mount) {
    if (rootEl) return;
    var cfg = root.XA_CONFIG || {};
    if (cfg.scores) S.configure(cfg.scores);
    rootEl = mount || doc.getElementById('xa-root') || doc.body;
    buildRoom();
    S.onChange(function (st) {
      walletStatus = st;
      paintWallet();
    });
    cabinets.forEach(function (c) { refreshCabinet(c); });
    root.addEventListener('resize', fit);
    doc.addEventListener('visibilitychange', function () { if (doc.hidden) togglePause(true); });
    root.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modalEl) { closeModal(); return; }
      if (!session) return;
      if (e.key === 'Enter' && session.state === 'over' && doc.activeElement && doc.activeElement.id !== 'xa-name' &&
          doc.activeElement.tagName !== 'BUTTON' && doc.activeElement.tagName !== 'A') startGame(session.game.id, session.variant && session.variant.key);
      if ((e.key === 'Escape' || e.key === 'p' || e.key === 'P') && session.state === 'paused') togglePause();
    });
    raf = root.requestAnimationFrame(frame);
  }

  root.XARoom = {
    boot: boot,
    start: startGame,
    back: endSession,
    _session: function () { return session; }
  };
})(window);
</script>
<script>/* game-neon-snake.js */
/*
 * Xtrata Arcade cartridge #1 — NEON SNAKE (v2)
 * Eat, grow, don't bite yourself — across designed stages with portals,
 * with power-ups that bend time, space and the soundtrack.
 *
 * Music: a synthwave track that *grows with the snake*. Each extra length
 * unlocks a layer (pad → bass → drums → arps → lead), speed drives tempo,
 * every stage modulates up a tone, every bite plays a chord tone in key,
 * SLOW drops the tempo under a filter, GHOST shifts to a whole-tone scale,
 * MAGNET adds a bell sparkle line, and death is a tape stop.
 *
 * Contract game-id: xa_neon_snake (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-neon-snake');
  var U = XA.util;
  var M = function () { return XA.music; };

  var W = 480, H = 480, CELL = 20, COLS = 24, ROWS = 24, BITES_PER_STAGE = 12;
  var COLOR = '#39ff88', FOOD = '#ff3fa4', GOLD = '#ffd23f';
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var THEMES = [
    { snake: '#39ff88', wall: '#6a7bff', grid: 'rgba(57,255,136,0.06)', bg: '#05060f' },
    { snake: '#3ff0ff', wall: '#ff3fa4', grid: 'rgba(63,240,255,0.07)', bg: '#06051a' },
    { snake: '#ffd23f', wall: '#3ff0ff', grid: 'rgba(255,210,63,0.06)', bg: '#0d0714' },
    { snake: '#ff8fd8', wall: '#39ff88', grid: 'rgba(255,143,216,0.06)', bg: '#070d12' },
    { snake: '#b98cff', wall: '#ffd23f', grid: 'rgba(185,140,255,0.07)', bg: '#0a0618' }
  ];
  var POWERS = {
    slow: { color: '#3ff0ff', label: 'SLOW-MO', dur: 5 },
    ghost: { color: '#b98cff', label: 'GHOST', dur: 5 },
    magnet: { color: '#ffd23f', label: 'MAGNET', dur: 6 }
  };

  // Designed layouts (walls + optional portal pair), returned as cell lists.
  function layout(stage) {
    var walls = [], portals = null, i, startY = 12;
    function line(x0, y0, x1, y1) {
      var dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0), x = x0, y = y0;
      while (true) { walls.push([x, y]); if (x === x1 && y === y1) break; x += dx; y += dy; }
    }
    var k = (stage - 1) % 5;
    if (k === 1) { // corner brackets
      [[2, 2, 1, 1], [21, 2, -1, 1], [2, 21, 1, -1], [21, 21, -1, -1]].forEach(function (c) {
        line(c[0], c[1], c[0] + 4 * c[2], c[1]); line(c[0], c[1], c[0], c[1] + 4 * c[3]);
      });
    } else if (k === 2) { // broken cross + portals
      line(11, 3, 11, 8); line(11, 15, 11, 20); line(3, 11, 8, 11); line(15, 11, 20, 11);
      portals = [[4, 4], [19, 19]];
      startY = 13;                              // one clear row between you and the arm
    } else if (k === 3) { // twin bars with portals at their ends
      line(4, 7, 19, 7); line(4, 16, 19, 16);
      portals = [[2, 11], [21, 11]];
    } else if (k === 4) { // box with four doors
      line(7, 7, 10, 7); line(13, 7, 16, 7); line(7, 16, 10, 16); line(13, 16, 16, 16);
      line(7, 8, 7, 10); line(7, 13, 7, 15); line(16, 8, 16, 10); line(16, 13, 16, 15);
      portals = [[11, 11], [3, 20]];
    }
    // later loops: a few extra pillars
    for (i = 0; i < Math.floor((stage - 1) / 5) * 3; i++) {
      var py = 3 + (i * 11) % 18;
      if (Math.abs(py - startY) > 1) walls.push([3 + (i * 7) % 18, py]);   // keep the start lane clear
    }
    return { walls: walls, portals: portals, startY: startY };
  }

  function song() {
    var hook = [
      '4 - . 4 2 - 0 - 2 - - - . . . .',
      '5 - . 5 4 - 2 - 4 - - - . . . .',
      '7 - . 6 4 - 2 - 4 - 6 - 7 - - -',
      '6 - - - 4 - - - 2 - - - . . . .'
    ].join(' ');
    return {
      bpm: 104, key: 57, scale: 'minor', chords: [0, 5, 2, 6], seed: 11,
      tracks: [
        { name: 'pad', inst: 'pad', layer: 0, gain: 0.5, chord: true, octave: -1,
          fn: function (i) { return i.stepInBar === 0 ? [{ deg: 0, steps: 16 }, { deg: 2, steps: 16 }, { deg: 4, steps: 16 }] : null; } },
        { name: 'bass', inst: 'bass', layer: 0.12, gain: 0.55, chord: true, octave: -2, params: { cutoff: 700 },
          pattern: '0 . 0 . 0 . ^0 . 0 . 0 . 0 . ^0 .' },
        { name: 'kick', inst: 'kick', layer: 0.25, gain: 0.8, pattern: 'x...x...x...x...' },
        { name: 'hat', inst: 'hat', layer: 0.32, gain: 0.5, pattern: '..x...x...x...xx' },
        { name: 'snare', inst: 'clap', layer: 0.45, gain: 0.55, pattern: '....x.......x...' },
        { name: 'arp', inst: 'arp', layer: 0.58, gain: 0.35, chord: true, octave: 1,
          fn: function (i) { return [0, 2, 4, 7][i.step % 4]; } },
        { name: 'lead', inst: 'lead', layer: 0.75, gain: 0.4, octave: 1, pattern: hook },
        { name: 'sparkle', inst: 'bell', layer: 2, gain: 0.35, chord: true, octave: 2, rate: 2,
          fn: function (i) { return i.rng() < 0.6 ? { deg: [0, 2, 4, 7][Math.floor(i.rng() * 4)], vel: 0.6 } : null; } },
        { name: 'ghostpad', inst: 'pad', layer: 2, gain: 0.35, octave: 0, params: { cutoff: 2400, attack: 0.2 },
          fn: function (i) { return i.stepInBar % 8 === 0 ? [{ deg: 0, steps: 8 }, { deg: 3, steps: 8 }] : null; } }
      ]
    };
  }

  function create(api) {
    var rng = api.rng;
    var stage = 1, theme = THEMES[0];
    var walls = {}, portals = null;
    var snake, prevSnake, dir, queue, grow;
    var tick = 0, food = null, gold = null, power = null, active = null;
    var bitesInStage = 0, eaten = 0, combo = 1, comboTimer = 0;
    var dead = false, deathT = 0, stageT = 0, t = 0;

    function key(x, y) { return x + ',' + y; }
    function loadStage() {
      theme = THEMES[(stage - 1) % THEMES.length];
      var L = layout(stage);
      walls = {};
      L.walls.forEach(function (w) { walls[key(w[0], w[1])] = true; });
      portals = L.portals;
      var len = snake ? Math.min(10, snake.length) : 4;
      snake = [];
      for (var i = 0; i < len; i++) snake.push({ x: Math.max(1, 6 - i), y: L.startY });
      prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
      dir = 'right'; queue = []; grow = 0; tick = 0;
      bitesInStage = 0;
      food = freeCell(true); gold = null; power = null;
    }
    function occupied(x, y, ignoreSnake) {
      if (walls[key(x, y)]) return true;
      if (portals && portals.some(function (p) { return p[0] === x && p[1] === y; })) return true;
      if (!ignoreSnake) for (var i = 0; i < snake.length; i++) if (snake[i].x === x && snake[i].y === y) return true;
      return false;
    }
    function freeCell(avoidHead) {
      for (var tries = 0; tries < 800; tries++) {
        var x = 1 + rng.int(COLS - 2), y = 1 + rng.int(ROWS - 2);
        if (occupied(x, y)) continue;
        if (food && food.x === x && food.y === y) continue;
        if (gold && gold.x === x && gold.y === y) continue;
        if (power && power.x === x && power.y === y) continue;
        if (avoidHead && snake && Math.abs(x - snake[0].x) + Math.abs(y - snake[0].y) < 5) continue;
        return { x: x, y: y };
      }
      return null;
    }
    function baseInterval() { return Math.max(0.05, 0.13 - (stage - 1) * 0.006 - snake.length * 0.0012); }
    function interval() { return baseInterval() * (active && active.kind === 'slow' ? 1.9 : 1); }
    function bpmFor(iv) { return 100 + U.clamp((0.13 - iv) / 0.08, 0, 1) * 52; }

    function syncMusic() {
      var m = M();
      if (!m) return;
      m.setIntensity(U.clamp((snake.length - 4) / 34 + (stage - 1) * 0.08, 0, 1));
      if (!(active && active.kind === 'slow')) m.setTempo(bpmFor(baseInterval()), 1.2);
    }

    loadStage();
    if (M()) { M().play(song(), { fade: 1.2, intensity: 0 }); }

    function turn(d) {
      var last = queue.length ? queue[queue.length - 1] : dir;
      if (d === last) return;
      var a = DIRS[d], b = DIRS[last];
      if (a[0] === -b[0] && a[1] === -b[1]) return;
      if (queue.length < 3) queue.push(d);
    }

    function die() {
      dead = true;
      var h = snake[0];
      api.fx.burst(h.x * CELL + CELL / 2, h.y * CELL + CELL / 2, theme.snake, 40, 220, 0.9);
      snake.forEach(function (s, i) {
        if (i % 2) api.fx.burst(s.x * CELL + CELL / 2, s.y * CELL + CELL / 2, theme.snake, 3, 90, 0.8);
      });
      api.shake(10);
      if (M()) { M().note('sub', -7, { dur: 0.9, gain: 0.8 }); M().tapeStop(1.1); }
      else api.audio.tone(220, 0.35, { type: 'sawtooth', slide: 0.25, vol: 0.3 });
    }

    function activate(kind) {
      var m = M();
      endPower();
      active = { kind: kind, left: POWERS[kind].dur };
      api.fx.text(W / 2, 60, POWERS[kind].label + '!', POWERS[kind].color, 16);
      if (!m) return;
      m.stinger([{ deg: 0 }, { deg: 2, at: 1 }, { deg: 4, at: 2 }, { deg: 7, at: 3, steps: 3 }], { inst: 'bell', quantize: '16', octave: 1, gain: 0.6 });
      if (kind === 'slow') { m.setTempo(bpmFor(baseInterval()) * 0.55, 0.5); m.setFilter(900, 0.5); }
      if (kind === 'ghost') { m.setScale('whole'); m.setTrack('ghostpad', true); m.setFilter(5000, 0.3); }
      if (kind === 'magnet') { m.setTrack('sparkle', true); }
    }
    function endPower() {
      if (!active) return;
      var m = M(), kind = active.kind;
      active = null;
      if (!m) return;
      if (kind === 'slow') { m.setFilter(18000, 0.6); }
      if (kind === 'ghost') { m.setScale('minor'); m.setTrack('ghostpad', null); m.setFilter(18000, 0.3); }
      if (kind === 'magnet') { m.setTrack('sparkle', null); }
      syncMusic();
    }

    function nextStage() {
      var bonus = snake.length * 10 * stage;
      api.addScore(bonus);
      api.fx.text(W / 2, H / 2 + 30, 'STAGE CLEAR +' + bonus, GOLD, 14);
      stage++;
      stageT = 1.4;
      endPower();
      var m = M();
      if (m) {
        m.note('riser', 0, { dur: 1.1, gain: 0.5 });
        m.stinger([{ deg: 0 }, { deg: 4, at: 2 }, { deg: 7, at: 4 }, { deg: 9, at: 6 }, { deg: 11, at: 8, steps: 8 }], { inst: 'lead', quantize: 'beat', octave: 1, gain: 0.5 });
        m.transpose(2);
      }
    }

    function step() {
      prevSnake = snake.map(function (s) { return { x: s.x, y: s.y }; });
      if (queue.length) dir = queue.shift();
      var d = DIRS[dir];
      var nx = snake[0].x + d[0], ny = snake[0].y + d[1];
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return die();
      // portals: arrive on the partner cell, keep heading
      if (portals) {
        for (var p = 0; p < 2; p++) {
          if (portals[p][0] === nx && portals[p][1] === ny) {
            var o = portals[1 - p];
            nx = o[0] + d[0]; ny = o[1] + d[1];
            if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return die();
            if (M()) M().note('bell', 7, { octave: 1, gain: 0.5, chord: true });
            api.fx.burst(o[0] * CELL + CELL / 2, o[1] * CELL + CELL / 2, '#ffffff', 12, 120, 0.4);
            break;
          }
        }
      }
      var ghost = active && active.kind === 'ghost';
      var tail = snake[snake.length - 1];
      var hitsTail = tail.x === nx && tail.y === ny && grow === 0;
      if (walls[key(nx, ny)]) return die();
      if (!ghost && !hitsTail && snake.some(function (s) { return s.x === nx && s.y === ny; })) return die();
      snake.unshift({ x: nx, y: ny });
      if (grow > 0) grow--; else snake.pop();

      var cx = nx * CELL + CELL / 2, cy = ny * CELL + CELL / 2;
      var m = M();
      if (food && nx === food.x && ny === food.y) {
        combo = comboTimer > 0 ? Math.min(6, combo + 1) : 1;
        comboTimer = 3;
        var pts = 10 * combo * stage;
        api.addScore(pts);
        api.fx.burst(cx, cy, FOOD, 18, 140);
        api.fx.text(cx, cy - 10, '+' + pts + (combo > 1 ? ' x' + combo : ''), FOOD, 12);
        if (m) m.note('pluck', [0, 2, 4, 7, 9, 11][combo - 1], { chord: true, octave: 1, gain: 0.8 });
        else api.audio.tone(520 + combo * 90, 0.08, { vol: 0.2 });
        grow += 2; eaten++; bitesInStage++;
        food = freeCell(false);
        if (!gold && eaten % 5 === 0) { gold = freeCell(true); if (gold) gold.life = 6; }
        if (!power && eaten % 7 === 3) {
          power = freeCell(true);
          if (power) { power.kind = ['slow', 'ghost', 'magnet'][rng.int(3)]; power.life = 7; }
        }
        syncMusic();
        if (bitesInStage >= BITES_PER_STAGE) nextStage();
      } else if (gold && nx === gold.x && ny === gold.y) {
        var g = (50 + Math.round(gold.life * 10)) * stage;
        api.addScore(g);
        api.fx.burst(cx, cy, GOLD, 30, 200);
        api.fx.text(cx, cy - 10, '+' + g, GOLD, 14);
        if (m) m.stinger([{ deg: 0 }, { deg: 2, at: 1 }, { deg: 4, at: 2 }, { deg: 7, at: 3 }], { inst: 'pluck', quantize: '16', octave: 1 });
        grow += 4; gold = null;
        syncMusic();
      } else if (power && nx === power.x && ny === power.y) {
        activate(power.kind);
        api.fx.burst(cx, cy, POWERS[power.kind].color, 26, 180);
        power = null;
      }
      // magnet: food drifts one cell toward the head every other step
      if (active && active.kind === 'magnet' && food && (Math.round(t * 10) % 2 === 0)) {
        var dx = Math.sign(nx - food.x), dy = Math.sign(ny - food.y);
        var tryX = { x: food.x + dx, y: food.y }, tryY = { x: food.x, y: food.y + dy };
        var mv = Math.abs(nx - food.x) > Math.abs(ny - food.y) ? [tryX, tryY] : [tryY, tryX];
        for (var k = 0; k < 2; k++) if ((mv[k].x !== food.x || mv[k].y !== food.y) && !occupied(mv[k].x, mv[k].y)) { food = mv[k]; break; }
      }
    }

    return {
      // Read-only test hook: what is on screen right now.
      debug: function () { return { stage: stage, len: snake.length, head: snake[0], dir: dir, food: food, active: active && active.kind, dead: dead }; },
      update: function (dt) {
        t += dt;
        var inp = api.input;
        ['up', 'down', 'left', 'right'].forEach(function (d) { if (inp.hit(d)) turn(d); });
        inp.takeSwipes().forEach(function (s) { if (DIRS[s]) turn(s); });
        if (dead) { deathT += dt; if (deathT > 1.1) api.gameOver(); return; }
        if (stageT > 0) {
          stageT -= dt;
          if (stageT <= 0) loadStage();
          return;
        }
        if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 1; }
        if (gold) { gold.life -= dt; if (gold.life <= 0) gold = null; }
        if (power) { power.life -= dt; if (power.life <= 0) power = null; }
        if (active) { active.left -= dt; if (active.left <= 0) endPower(); }
        tick += dt;
        var iv = interval();
        while (tick >= iv && !dead && stageT <= 0) { tick -= iv; step(); }
        api.setStatus('STAGE ' + stage + '  ·  ' + bitesInStage + '/' + BITES_PER_STAGE + '  ·  LEN ' + snake.length +
          (active ? '  ·  ' + POWERS[active.kind].label + ' ' + active.left.toFixed(1) : combo > 1 ? '  ·  COMBO x' + combo : ''));
      },

      render: function (ctx) {
        var pulse = M() ? M().pulse(6) : 0;
        ctx.fillStyle = theme.bg;
        ctx.fillRect(0, 0, W, H);
        // grid breathes with the beat
        ctx.globalAlpha = 1 + pulse * 1.5;
        ctx.strokeStyle = theme.grid;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (var gx = 0; gx <= COLS; gx++) { ctx.moveTo(gx * CELL + 0.5, 0); ctx.lineTo(gx * CELL + 0.5, H); }
        for (var gy = 0; gy <= ROWS; gy++) { ctx.moveTo(0, gy * CELL + 0.5); ctx.lineTo(W, gy * CELL + 0.5); }
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.save();
        ctx.strokeStyle = theme.snake; ctx.globalAlpha = 0.45 + pulse * 0.4; ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, W - 2, H - 2);
        ctx.restore();

        // walls
        ctx.save();
        ctx.shadowColor = theme.wall; ctx.shadowBlur = 10 + pulse * 8; ctx.fillStyle = theme.wall;
        Object.keys(walls).forEach(function (k) {
          var p = k.split(','); ctx.fillRect(+p[0] * CELL + 2, +p[1] * CELL + 2, CELL - 4, CELL - 4);
        });
        ctx.restore();
        // portals
        if (portals) portals.forEach(function (p, i) {
          var px = p[0] * CELL + CELL / 2, py = p[1] * CELL + CELL / 2;
          ctx.save();
          ctx.translate(px, py); ctx.rotate(t * (i ? -3 : 3));
          ctx.strokeStyle = '#ffffff'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 14; ctx.lineWidth = 2;
          for (var r = 0; r < 3; r++) { ctx.beginPath(); ctx.arc(0, 0, 4 + r * 3, r, r + 4); ctx.stroke(); }
          ctx.restore();
        });

        var bob = 1 + pulse * 0.25;
        function orb(o, color, r) {
          ctx.save();
          ctx.shadowColor = color; ctx.shadowBlur = 16; ctx.fillStyle = color;
          ctx.beginPath(); ctx.arc(o.x * CELL + CELL / 2, o.y * CELL + CELL / 2, r * bob, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }
        if (food) orb(food, FOOD, 6);
        if (gold) {
          orb(gold, GOLD, 7);
          ctx.strokeStyle = GOLD; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(gold.x * CELL + CELL / 2, gold.y * CELL + CELL / 2, 12, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (gold.life / 6)); ctx.stroke();
        }

    [{ deg: 0 }, { deg: 2, at: 1 }, { deg: 4, at: 2 }, { deg: 6, at: 3 }, { deg: 7, at: 4 }, { deg: 9, at: 6 }, { deg: 11, at: 8 }, { deg: 14, at: 10, steps: 6 }]

    }
    function levelMusic() {

    }
    function sprintMusic() {

      if (!m) return;

    }

    function nextType() {

    while (queue.length < 4) queue.push(nextType());

    function cells(p, rot, ox, oy) {

    }
    function fits(p, rot, ox, oy) {

      return true;
    }
    function spawn(type) {
      var size = ROT[type][0].length;

      fallT = 0; lockT = 0; lockResets = 0; lastRot = false;

    }
    function spawnNext() { spawn(queue.shift()); queue.push(nextType()); }
    function topOut() {

      for (var y = HIDDEN; y < ROWS; y++) for (var x = 0; x < COLS; x++) {

      }

    }
    function grounded() { return !fits(cur, cur.rot, cur.x, cur.y + 1); }
    function touchLock() {

    }
    function move(dx) {

    function rotate(dirn) {

    spawnNext();

    function drawMini(ctx, type, cx, cy, size, dim) {

      }

    return {

      render: function (ctx) {

<script>/* game-cave-diver.js */
/*
 * Xtrata Arcade cartridge #3 — CAVE DIVER (v2)
 * One button: hold to swim up, release to sink. Dive through four zones —
 * Sunlit Reef, Kelp Forest, The Abyss and the Thermal Vents — each with its
 * own light, currents, creatures and hazards.

 * is low-passed by depth, pearl chains climb the zone's scale on the beat,

    { name: 'THERMAL VENTS', from: 1800, top: '#2a0a0a', bottom: '#0a0303', wall: '#3a1208', edge: '#ff6a2a', dark: 0.45,

  function zoneIndex(m) {

  function create(api) {

    var dctx = dark.getContext('2d');

    function gapFor(d) { return U.lerp(250, 120, U.clamp(d / 16000, 0, 1)); }
    function genCol(index) {
      var d = index * COL, m = d / 10, z = zoneIndex(m);
      drift += (rng() - 0.5) * 3.2;
      drift *= 0.94;
      center += drift;
      var gap = gapFor(d);
      center = U.clamp(center, 26 + gap / 2, H - 26 - gap / 2);
      var wob = Math.sin(index * 0.35) * 6;
      var c = { top: center - gap / 2 + wob, bot: center + gap / 2 + wob, z: z };
      if (index > 40) {
        if (rng() < 0.045) things.push({ kind: 'pearl', x: d, y: U.lerp(c.top + 22, c.bot - 22, rng()) });
        var r = rng();
        if (z === 0 && r < 0.02) things.push({ kind: 'urchin', x: d, y: rng() < 0.5 ? c.top + 8 : c.bot - 8, r: 11 });
        if (z === 1 && r < 0.03) {
          var fromTop = rng() < 0.5;
          things.push({ kind: 'kelp', x: d, base: fromTop ? c.top : c.bot, len: (c.bot - c.top) * (0.35 + rng() * 0.2), up: !fromTop, phase: rng() * 6 });
        }
        if (z === 2 && r < 0.014) things.push({ kind: 'lure', x: d, baseY: (c.top + c.bot) / 2, amp: (c.bot - c.top) * 0.3, phase: rng() * 6, r: 10 });
        if (z === 3 && r < 0.02) things.push({ kind: 'vent', x: d, floor: c.bot, top: c.top, reach: (c.bot - c.top) * (0.45 + rng() * 0.15), period: 2.6 + rng() * 1.5, phase: rng() * 3 });
      }
      return c;
    }
    function colAt(worldX) { return cols[U.clamp(Math.floor(worldX / COL) - firstCol, 0, cols.length - 1)]; }
    function fill() {
      var need = Math.ceil((dist + W + COL * 4) / COL);
      while (firstCol + cols.length < need) cols.push(genCol(firstCol + cols.length));
      var drop = Math.floor((dist - COL * 4) / COL) - firstCol;
      if (drop > 0) { cols.splice(0, drop); firstCol += drop; }
      things = things.filter(function (o) { return o.x > dist - 60; });
    }
    for (var i = 0; i < 40; i++) cols.push(genCol(i));
    center = H / 2;
    fill();
    for (i = 0; i < 14; i++) fishes.push({ x: rng() * W, y: 40 + rng() * (H - 80), s: 0.5 + rng() * 0.8, v: 20 + rng() * 40, p: rng() * 6 });

    var m0 = M();
    if (m0) { m0.play(SONGS[0], { fade: 1.5 }); m0.setFilter(ZONES[0].filter, 0.5); }

    function ventActive(o) { var ph = ((t + o.phase) % o.period) / o.period; return ph > 0.72; }
    function ventWarn(o) { var ph = ((t + o.phase) % o.period) / o.period; return ph > 0.5 && ph <= 0.72; }

    function die(reason) {
      dead = true;
      api.fx.burst(PLAYER_X, y, ACCENT, 36, 230, 0.9);
      api.fx.burst(PLAYER_X, y, '#bfefff', 20, 120, 1.1);
      if (reason) api.fx.text(PLAYER_X + 40, y - 24, reason, '#ff8a8a', 11);
      api.shake(12);
      if (M()) { M().setFilter(500, 0.2); M().tapeStop(1.2); }
      else api.audio.tone(200, 0.4, { type: 'sawtooth', slide: 0.3, vol: 0.28 });
    }
    function changeZone(z) {
      prevZone = zone; zone = z; zoneBlend = 0; bannerT = 2.6;
      var m = M();
      if (m) {
        m.play(SONGS[z], { fade: 2.8, intensity: m.intensity(), keepFilter: true });
        m.setFilter(ZONES[z].filter, 2.5);
        m.note('riser', 0, { dur: 1.6, gain: 0.35 });
      }
    }

    return {
      // Read-only test hook: what is on screen right now.
      debug: function () {
        var c = colAt(dist + PLAYER_X + 40);
        return { y: y, vy: vy, top: c.top, bot: c.bot, zone: zone, metres: Math.floor(dist / 10), dead: dead };
      },
      update: function (dt) {
        t += dt;
        var inp = api.input;
        var hold = inp.held('hold') || inp.held('a') || inp.held('up');
        inp.takeSwipes();
        fishes.forEach(function (f) { f.x -= (f.v + speed * 0.15 * f.s) * dt; if (f.x < -30) { f.x = W + 30; f.y = 40 + rng() * (H - 80); } });
        if (dead) { deadT += dt; if (deadT > 1.1) api.gameOver(); return; }
        if (bannerT > 0) bannerT -= dt;
        zoneBlend = Math.min(1, zoneBlend + dt / 2.5);
        if (!started) {
          var c0 = colAt(dist + PLAYER_X);
          y = (c0.top + c0.bot) / 2 + Math.sin(t * 3) * 8;          // bob in the middle of the gap
          if (hold || inp.hit('a') || inp.hit('up') || inp.hit('hold')) { started = true; vy = -120; if (M()) M().note('marimba', 4, { gain: 0.8 }); }
          return;
        }
        // physics + currents
        vy += (hold ? -1450 : 1050) * dt;
        if (zone === 1) vy += Math.sin(t * 0.9) * 240 * dt;               // kelp sways you
        vy = U.clamp(vy, -380, 420);
        y += vy * dt;
        speed = Math.min(430, 190 + dist * 0.012);
        dist += speed * dt;
        fill();
        var metres = Math.floor(dist / 10);
        var z = zoneIndex(metres);
        if (z !== zone) changeZone(z);

        var wx = dist + PLAYER_X, near = 999;
        for (var k = -1; k <= 1; k++) {
          var c = colAt(wx + k * R);
          if (y - R < c.top || y + R > c.bot) { die(); return; }
          near = Math.min(near, y - R - c.top, c.bot - (y + R));
        }
        closeCd -= dt;
        if (near < 7 && closeCd <= 0) {
          closeCd = 1.1; bonus += 15;
          api.fx.text(PLAYER_X + 30, y - 18, 'CLOSE +15', '#bfefff', 11);
          if (M()) M().note('pluck', 7, { chord: true, octave: 1, gain: 0.5 });
        }
        for (var j = 0; j < things.length; j++) {
          var o = things[j];
          var dx = o.x - wx;
          if (dx < -40 || dx > 60) continue;
          if (o.kind === 'pearl' && !o.got) {
            var dy = o.y - y;
            if (dx * dx + dy * dy < (R + 9) * (R + 9)) {
              o.got = true;
              chain = Math.min(12, chain + 1);
              var pts = 20 * chain;
              pickups += pts;
              api.fx.burst(PLAYER_X + dx, o.y, PEARL, 16, 150);
              api.fx.text(PLAYER_X + dx, o.y - 16, '+' + pts + (chain > 1 ? ' x' + chain : ''), PEARL, 12);
              // the chain climbs the current zone's scale, locked to the grid
              if (M()) M().note(zone === 2 ? 'bell' : 'marimba', chain - 1, { quantize: '16', octave: 1, gain: 0.75 });
            } else if (dx < -30 && !o.missed) {
              o.missed = true;
              if (chain > 1) api.fx.text(PLAYER_X, y + 22, 'CHAIN LOST', '#8899aa', 10);
              chain = 0;
            }
          } else if (o.kind === 'urchin') {
            if (Math.hypot(dx, o.y - y) < R + o.r - 3) { die('URCHIN'); return; }
          } else if (o.kind === 'kelp') {
            var tipY = o.up ? o.base - o.len : o.base + o.len;
            var sway = Math.sin(t * 2 + o.phase) * 10;
            if (Math.abs(dx - sway * 0.5) < 6 + R && (o.up ? y + R > tipY : y - R < tipY)) { die('TANGLED'); return; }
          } else if (o.kind === 'lure') {
            var ly = o.baseY + Math.sin(t * 1.4 + o.phase) * o.amp;
            if (Math.hypot(dx, ly - y) < R + o.r - 2) { die('ANGLERFISH'); return; }
          } else if (o.kind === 'vent') {
            if (Math.abs(dx) < 16) {
              if (ventActive(o) && y + R > o.floor - o.reach) { die('SCALDED'); return; }
              vy -= 900 * dt;                                           // warm updraft
            }
          }
        }
        api.setScore(metres + pickups + bonus);
        bubbleT += dt;
        if (bubbleT > 0.05) {
          bubbleT = 0;
          api.fx.trail(PLAYER_X - 12, y + (Math.random() - 0.5) * 6, 'rgba(190,240,255,0.8)', -speed * 0.4, -20 - Math.random() * 30);
        }
        if (M()) M().setIntensity(U.clamp(chain / 10 + (hold ? 0.25 : 0) + (speed - 190) / 600, 0, 1));
        api.setStatus(ZONES[zone].name + '  ·  ' + metres + ' m' + (chain > 1 ? '  ·  CHAIN x' + chain : ''));
      },

      render: function (ctx) {
        var Z = ZONES[zone], P = ZONES[prevZone], b = zoneBlend;
        function mix(a, c) {
          var pa = parseInt(a.slice(1), 16), pc = parseInt(c.slice(1), 16);
          var r = ((pa >> 16) & 255) * (1 - b) + ((pc >> 16) & 255) * b;
          var g = ((pa >> 8) & 255) * (1 - b) + ((pc >> 8) & 255) * b;
          var bl = (pa & 255) * (1 - b) + (pc & 255) * b;
          return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (bl | 0) + ')';
        }
        var grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, mix(P.top, Z.top));
        grad.addColorStop(1, mix(P.bottom, Z.bottom));
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        var pulse = M() ? M().pulse(4) : 0;
        // god rays in the shallows
        if (zone <= 1) {
          ctx.save();
          ctx.globalAlpha = (zone === 0 ? 0.07 : 0.035) * (1 + pulse * 0.5);
          ctx.fillStyle = '#d6f7ff';
          for (var r = 0; r < 5; r++) {
            var rx = ((r * 150 - dist * 0.1) % (W + 200) + W + 200) % (W + 200) - 100;
            ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx + 70, 0); ctx.lineTo(rx - 40, H); ctx.lineTo(rx - 100, H); ctx.fill();
          }
          ctx.restore();
        }
        // background sea life
        ctx.save();
        fishes.forEach(function (f) {
          ctx.globalAlpha = zone === 2 ? 0.8 : 0.25;
          ctx.fillStyle = zone === 2 ? Z.speck : 'rgba(0,0,0,0.5)';
          if (zone === 2) { ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0.4, 1.5 * f.s + Math.sin(t * 3 + f.p)), 0, 7); ctx.fill(); return; }
          var s = 6 * f.s;
          ctx.beginPath();
          ctx.moveTo(f.x - s, f.y); ctx.quadraticCurveTo(f.x, f.y - s * 0.6, f.x + s, f.y);
          ctx.quadraticCurveTo(f.x, f.y + s * 0.6, f.x - s, f.y);
          ctx.lineTo(f.x + s * 1.6, f.y - s * 0.5 + Math.sin(t * 10 + f.p) * 1.5); ctx.lineTo(f.x + s * 1.6, f.y + s * 0.5); ctx.closePath();
          ctx.fill();
        });
        ctx.restore();

        // cave walls
        var offset = dist - firstCol * COL;
        function wall(isTop) {
          ctx.beginPath();
          ctx.moveTo(-COL, isTop ? 0 : H);
          for (var i = 0; i < cols.length; i++) {
            var sx = i * COL - offset;
            if (sx < -COL * 2 || sx > W + COL * 2) continue;
            ctx.lineTo(sx, isTop ? cols[i].top : cols[i].bot);
          }
          ctx.lineTo(W + COL, isTop ? 0 : H);
          ctx.closePath();
        }
        ctx.save();
        [true, false].forEach(function (isTop) {
          ctx.fillStyle = mix(P.wall, Z.wall);
          wall(isTop); ctx.fill();
          ctx.strokeStyle = mix(P.edge, Z.edge); ctx.lineWidth = 2; ctx.shadowColor = Z.edge; ctx.shadowBlur = 10 + pulse * 10;
          ctx.stroke(); ctx.shadowBlur = 0;
        });
        ctx.restore();

        // things (non-glowing ones first; lights go on top of the darkness)
        things.forEach(function (o) {
          var sx = o.x - dist;
          if (sx < -40 || sx > W + 40) return;
          if (o.kind === 'urchin') {
            ctx.save(); ctx.translate(sx, o.y);
            ctx.strokeStyle = '#2b1030'; ctx.fillStyle = '#51204f'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, o.r * 0.6, 0, 7); ctx.fill();
            for (var s = 0; s < 12; s++) { var a = s / 12 * 6.28 + t * 0.3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * o.r * 1.2, Math.sin(a) * o.r * 1.2); ctx.stroke(); }
            ctx.restore();
          } else if (o.kind === 'kelp') {
            ctx.save();
            ctx.strokeStyle = '#1f8a4a'; ctx.lineWidth = 7; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(sx, o.base);
            var segs = 8;
            for (var q = 1; q <= segs; q++) {
              var f = q / segs;
              ctx.lineTo(sx + Math.sin(t * 2 + o.phase + f * 2) * 10 * f, o.base + (o.up ? -1 : 1) * o.len * f);
            }
            ctx.stroke();
            ctx.strokeStyle = '#35c46e'; ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
          } else if (o.kind === 'vent') {
            var act = ventActive(o), warn = ventWarn(o);
            ctx.save();
            ctx.fillStyle = '#1a0a05';
            ctx.beginPath(); ctx.moveTo(sx - 16, o.floor + 2); ctx.lineTo(sx - 6, o.floor - 12); ctx.lineTo(sx + 6, o.floor - 12); ctx.lineTo(sx + 16, o.floor + 2); ctx.fill();
            var plumeTop = act ? o.floor - o.reach : warn ? o.floor - o.reach * 0.5 : o.floor - 40;
            var g2 = ctx.createLinearGradient(0, o.floor, 0, plumeTop);
            g2.addColorStop(0, act ? 'rgba(255,120,40,0.75)' : warn ? 'rgba(255,160,80,0.35)' : 'rgba(255,200,160,0.15)');
            g2.addColorStop(1, 'rgba(255,120,40,0)');
            ctx.fillStyle = g2;
            ctx.fillRect(sx - (act ? 14 : 8), plumeTop, act ? 28 : 16, o.floor - plumeTop);
            ctx.restore();
          }
        });

        // the carp
        if (!dead) {
          ctx.save();
          ctx.translate(PLAYER_X, y);
          ctx.rotate(U.clamp(vy / 900, -0.5, 0.5));
          var sw = Math.sin(t * 14) * 0.25;
          ctx.shadowColor = ACCENT; ctx.shadowBlur = 14; ctx.fillStyle = ACCENT;
          ctx.beginPath();
          ctx.moveTo(14, 0);
          ctx.bezierCurveTo(8, -9, -8, -9 + sw * 6, -11, 0);
          ctx.bezierCurveTo(-8, 9 + sw * 6, 8, 9, 14, 0);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-10, 0); ctx.lineTo(-22, -8 + sw * 10); ctx.lineTo(-19, 0); ctx.lineTo(-22, 8 + sw * 10); ctx.closePath(); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffd6a0';
          ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(-6, -13 + sw * 4); ctx.lineTo(-5, -6); ctx.fill();
          ctx.fillStyle = '#fff3e0';
          ctx.beginPath(); ctx.ellipse(3, 3, 7, 3, 0, 0, 7); ctx.fill();
          ctx.fillStyle = '#05060f';
          ctx.beginPath(); ctx.arc(8, -2.5, 1.8, 0, 7); ctx.fill();
          ctx.restore();
        }

        // darkness with the carp's own light (the abyss, dimmer at the vents)
        var darkness = P.dark * (1 - b) + Z.dark * b;
        if (darkness > 0.02) {
          dctx.globalCompositeOperation = 'source-over';
          dctx.clearRect(0, 0, W, H);
          dctx.fillStyle = 'rgba(0,0,6,' + darkness.toFixed(3) + ')';
          dctx.fillRect(0, 0, W, H);
          dctx.globalCompositeOperation = 'destination-out';
          var lx = PLAYER_X + 10, ly = y;
          var halo = dctx.createRadialGradient(lx, ly, 10, lx, ly, 90);
          halo.addColorStop(0, 'rgba(0,0,0,1)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
          dctx.fillStyle = halo; dctx.fillRect(0, 0, W, H);
          var cone = dctx.createRadialGradient(lx, ly, 20, lx + 120, ly, 240);
          cone.addColorStop(0, 'rgba(0,0,0,0.95)'); cone.addColorStop(1, 'rgba(0,0,0,0)');
          dctx.fillStyle = cone;
          dctx.beginPath(); dctx.moveTo(lx, ly);
          dctx.lineTo(lx + 330, ly - 120 + vy * 0.1); dctx.lineTo(lx + 330, ly + 120 + vy * 0.1); dctx.closePath(); dctx.fill();
          ctx.drawImage(dark, 0, 0, W, H);
        }

        // lights on top of the darkness: pearls and anglerfish lures
        things.forEach(function (o) {
          var sx = o.x - dist;
          if (sx < -40 || sx > W + 40) return;
          if (o.kind === 'pearl' && !o.got) {
            ctx.save();
            ctx.shadowColor = PEARL; ctx.shadowBlur = 14 + pulse * 10; ctx.fillStyle = PEARL;
            var s2 = 7 + Math.sin(t * 5 + o.x) * 1.2 + pulse * 1.5;
            ctx.beginPath(); ctx.moveTo(sx, o.y - s2); ctx.lineTo(sx + s2, o.y); ctx.lineTo(sx, o.y + s2); ctx.lineTo(sx - s2, o.y); ctx.fill();
            ctx.restore();
          } else if (o.kind === 'lure') {
            var ly2 = o.baseY + Math.sin(t * 1.4 + o.phase) * o.amp;
            ctx.save();
            ctx.strokeStyle = 'rgba(120,160,255,0.35)'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(sx + 26, ly2 + 22); ctx.quadraticCurveTo(sx + 18, ly2 - 4, sx, ly2); ctx.stroke();
            ctx.fillStyle = '#aee6ff'; ctx.shadowColor = '#6fd0ff'; ctx.shadowBlur = 24;
            ctx.beginPath(); ctx.arc(sx, ly2, 5 + Math.sin(t * 6 + o.phase), 0, 7); ctx.fill();
            // the fish behind the light, only hinted
            ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(40,50,90,0.55)';
            ctx.beginPath(); ctx.ellipse(sx + 34, ly2 + 26, 20, 13, 0, 0, 7); ctx.fill();
            ctx.fillStyle = 'rgba(230,240,255,0.7)';
            for (var tt = 0; tt < 4; tt++) ctx.fillRect(sx + 18 + tt * 5, ly2 + 25, 2, 4);
            ctx.restore();
          }
        });

        if (bannerT > 0) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, bannerT) * 0.9;
          U.glowText(ctx, Z.name, W / 2, 70, 20, Z.edge);
          ctx.font = '700 11px ui-monospace, Menlo, Consolas, monospace'; ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(220,240,255,0.7)';
          ctx.fillText(Z.from + ' m', W / 2, 96);
          ctx.restore();
        }
        if (!started && !dead) {
          ctx.save();
          ctx.globalAlpha = 0.6 + Math.sin(t * 5) * 0.4;
          U.glowText(ctx, 'HOLD TO SWIM', W / 2, H / 2 + 60, 16, '#bfefff');
          ctx.restore();
        }
      }
    };
  }

  function attract(ctx, w, h, t) {
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0a4d6e'); g.addColorStop(1, '#010812');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    var off = t * 60;
    function edge(isTop) {
      ctx.beginPath();
      ctx.moveTo(0, isTop ? 0 : h);
      for (var x = 0; x <= w; x += 6) {
        var c = h / 2 + Math.sin((x + off) * 0.018) * h * 0.14;
        var gap = h * 0.5 + Math.sin((x + off) * 0.05) * h * 0.04;
        ctx.lineTo(x, isTop ? c - gap / 2 : c + gap / 2);
      }
      ctx.lineTo(w, isTop ? 0 : h);
      ctx.closePath();
      ctx.fillStyle = '#0c3a3a'; ctx.fill();
      ctx.strokeStyle = '#5fffd0'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.save(); ctx.shadowColor = '#5fffd0'; ctx.shadowBlur = 8; edge(true); edge(false); ctx.restore();
    var px = w * 0.3, py = h / 2 + Math.sin((px + off) * 0.018) * h * 0.14;
    ctx.save();
    ctx.shadowColor = ACCENT; ctx.shadowBlur = 10; ctx.fillStyle = ACCENT;
    ctx.beginPath(); ctx.ellipse(px, py, 8, 5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(px - 6, py); ctx.lineTo(px - 13, py - 5 + Math.sin(t * 16) * 2); ctx.lineTo(px - 13, py + 5 + Math.sin(t * 16) * 2); ctx.fill();
    ctx.restore();
    ctx.fillStyle = PEARL;
    var kx = ((w * 0.8 - t * 40) % w + w) % w;
    ctx.fillRect(kx, h / 2 + Math.sin((kx + off) * 0.018) * h * 0.14 - 3, 5, 5);
  }

  XA.registerGame({
    id: 'xa_cave_diver',
    order: 3,
    title: 'Cave Diver',
    tagline: 'Reef, kelp, abyss, vents. How deep?',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'hold',
    controls: 'Hold Space / ↑ / tap-and-hold',
    create: create,
    attract: attract
  });
})(window);
</script>
<script>/* game-orbit-merge.js */
/*
 * Xtrata Arcade cartridge #4 - ORBIT MERGE (v2)
 * Drop planets into the jar. Two of the same kind touching merge into the
 * next size up; keep the jar below the red line. Grow a SUN and it goes
 * supernova: the jar is cleared, every body scores, and you level up into a
 * new sky. Specials turn up in the queue now and then: BOMB, TREMOR, STARDUST.
 *
 * Music: slow F lydian space pads. Jar fill -> intensity, the danger line
 * closes the filter, merges play lower notes for bigger planets and climb
 * with the chain, every level modulates, a supernova is a riser + stinger.
 *
 * Contract game-id: xa_orbit_merge (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-orbit-merge');
  var U = XA.util;
  var M = function () { return XA.music; };

  var W = 420, H = 600, TAU = Math.PI * 2;
  var LEFT = 26, RIGHT = W - 26, FLOOR = H - 22, DANGER = 118, DROP_Y = 64, GRACE = 2.2;
  var ACCENT = '#b98cff', SS = 2, VMAX = 1300;
  // k = surface look; base/dark/light = palette used by the painter
  var TIERS = [
    { r: 13, c: '#c3c9dc', n: 'Moon', k: 'rock', base: '#9aa0b4', dark: '#50556a', light: '#e4e7f2' },
    { r: 18, c: '#ffb3cf', n: 'Pluto', k: 'ice', base: '#ecd3dd', dark: '#8a5a6e', light: '#ffffff' },

          if (touched && a.sp === 'bomb') { a.dead = true; pend.push({ k: 'bomb', o: a }); }
        }
      }
      while (pend.length) {
        var e = pend.shift();
        if (e.k === 'bomb') detonate(e.o); else upgrade(e.o);
        if (nova) { pend.length = 0; break; }
      }
      for (i = 0; i < orbs.length; i++) if (orbs[i].dead) { orbs = orbs.filter(function (o) { return !o.dead; }); break; }
    }

    // jar fill -> layers; planets over the line -> filter tension (edge-triggered)
    function syncMusic() {
      var m = M();
      if (!m) return;
      var top = FLOOR;
      for (var k = 0; k < orbs.length; k++) if (orbs[k].age > 0.8) top = Math.min(top, orbs[k].y - orbs[k].r);
      var q = Math.round(U.clamp((FLOOR - top) / (FLOOR - DANGER), 0, 1) * 20) / 20;
      if (q !== musicQ) { musicQ = q; m.setIntensity(q); }
      var tense = dangerT > 0 && !nova;
      if (tense !== musicTense) { musicTense = tense; m.setFilter(tense ? 1500 : 18000, tense ? 0.5 : 1); }
    }

    function gameOver() {
      over = true;
      api.shake(12);
      if (M()) { M().setFilter(600, 0.3); M().tapeStop(1.3); }
      api.audio.tone(180, 0.6, { type: 'sawtooth', slide: 0.3, vol: 0.28 });
      orbs.forEach(function (o, k) { o.dieAt = 0.2 + Math.min(1.1, k * 0.03); });
    }

    if (M()) M().play(song(), { fade: 1.6, intensity: 0 });

    /* ------------------------------------------------ render parts */
    function ghostY(x, r) {
      var y = FLOOR - r;
      for (var k = 0; k < orbs.length; k++) {
        var o = orbs[k], dx = o.x - x, rr = r + o.r;
        if (Math.abs(dx) < rr) { var yy = o.y - Math.sqrt(rr * rr - dx * dx); if (yy < y) y = yy; }
      }
      return Math.max(DROP_Y, y);
    }
    function drawBody(ctx, o) {
      var sc = 1 + o.pop * 0.18, sq = o.sq * Math.cos(o.sqPh);
      if (o.sp) { drawSpecial(ctx, o.sp, o.x, o.y, t, sc, o.ang); return; }
      if (o.tier === SUN) {
        var grow = nova && nova.sun === o ? 1 + Math.min(1, nova.t) * 0.3 + Math.sin(nova.t * nova.t * 30) * 0.03 * nova.t : 1;
        drawSun(ctx, o.x, o.y, t, sc * grow);
        drawPlanet(ctx, o.x, o.y, SUN, { sc: sc * grow });
        return;
      }
      drawPlanet(ctx, o.x, o.y, o.tier, { ang: o.ang, sc: sc, sq: sq, sqAng: o.sqAng });
    }
    function drawBackground(ctx) {
      if (oldSky && skyBlend < 1) { ctx.drawImage(oldSky.canvas, 0, 0, W, H); ctx.globalAlpha = skyBlend; }
      ctx.drawImage(sky.canvas, 0, 0, W, H);
      ctx.globalAlpha = 1;
      var tint = 'hsl(' + sky.hue + ',70%,88%)', par = (aimX - W / 2) * 0.03;
      ctx.fillStyle = tint;
      for (var k = 0; k < stars.length; k++) {
        var s = stars[k];
        ctx.globalAlpha = (0.3 + Math.sin(t * 2 + s.p) * 0.25) * (0.5 + s.z * 0.5);
        var x = ((s.x - par * s.z) % W + W) % W;
        ctx.fillRect(x, s.y, s.s * s.z + 0.4, s.s * s.z + 0.4);
      }
      ctx.globalAlpha = 1;
    }
    function drawDanger(ctx) {
      var warn = dangerT > 0;
      if (nearV > 0.05) {
        var zg = ctx.createLinearGradient(0, JTOP, 0, DANGER + 30);
        zg.addColorStop(0, 'rgba(255,77,109,0)'); zg.addColorStop(0.55, 'rgba(255,77,109,' + (0.1 * nearV + (warn ? 0.08 : 0)) + ')'); zg.addColorStop(1, 'rgba(255,77,109,0)');
        ctx.fillStyle = zg; ctx.fillRect(LEFT, JTOP, RIGHT - LEFT, DANGER + 30 - JTOP);
      }
      ctx.save();
      ctx.setLineDash([8, 8]);
      ctx.lineDashOffset = -t * 20;
      var pulse = 0.5 + 0.5 * Math.sin(t * (warn ? 20 : 7));
      ctx.strokeStyle = 'rgba(255,77,109,' + (warn ? 0.5 + pulse * 0.5 : 0.3 + nearV * 0.5 * pulse) + ')';
      ctx.lineWidth = warn ? 2.5 : 2;
      ctx.beginPath(); ctx.moveTo(LEFT, DANGER); ctx.lineTo(RIGHT, DANGER); ctx.stroke();
      ctx.restore();
    }
    function drawCountdown(ctx) {
      if (dangerT > 0 && !over) {
        var left = 1 - dangerT / GRACE, x = U.clamp(dangerX, LEFT + 20, RIGHT - 20), y = DANGER - 22;
        ctx.save();
        ctx.fillStyle = 'rgba(20,4,12,0.7)'; disc(ctx, x, y, 12);
        ctx.strokeStyle = 'rgba(255,77,109,0.3)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 11, 0, TAU); ctx.stroke();
        ctx.strokeStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(x, y, 11, -Math.PI / 2, -Math.PI / 2 + TAU * left); ctx.stroke();
        ctx.restore();
        U.glowText(ctx, String(Math.ceil(GRACE - dangerT)), x, y + 1, 9, '#ffd0d8');
        ctx.save(); ctx.globalAlpha = Math.min(1, dangerT * 2);
        U.glowText(ctx, 'TOO HIGH!', W / 2, DANGER + 18, 13, '#ff4d6d');
        ctx.restore();
      }
    }
    function drawPreview(ctx) {
      var x = W - 104, y = 6;
      ctx.save();
      ctx.fillStyle = 'rgba(8,6,24,0.55)'; ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1;
      U.roundRect(ctx, x, y, 98, 50, 10); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(210,215,255,0.6)'; ctx.font = '700 9px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('NEXT', x + 8, y + 12);
      ctx.restore();
      for (var k = 0; k < 2; k++) {
        var it = queue[k], dr = it.sp ? 11 : 8 + it.tier * 1.6, sc = (k ? 0.8 : 1) * dr / itemR(it);

      }
    }
    function drawLadder(ctx) {
      var n = TIERS.length, gap = 34, x0 = W / 2 - (n - 1) * gap / 2, y = H - 10;
      for (var k = 0; k < n; k++) {
        drawThumb(ctx, x0 + k * gap, y, k, 4 + Math.round(k * 0.45), k <= best ? 1 : 0.28);
      }
    }

    return {
      // Read-only snapshot for tests.
      debug: function () {
        var mt = -1;
        orbs.forEach(function (o) { if (o.tier > mt) mt = o.tier; });
        return { level: level, bodies: orbs.length, maxTier: mt, current: name(cur), queue: [name(queue[0]), name(queue[1])],
          danger: Math.round(dangerT * 100) / 100, dead: over, nova: !!nova, tremor: tremor > 0, drops: drops };
      },
      update: function (dt) {
        t += dt;
        var inp = api.input, k;
        inp.takeSwipes();
        for (k = rings2.length - 1; k >= 0; k--) { var rg = rings2[k]; rg.r += rg.v * dt; rg.life -= dt; if (rg.life <= 0) rings2.splice(k, 1); }
        if (flashT > 0) flashT = Math.max(0, flashT - dt * 2.2);
        if (bannerT > 0) bannerT -= dt;
        if (caption) { caption.t -= dt; if (caption.t <= 0) caption = null; }
        skyBlend = Math.min(1, skyBlend + dt / 2);
        for (k = 0; k < stars.length; k++) { var s = stars[k]; s.y += s.z * 7 * dt; if (s.y > H) { s.y -= H; s.x = vis() * W; } }
        if (over) {
          overT += dt;
          orbs.forEach(function (o) { if (!o.dead && o.dieAt < overT) { o.dead = true; api.fx.burst(o.x, o.y, o.sp ? SPECIAL[o.sp].c : TIERS[o.tier].c, 10, 160); } });

        // Aim: pointer when it moves, otherwise keys.
        var p = api.pointer();
        if (p.moved !== lastMoved) { lastMoved = p.moved; aimX = p.x; }
        if (inp.held('left')) aimX -= 330 * dt;
        if (inp.held('right')) aimX += 330 * dt;
        aimX = clampAim(aimX);

        // Drop: key press, or release of a touch/click inside the jar.
        if (inp.hit('release')) drop();
        if (inp.hit('a') || inp.hit('down') || inp.hit('up')) drop();

        if (nova) updateNova(dt);
        else {
          if (tremor > 0) tremor -= dt;
          var h = dt / SUB;
          for (var s2 = 0; s2 < SUB && !nova; s2++) physics(h);
        }
        orbs.forEach(function (o) {
          o.age += dt;
          if (o.pop > 0) o.pop = Math.max(0, o.pop - dt * 4);
          if (o.sq > 0.004) { o.sq *= Math.exp(-dt * 7); o.sqPh += dt * 30; } else o.sq = 0;
          if (o.puff > 0) o.puff -= dt;

          if (o.tier > best) best = Math.min(o.tier, SUN);
        });

        // Over the line: only settled planets count, and only if they stay there.
        nearV = 0;
        var above = false, hiTop = 1e9;
        if (!nova) {
          orbs.forEach(function (o) {
            if (o.age <= 1.2) return;
            var top = o.y - o.r;
            nearV = Math.max(nearV, U.clamp(1 - (top - DANGER) / 80, 0, 1));
            if (top < DANGER && Math.abs(o.vy) < 120) { if (top < hiTop) { hiTop = top; dangerX = o.x; } above = true; }
          });
        }
        dangerT = above ? dangerT + dt : Math.max(0, dangerT - dt * 2);
        if (dangerT > GRACE) gameOver();
        syncMusic();

        var biggest = orbs.reduce(function (m, o) { return Math.max(m, o.tier); }, 0);
        api.setStatus('LV ' + level + '   NEXT ' + name(queue[0]) + '   BIGGEST ' + TIERS[Math.max(0, biggest)].n.toUpperCase());
      },

      render: function (ctx) {
        drawBackground(ctx);
        var jx = tremor > 0 ? Math.sin(tremorPh) * 3 * Math.min(1, tremor / 0.5) : 0;
        drawDanger(ctx);

        // aim guide + ghost + held item
        if (!over && !nova) {
          var ax = clampAim(aimX), r = itemR(cur), ready = cooldown <= 0;
          if (cur.sp !== 'tremor') {
            var gy = ghostY(ax, r);
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,' + (ready ? 0.22 : 0.1) + ')';
            ctx.setLineDash([3, 7]); ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(ax, DROP_Y + r); ctx.lineTo(ax, gy); ctx.stroke();
            ctx.setLineDash([4, 5]); ctx.strokeStyle = 'rgba(255,255,255,' + (ready ? 0.35 : 0.15) + ')';
            ctx.beginPath(); ctx.arc(ax, gy, r, 0, TAU); ctx.stroke();
            ctx.restore();
            if (ready && gy > DROP_Y + r * 2) drawItem(ctx, cur, ax, gy, t, 1, 0.16);
          }
        }
        for (var k = 0; k < orbs.length; k++) drawBody(ctx, orbs[k]);

        if (rings2.length) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          rings2.forEach(function (rg) {
            var f = rg.life / rg.max;
            ctx.globalAlpha = f; ctx.strokeStyle = rg.c; ctx.lineWidth = rg.w * (0.4 + f);
            ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, TAU); ctx.stroke();

          ctx.restore();
        }
        ctx.drawImage(sky.jar.left, LEFT + 2 + jx, JY0, 14, JH);
        ctx.drawImage(sky.jar.right, RIGHT - 10 + jx, JY0, 6, JH);
        ctx.fillStyle = 'rgba(255,255,255,0.09)'; ctx.fillRect(LEFT + 16, FLOOR - 3, RIGHT - LEFT - 32, 1);
        drawCountdown(ctx);
        drawLadder(ctx);
        drawPreview(ctx);

        if (!over && !nova) {
          var bob = Math.sin(t * 3) * 1.5;
          drawItem(ctx, cur, clampAim(aimX), DROP_Y + bob, t, 1, cooldown > 0 ? 0.35 : 1);
          if (cur.sp) U.glowText(ctx, SPECIAL[cur.sp].label, clampAim(aimX), DROP_Y - itemR(cur) - 14, 8, SPECIAL[cur.sp].c);
        }
        ctx.save();
        ctx.font = '700 10px ui-monospace, Menlo, Consolas, monospace';
        ctx.fillStyle = 'hsla(' + sky.hue + ',90%,85%,0.75)';
        ctx.fillText('LEVEL ' + level, LEFT, 18);
        ctx.restore();

        if (caption) {
          var ca = Math.min(1, caption.t * 2, (3.2 - caption.t) * 4), sp = SPECIAL[caption.sp];
          ctx.save(); ctx.globalAlpha = ca;
          ctx.fillStyle = 'rgba(8,6,24,0.75)'; U.roundRect(ctx, W / 2 - 150, 150, 300, 58, 12); ctx.fill();
          drawSpecial(ctx, caption.sp, W / 2 - 118, 179, t, 1);
          U.glowText(ctx, 'NEW: ' + sp.label, W / 2 + 18, 170, 12, sp.c);
          U.glowText(ctx, sp.desc, W / 2 + 18, 192, 7, '#e6e8ff');
          ctx.restore();
        }
        if (bannerT > 0) {
          ctx.save(); ctx.globalAlpha = Math.min(1, bannerT * 1.5, (2.8 - bannerT) * 3);
          U.glowText(ctx, 'LEVEL ' + level, W / 2, H / 2 - 20, 26, 'hsl(' + sky.hue + ',95%,80%)');
          U.glowText(ctx, 'NEW SKY - GROW ANOTHER SUN', W / 2, H / 2 + 14, 8, '#ffffff');
          ctx.restore();
        }
        if (nova && !nova.fired) {
          ctx.save(); ctx.globalAlpha = Math.min(0.55, nova.t * 0.55);
          var ng = ctx.createRadialGradient(nova.x, nova.y, 0, nova.x, nova.y, 300);
          ng.addColorStop(0, 'rgba(255,240,180,0.6)'); ng.addColorStop(1, 'rgba(255,200,80,0)');
          ctx.fillStyle = ng; ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
        if (flashT > 0) { ctx.fillStyle = 'rgba(255,248,225,' + Math.min(0.9, flashT) + ')'; ctx.fillRect(0, 0, W, H); }
      }
    };
  }

  function attract(ctx, w, h, t) {
    var bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#150b33'); bg.addColorStop(1, '#03020c');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
    var ng = ctx.createRadialGradient(w * 0.72, h * 0.28, 0, w * 0.72, h * 0.28, w * 0.55);
    ng.addColorStop(0, 'rgba(190,110,255,0.22)'); ng.addColorStop(1, 'rgba(190,110,255,0)');
    ctx.fillStyle = ng; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#fff';
    for (var i = 0; i < 40; i++) {
      var fx = Math.abs(Math.sin(i * 12.9898) * 43758.5) % 1, fy = Math.abs(Math.sin(i * 78.233) * 12543.1) % 1;
      ctx.globalAlpha = 0.25 + 0.25 * Math.sin(t * 2 + i);
      ctx.fillRect(fx * w, (fy * h + t * (3 + i % 3 * 4)) % h, 1.2, 1.2);
    }
    ctx.globalAlpha = 1;
    var s = h / 300;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fillRect(w * 0.04, h * 0.25, w * 0.92, h * 0.72);
    ctx.strokeStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 8; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(w * 0.04, h * 0.25); ctx.lineTo(w * 0.04, h * 0.97); ctx.lineTo(w * 0.96, h * 0.97); ctx.lineTo(w * 0.96, h * 0.25); ctx.stroke();

    id: 'xa_orbit_merge',

    tagline: 'Match planets. Grow a sun.',
    color: ACCENT,
    size: { w: W, h: H },

<script>/* game-block-runner.js */
/*
 * Xtrata Arcade cartridge #5 - BLOCK RUNNER (v2)
 * An endless one-button runner: an orange block sprints through four worlds -
 * City Rush, Dune Sea, Neon Night and Orbit - each with its own sky, parallax,
 * ground, obstacle mix and soundtrack. Tap to jump (hold for height, jump
 * again in the air with DOUBLE JUMP), duck under drones, ride coin trails,
 * grab SHIELD / MAGNET / DOUBLE JUMP / DASH, and shave obstacles for
 * CLOSE CALL bonuses.
 *
 * Music: one song per world, crossfaded on the world change (C-major city
 * chiptune, E-phrygian desert pluck, A-minor synthwave, D-lydian space
 * bells). Tempo follows speed, jumps climb an arpeggio, ducking dips the
 * filter, DASH drops tempo + filter, 500 m milestones step the key up.
 *
 * Contract game-id: xa_block_runner (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-block-runner');
  var U = XA.util;
  var M = function () { return XA.music; };

  var W = 600, H = 340, GROUND = 284, PX = 92, TW = 1024;
  var ACCENT = '#ff9f1c', COIN = '#3ff0ff';
  var SIZE = 30, DUCK = 17, JUMP_V = 640, G_HOLD = 1500, G_FALL = 2900, CLOSE = 9;
  var KEY_STEPS = [0, 2, 4, 5, 7, 9];

  var WORLDS = [
    { name: 'CITY RUSH', sky: ['#170a2c', '#4a1848', '#ff7a4d'], far: '#3b2160', mid: '#22123c', ground: '#0d0818', line: ACCENT,
      stripe: 'rgba(255,159,28,0.28)', fill: '#23254a', edge: '#6a7bff', haz: '#ff4d6d', drone: '#c77dff', dust: 'rgba(200,180,255,0.7)' },
    { name: 'DUNE SEA', sky: ['#2b1640', '#c4513a', '#ffcf7a'], far: '#7d3a3f', mid: '#a9552b', ground: '#4a2914', line: '#ffcf7a',
      stripe: 'rgba(255,207,122,0.3)', fill: '#6e4226', edge: '#ffb36b', haz: '#46d17a', drone: '#ff8a5c', dust: 'rgba(255,200,130,0.75)' },
    { name: 'NEON NIGHT', sky: ['#03000f', '#190540', '#4a0f78'], far: '#1a0b3a', mid: '#0e0626', ground: '#07001a', line: '#ff3fa4',
      stripe: 'rgba(255,63,164,0.45)', fill: '#140330', edge: '#3ff0ff', haz: '#ff3fa4', drone: '#ffe14d', dust: 'rgba(255,120,210,0.7)' },
    { name: 'ORBIT', sky: ['#000004', '#050a24', '#1a0f45'], far: '#1b1e3a', mid: '#2b2e4a', ground: '#262838', line: '#b8c4ff',
      stripe: 'rgba(184,196,255,0.22)', fill: '#3a3d55', edge: '#b8c4ff', haz: '#9dff5a', drone: '#5ad1ff', dust: 'rgba(200,210,240,0.7)' }
  ];
  var BOUNDS = [0, 600, 1400, 2400, 3400];

    for (var i = 1; i < BOUNDS.length; i++) if (m < BOUNDS[i]) return i - 1;

  }
