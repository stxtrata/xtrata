    function destroy(br, byBomb) {
      if (br.hp <= 0 && !byBomb) return;
      var color = br.kind === 'S' ? '#9aa3c7' : br.kind === 'B' ? '#ff9f1c' : br.kind === 'G' ? '#ffd23f' : br.kind === 'M' ? '#39ff88' : HP_COLORS[Math.min(br.max, 4)];
      br.hp = 0;
      var mult = 1 + Math.min(combo, 12) * 0.1;
      var pts = Math.round(10 * Math.min(br.max, 4) * level * mult);
      api.addScore(pts);
      if (combo >= 4) api.fx.text(br.x + BW / 2, br.y + BH / 2, '+' + pts, '#fff', 10);
      shatter(br, color);
      api.fx.burst(br.x + BW / 2, br.y + BH / 2, color, 8, 140, 0.4);
      if (br.kind === 'G' || rng() < 0.11) {
        var kinds = ['wide', 'multi', 'slow', 'laser', 'catch', 'fire', 'wide', 'multi', 'laser'];
        var k = rng() < 0.08 ? 'life' : kinds[Math.floor(rng() * kinds.length)];
        drops.push({ x: br.x + BW / 2, y: br.y + BH / 2, kind: k });
      }
      if (br.kind === 'B') {
        api.shake(6);
        api.fx.burst(br.x + BW / 2, br.y + BH / 2, '#ff9f1c', 30, 220, 0.6);
        if (M()) M().note('kick', 0, { gain: 1 });
        bricks.forEach(function (o) {
          if (o.hp > 0 && o !== br && Math.abs(o.r - br.r) <= 1 && Math.abs(o.c - br.c) <= 1 && o.kind !== 'S') destroy(o, true);
        });
      }
    }
    function hitBrick(br) {
      br.flash = 0.12;
      combo++;
      comboNote();
      if (br.kind === 'S') { if (M()) M().note('bell', 0, { octave: 2, gain: 0.25 }); combo = Math.max(0, combo - 1); return; }
      br.hp--;
      if (br.hp <= 0) destroy(br, false);
      else api.addScore(Math.round(5 * level));
    }
    function hitBoss(dmg) {
      boss.hp -= dmg; boss.flash = 0.12;
      api.addScore(25 * level);
      api.shake(3);
      if (M()) M().note('bell', 7 - Math.round((boss.hp / boss.max) * 7), { octave: 1, gain: 0.5 });
      if (boss.hp <= 0) {
        api.addScore(1500 * boss.tier);
        api.fx.text(W / 2, boss.y + 30, 'CORE DOWN +' + (1500 * boss.tier), '#ffd23f', 16);
        for (var i = 0; i < 5; i++) api.fx.burst(boss.x + rng() * boss.w, boss.y + rng() * boss.h, i % 2 ? ACCENT : '#ffd23f', 30, 260, 1);
        api.shake(16);
        boss = null;
      }
    }

    // Move one ball by h seconds; returns false if it fell out.
    function stepBall(b, h) {
      b.x += b.vx * h; b.y += b.vy * h;
      if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); }
      if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); }
      if (b.y < BALL_R + 30) { b.y = BALL_R + 30; b.vy = Math.abs(b.vy); }
      var half = paddle.w / 2;
      if (b.vy > 0 && b.y + BALL_R >= PY && b.y + BALL_R <= PY + PH + 8 && b.x > paddle.x - half - BALL_R && b.x < paddle.x + half + BALL_R) {
        if (timers.catch > 0) {
          b.stuck = true; b.off = b.x - paddle.x; b.hold = 2; b.y = PY - BALL_R - 1;
          if (M()) M().note('marimba', 2, { chord: true, octave: 1 });
          combo = 0;
          return true;
        }
        var off = U.clamp((b.x - paddle.x) / half, -1, 1);
        var ang = (-90 + off * 62) * Math.PI / 180;
        var sp = Math.min(640, Math.hypot(b.vx, b.vy) * 1.012);
        b.vx = Math.cos(ang) * sp; b.vy = Math.sin(ang) * sp;
        b.y = PY - BALL_R;
        combo = 0;
        if (M()) M().note('kick', 0, { gain: 0.5 }); else api.audio.tone(220, 0.05, { type: 'square', vol: 0.12 });
        api.fx.burst(b.x, PY, ACCENT, 6, 80, 0.3);
      }
      var fire = timers.fire > 0;
      for (var i = 0; i < bricks.length; i++) {
        var br = bricks[i];
        if (br.hp <= 0) continue;
        var nx = U.clamp(b.x, br.x, br.x + BW), ny = U.clamp(b.y, br.y, br.y + BH);
        var dx = b.x - nx, dy = b.y - ny;
        if (dx * dx + dy * dy > BALL_R * BALL_R) continue;
        if (fire) { combo++; comboNote(); destroy(br, true); continue; }
        if (Math.abs(dx) > Math.abs(dy)) b.vx = dx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
        else b.vy = dy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy);
        hitBrick(br);
        break;
      }
      if (boss) {
        var bx = U.clamp(b.x, boss.x, boss.x + boss.w), by = U.clamp(b.y, boss.y, boss.y + boss.h);
        var ddx = b.x - bx, ddy = b.y - by;
        if (ddx * ddx + ddy * ddy <= BALL_R * BALL_R) {
          if (Math.abs(ddx) > Math.abs(ddy)) b.vx = ddx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
          else b.vy = ddy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy);
          hitBoss(fire ? 3 : 1);
        }
      }
      return b.y < H + 20;
    }

    function loseLife() {
      lives--;
      api.shake(8);
      Object.keys(timers).forEach(function (k) { timers[k] = 0; });
      paddle.target = 84; drops = []; lasers = [];
      if (lives <= 0) { over = true; api.fx.burst(paddle.x, PY, ACCENT, 40, 220, 1); return; }
      var m = M();
      if (m) { m.duck(0.75, 1.4); m.setFilter(700, 0.1); m.setFilter(18000, 1.6); m.note('sub', -3, { dur: 0.6, gain: 0.8 }); }
      api.fx.text(W / 2, H / 2, lives + (lives === 1 ? ' LIFE LEFT' : ' LIVES LEFT'), '#fff', 14);
      resetBall();
    }
    function applyPower(kind, x) {
      var pw = POWERS[kind];
      api.fx.burst(x, PY, pw.c, 16, 140);
      var label = { wide: 'WIDE', multi: 'MULTI', slow: 'SLOW', life: '+1 LIFE', laser: 'LASER', catch: 'CATCH', fire: 'FIREBALL' }[kind];
      api.fx.text(x, PY - 20, label, pw.c, 11);
      var m = M();
      if (m) m.stinger([{ deg: 0 }, { deg: 4, at: 1 }, { deg: 7, at: 2, steps: 2 }], { inst: 'bell', quantize: '16', octave: 1, gain: 0.5 });
      if (kind === 'wide') { paddle.target = 134; timers.wide = 12; timers.shrink = 0; }
      if (kind === 'slow') { timers.slow = 10; if (m) m.setFilter(1800, 0.4); }
      if (kind === 'life') lives = Math.min(5, lives + 1);
      if (kind === 'laser') timers.laser = 10;
      if (kind === 'catch') timers.catch = 12;
      if (kind === 'fire') { timers.fire = 8; setFill(true); }
      if (kind === 'multi') {
        var src = balls.filter(function (b) { return !b.stuck; })[0];
        if (src) for (var k = 0; k < 2 && balls.length < 8; k++) {
          var a = Math.atan2(src.vy, src.vx) + (k ? 0.45 : -0.45), sp = Math.hypot(src.vx, src.vy);
          balls.push({ x: src.x, y: src.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, stuck: false });
        }
      }
    }

    return {
      update: function (dt) {
        t += dt;
        var inp = api.input;
        var sw = inp.takeSwipes();
        shards.forEach(function (s) { s.vy += 900 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt; s.life -= dt * 0.8; });
        shards = shards.filter(function (s) { return s.life > 0 && s.y < H + 20; });
        if (over) { overT += dt; if (overT > 1.1) api.gameOver(); return; }
        if (titleT > 0) titleT -= dt;

        var p = api.pointer();
        if (p.moved !== lastMoved) { lastMoved = p.moved; paddle.x = p.x; }
        if (inp.held('left')) paddle.x -= 560 * dt;
        if (inp.held('right')) paddle.x += 560 * dt;
        var wantW = timers.shrink > 0 ? 56 : timers.wide > 0 ? 134 : 84;
        paddle.target = wantW;
        paddle.w += (paddle.target - paddle.w) * Math.min(1, dt * 10);
        paddle.x = U.clamp(paddle.x, paddle.w / 2 + 4, W - paddle.w / 2 - 4);
        Object.keys(timers).forEach(function (k) {
          if (timers[k] > 0) {
            timers[k] -= dt;
            if (timers[k] <= 0) {
              timers[k] = 0;
              if (k === 'slow' && M()) M().setFilter(18000, 0.8);
              if (k === 'fire') setFill(false);
            }
          }
        });

        if (clearT > 0) {
          clearT -= dt;
          balls.forEach(function (b) { if (b.stuck) b.x = paddle.x; });
          if (clearT <= 0) {
            levelIndex++;
            if (levelIndex >= LEVELS.length) { levelIndex = 0; loop++; }
            level++;
            buildLevel(); resetBall();
          }
          return;
        }

        var press = inp.hit('a') || inp.hit('up') || sw.indexOf('tap') >= 0;
        balls.forEach(function (b) {
          if (!b.stuck) return;
          b.x = paddle.x + (b.off || 0); b.y = PY - BALL_R - 1;
          if (b.hold > 0) { b.hold -= dt; if (b.hold <= 0) { b.off = 0; launch(b); return; } }
          if (press) { b.off = 0; b.hold = 0; launch(b); }
        });
        // lasers
        laserCd -= dt;
        if (timers.laser > 0 && laserCd <= 0 && (inp.held('a') || inp.held('up') || inp.held('hold')) && !balls.some(function (b) { return b.stuck; })) {
          laserCd = 0.28;
          lasers.push({ x: paddle.x - paddle.w / 2 + 6, y: PY - 4 }, { x: paddle.x + paddle.w / 2 - 6, y: PY - 4 });
          if (M()) M().note('arp', [0, 2, 4, 7][Math.floor(rng() * 4)], { chord: true, octave: 2, gain: 0.5 });
        }
        lasers = lasers.filter(function (l) {
          l.y -= 620 * dt;
          if (l.y < 30) return false;
          for (var i = 0; i < bricks.length; i++) {
            var br = bricks[i];
            if (br.hp > 0 && l.x > br.x && l.x < br.x + BW && l.y > br.y && l.y < br.y + BH) {
              if (br.kind !== 'S') { br.hp--; br.flash = 0.1; if (br.hp <= 0) destroy(br, false); }
              return false;
            }
          }
          if (boss && l.x > boss.x && l.x < boss.x + boss.w && l.y > boss.y && l.y < boss.y + boss.h) { hitBoss(1); return false; }
          return true;
        });

        // movers slide; boss patrols and shoots sparks
        bricks.forEach(function (br) {
          if (br.flash > 0) br.flash -= dt;
          if (br.kind === 'M' && br.hp > 0) br.x = U.clamp(br.x0 + Math.sin(t * 1.4 + br.phase) * BW * 0.55, 2, W - BW - 2);
        });
        if (boss) {
          boss.x += boss.vx * dt;
          if (boss.x < 10 || boss.x + boss.w > W - 10) { boss.vx *= -1; boss.x = U.clamp(boss.x, 10, W - 10 - boss.w); }
          if (boss.flash > 0) boss.flash -= dt;
          boss.shootT -= dt;
          if (boss.shootT <= 0) {
            boss.shootT = Math.max(0.8, 2.2 - boss.tier * 0.3);
            sparks.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h, vy: 160 + boss.tier * 30 });
            if (M()) M().note('lead', 0, { octave: -1, gain: 0.4, dur: 0.1 });
          }
        }
        sparks = sparks.filter(function (s) {
          s.y += s.vy * dt;
          if (s.y > PY - 4 && s.y < PY + PH + 4 && Math.abs(s.x - paddle.x) < paddle.w / 2 + 4) {
            timers.shrink = 5; timers.wide = 0;
            api.shake(5);
            api.fx.text(paddle.x, PY - 24, 'SHRUNK', '#ff4d6d', 11);
            if (M()) M().duck(0.5, 0.6);
            return false;
          }
          return s.y < H + 10;
        });

        var slow = timers.slow > 0 ? 0.65 : 1;
        var sub = 3;
        for (var s = 0; s < sub; s++) balls = balls.filter(function (b) { return b.stuck || stepBall(b, dt * slow / sub); });
        balls.forEach(function (b) { if (!b.stuck) api.fx.trail(b.x, b.y, timers.fire > 0 ? '#ff9f1c' : 'rgba(255,255,255,0.5)', 0, 0); });
        if (!balls.length) { loseLife(); return; }

        drops = drops.filter(function (d) {
          d.y += 150 * dt;
          if (d.y > PY - 6 && d.y < PY + PH + 6 && Math.abs(d.x - paddle.x) < paddle.w / 2 + 10) { applyPower(d.kind, d.x); return false; }
          return d.y < H + 20;
        });

        var left = breakable();
        var m = M();
        if (m) {
          var remaining = (left + (boss ? 1 : 0)) / Math.max(1, totalBreakable);
          m.setIntensity(boss ? 0.2 + (1 - boss.hp / boss.max) * 0.8 : 0.15 + (1 - remaining) * 0.85);
        }
        if (!boss && left > 0) setFill(left <= 4 || timers.fire > 0);
        if (left === 0 && !boss) {
          var bonus = 250 * level + lives * 100;
          api.addScore(bonus);
          api.fx.text(W / 2, H / 2 - 30, 'WALL CLEARED +' + bonus, '#39ff88', 15);
          if (m) {
            setFill(false);
            m.stinger([{ deg: 0 }, { deg: 2, at: 2 }, { deg: 4, at: 4 }, { deg: 7, at: 6, steps: 10 }], { inst: 'lead', quantize: 'bar', octave: 1, gain: 0.6 });
          } else api.audio.arp([523, 659, 784, 1047], 0.08, { type: 'square', vol: 0.2 });
          balls = balls.slice(0, 1);
          balls[0].stuck = true; balls[0].off = 0; balls[0].hold = 0;
          clearT = 2.2;
        }
        api.setStatus('LV ' + level + ' ' + def().name + '  ·  LIVES ' + lives + '  ·  BRICKS ' + left + (combo > 2 ? '  ·  COMBO ' + combo : ''));
      },

      render: function (ctx) {
        var pulse = M() ? M().pulse(6) : 0;
        var hue = (levelIndex * 37) % 360;
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, 'hsl(' + hue + ',55%,' + (boss ? 9 : 7) + '%)'); g.addColorStop(1, '#05030c');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'hsla(' + hue + ',90%,60%,' + (0.06 + pulse * 0.08) + ')';
        ctx.beginPath();
        for (var x = 0; x <= W; x += 24) { ctx.moveTo(x + 0.5, 30); ctx.lineTo(x + 0.5, H); }
        ctx.stroke();
        ctx.save();
        ctx.strokeStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 12 + pulse * 10; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(W, 30); ctx.stroke();
        ctx.restore();
        for (var l = 0; l < lives; l++) { ctx.fillStyle = ACCENT; U.roundRect(ctx, 12 + l * 26, 11, 20, 7, 3); ctx.fill(); }
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '700 11px ui-monospace, Menlo, Consolas, monospace';
        ctx.textAlign = 'right';
        ctx.fillText('LV ' + level + ' · ' + def().name, W - 12, 19);

        bricks.forEach(function (br) {
          if (br.hp <= 0) return;
          var col = br.flash > 0 ? '#ffffff' : br.kind === 'B' ? '#ff9f1c' : br.kind === 'G' ? '#ffd23f' : br.kind === 'M' ? '#39ff88' : HP_COLORS[Math.min(br.hp, 4)];
          var a = br.kind === 'N' ? 0.4 + 0.6 * (br.hp / br.max) : 1;
          drawCell(ctx, br.x, br.y, BW, BH, col, a, br.kind, t);
          if (br.kind === 'N' && br.max > 1) {
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            for (var k = 0; k < br.hp; k++) ctx.fillRect(br.x + 5 + k * 6, br.y + BH - 7, 4, 3);
          }
        });
        shards.forEach(function (s) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, s.life);
          ctx.translate(s.x + s.w / 2, s.y + s.h / 2); ctx.rotate(s.rot);
          ctx.fillStyle = s.c; ctx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
          ctx.restore();
        });
        if (boss) {
          ctx.save();
          var bc = boss.flash > 0 ? '#ffffff' : ACCENT;
          ctx.shadowColor = bc; ctx.shadowBlur = 20 + pulse * 20;
          ctx.fillStyle = '#1a0717'; ctx.strokeStyle = bc; ctx.lineWidth = 3;
          U.roundRect(ctx, boss.x, boss.y, boss.w, boss.h, 10); ctx.fill(); ctx.stroke();
          ctx.shadowBlur = 0;
          var eye = boss.x + boss.w / 2 + U.clamp((paddle.x - boss.x - boss.w / 2) * 0.1, -20, 20);
          ctx.fillStyle = bc;
          ctx.beginPath(); ctx.arc(eye, boss.y + boss.h / 2, 8 + pulse * 3, 0, 7); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(boss.x + 8, boss.y - 10, boss.w - 16, 5);
          ctx.fillStyle = ACCENT; ctx.fillRect(boss.x + 8, boss.y - 10, (boss.w - 16) * (boss.hp / boss.max), 5);
          ctx.restore();
        }
        ctx.fillStyle = '#ff4d6d';
        sparks.forEach(function (s) { ctx.beginPath(); ctx.arc(s.x, s.y, 5 + Math.sin(t * 20) * 1.5, 0, 7); ctx.fill(); });
        ctx.fillStyle = '#ff8a8a';
        lasers.forEach(function (l) { ctx.fillRect(l.x - 1.5, l.y - 10, 3, 12); });

        drops.forEach(function (d) {
          var pw = POWERS[d.kind];
          ctx.save();
          ctx.shadowColor = pw.c; ctx.shadowBlur = 12; ctx.fillStyle = pw.c;
          U.roundRect(ctx, d.x - 14, d.y - 8, 28, 16, 8); ctx.fill();
          ctx.shadowBlur = 0; ctx.fillStyle = '#05030c';
          ctx.font = '900 11px ui-monospace, Menlo, Consolas, monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(pw.l, d.x, d.y + 1);
          ctx.restore();
        });

        // paddle (with cannons while the laser is on)
        var pc = timers.shrink > 0 ? '#ff4d6d' : timers.wide > 0 ? '#39ff88' : timers.catch > 0 ? '#b98cff' : ACCENT;
        ctx.save();
        ctx.shadowColor = pc; ctx.shadowBlur = 18; ctx.fillStyle = pc;
        U.roundRect(ctx, paddle.x - paddle.w / 2, PY, paddle.w, PH, 6); ctx.fill();
        if (timers.laser > 0) { ctx.fillStyle = '#ff4d6d'; ctx.fillRect(paddle.x - paddle.w / 2 + 3, PY - 7, 6, 8); ctx.fillRect(paddle.x + paddle.w / 2 - 9, PY - 7, 6, 8); }
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        U.roundRect(ctx, paddle.x - paddle.w / 2 + 4, PY + 2, paddle.w - 8, 3, 2); ctx.fill();
        ctx.restore();

        balls.forEach(function (b) {
          ctx.save();
          var fire = timers.fire > 0;
          ctx.shadowColor = fire ? '#ff9f1c' : timers.slow > 0 ? '#ffd23f' : '#ffffff'; ctx.shadowBlur = fire ? 24 : 14;
          ctx.fillStyle = fire ? '#ffe0b0' : '#ffffff';
          ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R + (fire ? 1.5 : 0), 0, 7); ctx.fill();
          ctx.restore();
        });
        // active power-up timers
        var active = ['laser', 'catch', 'fire', 'slow', 'wide'].filter(function (k) { return timers[k] > 0; });
        active.forEach(function (k, i) {
          ctx.fillStyle = POWERS[k].c;
          ctx.fillRect(12 + i * 46, H - 12, 40 * Math.min(1, timers[k] / 12), 4);
        });
        if (titleT > 0) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, titleT);
          U.glowText(ctx, (boss ? 'BOSS · ' : 'LEVEL ' + level + ' · ') + def().name, W / 2, H / 2 + 40, 16, boss ? ACCENT : '#ffd0ea');
          ctx.restore();
        } else if (balls.length === 1 && balls[0].stuck && !over && clearT <= 0 && !(balls[0].hold > 0)) {
          ctx.save();
          ctx.globalAlpha = 0.6 + Math.sin(t * 5) * 0.4;
          U.glowText(ctx, 'TAP OR SPACE TO LAUNCH', W / 2, PY - 60, 13, '#ffd0ea');
          ctx.restore();
        }
      }
    };
  }

  function attract(ctx, w, h, t) {
    ctx.fillStyle = '#0d0418';
    ctx.fillRect(0, 0, w, h);
    var cols = 8, bw = w / cols, bh = h * 0.055;
    var map = ['..2222..', '.211112.', '21BGGB12', '.211112.', '..SSSS..'];
    map.forEach(function (row, r) {
      for (var c = 0; c < cols; c++) {
        var ch = row[c];
        if (ch === '.' || (r * 3 + c * 5 + Math.floor(t * 0.7)) % 11 === 0) continue;
        var col = ch === 'S' ? '#9aa3c7' : ch === 'B' ? '#ff9f1c' : ch === 'G' ? '#ffd23f' : HP_COLORS[+ch];
        drawCell(ctx, c * bw + 2, h * 0.1 + r * (bh + 3), bw - 4, bh, col, 0.9, ch === 'S' || ch === 'B' || ch === 'G' ? ch : 'N', t);
      }
    });
    var bx = w / 2 + Math.sin(t * 1.9) * w * 0.4;
    var by = h * 0.55 + Math.abs(Math.sin(t * 2.6)) * -h * 0.25 + h * 0.2;
    var px = w / 2 + Math.sin(t * 1.9) * w * 0.35;
    ctx.save();
    ctx.shadowColor = ACCENT; ctx.shadowBlur = 12; ctx.fillStyle = ACCENT;
    U.roundRect(ctx, px - w * 0.1, h * 0.88, w * 0.2, h * 0.035, 4); ctx.fill();
    ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx, by, h * 0.025, 0, 7); ctx.fill();
    ctx.restore();
  }

  XA.registerGame({
    id: 'xa_brick_breaker',
    order: 6,
    title: 'Brick Breaker',
    tagline: '20 walls, 4 bosses. Play a combo.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'hint',
    touchHint: 'DRAG TO MOVE · TAP TO LAUNCH OR FIRE',
    controls: 'Mouse or ←→ to move · Space to launch / fire lasers',
    create: create,
    attract: attract
  });
})(window);
</script>
<script>/* game-rock-drift.js */
/*
 * Xtrata Arcade cartridge #7 — ROCK DRIFT
 * Thrust, rotate, split rocks. Big rocks break into smaller, faster ones;
 * a saucer shows up from wave 2 and shoots back. Extra ship every 10,000.
 * Contract game-id: xa_rock_drift (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-rock-drift');
  var U = XA.util;

  var W = 560, H = 480;
  var ACCENT = '#7df9ff', ROCK = '#c9d4ff', UFO = '#ff4fd8';
  var SIZES = [{ r: 40, pts: 20, spd: 45 }, { r: 22, pts: 50, spd: 80 }, { r: 12, pts: 100, spd: 125 }];

  function wrap(o) {
    if (o.x < -50) o.x += W + 100; else if (o.x > W + 50) o.x -= W + 100;
    if (o.y < -50) o.y += H + 100; else if (o.y > H + 50) o.y -= H + 100;
  }
  function wrapTight(o, r) {
    if (o.x < -r) o.x += W + 2 * r; else if (o.x > W + r) o.x -= W + 2 * r;
    if (o.y < -r) o.y += H + 2 * r; else if (o.y > H + r) o.y -= H + 2 * r;
  }

  function create(api) {
    var rng = api.rng;
    var ship = null;
    var rocks = [], bullets = [], ufoShots = [];
    var ufo = null, ufoT = 12;
    var wave = 0, lives = 3, nextLife = 10000, score = 0;
    var fireCd = 0, respawnT = 0, waveT = 0;
    var over = false, overT = 0;
    var t = 0;
    var stars = [];
    for (var i = 0; i < 70; i++) stars.push({ x: rng() * W, y: rng() * H, s: rng() < 0.1 ? 2 : 1 });

    function newShip() {
      ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, inv: 2.5, thrust: false };
    }
    function makeRock(x, y, size, ang) {
      var s = SIZES[size];
      var a = ang == null ? rng() * Math.PI * 2 : ang;
      var sp = s.spd * (0.7 + rng() * 0.6) * (1 + wave * 0.05);
      var pts = [];
      var n = 9 + Math.floor(rng() * 4);
      for (var k = 0; k < n; k++) pts.push(0.72 + rng() * 0.36);
      return { x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: size, r: s.r, rot: rng() * 6, spin: (rng() - 0.5) * 1.6, pts: pts };
    }
    function startWave() {
      wave++;
      var n = Math.min(11, 3 + wave);
      for (var k = 0; k < n; k++) {
        // spawn on the edges, away from the ship
        var edge = rng() < 0.5;
        var x = edge ? (rng() < 0.5 ? -30 : W + 30) : rng() * W;
        var y = edge ? rng() * H : (rng() < 0.5 ? -30 : H + 30);
        rocks.push(makeRock(x, y, 0));
      }
      api.fx.text(W / 2, H / 2 - 60, 'WAVE ' + wave, ACCENT, 18);
      api.audio.arp([392, 523, 659], 0.07, { type: 'triangle', vol: 0.16 });
    }
    function add(pts, x, y) {
      score += pts;
      api.addScore(pts);
      if (score >= nextLife) {
        nextLife += 10000;
        lives = Math.min(6, lives + 1);
        api.fx.text(W / 2, 60, 'EXTRA SHIP', '#39ff88', 14);
        api.audio.arp([659, 784, 1047], 0.08, { type: 'square', vol: 0.18 });
      }
      if (x != null) api.fx.text(x, y, '+' + pts, '#fff', 10);
    }
    function breakRock(r, idx) {
      rocks.splice(idx, 1);
      add(SIZES[r.size].pts, r.x, r.y - r.r);
      api.fx.burst(r.x, r.y, ROCK, 10 + (2 - r.size) * 10, 120 + r.size * 40, 0.6);
      api.shake(4 - r.size);
      api.audio.noise(0.18 + (2 - r.size) * 0.1, { vol: 0.22, cutoff: 700 + r.size * 800 });
      if (r.size < 2) {
        var base = Math.atan2(r.vy, r.vx);
        rocks.push(makeRock(r.x, r.y, r.size + 1, base + 0.6 + rng() * 0.4));
        rocks.push(makeRock(r.x, r.y, r.size + 1, base - 0.6 - rng() * 0.4));
      }
    }
    function killShip() {
      api.fx.burst(ship.x, ship.y, ACCENT, 40, 220, 1);
      api.fx.burst(ship.x, ship.y, '#ffffff', 16, 140, 0.8);
      api.shake(12);
      api.audio.noise(0.6, { vol: 0.35, cutoff: 600 });
      ship = null;
      lives--;
      if (lives <= 0) { over = true; return; }
      respawnT = 1.6;
    }
    function hits(a, b, r) {
      var dx = a.x - b.x, dy = a.y - b.y;
      return dx * dx + dy * dy < r * r;
    }

    newShip();
    startWave();

    return {
      update: function (dt) {
        t += dt;
        var inp = api.input;
        inp.takeSwipes();
        if (over) { overT += dt; if (overT > 1.2) api.gameOver(); updateWorld(dt); return; }

        if (!ship) {
          respawnT -= dt;
          // Respawn only when the centre is clear.
          if (respawnT <= 0 && !rocks.some(function (r) { return hits(r, { x: W / 2, y: H / 2 }, r.r + 70); })) newShip();
        } else {
          if (inp.held('left')) ship.a -= 4.4 * dt;
          if (inp.held('right')) ship.a += 4.4 * dt;
          ship.thrust = inp.held('up');
          if (ship.thrust) {
            ship.vx += Math.cos(ship.a) * 330 * dt;
            ship.vy += Math.sin(ship.a) * 330 * dt;
            if (Math.random() < 0.7) api.fx.trail(ship.x - Math.cos(ship.a) * 12, ship.y - Math.sin(ship.a) * 12, '#ffb35c',
              -Math.cos(ship.a) * 120 + (Math.random() - 0.5) * 40, -Math.sin(ship.a) * 120 + (Math.random() - 0.5) * 40);
          }
          var sp = Math.hypot(ship.vx, ship.vy);
          if (sp > 340) { ship.vx *= 340 / sp; ship.vy *= 340 / sp; }
          ship.vx *= Math.pow(0.55, dt); ship.vy *= Math.pow(0.55, dt);
          ship.x += ship.vx * dt; ship.y += ship.vy * dt;
          wrapTight(ship, 12);
          if (ship.inv > 0) ship.inv -= dt;
          fireCd -= dt;
          var firing = inp.held('a') || inp.held('c') || inp.held('hold');
          if (firing && fireCd <= 0 && bullets.length < 6) {
            fireCd = 0.17;
            bullets.push({ x: ship.x + Math.cos(ship.a) * 14, y: ship.y + Math.sin(ship.a) * 14,
              vx: ship.vx + Math.cos(ship.a) * 520, vy: ship.vy + Math.sin(ship.a) * 520, life: 0.85 });
            api.audio.tone(880, 0.05, { type: 'square', vol: 0.08, slide: 0.5 });
          }
        }
        updateWorld(dt);

        if (!rocks.length && !ufo) {
          waveT += dt;
          if (waveT > 1.4) { waveT = 0; startWave(); }
        }
        api.setStatus('WAVE ' + wave + '  ·  SHIPS ' + lives + '  ·  ROCKS ' + rocks.length);
      },

      render: function (ctx) {
        ctx.fillStyle = '#03040c';
        ctx.fillRect(0, 0, W, H);
        stars.forEach(function (s) {
          ctx.fillStyle = 'rgba(200,220,255,' + (0.3 + (s.s - 1) * 0.4) + ')';
          ctx.fillRect(s.x, s.y, s.s, s.s);
        });
        // lives
        for (var l = 0; l < lives; l++) drawShip(ctx, 18 + l * 18, 18, -Math.PI / 2, 0.6, false);

        ctx.save();
        ctx.strokeStyle = ROCK; ctx.lineWidth = 2; ctx.shadowColor = ROCK; ctx.shadowBlur = 8;
        rocks.forEach(function (r) {
          ctx.beginPath();
          for (var k = 0; k < r.pts.length; k++) {
            var a = r.rot + k / r.pts.length * Math.PI * 2;
            var px = r.x + Math.cos(a) * r.r * r.pts[k], py = r.y + Math.sin(a) * r.r * r.pts[k];
            if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
          }
          ctx.closePath();
          ctx.fillStyle = 'rgba(201,212,255,0.06)';
          ctx.fill();
          ctx.stroke();
        });
        ctx.restore();

        ctx.save();
        ctx.fillStyle = '#fff'; ctx.shadowColor = ACCENT; ctx.shadowBlur = 10;
        bullets.forEach(function (b) { ctx.fillRect(b.x - 1.5, b.y - 1.5, 3, 3); });
        ctx.fillStyle = UFO; ctx.shadowColor = UFO;
        ufoShots.forEach(function (b) { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 7); ctx.fill(); });
        ctx.restore();

        if (ufo) {
          ctx.save();
          ctx.translate(ufo.x, ufo.y);
          ctx.strokeStyle = UFO; ctx.shadowColor = UFO; ctx.shadowBlur = 14; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.ellipse(0, 0, 20, 7, 0, 0, 7); ctx.stroke();
          ctx.beginPath(); ctx.ellipse(0, -6, 9, 7, 0, Math.PI, 0); ctx.stroke();
          ctx.restore();
        }
        if (ship && !(ship.inv > 0 && Math.floor(t * 12) % 2)) drawShip(ctx, ship.x, ship.y, ship.a, 1, ship.thrust);
      }
    };

    function drawShip(ctx, x, y, a, k, thrust) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(a); ctx.scale(k, k);
      ctx.strokeStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 12; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-10, -9); ctx.lineTo(-6, 0); ctx.lineTo(-10, 9); ctx.closePath();
      ctx.fillStyle = 'rgba(125,249,255,0.12)'; ctx.fill(); ctx.stroke();
      if (thrust && Math.floor(t * 30) % 2) {
        ctx.strokeStyle = '#ffb35c'; ctx.shadowColor = '#ffb35c';
        ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(-17, 0); ctx.lineTo(-7, 4); ctx.stroke();
      }
      ctx.restore();
    }

    function updateWorld(dt) {
      var i, j;
      rocks.forEach(function (r) { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.spin * dt; wrap(r); });
      for (i = bullets.length - 1; i >= 0; i--) {
        var b = bullets[i];
        b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
        wrapTight(b, 2);
        if (b.life <= 0) { bullets.splice(i, 1); continue; }
        for (j = rocks.length - 1; j >= 0; j--) {
          if (hits(b, rocks[j], rocks[j].r)) { bullets.splice(i, 1); breakRock(rocks[j], j); break; }
        }
        if (bullets[i] === b && ufo && hits(b, ufo, 18)) {
          bullets.splice(i, 1);
          add(500, ufo.x, ufo.y - 16);
          api.fx.burst(ufo.x, ufo.y, UFO, 30, 200, 0.8);
          api.audio.arp([1047, 784, 523], 0.05, { type: 'square', vol: 0.18 });
          ufo = null;
        }
      }
      // saucer
      if (wave >= 2 && !over) {
        if (!ufo) {
          ufoT -= dt;
          if (ufoT <= 0) {
            var fromLeft = rng() < 0.5;
            ufo = { x: fromLeft ? -20 : W + 20, y: 60 + rng() * (H - 120), vx: fromLeft ? 90 : -90, shoot: 1.2, t: 0 };
          }
        } else {
          ufo.t += dt;
          ufo.x += ufo.vx * dt;
          ufo.y += Math.sin(ufo.t * 2) * 40 * dt;
          ufo.shoot -= dt;
          if (Math.floor(ufo.t * 8) % 4 === 0) api.audio.tone(ufo.t % 0.5 < 0.25 ? 520 : 440, 0.03, { type: 'sine', vol: 0.04 });
          if (ufo.shoot <= 0 && ship) {
            ufo.shoot = Math.max(0.8, 1.6 - wave * 0.1);
            var aim = Math.atan2(ship.y - ufo.y, ship.x - ufo.x) + (rng() - 0.5) * 0.5;
            ufoShots.push({ x: ufo.x, y: ufo.y, vx: Math.cos(aim) * 230, vy: Math.sin(aim) * 230, life: 2 });
          }
          if (ufo.x < -40 || ufo.x > W + 40) { ufo = null; }
          if (!ufo) ufoT = 14 + rng() * 10;
        }
      }
      for (i = ufoShots.length - 1; i >= 0; i--) {
        var s = ufoShots[i];
        s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
        if (s.life <= 0) { ufoShots.splice(i, 1); continue; }
        if (ship && ship.inv <= 0 && hits(s, ship, 10)) { ufoShots.splice(i, 1); killShip(); }
      }
      if (ship && ship.inv <= 0) {
        for (j = 0; j < rocks.length; j++) {
          if (hits(ship, rocks[j], rocks[j].r * 0.85 + 8)) { breakRock(rocks[j], j); killShip(); break; }
        }
        if (ship && ufo && hits(ship, ufo, 24)) { ufo = null; ufoT = 12; killShip(); }
      }
    }
  }

  function attract(ctx, w, h, t) {
    ctx.fillStyle = '#03040c';
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    ctx.strokeStyle = ROCK; ctx.shadowColor = ROCK; ctx.shadowBlur = 6; ctx.lineWidth = 1.5;
    [[0.2, 0.3, 0.12, 0.3], [0.75, 0.25, 0.09, -0.5], [0.65, 0.75, 0.14, 0.2], [0.3, 0.8, 0.06, 0.8]].forEach(function (r, i) {
      var x = ((r[0] * w + t * 14 * (i % 2 ? -1 : 1)) % w + w) % w, y = r[1] * h, rad = r[2] * h;
      ctx.beginPath();
      for (var k = 0; k < 10; k++) {
        var a = t * r[3] + k / 10 * Math.PI * 2, m = 0.75 + ((k * 7 + i * 3) % 5) / 12;
        ctx.lineTo(x + Math.cos(a) * rad * m, y + Math.sin(a) * rad * m);
      }
      ctx.closePath(); ctx.stroke();
    });
    ctx.restore();
    ctx.save();
    ctx.translate(w / 2, h / 2); ctx.rotate(t * 0.8);
    ctx.strokeStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 10; ctx.lineWidth = 2;
    var k2 = h / 300;
    ctx.beginPath(); ctx.moveTo(14 * k2, 0); ctx.lineTo(-10 * k2, -9 * k2); ctx.lineTo(-6 * k2, 0); ctx.lineTo(-10 * k2, 9 * k2); ctx.closePath(); ctx.stroke();
    ctx.fillStyle = '#fff';
    for (var b = 1; b < 4; b++) ctx.fillRect((20 + ((t * 200 + b * 40) % 140)) * k2, -1, 3, 3);
    ctx.restore();
  }

  XA.registerGame({
    id: 'xa_rock_drift',
    order: 7,
    title: 'Rock Drift',
    tagline: 'Thrust, turn, split the rocks.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'ship',
    controls: '←→ turn · ↑ thrust · Space fire (hold to auto-fire)',
    create: create,
    attract: attract
  });
})(window);
</script>
<script>/* game-stack-tower.js */
/*
 * Xtrata Arcade cartridge #8 — STACK TOWER
 * A slab slides back and forth over the tower; tap to drop it. Whatever
 * overhangs is sliced off. Land it perfectly to keep its full width, and
 * chain perfects to grow the slab back. Miss completely and it's over.
 * Contract game-id: xa_stack_tower (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-stack-tower');
  var U = XA.util;

  var W = 400, H = 600;
  var SLAB_H = 26, DEPTH = 14, BASE_W = 200, BASE_Y = 470, PERFECT = 5;
  var ACCENT = '#ffd23f';

  function hue(n) { return (200 + n * 9) % 360; }
  function col(n, l) { return 'hsl(' + hue(n) + ',85%,' + l + '%)'; }

  function slab(ctx, x, y, w, n, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    // top face (slanted back)
    ctx.fillStyle = col(n, 72);
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + DEPTH, y - DEPTH); ctx.lineTo(x + w + DEPTH, y - DEPTH); ctx.lineTo(x + w, y);
    ctx.closePath(); ctx.fill();
    // side face
    ctx.fillStyle = col(n, 38);
    ctx.beginPath();
    ctx.moveTo(x + w, y); ctx.lineTo(x + w + DEPTH, y - DEPTH); ctx.lineTo(x + w + DEPTH, y - DEPTH + SLAB_H); ctx.lineTo(x + w, y + SLAB_H);
    ctx.closePath(); ctx.fill();
    // front face
    ctx.shadowColor = col(n, 60); ctx.shadowBlur = 10;
    ctx.fillStyle = col(n, 55);
    ctx.fillRect(x, y, w, SLAB_H);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(x, y, w, 3);
    ctx.restore();
  }

  function create(api) {
    var tower = [{ x: (W - BASE_W) / 2 - DEPTH / 2, w: BASE_W }];   // index 0 = base
    var cur = null;
    var debris = [];
    var cam = 0, camTarget = 0;
    var perfectRun = 0;
    var over = false, overT = 0, fallT = 0;
    var t = 0;

    function yOf(i) { return BASE_Y - i * SLAB_H; }
    function spawn() {
      var n = tower.length;
      var top = tower[n - 1];
      var speed = Math.min(430, 150 + n * 7);
      var fromLeft = n % 2 === 0;
      // Enter from just off the edge so the slab is on screen almost at once.
      cur = { x: fromLeft ? -top.w * 0.35 : W - top.w * 0.65, w: top.w, dir: fromLeft ? 1 : -1, speed: speed };
    }
    spawn();

    function drop() {
      var n = tower.length;
      var top = tower[n - 1];
      var y = yOf(n);
      var left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w);
      var overlap = right - left;
      if (overlap <= 0) {
        // clean miss: the whole slab falls
        debris.push({ x: cur.x, y: y, w: cur.w, n: n, vy: 0, vx: cur.dir * 60, rot: 0, vr: cur.dir * 1.2 });
        cur = null;
        over = true;
        api.shake(10);
        api.audio.tone(220, 0.5, { type: 'sawtooth', slide: 0.3, vol: 0.28 });
        return;
      }
      var off = cur.x - top.x;
      if (Math.abs(off) <= PERFECT) {
        perfectRun++;
        var w = top.w;
        if (perfectRun >= 3) w = Math.min(BASE_W, w + 8);
        var x = top.x - (w - top.w) / 2;
        tower.push({ x: x, w: w });
        var bonus = 10 * Math.min(perfectRun, 10);
        api.addScore(10 + bonus);
        api.fx.text(x + w / 2, y - 26 + cam, perfectRun > 1 ? 'PERFECT x' + perfectRun : 'PERFECT', '#ffffff', 13);
        api.fx.burst(x + w / 2, y + cam, col(n, 70), 20, 180, 0.5);
        api.audio.tone(440 * Math.pow(1.0595, Math.min(perfectRun, 24) * 2), 0.14, { type: 'triangle', vol: 0.2 });
      } else {
        perfectRun = 0;
        tower.push({ x: left, w: overlap });
        // sliced-off piece
        var cutX = off > 0 ? right : cur.x;
        var cutW = cur.w - overlap;
        debris.push({ x: cutX, y: y, w: cutW, n: n, vy: 0, vx: (off > 0 ? 1 : -1) * 40, rot: 0, vr: (off > 0 ? 1 : -1) * 1.5 });
        api.addScore(10);
        api.audio.tone(300 + Math.min(n, 40) * 6, 0.07, { type: 'square', vol: 0.12 });
        api.shake(2);
      }
      camTarget = Math.max(0, (tower.length - 9) * SLAB_H);
      spawn();
    }

    return {
      // Read-only test hook: lets automated tests time a drop.
      debug: function () { return { cur: cur && { x: cur.x, w: cur.w }, top: tower[tower.length - 1], floors: tower.length - 1, perfectRun: perfectRun }; },
      update: function (dt) {
        t += dt;
        var inp = api.input;
        inp.takeSwipes();
        cam += (camTarget - cam) * Math.min(1, dt * 6);
        debris.forEach(function (d) { d.vy += 1300 * dt; d.y += d.vy * dt; d.x += d.vx * dt; d.rot += d.vr * dt; });
        debris = debris.filter(function (d) { return d.y + cam < H + 200; });
        if (over) {
          overT += dt;
          // Pan down the whole tower before ending.
          camTarget = 0;
          fallT += dt;
          if (overT > 1.8) api.gameOver();
          return;
        }
        cur.x += cur.dir * cur.speed * dt;
        if (cur.dir > 0 && cur.x + cur.w > W + 20) cur.dir = -1;
        if (cur.dir < 0 && cur.x < -20) cur.dir = 1;
        if (inp.hit('a') || inp.hit('hold') || inp.hit('up') || inp.hit('down')) drop();
        api.setStatus('FLOOR ' + (tower.length - 1) + (perfectRun > 1 ? '  ·  PERFECT x' + perfectRun : ''));
      },

      render: function (ctx) {
        var floors = tower.length;
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, 'hsl(' + hue(floors) + ',45%,10%)');
        g.addColorStop(1, 'hsl(' + ((hue(floors) + 40) % 360) + ',55%,4%)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // height markers every 10 floors
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.07)';
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.font = '700 10px ui-monospace, Menlo, Consolas, monospace';
        for (var f = 10; f < floors + 20; f += 10) {
          var my = yOf(f) + cam;
          if (my < -10 || my > H) continue;
          ctx.beginPath(); ctx.moveTo(0, my + 0.5); ctx.lineTo(W, my + 0.5); ctx.stroke();
          ctx.fillText(f + 'F', 8, my - 4);
        }
        ctx.restore();

        ctx.save();
        ctx.translate(0, cam);
        // ground plinth
        ctx.fillStyle = '#0a0b18';
        ctx.fillRect(0, BASE_Y + SLAB_H, W, 400);
        for (var i = 0; i < tower.length; i++) {
          var y = yOf(i);
          if (y + cam > H + 40 || y + cam < -60) continue;
          slab(ctx, tower[i].x, y, tower[i].w, i);
        }
        if (cur) slab(ctx, cur.x, yOf(tower.length), cur.w, tower.length);
        debris.forEach(function (d) {
          ctx.save();
          ctx.translate(d.x + d.w / 2, d.y + SLAB_H / 2);
          ctx.rotate(d.rot);
          slab(ctx, -d.w / 2, -SLAB_H / 2, d.w, d.n, 0.9);
          ctx.restore();
        });
        ctx.restore();

        U.glowText(ctx, String(floors - 1), W / 2, 56, 34, ACCENT);
        if (floors === 1 && !over) {
          ctx.save();

<script>/* game-road-hopper.js */
/*

 */

  var ACCENT = '#39ff88';
  var CAR_COLORS = ['#ff4d6d', '#3ff0ff', '#ffd23f', '#b04dff', '#ff9f1c', '#4d7bff'];

  function create(api) {
    var rng = api.rng;
    var rows = [];

    var player = { row: 0, x: C * 4.5, face: 'up', hop: 0, fromRow: 0, fromX: C * 4.5 };
    var queued = null;

      var track = W + 4 * C;

      update: function (dt) {

          ctx.fillStyle = CAR_COLORS[(c + i) % CAR_COLORS.length];

        }

          ctx.fillStyle = '#6b4424'; U.roundRect(ctx, lx, y + rh * 0.18, rh * 2.6, rh * 0.64, 5); ctx.fill();
        }

    var k = (t * 1.5) % 1;
    var py = h - (hopRow + 0.5) * rh - Math.sin(Math.min(1, k * 4) * Math.PI) * rh * 0.3;
    ctx.save();

    controls: 'Arrows / WASD to hop · swipe or tap on mobile',
    create: create,
    attract: attract
  });
})(window);

<script>/* game-tile-tap.js */
/*
 * Xtrata Arcade cartridge #10 — TILE TAP
 * Four lanes of falling tiles. Tap the lowest tile before it leaves the
 * screen; every tile plays the next note of the tune. Tap the wrong lane or
 * let one slip past and the song ends. It speeds up as you go.
 * Contract game-id: xa_tile_tap (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-tile-tap');
  var U = XA.util;

  var W = 400, H = 600, LANES = 4, LW = W / LANES, TH = 138, PERFECT_ZONE = 170;
  var ACCENT = '#3ff0ff', HOT = '#ff3fa4';
  var LANE_KEYS = [['left', 'k1'], ['down', 'k2'], ['up', 'k3'], ['right', 'k4']];
  var LANE_LABELS = ['←', '↓', '↑', '→'];

  // An original looping tune: i–VI–III–VII in A minor as rolling arpeggios.
  var CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
  var SHAPE = [0, 1, 2, 3, 2, 1, 0, 2];
  function noteAt(i) {
    var chord = CHORDS[Math.floor(i / 8) % CHORDS.length];
    var k = SHAPE[i % 8];
    var midi = k === 3 ? chord[0] + 12 : chord[k];
    if (Math.floor(i / 32) % 2 === 1 && i % 2 === 1) midi += 12; // second pass climbs
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  function create(api) {
    var rng = api.rng;
    var tiles = [];          // { lane, y, hit, fade }
    var nextIndex = 0;       // index into tiles of the lowest untapped tile
    var count = 0, perfectStreak = 0;
    var speed = 0, started = false;
    var over = false, overT = 0, badLane = -1, flash = 0;
    var t = 0;
    var lastLane = -1;

    function laneFor() {
      var l;
      do { l = Math.floor(rng() * LANES); } while (l === lastLane && rng() < 0.6);
      lastLane = l;
      return l;
    }
    // Fill the screen upwards; the first tile sits on the start line.
    function topY() { return tiles.length ? tiles[tiles.length - 1].y : H - TH - 20 + TH; }
    function fill() {
      while (topY() > -TH * 2) tiles.push({ lane: laneFor(), y: topY() - TH, hit: false, fade: 0 });
    }
    fill();

    function end(lane) {
      over = true;
      badLane = lane;
      api.shake(9);
      api.audio.tone(110, 0.5, { type: 'sawtooth', vol: 0.28, slide: 0.5 });
      api.audio.tone(116, 0.5, { type: 'sawtooth', vol: 0.2, slide: 0.5 });
    }
    function tap(lane) {

      var next = tiles[nextIndex];

<script>/* game-merge-2048.js */
/*
 * Xtrata Arcade cartridge #11 — MERGE 2048

 * Contract game-id: xa_merge_2048 (score mode, higher is better)

(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-merge-2048');
  var U = XA.util;

  var W = 440, H = 520, N = 4, PAD = 12, BOARD = 416, BX = (W - BOARD) / 2, BY = 88;
  var CELL = (BOARD - PAD * (N + 1)) / N;
  var SLIDE = 0.1;
  var ACCENT = '#ffae3f';
  var COLORS = {
    2: '#2b3a7a', 4: '#34479a', 8: '#b04dff', 16: '#d43fd8', 32: '#ff3fa4', 64: '#ff4d6d',
    128: '#ff9f1c', 256: '#ffd23f', 512: '#39ff88', 1024: '#3ff0ff', 2048: '#ffffff'
  };

  function create(api) {
    var rng = api.rng;
    var grid = [];           // grid[r][c] = tile | null
    var tiles = [];          // all live tiles (for drawing and animation)
    var nextId = 1;
    var anim = 0;            // >0 while tiles slide
    var best = 2, reached2048 = false;
    var moves = 0;
    var over = false, overT = 0;
    var t = 0;
    for (var r = 0; r < N; r++) grid.push([null, null, null, null]);

    function cellX(c) { return BX + PAD + c * (CELL + PAD); }
    function cellY(r) { return BY + PAD + r * (CELL + PAD); }

      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!grid[r][c]) empty.push([r, c]);
      if (!empty.length) return;
      var e = empty[Math.floor(rng() * empty.length)];

    function canMove() {

        var tl = grid[r][c];

        if (c < N - 1 && grid[r][c + 1] && grid[r][c + 1].v === tl.v) return true;
        if (r < N - 1 && grid[r + 1][c] && grid[r + 1][c].v === tl.v) return true;

              other.v *= 2;
              other.merged = true;
              other.pop = 0.18;
              dead.push(tl);
              gained += other.v;

              return;

            grid[nr][nc] = tl;
            tl.r = nr; tl.c = nc;
            moved = true;
          }
        });
      });
      if (!moved) { api.audio.tone(140, 0.04, { type: 'square', vol: 0.05 }); return; }
      moves++;
      anim = SLIDE;
      dead.forEach(function (d) { d.dying = true; });
      api.audio.tone(merges ? 330 + Math.log2(best) * 30 : 220, 0.06, { type: 'triangle', vol: merges ? 0.16 : 0.08 });
      if (gained) {
        api.addScore(gained);
        if (merges > 1) api.fx.text(W - 80, 44, merges + ' MERGES +' + gained, ACCENT, 11);
      }
      if (best >= 2048 && !reached2048) {
        reached2048 = true;
        api.fx.text(W / 2, BY + BOARD / 2, '2048!', '#ffffff', 28);
        api.fx.burst(W / 2, BY + BOARD / 2, '#ffd23f', 80, 300, 1.2);
        api.shake(10);
        api.audio.arp([523, 659, 784, 1047, 1319, 1568], 0.08, { type: 'square', vol: 0.2 });

    }

    function afterSlide() {
      tiles = tiles.filter(function (tl) {
        if (tl.dying) {
          api.fx.burst(cellX(tl.c) + CELL / 2, cellY(tl.r) + CELL / 2, COLORS[Math.min(tl.v * 2, 2048)] || '#fff', 8, 110, 0.35);
          return false;
        }
        return true;
      });
      tiles.forEach(function (tl) { tl.fr = tl.r; tl.fc = tl.c; });

        api.shake(6);

      }
    }

    return {
      update: function (dt) {
        t += dt;
        var inp = api.input;
        var dirs = [];
        ['up', 'down', 'left', 'right'].forEach(function (d) { if (inp.hit(d)) dirs.push(d); });
        inp.takeSwipes().forEach(function (s) { if (s !== 'tap') dirs.push(s); });

        tiles.forEach(function (tl) {
          if (tl.born > 0) tl.born = Math.max(0, tl.born - dt);
          if (tl.pop > 0 && anim === 0) tl.pop = Math.max(0, tl.pop - dt);
        });
        api.setStatus('BEST TILE ' + best + '  ·  MOVES ' + moves);
      },

      render: function (ctx) {
        ctx.fillStyle = '#07071a';
        ctx.fillRect(0, 0, W, H);
        U.glowText(ctx, String(best), W / 2, 44, 30, COLORS[Math.min(best, 2048)] || '#fff');
        ctx.fillStyle = 'rgba(200,210,255,0.45)';
        ctx.font = '700 10px ui-monospace, Menlo, Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('BEST TILE', W / 2, 72);

        ctx.save();
        ctx.fillStyle = '#10122e';
        ctx.shadowColor = ACCENT; ctx.shadowBlur = 16;
        U.roundRect(ctx, BX, BY, BOARD, BOARD, 14); ctx.fill();
        ctx.restore();
        for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
          ctx.fillStyle = 'rgba(255,255,255,0.04)';
          U.roundRect(ctx, cellX(c), cellY(r), CELL, CELL, 10); ctx.fill();

        var ease = 1 - Math.pow(1 - k, 3);

          var x = cellX(tl.fc) + (cellX(tl.c) - cellX(tl.fc)) * ease;
          var y = cellY(tl.fr) + (cellY(tl.r) - cellY(tl.fr)) * ease;
          var s = 1;
          if (tl.born > 0) s = 1 - tl.born / 0.12;
          if (tl.pop > 0 && anim === 0) s = 1 + Math.sin((tl.pop / 0.18) * Math.PI) * 0.12;
          var v = tl.dying ? tl.v : tl.v;
          var col = COLORS[Math.min(v, 2048)] || '#ffffff';

          ctx.scale(s, s);
          ctx.fillStyle = col;
          ctx.shadowColor = col; ctx.shadowBlur = v >= 128 ? 22 : 8;

          ctx.shadowBlur = 0;
          ctx.fillStyle = v >= 256 && v !== 512 ? '#1a1030' : '#ffffff';

          ctx.font = '900 ' + size + 'px ui-monospace, Menlo, Consolas, monospace';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(String(v), 0, 2);
          ctx.restore();
        });
        if (moves === 0 && !over) {
          ctx.save();
          ctx.globalAlpha = 0.6 + Math.sin(t * 5) * 0.4;
          U.glowText(ctx, 'SWIPE OR USE THE ARROWS', W / 2, H - 6, 11, '#ffe2bd');
          ctx.restore();
        }

<script>/* game-block-defence.js */
/*
 * Xtrata Arcade cartridge #12 — BLOCK DEFENCE
 * Missiles rain down on six block towers. Aim and fire interceptors from
 * three silos; each blast hangs in the air and takes out anything that
 * flies into it. Later waves bring faster warheads that split. Survive
 * the wave for bonus points on saved towers and unused ammo.
 * Contract game-id: xa_block_defence (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-block-defence');
  var U = XA.util;

  var W = 480, H = 560, GROUND = 520;
  var ACCENT = '#39ff88', ENEMY = '#ff4d6d', BLAST = '#ffd23f';
  var SILO_X = [40, 240, 440];

  var AMMO = 10;

  function create(api) {
    var rng = api.rng;
    var cities = CITY_X.map(function (x, i) { return { x: x, alive: true, h: 3 + (i * 7) % 3 }; });
    var silos = SILO_X.map(function (x) { return { x: x, ammo: AMMO, alive: true }; });
    var interceptors = [], blasts = [], enemies = [];
    var wave = 0, toSpawn = 0, spawnT = 0, between = 0;
    var aim = { x: W / 2, y: 260 };
    var lastMoved = api.pointer().moved;
    var score = 0, nextCity = 10000;
    var over = false, overT = 0;
    var t = 0;

    function startWave() {
      wave++;
      toSpawn = 8 + wave * 3;
      spawnT = 0.6;
      silos.forEach(function (s) { s.ammo = AMMO; s.alive = true; });
      api.fx.text(W / 2, 200, 'WAVE ' + wave, ACCENT, 18);
      api.audio.arp([392, 494, 587], 0.08, { type: 'triangle', vol: 0.16 });
    }
    function speed() { return 34 + wave * 7; }
    function targets() {
      var list = [];
      cities.forEach(function (c) { if (c.alive) list.push(c.x); });
      silos.forEach(function (s) { if (s.alive) list.push(s.x); });
      return list.length ? list : [W / 2];

    function spawnEnemy(x, y, tx) {
      var sp = speed() * (0.85 + rng() * 0.3);
      var dx = tx - x, dy = GROUND - y, d = Math.hypot(dx, dy);
      enemies.push({ sx: x, sy: y, x: x, y: y, vx: dx / d * sp, vy: dy / d * sp,

      api.audio.tone(700, 0.08, { type: 'square', vol: 0.1, slide: 1.8 });
      return true;
    }
    function fireNearest(tx, ty) {
      var order = [0, 1, 2].sort(function (a, b) { return Math.abs(SILO_X[a] - tx) - Math.abs(SILO_X[b] - tx); });
      for (var i = 0; i < order.length; i++) if (fire(order[i], tx, ty)) return;
      api.audio.tone(120, 0.05, { type: 'square', vol: 0.06 });
    }
    function addPts(n, x, y) {
      score += n;
      api.addScore(n);
      if (x != null) api.fx.text(x, y, '+' + n, '#fff', 10);
      if (score >= nextCity) {
        nextCity += 10000;
        var dead = cities.filter(function (c) { return !c.alive; });
        if (dead.length) { dead[0].alive = true; api.fx.text(dead[0].x, GROUND - 40, 'REBUILT', ACCENT, 11); }
      }
    }
    function hitGround(e) {
      var hitSomething = false;
      cities.forEach(function (c) {
        if (c.alive && Math.abs(c.x - e.x) < 20) {
          c.alive = false; hitSomething = true;
          api.fx.burst(c.x, GROUND - 14, ACCENT, 30, 180, 0.9);
        }
      });
      silos.forEach(function (s) {
        if (s.alive && Math.abs(s.x - e.x) < 20) { s.alive = false; s.ammo = 0; hitSomething = true; api.fx.burst(s.x, GROUND - 10, '#9aa3c7', 24, 160, 0.8); }
      });
      blasts.push({ x: e.x, y: GROUND - 4, r: 0, max: 26, t: 0, life: 0.7, enemy: true });
      api.shake(hitSomething ? 9 : 4);
      api.audio.noise(0.35, { vol: hitSomething ? 0.35 : 0.2, cutoff: 700 });
    }

    startWave();

    return {
      // Read-only test hook: the lowest incoming warhead.
      debug: function () {
        var low = null;
        enemies.forEach(function (e) { if (!low || e.y > low.y) low = e; });
        return { enemy: low && { x: low.x, y: low.y, vx: low.vx, vy: low.vy }, wave: wave };
      },
      update: function (dt) {
        t += dt;
        var inp = api.input;
        inp.takeSwipes();
        // aim: pointer when it moves, arrows otherwise
        var p = api.pointer();
        if (p.moved !== lastMoved) { lastMoved = p.moved; aim.x = p.x; aim.y = p.y; }
        if (inp.held('left')) aim.x -= 360 * dt;
        if (inp.held('right')) aim.x += 360 * dt;
        if (inp.held('up')) aim.y -= 360 * dt;
        if (inp.held('down')) aim.y += 360 * dt;
        aim.x = U.clamp(aim.x, 6, W - 6); aim.y = U.clamp(aim.y, 36, GROUND - 30);

        if (!over) {
          if (inp.hit('hold')) { aim.x = U.clamp(p.x, 6, W - 6); aim.y = U.clamp(p.y, 36, GROUND - 30); fireNearest(aim.x, aim.y); }
          if (inp.hit('a')) fireNearest(aim.x, aim.y);
          if (inp.hit('b')) fire(0, aim.x, aim.y);
          if (inp.hit('c')) fire(1, aim.x, aim.y);
          if (inp.hit('d')) fire(2, aim.x, aim.y);
        }

        // spawn
        if (!over && toSpawn > 0) {
          spawnT -= dt;
          if (spawnT <= 0) {
            var burst = 1 + (rng() < 0.3 ? 1 : 0) + (wave > 4 && rng() < 0.3 ? 1 : 0);
            for (var b = 0; b < burst && toSpawn > 0; b++, toSpawn--) {
              var tg = targets();
              spawnEnemy(20 + rng() * (W - 40), -6, tg[Math.floor(rng() * tg.length)] + (rng() - 0.5) * 10);
            }

        var i;
        // interceptors fly to their mark and burst
        for (i = interceptors.length - 1; i >= 0; i--) {
          var m = interceptors[i];
          m.left -= dt;
          if (m.left <= 0) {
            blasts.push({ x: m.tx, y: m.ty, r: 0, max: 38, t: 0, life: 1.1 });
            api.audio.noise(0.25, { vol: 0.18, cutoff: 2200 });
            interceptors.splice(i, 1);
          } else { m.x += m.vx * dt; m.y += m.vy * dt; }
        }
        // blasts grow then shrink
        for (i = blasts.length - 1; i >= 0; i--) {
          var bl = blasts[i];
          bl.t += dt;
          var k = bl.t / bl.life;
          bl.r = bl.max * Math.sin(Math.min(1, k) * Math.PI);
          if (k >= 1) blasts.splice(i, 1);
        }
        // enemies
        var chain = 0;
        for (i = enemies.length - 1; i >= 0; i--) {
          var e = enemies[i];
          e.x += e.vx * dt; e.y += e.vy * dt;
          if (e.split && e.y > e.split) {
            e.split = 0;
            var tg2 = targets();
            for (var s = 0; s < 2; s++) spawnEnemy(e.x, e.y, tg2[Math.floor(rng() * tg2.length)]);
            api.audio.tone(500, 0.06, { type: 'sawtooth', vol: 0.08 });
          }
          var killed = false;
          for (var j = 0; j < blasts.length; j++) {
            var bj = blasts[j];
            if (!bj.enemy && Math.hypot(e.x - bj.x, e.y - bj.y) < bj.r + 2) { killed = true; break; }
          }
          if (killed) {
            chain++;
            enemies.splice(i, 1);
            addPts(25 * wave * chain, e.x, e.y - 12);
            blasts.push({ x: e.x, y: e.y, r: 0, max: 22, t: 0, life: 0.6 });
            api.fx.burst(e.x, e.y, ENEMY, 10, 130, 0.5);

          }
          if (e.y >= GROUND - 4) { enemies.splice(i, 1); hitGround(e); }
        }

        if (!over && !cities.some(function (c) { return c.alive; })) {
          over = true;
          api.audio.tone(90, 1, { type: 'sawtooth', vol: 0.3, slide: 0.5 });
          api.shake(16);
        }
        if (over) { overT += dt; if (overT > 1.6) api.gameOver(); return; }

        // wave cleared
        if (toSpawn === 0 && !enemies.length && !interceptors.length) {
          between += dt;
          if (between > 0.8) {
            between = 0;
            var alive = cities.filter(function (c) { return c.alive; }).length;
            var ammo = silos.reduce(function (a, s) { return a + (s.alive ? s.ammo : 0); }, 0);
            var bonus = alive * 100 * Math.min(wave, 6) + ammo * 5 * Math.min(wave, 6);
            addPts(bonus);
            api.fx.text(W / 2, 250, 'WAVE ' + wave + ' CLEAR  +' + bonus, BLAST, 14);
            startWave();
          }
        }
        var ammoLeft = silos.map(function (s) { return s.alive ? s.ammo : 'X'; }).join(' / ');
        api.setStatus('WAVE ' + wave + '  ·  AMMO ' + ammoLeft + '  ·  TOWERS ' + cities.filter(function (c) { return c.alive; }).length);
      },

      render: function (ctx) {
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#02030c'); g.addColorStop(1, '#0a1428');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        // ground
        ctx.fillStyle = '#0c1f16';
        ctx.fillRect(0, GROUND, W, H - GROUND);
        ctx.save();
        ctx.strokeStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 8; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
        ctx.restore();
        // cities: stacks of blocks
        cities.forEach(function (c) {
          if (!c.alive) {
            ctx.fillStyle = '#2a1a1a';
            ctx.fillRect(c.x - 14, GROUND - 6, 28, 6);
            return;
          }
          for (var k = 0; k < c.h; k++) {
            ctx.save();
            ctx.fillStyle = k === c.h - 1 ? '#7dffb8' : ACCENT;
            ctx.shadowColor = ACCENT; ctx.shadowBlur = 8;
            var w = 26 - k * 4;
            ctx.fillRect(c.x - w / 2, GROUND - (k + 1) * 11, w, 10);
            ctx.restore();
          }
        });
        // silos
        silos.forEach(function (s, i) {
          ctx.save();
          ctx.fillStyle = s.alive ? '#3a4a8a' : '#2a2a3a';
          ctx.beginPath(); ctx.moveTo(s.x - 22, GROUND); ctx.lineTo(s.x - 10, GROUND - 16); ctx.lineTo(s.x + 10, GROUND - 16); ctx.lineTo(s.x + 22, GROUND); ctx.fill();
          if (s.alive) {
            ctx.fillStyle = '#cfe0ff';
            for (var a = 0; a < s.ammo; a++) ctx.fillRect(s.x - 18 + (a % 5) * 8, GROUND + 8 + Math.floor(a / 5) * 8, 5, 5);
          }
          ctx.fillStyle = 'rgba(200,210,255,0.4)';
          ctx.font = '700 9px ui-monospace, Menlo, Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.fillText(['Z', 'X', 'C'][i], s.x, GROUND - 20);
          ctx.restore();
        });
        // enemy trails
        ctx.save();
        ctx.lineWidth = 1.5;
        enemies.forEach(function (e) {
          var gr = ctx.createLinearGradient(e.sx, e.sy, e.x, e.y);
          gr.addColorStop(0, 'rgba(255,77,109,0)');
          gr.addColorStop(1, 'rgba(255,77,109,0.8)');
          ctx.strokeStyle = gr;
          ctx.beginPath(); ctx.moveTo(e.sx, e.sy); ctx.lineTo(e.x, e.y); ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.shadowColor = ENEMY; ctx.shadowBlur = 10;
          ctx.fillRect(e.x - 2, e.y - 2, 4, 4);
          ctx.shadowBlur = 0;
        });
        // interceptors
        interceptors.forEach(function (m) {
          ctx.strokeStyle = 'rgba(57,255,136,0.6)';
          ctx.beginPath(); ctx.moveTo(m.sx, m.sy); ctx.lineTo(m.x, m.y); ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.fillRect(m.x - 1.5, m.y - 1.5, 3, 3);
          ctx.strokeStyle = 'rgba(57,255,136,0.5)';
          ctx.beginPath(); ctx.moveTo(m.tx - 4, m.ty - 4); ctx.lineTo(m.tx + 4, m.ty + 4); ctx.moveTo(m.tx + 4, m.ty - 4); ctx.lineTo(m.tx - 4, m.ty + 4); ctx.stroke();
        });
        ctx.restore();
        // blasts
        blasts.forEach(function (b) {
          ctx.save();
          var col = b.enemy ? ENEMY : (Math.floor(t * 20) % 2 ? BLAST : '#ffffff');
          ctx.fillStyle = col; ctx.globalAlpha = 0.85;
          ctx.shadowColor = col; ctx.shadowBlur = 20;
          ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(0, b.r), 0, 7); ctx.fill();
          ctx.restore();
        });
        // crosshair
        if (!over) {
          ctx.save();
          ctx.strokeStyle = ACCENT; ctx.lineWidth = 1.5; ctx.shadowColor = ACCENT; ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(aim.x, aim.y, 9, 0, 7);
          ctx.moveTo(aim.x - 15, aim.y); ctx.lineTo(aim.x - 5, aim.y);
          ctx.moveTo(aim.x + 5, aim.y); ctx.lineTo(aim.x + 15, aim.y);
          ctx.moveTo(aim.x, aim.y - 15); ctx.lineTo(aim.x, aim.y - 5);
          ctx.moveTo(aim.x, aim.y + 5); ctx.lineTo(aim.x, aim.y + 15);
          ctx.stroke();
          ctx.restore();
        }
      }
    };
  }

  function attract(ctx, w, h, t) {
    ctx.fillStyle = '#040818';
    ctx.fillRect(0, 0, w, h);
    var gy = h * 0.9;
    ctx.fillStyle = '#0c1f16'; ctx.fillRect(0, gy, w, h - gy);
    for (var c = 0; c < 6; c++) {
      var cx = w * (0.15 + c * 0.14);
      ctx.fillStyle = ACCENT;
      ctx.fillRect(cx - w * 0.03, gy - h * 0.06, w * 0.06, h * 0.06);
      ctx.fillRect(cx - w * 0.02, gy - h * 0.1, w * 0.04, h * 0.04);
    }
    ctx.lineWidth = 1.5;
    for (var i = 0; i < 4; i++) {
      var k = ((t * 0.25 + i * 0.27) % 1);
      var sx = w * (0.1 + i * 0.25), tx = w * (0.8 - i * 0.2);
      var x = sx + (tx - sx) * k, y = gy * k;
      ctx.strokeStyle = 'rgba(255,77,109,0.8)';
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(x, y); ctx.stroke();
      if (k > 0.55 && k < 0.75 && i % 2 === 0) {
        ctx.fillStyle = BLAST; ctx.shadowColor = BLAST; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(x, y, h * 0.08 * Math.sin((k - 0.55) / 0.2 * Math.PI), 0, 7); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }

  XA.registerGame({
    id: 'xa_block_defence',
    order: 12,
    title: 'Block Defence',
    tagline: 'Shield the towers. Blast the warheads.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'hint',
    touchHint: 'TAP THE SKY TO FIRE AN INTERCEPTOR THERE',
    controls: 'Click to fire · or arrows to aim, Space / Z X C to fire',
    create: create,
    attract: attract
  });
})(window);
</script>
<script>/* game-maze-muncher.js */
/*
 * Xtrata Arcade cartridge #13 — MAZE MUNCHER
 * Clear every data pellet from the maze while four glitches hunt you.
 * Grab a power core and the glitches turn vulnerable for a few seconds;
 * eat them back to back for 200 / 400 / 800 / 1600. Three lives.
 * Contract game-id: xa_maze_muncher (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-maze-muncher');
  var U = XA.util;

  var MAP = [
    '###################',
    '#........#........#',
    '#o##.###.#.###.##o#',
    '#.................#',
    '#.##.#.#####.#.##.#',
    '#....#...#...#....#',
    '####.###.#.###.####',
    '   #.#.......#.#   ',
    '####.#.##-##.#.####',
    'T......#HHH#......T',
    '####.#.#####.#.####',
    '   #.#.......#.#   ',
    '####.#.#####.#.####',
    '#........#........#',
    '#.##.###.#.###.##.#',
    '#o.#.....P.....#.o#',
    '##.#.#.#####.#.#.##',
    '#....#...#...#....#',
    '#.######.#.######.#',
    '#.................#',
    '###################'
  ];
  var COLS = 19, ROWS = 21, T = 22, TOP = 30;
  var W = COLS * T, H = ROWS * T + TOP + 8;
  var ACCENT = '#ffd23f', WALL = '#4d7bff';
  var GLITCH = ['#ff4d6d', '#ff8fd8', '#3ff0ff', '#ff9f1c'];
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
  var ORDER = ['up', 'left', 'down', 'right'];
  var DOOR = { x: 9, y: 8 }, HOUSE = { x: 9, y: 9 }, EXIT = { x: 9, y: 7 };
  var CORNERS = [{ x: 17, y: -2 }, { x: 1, y: -2 }, { x: 18, y: 22 }, { x: 0, y: 22 }];

  function create(api) {
    var rng = api.rng;
    var pellets, left;
    var player, glitches;
    var level = 1, lives = 3;
    var modeT = 0, chase = false, frightT = 0, eatChain = 0;
    var dying = 0, readyT = 1.2, clearT = 0, over = false, overT = 0;
    var bonus = null, bonusShown = 0;
    var t = 0;

    function cell(x, y) {
      if (y < 0 || y >= ROWS) return '#';
      x = ((x % COLS) + COLS) % COLS;
      return MAP[y][x];
    }
    function openFor(x, y, g) {
      var c = cell(x, y);
      if (c === '#' || c === ' ') return false;
      if (c === '-' || c === 'H') return !!g && (g.state === 'leaving' || g.state === 'eyes' || g.state === 'house');
      return true;
    }
    function resetPellets() {
      pellets = {}; left = 0;
      for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
        var c = MAP[y][x];
        if (c === '.' || c === 'o') { pellets[x + ',' + y] = c === 'o' ? 2 : 1; left++; }
      }
    }
    function resetActors() {
      player = { x: 9, y: 15, dir: 'left', want: 'left', mouth: 0 };
      glitches = GLITCH.map(function (c, i) {
        return { i: i, x: i === 0 ? EXIT.x : 8 + (i % 3), y: i === 0 ? EXIT.y : HOUSE.y, dir: i === 0 ? 'left' : 'up',
          state: i === 0 ? 'normal' : 'house', release: [0, 2.5, 5, 8][i] * Math.max(0.4, 1 - (level - 1) * 0.12), color: c };
      });
      modeT = 0; chase = false; frightT = 0;
    }
    resetPellets();
    resetActors();

    function speedPlayer() { return Math.min(8.6, 6.4 + level * 0.25); }
    function speedGlitch(g) {
      if (g.state === 'eyes') return 14;
      if (g.state === 'fright') return 3.6;
      if (g.state === 'house' || g.state === 'leaving') return 3.5;
      var tunnel = g.y === 9 && (g.x < 4 || g.x > 14);
      return (tunnel ? 0.55 : 1) * Math.min(8.2, 5.8 + level * 0.3);
    }
    function atCenter(e) { return Math.abs(e.x - Math.round(e.x)) < 1e-6 && Math.abs(e.y - Math.round(e.y)) < 1e-6; }
    function canGo(e, d, g) { var v = DIRS[d]; return openFor(Math.round(e.x) + v[0], Math.round(e.y) + v[1], g); }

    // Advance an actor along the grid; `decide(e)` picks a direction at each centre.
    function advance(e, dist, decide, g) {
      for (var guard = 0; guard < 12 && dist > 1e-6; guard++) {
        if (atCenter(e)) {
          e.x = Math.round(e.x); e.y = Math.round(e.y);
          if (e.x < 0) e.x += COLS; else if (e.x >= COLS) e.x -= COLS;
          decide(e);
          if (!e.dir || !canGo(e, e.dir, g)) return;
