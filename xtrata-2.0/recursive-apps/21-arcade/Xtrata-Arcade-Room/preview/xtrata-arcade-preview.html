        var v = DIRS[e.dir], s = v[0] || v[1];
        var cur = v[0] ? e.x : e.y;
        var target = s > 0 ? Math.floor(cur + 1e-9) + 1 : Math.ceil(cur - 1e-9) - 1;
        var toNext = Math.abs(target - cur);
        var step = Math.min(dist, toNext);
        if (v[0]) e.x += s * step; else e.y += s * step;
        dist -= step;
        if (Math.abs(e.x - Math.round(e.x)) < 1e-6) e.x = Math.round(e.x);
        if (Math.abs(e.y - Math.round(e.y)) < 1e-6) e.y = Math.round(e.y);
        if (step < toNext) return;
      }
    }

    function glitchTarget(g) {
      var px = Math.round(player.x), py = Math.round(player.y), pv = DIRS[player.dir] || [0, 0];
      if (g.state === 'eyes') return DOOR;
      if (g.state === 'leaving') return EXIT;
      if (!chase) return CORNERS[g.i];
      if (g.i === 0) return { x: px, y: py };
      if (g.i === 1) return { x: px + pv[0] * 4, y: py + pv[1] * 4 };
      if (g.i === 2) { var a = glitches[0]; return { x: px + pv[0] * 2 + (px + pv[0] * 2 - a.x), y: py + pv[1] * 2 + (py + pv[1] * 2 - a.y) }; }
      var d = Math.hypot(g.x - px, g.y - py);
      return d > 7 ? { x: px, y: py } : CORNERS[3];
    }
    function decideGlitch(g) {
      var x = Math.round(g.x), y = Math.round(g.y);
      if (g.state === 'eyes' && x === DOOR.x && y === DOOR.y) { g.state = 'house'; g.dir = 'down'; g.release = 1.2; return; }
      if (g.state === 'house') {
        if (y > HOUSE.y - 1 && g.release > 0) { g.dir = null; return; }
        g.state = 'leaving';
      }
      if (g.state === 'leaving' && x === EXIT.x && y === EXIT.y) g.state = frightT > 0 && g.wasFright ? 'fright' : 'normal';
      var options = ORDER.filter(function (d) { return d !== OPP[g.dir] && canGo(g, d, g); });
      if (!options.length) options = ORDER.filter(function (d) { return canGo(g, d, g); });
      if (g.state === 'fright') { g.dir = options[Math.floor(rng() * options.length)]; return; }
      var tg = glitchTarget(g);
      var best = null, bestD = 1e9;
      options.forEach(function (d) {
        var v = DIRS[d], dd = Math.pow(x + v[0] - tg.x, 2) + Math.pow(y + v[1] - tg.y, 2);
        if (dd < bestD) { bestD = dd; best = d; }
      });
      g.dir = best;
    }
    function decidePlayer(p) {
      if (p.want && canGo(p, p.want)) p.dir = p.want;
      var key = Math.round(p.x) + ',' + Math.round(p.y);
      if (pellets[key]) eat(key);
    }
    function eat(key) {
      var kind = pellets[key];
      delete pellets[key];
      left--;
      var xy = key.split(',');
      if (kind === 2) {
        api.addScore(50);
        frightT = Math.max(2, 7 - (level - 1) * 0.8);
        eatChain = 0;
        glitches.forEach(function (g) {
          if (g.state === 'normal') { g.state = 'fright'; g.dir = OPP[g.dir] || g.dir; }
          g.wasFright = true;
        });
        api.audio.arp([392, 523, 392, 523], 0.05, { type: 'square', vol: 0.14 });
      } else {
        api.addScore(10);
        api.audio.tone(t % 0.3 < 0.15 ? 520 : 440, 0.03, { type: 'triangle', vol: 0.07 });
      }
      if (!bonus && bonusShown < 2 && (left === 120 || left === 50)) {
        bonus = { x: 9, y: 11, life: 9 }; bonusShown++;
      }
      if (left <= 0) {
        clearT = 2;
        api.fx.text(W / 2, TOP + T * 10, 'MAZE CLEAR', ACCENT, 18);
        api.audio.arp([523, 659, 784, 1047], 0.08, { type: 'square', vol: 0.2 });
      }
      void xy;
    }
    function px(x) { return x * T + T / 2; }
    function py(y) { return TOP + y * T + T / 2; }

    function loseLife() {
      dying = 1.4;
      api.shake(8);
      api.audio.tone(500, 0.9, { type: 'sawtooth', slide: 0.15, vol: 0.25 });
      api.fx.burst(px(player.x), py(player.y), ACCENT, 30, 180, 0.9);
    }

    return {
      update: function (dt) {
        t += dt;
        var inp = api.input;
        ['up', 'down', 'left', 'right'].forEach(function (d) { if (inp.hit(d) || inp.held(d)) player.want = d; });
        inp.takeSwipes().forEach(function (s) { if (DIRS[s]) player.want = s; });
        if (over) { overT += dt; if (overT > 1.2) api.gameOver(); return; }
        if (dying > 0) {
          dying -= dt;
          if (dying <= 0) {
            lives--;
            if (lives <= 0) { over = true; return; }
            resetActors(); readyT = 1.4;
          }
          return;
        }
        if (clearT > 0) {
          clearT -= dt;
          if (clearT <= 0) { level++; resetPellets(); resetActors(); readyT = 1.6; bonusShown = 0; }
          return;
        }
        if (readyT > 0) { readyT -= dt; return; }

        // reverse instantly between tiles
        if (player.want === OPP[player.dir]) player.dir = player.want;
        advance(player, speedPlayer() * dt, decidePlayer);
        player.mouth += dt * 14;

        // scatter/chase cycle; paused while frightened
        if (frightT > 0) {
          frightT -= dt;
          if (frightT <= 0) glitches.forEach(function (g) { g.wasFright = false; if (g.state === 'fright') g.state = 'normal'; });
        } else {
          modeT += dt;
          var was = chase;
          chase = !(modeT < 7 || (modeT > 27 && modeT < 34) || (modeT > 54 && modeT < 59));
          if (chase !== was) glitches.forEach(function (g) { if (g.state === 'normal') g.dir = OPP[g.dir] || g.dir; });
        }
        glitches.forEach(function (g) {
          if (g.state === 'house') {
            g.release -= dt;
            // bob in the house
            g.y = HOUSE.y + Math.sin(t * 6 + g.i) * 0.15;
            if (g.release <= 0) { g.y = HOUSE.y; g.x = HOUSE.x; g.state = 'leaving'; g.dir = 'up'; }
            return;
          }
          advance(g, speedGlitch(g) * dt, decideGlitch, g);
          if (Math.hypot(g.x - player.x, g.y - player.y) < 0.65) {
            if (g.state === 'fright') {
              eatChain++;
              var pts = 100 * Math.pow(2, Math.min(eatChain, 4));
              api.addScore(pts);
              api.fx.text(px(g.x), py(g.y), String(pts), '#3ff0ff', 12);
              api.fx.burst(px(g.x), py(g.y), '#3ff0ff', 16, 140);
              api.audio.arp([800, 1200, 1600], 0.04, { type: 'square', vol: 0.16 });
              g.state = 'eyes';
            } else if (g.state === 'normal' || g.state === 'leaving') {
              loseLife();
            }
          }
        });
        if (bonus) {
          bonus.life -= dt;
          if (Math.hypot(bonus.x - player.x, bonus.y - player.y) < 0.6) {
            var bp = 100 * level + 100;
            api.addScore(bp);
            api.fx.text(px(bonus.x), py(bonus.y), '+' + bp, '#39ff88', 12);
            api.audio.arp([659, 988], 0.06, { type: 'square', vol: 0.16 });
            bonus = null;
          } else if (bonus.life <= 0) bonus = null;
        }
        api.setStatus('LEVEL ' + level + '  ·  LIVES ' + lives + '  ·  PELLETS ' + left + (frightT > 0 ? '  ·  POWER ' + frightT.toFixed(1) : ''));
      },

      render: function (ctx) {
        ctx.fillStyle = '#04040f';
        ctx.fillRect(0, 0, W, H);
        // walls
        ctx.save();
        var flash = clearT > 0 && Math.floor(t * 6) % 2;
        ctx.strokeStyle = flash ? '#ffffff' : WALL;
        ctx.shadowColor = WALL; ctx.shadowBlur = 8; ctx.lineWidth = 2;
        for (var y = 0; y < ROWS; y++) for (var x = 0; x < COLS; x++) {
          var c = MAP[y][x];
          if (c !== '#') continue;
          var X = x * T, Y = TOP + y * T;
          // draw edges facing open cells for a clean outline look
          ctx.beginPath();
          if (y > 0 && MAP[y - 1][x] !== '#' && MAP[y - 1][x] !== ' ') { ctx.moveTo(X, Y + 4); ctx.lineTo(X + T, Y + 4); }
          if (y < ROWS - 1 && MAP[y + 1][x] !== '#' && MAP[y + 1][x] !== ' ') { ctx.moveTo(X, Y + T - 4); ctx.lineTo(X + T, Y + T - 4); }
          if (x > 0 && MAP[y][x - 1] !== '#' && MAP[y][x - 1] !== ' ') { ctx.moveTo(X + 4, Y); ctx.lineTo(X + 4, Y + T); }
          if (x < COLS - 1 && MAP[y][x + 1] !== '#' && MAP[y][x + 1] !== ' ') { ctx.moveTo(X + T - 4, Y); ctx.lineTo(X + T - 4, Y + T); }
          ctx.stroke();
        }
        ctx.restore();
        ctx.fillStyle = '#ff8fd8';
        ctx.fillRect(DOOR.x * T + 2, TOP + DOOR.y * T + T / 2 - 1, T - 4, 3);
        // pellets
        Object.keys(pellets).forEach(function (k) {
          var xy = k.split(','), kind = pellets[k];
          if (kind === 2) {
            if (Math.floor(t * 4) % 2) return;
            ctx.save();
            ctx.fillStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 12;
            ctx.fillRect(px(+xy[0]) - 6, py(+xy[1]) - 6, 12, 12);
            ctx.restore();
          } else {
            ctx.fillStyle = '#ffe9a8';
            ctx.fillRect(px(+xy[0]) - 2, py(+xy[1]) - 2, 4, 4);
          }
        });
        if (bonus) {
          ctx.save();
          ctx.translate(px(bonus.x), py(bonus.y)); ctx.rotate(t * 2);
          ctx.fillStyle = '#39ff88'; ctx.shadowColor = '#39ff88'; ctx.shadowBlur = 14;
          ctx.fillRect(-7, -7, 14, 14);
          ctx.restore();
        }
        // glitches: diamond bodies with a jittering scanline
        glitches.forEach(function (g) {
          var gx = px(g.x), gy = py(g.y);
          ctx.save();
          ctx.translate(gx, gy);
          if (g.state !== 'eyes') {
            var fr = g.state === 'fright';
            var blink = fr && frightT < 2 && Math.floor(t * 8) % 2;
            var col = fr ? (blink ? '#ffffff' : '#2a4dff') : g.color;
            ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(10, 0); ctx.lineTo(0, 10); ctx.lineTo(-10, 0); ctx.closePath(); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(-8, Math.sin(t * 20 + g.i) * 5, 16, 2);
          }
          var v = DIRS[g.dir] || [0, 0];
          ctx.fillStyle = '#fff';
          ctx.fillRect(-6, -4, 5, 5); ctx.fillRect(1, -4, 5, 5);
          ctx.fillStyle = '#05060f';
          ctx.fillRect(-5 + v[0] * 1.5, -3 + v[1] * 1.5, 3, 3); ctx.fillRect(2 + v[0] * 1.5, -3 + v[1] * 1.5, 3, 3);
          ctx.restore();
        });
        // player: a chomping block
        if (!(dying > 0 && dying < 1.0)) {
          var pv = DIRS[player.dir];
          var ang = Math.atan2(pv[1], pv[0]);
          var open = Math.abs(Math.sin(player.mouth)) * 0.55;
          ctx.save();
          ctx.translate(px(player.x), py(player.y));
          ctx.rotate(ang);
          if (dying > 0) ctx.scale(dying / 1.4, dying / 1.4);
          ctx.fillStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 14;
          // upper and lower jaws open like a trap
          ctx.save(); ctx.rotate(-open); ctx.fillRect(-9, -9, 18, 8); ctx.restore();
          ctx.save(); ctx.rotate(open); ctx.fillRect(-9, 1, 18, 8); ctx.restore();
          ctx.fillRect(-9, -9, 8, 18);
          ctx.restore();
        }
        // lives + level
        for (var l = 0; l < lives; l++) { ctx.fillStyle = ACCENT; ctx.fillRect(8 + l * 18, 10, 12, 12); }
        ctx.fillStyle = 'rgba(200,210,255,0.6)';
        ctx.font = '700 11px ui-monospace, Menlo, Consolas, monospace';
        ctx.textAlign = 'right';
        ctx.fillText('LEVEL ' + level, W - 8, 20);
        if (readyT > 0 && !over) U.glowText(ctx, 'READY', W / 2, py(11), 14, ACCENT);
      }
    };
  }

  function attract(ctx, w, h, t) {
    ctx.fillStyle = '#04040f';
    ctx.fillRect(0, 0, w, h);
    var cy = h / 2, cell = h / 10;
    ctx.strokeStyle = WALL; ctx.lineWidth = 2; ctx.shadowColor = WALL; ctx.shadowBlur = 6;
    ctx.strokeRect(6, cy - cell * 1.2, w - 12, cell * 2.4);
    ctx.shadowBlur = 0;
    var x = ((t * w * 0.25) % (w + 80)) - 40;
    ctx.fillStyle = '#ffe9a8';
    for (var p = 20; p < w; p += cell) if (p > x + 10) ctx.fillRect(p, cy - 2, 4, 4);
    ctx.fillStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 10;
    var open = Math.abs(Math.sin(t * 12)) * 0.5;
    ctx.save(); ctx.translate(x, cy);
    ctx.save(); ctx.rotate(-open); ctx.fillRect(-cell * 0.4, -cell * 0.4, cell * 0.8, cell * 0.35); ctx.restore();
    ctx.save(); ctx.rotate(open); ctx.fillRect(-cell * 0.4, cell * 0.05, cell * 0.8, cell * 0.35); ctx.restore();
    ctx.fillRect(-cell * 0.4, -cell * 0.4, cell * 0.35, cell * 0.8);
    ctx.restore();
    GLITCH.forEach(function (c, i) {
      var gx = x - cell * (1.6 + i * 1.1);
      ctx.fillStyle = c; ctx.shadowColor = c;
      ctx.beginPath(); ctx.moveTo(gx, cy - cell * 0.45); ctx.lineTo(gx + cell * 0.45, cy); ctx.lineTo(gx, cy + cell * 0.45); ctx.lineTo(gx - cell * 0.45, cy); ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  XA.registerGame({
    id: 'xa_maze_muncher',
    order: 13,
    title: 'Maze Muncher',
    tagline: 'Clear the maze. Turn the glitches.',
    color: ACCENT,
    size: { w: W, h: H },
    touch: 'dpad',
    controls: 'Arrows / WASD to steer · swipe on mobile',
    create: create,
    attract: attract
  });
})(window);
</script>
<script>/* game-invader-wave.js */
/*
 * Xtrata Arcade cartridge #14 — INVADER WAVE
 * A marching formation of pixel invaders speeds up as it thins out. Hide
 * behind the crumbling bunkers, pick off the mystery ship for a bonus,
 * and clear the wave before it lands. Each new wave starts lower.
 * Contract game-id: xa_invader_wave (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-invader-wave');
  var U = XA.util;

  var W = 480, H = 560, PY = 522, GROUND = 540;
  var COLS = 11, ROWS = 5, CW = 34, CH = 30, PIX = 3;
  var ACCENT = '#39ff88';
  var ROW_COLORS = ['#ff3fa4', '#b04dff', '#b04dff', '#3ff0ff', '#3ff0ff'];
  var ROW_PTS = [30, 20, 20, 10, 10];

  // Original sprites: 8x8, mirrored, generated from fixed seeds so every
  // player sees the same invaders. Two frames per type for the march.
  var SPRITES = [101, 202, 303].map(function (seed) {
    var r = U.rng(seed);
    var base = [];
    for (var y = 0; y < 8; y++) {
      var row = [];
      for (var x = 0; x < 4; x++) {
        var p = y < 2 ? 0.35 : y < 6 ? 0.7 : 0.45;
        row.push(r() < p ? 1 : 0);
      }
      row[3] = y > 0 && y < 6 ? 1 : row[3];     // solid spine
      base.push(row.concat(row.slice().reverse()));
    }
    base[3][2] = base[3][5] = 0;                 // eyes
    var alt = base.map(function (row, y) {
      if (y < 6) return row.slice();
      return row.map(function (v, x) { return base[y][(x + (y === 6 ? 1 : 7)) % 8]; });
    });
    return [base, alt];
  });
  var TYPE_OF_ROW = [0, 1, 1, 2, 2];

  function drawSprite(ctx, spr, x, y, color, px) {
    ctx.fillStyle = color;
    for (var r = 0; r < 8; r++) for (var c = 0; c < 8; c++) if (spr[r][c]) ctx.fillRect(x + c * px, y + r * px, px, px);
  }

  function create(api) {
    var rng = api.rng;
    var aliens = [], formation = { x: 0, y: 0, dir: 1, step: 0, frame: 0 };
    var shots = [], bombs = [], bunkers = [], ufo = null, ufoT = 20;
    var player = { x: W / 2, alive: true, respawn: 0, inv: 0 };
    var wave = 0, lives = 3, score = 0, nextLife = 5000;
    var fireCd = 0, bombT = 1.5, clearT = 0, over = false, overT = 0;
    var t = 0;

    function buildBunkers() {
      bunkers = [];
      for (var b = 0; b < 4; b++) {
        var bx = 60 + b * 108, cells = {};
        for (var r = 0; r < 8; r++) for (var c = 0; c < 11; c++) {
          if (r === 0 && (c < 2 || c > 8)) continue;
          if (r >= 5 && c >= 3 && c <= 7) continue; // arch
          cells[c + ',' + r] = true;
        }
        bunkers.push({ x: bx, y: 440, cells: cells });
      }
    }
    function startWave() {
      wave++;
      aliens = [];
      for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) aliens.push({ r: r, c: c, alive: true });
      formation.x = 36;
      formation.y = 70 + Math.min(4, wave - 1) * 14;
      formation.dir = 1; formation.step = 0;
      shots = []; bombs = [];
      if (wave === 1 || wave % 3 === 1) buildBunkers();
      api.fx.text(W / 2, 250, 'WAVE ' + wave, ACCENT, 18);
    }
    startWave();

    function alienPos(a) { return { x: formation.x + a.c * CW, y: formation.y + a.r * CH }; }
    function alive() { return aliens.filter(function (a) { return a.alive; }); }

    function addPts(n, x, y) {
      score += n; api.addScore(n);
      if (x != null) api.fx.text(x, y, '+' + n, '#fff', 10);
      if (score >= nextLife) { nextLife += 5000; lives = Math.min(5, lives + 1); api.fx.text(W / 2, 300, 'EXTRA CANNON', ACCENT, 13); }
    }
    function hitBunker(x, y, radius) {
      for (var i = 0; i < bunkers.length; i++) {
        var b = bunkers[i];
        if (x < b.x - 4 || x > b.x + 48 || y < b.y - 4 || y > b.y + 36) continue;
        var c = Math.floor((x - b.x) / 4), r = Math.floor((y - b.y) / 4);
        if (b.cells[c + ',' + r]) {
          for (var dc = -radius; dc <= radius; dc++) for (var dr = -radius; dr <= radius; dr++) {
            if (Math.abs(dc) + Math.abs(dr) <= radius && rng() < 0.85) delete b.cells[(c + dc) + ',' + (r + dr)];
          }
          return true;
        }
      }
      return false;
    }
    function killPlayer() {
      player.alive = false;
      player.respawn = 1.6;
      lives--;
      api.fx.burst(player.x, PY, ACCENT, 34, 200, 0.9);
      api.shake(10);
      api.audio.noise(0.6, { vol: 0.3, cutoff: 900 });
      if (lives <= 0) over = true;
    }

    return {
      update: function (dt) {
        t += dt;
        var inp = api.input;
        inp.takeSwipes();
        if (over) { overT += dt; if (overT > 1.3) api.gameOver(); return; }
        var i;

        // player
        if (player.alive) {
          var mv = (inp.held('right') ? 1 : 0) - (inp.held('left') ? 1 : 0);
          player.x = U.clamp(player.x + mv * 260 * dt, 20, W - 20);
          if (player.inv > 0) player.inv -= dt;
          fireCd -= dt;
          if ((inp.held('a') || inp.held('up') || inp.held('hold')) && fireCd <= 0 && shots.length < 2) {
            shots.push({ x: player.x, y: PY - 12 });
            fireCd = 0.32;
            api.audio.tone(900, 0.06, { type: 'square', vol: 0.08, slide: 0.4 });
          }
        } else {
          player.respawn -= dt;
          if (player.respawn <= 0) { player.alive = true; player.inv = 1.5; player.x = W / 2; bombs = []; }
        }

        if (clearT > 0) { clearT -= dt; if (clearT <= 0) startWave(); return; }

        // formation march: interval shrinks as invaders fall
        var live = alive();
        var interval = 0.03 + (live.length / (COLS * ROWS)) * 0.55 / (1 + (wave - 1) * 0.12);
        formation.step += dt;
        if (formation.step >= interval) {
          formation.step = 0;
          formation.frame ^= 1;
          var minX = 1e9, maxX = -1e9;
          live.forEach(function (a) { var p = alienPos(a); minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x + 24); });
          if ((formation.dir > 0 && maxX + 6 > W - 8) || (formation.dir < 0 && minX - 6 < 8)) {
            formation.y += 14; formation.dir *= -1;
          } else formation.x += 6 * formation.dir;
          api.audio.tone([98, 92, 87, 82][Math.floor(t * 10) % 4], 0.05, { type: 'square', vol: 0.06 });
        }
        // invaders erase bunkers they touch, and win if they land
        live.forEach(function (a) {
          var p = alienPos(a);
          if (p.y + 24 > 436) for (var k = 0; k < 24; k += 4) hitBunker(p.x + k, p.y + 22, 0);
          if (p.y + 24 >= PY - 6) { over = true; api.shake(14); api.audio.tone(80, 1, { type: 'sawtooth', vol: 0.3 }); }
        });

        // player shots
        for (i = shots.length - 1; i >= 0; i--) {
          var s = shots[i];
          s.y -= 540 * dt;
          if (s.y < 30) { shots.splice(i, 1); continue; }
          if (hitBunker(s.x, s.y, 1)) { shots.splice(i, 1); continue; }
          var hit = false;
          for (var k = 0; k < aliens.length; k++) {
            var a = aliens[k];
            if (!a.alive) continue;
            var p = alienPos(a);
            if (s.x > p.x && s.x < p.x + 24 && s.y > p.y && s.y < p.y + 24) {
              a.alive = false; hit = true;
              var pts = Math.round(ROW_PTS[a.r] * (1 + (wave - 1) * 0.25));
              addPts(pts);
              api.fx.burst(p.x + 12, p.y + 12, ROW_COLORS[a.r], 14, 140, 0.5);
              api.audio.noise(0.12, { vol: 0.18, cutoff: 2400 });
              break;
            }
          }
          if (!hit && ufo && Math.abs(s.x - ufo.x) < 22 && Math.abs(s.y - 54) < 10) {
            var up = [50, 100, 150, 300][Math.floor(rng() * 4)];
            addPts(up, ufo.x, 40);
            api.fx.burst(ufo.x, 54, '#ff4d6d', 30, 180, 0.8);
            api.audio.arp([1047, 784, 1047], 0.05, { type: 'square', vol: 0.16 });
            ufo = null; ufoT = 18 + rng() * 10; hit = true;
          }
          if (!hit) for (var bi = bombs.length - 1; bi >= 0; bi--) {
            if (Math.abs(bombs[bi].x - s.x) < 5 && Math.abs(bombs[bi].y - s.y) < 10) { bombs.splice(bi, 1); hit = true; addPts(5); break; }
          }
          if (hit) shots.splice(i, 1);
        }

        // invader bombs from the lowest invader in a random column
        bombT -= dt;
        if (bombT <= 0 && live.length && player.alive) {
          bombT = Math.max(0.3, 1.25 - wave * 0.08) * (0.5 + rng());
          var cols = {};
          live.forEach(function (a) { if (!cols[a.c] || cols[a.c].r < a.r) cols[a.c] = a; });
          var keys = Object.keys(cols);
          // favour the column above the player
          var pick = cols[keys[Math.floor(rng() * keys.length)]];
          if (rng() < 0.4) keys.forEach(function (kk) { var pp = alienPos(cols[kk]); if (Math.abs(pp.x + 12 - player.x) < 20) pick = cols[kk]; });
          var bp = alienPos(pick);
          bombs.push({ x: bp.x + 12, y: bp.y + 24, v: 190 + wave * 14 });
        }
        for (i = bombs.length - 1; i >= 0; i--) {
          var b = bombs[i];
          b.y += b.v * dt;
          if (b.y > GROUND) { bombs.splice(i, 1); continue; }
          if (hitBunker(b.x, b.y, 1)) { bombs.splice(i, 1); continue; }
          if (player.alive && player.inv <= 0 && Math.abs(b.x - player.x) < 16 && b.y > PY - 10 && b.y < PY + 10) {
            bombs.splice(i, 1); killPlayer(); break;
          }
        }

        // mystery ship
        if (!ufo) {
          ufoT -= dt;
          if (ufoT <= 0) { var fl = rng() < 0.5; ufo = { x: fl ? -30 : W + 30, v: fl ? 110 : -110 }; }
        } else {
          ufo.x += ufo.v * dt;
          if (Math.floor(t * 12) % 2) api.audio.tone(ufo.x % 40 < 20 ? 700 : 620, 0.03, { type: 'sine', vol: 0.03 });
          if (ufo.x < -50 || ufo.x > W + 50) { ufo = null; ufoT = 18 + rng() * 10; }
        }

        if (!alive().length && clearT <= 0) {
          var bonus = 100 * wave;
          addPts(bonus);
          api.fx.text(W / 2, 280, 'WAVE CLEAR +' + bonus, '#ffd23f', 15);
          api.audio.arp([523, 659, 784, 1047], 0.08, { type: 'square', vol: 0.18 });
          clearT = 1.8;
        }
        api.setStatus('WAVE ' + wave + '  ·  CANNONS ' + lives + '  ·  INVADERS ' + alive().length);
      },

      render: function (ctx) {
        ctx.fillStyle = '#03030b';
        ctx.fillRect(0, 0, W, H);
        // ground line + lives
        ctx.fillStyle = ACCENT;
        ctx.fillRect(0, GROUND, W, 2);
        for (var l = 0; l < lives; l++) drawCannon(ctx, 24 + l * 30, GROUND + 12, 0.6);
        // bunkers
        ctx.fillStyle = ACCENT;
        bunkers.forEach(function (b) {
          Object.keys(b.cells).forEach(function (k) {
            var cr = k.split(',');
            ctx.fillRect(b.x + cr[0] * 4, b.y + cr[1] * 4, 4, 4);
          });
        });
        // invaders
        ctx.save();
        aliens.forEach(function (a) {
          if (!a.alive) return;
          var p = alienPos(a);
          ctx.shadowColor = ROW_COLORS[a.r]; ctx.shadowBlur = 8;
          drawSprite(ctx, SPRITES[TYPE_OF_ROW[a.r]][formation.frame], p.x, p.y, ROW_COLORS[a.r], PIX);
        });
        ctx.restore();
        // mystery ship
        if (ufo) {
          ctx.save();
          ctx.fillStyle = '#ff4d6d'; ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 14;
          ctx.beginPath(); ctx.ellipse(ufo.x, 56, 22, 7, 0, 0, 7); ctx.fill();
          ctx.fillRect(ufo.x - 8, 44, 16, 8);
          ctx.fillStyle = '#fff';
          for (var d = -14; d <= 14; d += 7) ctx.fillRect(ufo.x + d - 1, 55, 3, 3);
          ctx.restore();
        }
        // shots
        ctx.fillStyle = '#ffffff';
        shots.forEach(function (s) { ctx.fillRect(s.x - 1.5, s.y - 8, 3, 10); });
        ctx.strokeStyle = '#ff9f1c'; ctx.lineWidth = 2;
        bombs.forEach(function (b) {
          ctx.beginPath();
          var z = Math.floor(t * 20) % 2 ? 3 : -3;
          ctx.moveTo(b.x, b.y - 10); ctx.lineTo(b.x + z, b.y - 6); ctx.lineTo(b.x - z, b.y - 2); ctx.lineTo(b.x, b.y + 2);
          ctx.stroke();
        });
        if (player.alive && !(player.inv > 0 && Math.floor(t * 12) % 2)) drawCannon(ctx, player.x, PY, 1);
      }
    };

    function drawCannon(ctx, x, y, k) {
      ctx.save();
      ctx.translate(x, y); ctx.scale(k, k);
      ctx.fillStyle = ACCENT; ctx.shadowColor = ACCENT; ctx.shadowBlur = 10;
      ctx.fillRect(-16, -2, 32, 10);
      ctx.fillRect(-11, -7, 22, 6);
      ctx.fillRect(-3, -14, 6, 8);
      ctx.restore();
    }
  }

  function attract(ctx, w, h, t) {
    ctx.fillStyle = '#03030b';
    ctx.fillRect(0, 0, w, h);
    var px = Math.max(1.5, h / 110);
    var cw = px * 11, chh = px * 10;
    var cols = Math.min(8, Math.floor((w * 0.8) / cw));
    var ox = (w - cols * cw) / 2 + Math.sin(t * 1.5) * w * 0.06;
    var frame = Math.floor(t * 3) % 2;
    for (var r = 0; r < 4; r++) for (var c = 0; c < cols; c++) {

    color: ACCENT,

<script>/* game-helix-drop.js */
/*
 * Xtrata Arcade cartridge #15 — HELIX DROP
 * A ball bounces on a spiral tower of rings. Spin the tower so the ball
 * drops through the gaps; avoid the red segments. Fall through three rings
 * without bouncing and the ball ignites, smashing whatever it lands on.
 * Contract game-id: xa_helix_drop (score mode, higher is better)
 */
(function (root) {
  'use strict';
  var XA = root.XA;
  if (!XA) throw new Error('arcade-kit must load before game-helix-drop');
  var U = XA.util;

  var W = 400, H = 600, CX = W / 2;
  var R = 150, RI = 34, SQ = 0.32, SEG = 12, STEP = Math.PI * 2 / SEG, GAP_Y = 118, BALL_R = 11;
  var FRONT = Math.PI / 2, MID = (R + RI) / 2;
  var ACCENT = '#ff9f1c', SAFE = '#3ff0ff', DANGER = '#ff2d55';

  function create(api) {
    var rng = api.rng;
    var rings = [];                 // { y, kinds:[0 plate,1 gap,2 danger], broken, splats:[] }
    var rot = 0;
    var ball = { y: -60, vy: 0 };
    var nextRing = 0, cam = -200, combo = 0, passed = 0;
    var lastPX = null, lastMoved = api.pointer().moved;
    var over = false, overT = 0, t = 0;

    function makeRing(k) {
      var kinds = new Array(SEG).fill(0);
      var gapLen = k < 10 ? 2 : (rng() < 0.6 ? 2 : 1);
      var g0 = Math.floor(rng() * SEG);
      if (k === 0) g0 = 7;          // first gap starts away from the ball
      for (var i = 0; i < gapLen; i++) kinds[(g0 + i) % SEG] = 1;
      var danger = k < 3 ? 0 : Math.min(5, 1 + Math.floor(k / 7));
      for (var d = 0; d < danger; d++) {
        var s = Math.floor(rng() * SEG);
        if (kinds[s] === 0 && !(k < 6 && s === 3)) kinds[s] = 2;
      }
      // the ring the ball starts on must be safe under it
      if (k === 0) kinds[3] = 0;
      return { y: k * GAP_Y, kinds: kinds, broken: 0, splats: [] };
    }
    function ring(k) { while (rings.length <= k) rings.push(makeRing(rings.length)); return rings[k]; }
    for (var i = 0; i < 12; i++) ring(i);

    function segUnderBall() {
      var local = ((FRONT - rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      return Math.floor(local / STEP) % SEG;
    }
    function landOn(rg, k) {
      var s = segUnderBall();
      var kind = rg.kinds[s];
      var sy = rg.y;
      if (kind === 1) {
        passed++;
        combo++;
        var pts = 10 * combo;
        api.addScore(pts);
        if (combo > 1) api.fx.text(CX + 40, sy - cam - 10, '+' + pts, combo >= 3 ? ACCENT : '#fff', 11 + Math.min(combo, 5));
        api.audio.tone(300 + Math.min(combo, 12) * 60, 0.06, { type: 'triangle', vol: 0.12 });
        nextRing = k + 1;
        return false;
      }
      if (combo >= 3) {
        // fireball smash
        rg.broken = 1;
        passed++;
        api.addScore(20 + combo * 5);
        api.fx.burst(CX, sy - cam + MID * SQ, ACCENT, 40, 260, 0.8);
        api.fx.text(CX, sy - cam - 20, 'SMASH', ACCENT, 15);
        api.shake(7);
        api.audio.noise(0.25, { vol: 0.28, cutoff: 1400 });
        combo = 0;
        nextRing = k + 1;
        ball.vy = -520;
        return true;
      }
      if (kind === 2) {
        over = true;
        api.fx.burst(CX, sy - cam + MID * SQ, DANGER, 36, 220, 0.9);
        api.shake(12);
        api.audio.tone(160, 0.5, { type: 'sawtooth', slide: 0.3, vol: 0.28 });
        return true;
      }
      // normal bounce
      ball.y = sy - BALL_R;
      ball.vy = -600;
      combo = 0;
      var local = ((FRONT - rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      rg.splats.push(local);
      if (rg.splats.length > 5) rg.splats.shift();
      api.audio.tone(180, 0.05, { type: 'square', vol: 0.1 });
      api.fx.burst(CX, sy - cam + MID * SQ, SAFE, 6, 80, 0.3);
      return true;
    }

    return {
      // Read-only test hook.
      debug: function () { return { seg: segUnderBall(), kinds: ring(nextRing).kinds.slice(), passed: passed }; },
      update: function (dt) {
        t += dt;
        var inp = api.input;
        inp.takeSwipes();
        // rotate: keys, or drag horizontally (mouse or touch)
        if (inp.held('left')) rot -= 3.4 * dt;
        if (inp.held('right')) rot += 3.4 * dt;
        var p = api.pointer();
        if (p.down) {

          lastPX = p.x;
        } else lastPX = null;
        lastMoved = p.moved;

        if (over) { overT += dt; if (overT > 1.2) api.gameOver(); return; }

        var prevBottom = ball.y + BALL_R;
        ball.vy = Math.min(900, ball.vy + 1900 * dt);
        ball.y += ball.vy * dt;
        var bottom = ball.y + BALL_R;
        // check rings crossed this frame
        for (var k = nextRing; k < nextRing + 3; k++) {
          var rg = ring(k);
          if (rg.broken) { if (k === nextRing) nextRing++; continue; }
          if (prevBottom <= rg.y && bottom >= rg.y && ball.vy > 0) {

          }

        ring(nextRing + 10);
        cam += ((ball.y - 210) - cam) * Math.min(1, dt * 6);
        rings.forEach(function (rg) { if (rg.broken > 0 && rg.broken < 2) rg.broken = Math.min(2, rg.broken + dt * 2); });
        api.setStatus('RINGS ' + passed + (combo >= 3 ? '  ·  ON FIRE' : combo > 1 ? '  ·  COMBO ' + combo : ''));
      },

      render: function (ctx) {
        var g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#1a0a2e'); g.addColorStop(1, '#070312');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        var first = Math.max(0, Math.floor((cam - 80) / GAP_Y)), last = Math.floor((cam + H + 80) / GAP_Y);
        var i, k;
        function segPath(sy, a0, a1, lift) {
          ctx.beginPath();
          var n = 6;
          for (i = 0; i <= n; i++) {
            var a = a0 + (a1 - a0) * i / n;
            ctx.lineTo(CX + Math.cos(a) * R, sy + lift + Math.sin(a) * R * SQ);
          }
          for (i = n; i >= 0; i--) {
            var b = a0 + (a1 - a0) * i / n;
            ctx.lineTo(CX + Math.cos(b) * RI, sy + lift + Math.sin(b) * RI * SQ);
          }
          ctx.closePath();
        }
        function drawRing(k, frontHalf) {
          var rg = rings[k];
          if (!rg || rg.broken >= 2) return;
          var sy = rg.y - cam;
          var alpha = rg.broken ? 1 - rg.broken / 2 : 1;
          for (var s = 0; s < SEG; s++) {
            var kind = rg.kinds[s];
            if (kind === 1) continue;
            var a0 = s * STEP + rot, a1 = a0 + STEP;
            var mid = (a0 + a1) / 2;
            var isFront = Math.sin(mid) > 0;
            if (isFront !== frontHalf) continue;
            var col = kind === 2 ? DANGER : k === nextRing ? SAFE : '#2fb9c9';
            ctx.save();
            ctx.globalAlpha = alpha;
            if (isFront) { ctx.fillStyle = kind === 2 ? '#7a0f25' : '#0e4f58'; segPath(sy, a0, a1, 12); ctx.fill(); }
            ctx.fillStyle = col;
            if (kind === 2) { ctx.shadowColor = DANGER; ctx.shadowBlur = 10; }
            segPath(sy, a0, a1, 0); ctx.fill();
            ctx.restore();
          }
          // paint splats where the ball bounced
          rg.splats.forEach(function (loc) {
            var a = loc + rot;
            if ((Math.sin(a) > 0) !== frontHalf) return;
            ctx.fillStyle = 'rgba(255,159,28,0.55)';
            ctx.beginPath(); ctx.ellipse(CX + Math.cos(a) * MID, sy + Math.sin(a) * MID * SQ, 10, 4, 0, 0, 7); ctx.fill();
          });
        }
        for (k = last; k >= first; k--) drawRing(k, false);
        // central pillar
        var pg = ctx.createLinearGradient(CX - RI, 0, CX + RI, 0);
        pg.addColorStop(0, '#2a1450'); pg.addColorStop(0.5, '#5b3aa0'); pg.addColorStop(1, '#2a1450');
        ctx.fillStyle = pg;
        ctx.fillRect(CX - RI + 4, 0, (RI - 4) * 2, H);
        for (k = last; k >= first; k--) drawRing(k, true);

        // ball (always at the front of the tower)
        var by = ball.y - cam + MID * SQ;
        var fire = combo >= 3;
        ctx.save();
        ctx.fillStyle = fire ? ACCENT : '#ffffff';
        ctx.shadowColor = fire ? ACCENT : '#ffd9a8'; ctx.shadowBlur = fire ? 26 : 12;
        var squash = ball.vy < -300 ? 1.08 : 1;
        ctx.beginPath(); ctx.ellipse(CX, by, BALL_R / squash, BALL_R * squash, 0, 0, 7); ctx.fill();
        ctx.restore();
        if (fire && !over) api.fx.trail(CX + (Math.random() - 0.5) * 8, by - 8, ACCENT, 0, -60);

        if (passed === 0 && !over) {
          ctx.save();
          ctx.globalAlpha = 0.6 + Math.sin(t * 5) * 0.4;
          U.glowText(ctx, 'DRAG OR ←→ TO SPIN', W / 2, 60, 13, '#ffe2bd');
          ctx.restore();
        }
      }
    };
  }

  function attract(ctx, w, h, t) {
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#1a0a2e'); g.addColorStop(1, '#070312');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    var cx = w / 2, r = Math.min(w, h * 1.4) * 0.34, ri = r * 0.22, rot = t * 1.1;
    ctx.fillStyle = '#4a2c88';
    ctx.fillRect(cx - ri * 0.8, 0, ri * 1.6, h);

      var sy = h * 0.2 + k * h * 0.25;
      for (var s = 0; s < 12; s++) {
