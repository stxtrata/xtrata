<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astro Blaster Mobile - On-Chain</title>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #050816; color: #d6e7ff; }
    #loader-panel { padding: 10px 12px; border-bottom: 1px solid #1d2c47; background: #0a1223; overflow: hidden; transition: opacity 0.22s ease, max-height 0.22s ease, padding 0.22s ease, border-width 0.22s ease; max-height: 240px; opacity: 1; }
    #loader-panel.is-hidden { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; border-bottom-width: 0; }
    #loader-title { font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: #9fc2ff; }
    #loader-log { margin: 8px 0 0; max-height: 130px; overflow: auto; font-size: 12px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; color: #9ec6ff; }
    #loader-panel.is-hidden #loader-log { max-height: 0; margin-top: 0; }

    /* v4 mobile parent: scale the existing canvas above a fixed touch deck. */
    #astro-mobile-controls[hidden] { display: none !important; }
    #astro-mobile-controls {
      position: fixed;
      z-index: 120;
      right: 0;
      bottom: 0;
      left: 0;
      height: calc(146px + env(safe-area-inset-bottom, 0px));
      padding: 9px max(12px, env(safe-area-inset-right, 0px)) calc(9px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: linear-gradient(180deg, rgba(4, 9, 22, 0.9), rgba(2, 5, 14, 0.98));
      border-top: 1px solid rgba(67, 224, 255, 0.38);
      box-shadow: 0 -10px 28px rgba(0, 0, 0, 0.42);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: contain;
    }
    /* v5: analog-feel joystick zone replaces the four-button d-pad. */
    .astro-mobile-joystick {
      position: relative;
      width: 128px;
      height: 128px;
      flex: 0 0 128px;
      border-radius: 50%;
      border: 1px solid rgba(73, 98, 125, 0.9);
      background:
        radial-gradient(circle at 50% 42%, rgba(30, 52, 79, 0.55), rgba(7, 14, 27, 0.92) 74%);
      box-shadow: inset 0 0 18px rgba(2, 6, 12, 0.85), 0 3px 9px rgba(0, 0, 0, 0.34);
      touch-action: none;
    }
    .astro-mobile-joystick::before {
      content: '';
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      border: 1px dashed rgba(84, 224, 255, 0.28);
      pointer-events: none;
    }
    .astro-joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 54px;
      margin: -27px 0 0 -27px;
      border-radius: 50%;
      border: 1px solid #58b7d4;
      background: radial-gradient(circle at 38% 30%, rgba(66, 118, 158, 0.98), rgba(15, 40, 64, 0.98) 78%);
      box-shadow: 0 0 14px rgba(49, 227, 255, 0.3), inset 0 1px rgba(255, 255, 255, 0.14);
      pointer-events: none;
      transition: transform 90ms ease-out;
    }
    .astro-mobile-joystick.is-active .astro-joystick-knob {
      transition: none;
      border-color: #58efff;
      box-shadow: 0 0 20px rgba(49, 227, 255, 0.55), inset 0 1px rgba(255, 255, 255, 0.14);
    }
    .astro-mobile-actions {
      display: grid;
      flex: 1 1 auto;
      max-width: 230px;
      grid-template-columns: minmax(58px, 1fr) minmax(76px, 1.25fr);
      grid-template-rows: 38px 76px;
      gap: 8px;
      align-items: stretch;
    }
    .astro-mobile-pause { grid-column: 1 / span 2; grid-row: 1; }
    .astro-mobile-key {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid #49627d;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(28, 44, 67, 0.96), rgba(10, 20, 36, 0.98));
      color: #d9f7ff;
      font: 700 16px/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-shadow: 0 0 8px rgba(84, 224, 255, 0.72);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.08), 0 3px 9px rgba(0, 0, 0, 0.34);
      touch-action: none;
      cursor: pointer;
    }
    .astro-mobile-key.is-pressed,
    .astro-mobile-key:active {
      transform: translateY(2px) scale(0.97);
      border-color: #58efff;
      background: linear-gradient(180deg, rgba(23, 116, 140, 0.98), rgba(11, 53, 77, 0.98));
      box-shadow: 0 0 16px rgba(49, 227, 255, 0.42);
    }
    .astro-mobile-utility { font-size: 11px; border-radius: 9px; }
    /* v5: restart lives in the top bar, out of thumb reach, with tap-to-confirm. */
    #mobile-restart-btn { display: none; }
    body.astro-mobile-controls-active #mobile-restart-btn { display: inline-block; }
    #mobile-restart-btn.is-confirming {
      border-color: #ff6472;
      color: #ffd2d8;
      background: linear-gradient(180deg, rgba(96, 22, 36, 0.98), rgba(52, 9, 18, 0.98));
      box-shadow: 0 0 12px rgba(255, 100, 114, 0.45);
    }
    .astro-mobile-fire {
      grid-column: 2;
      grid-row: 2;
      border-radius: 50%;
      border-color: #d36f37;
      color: #fff0d9;
      background: radial-gradient(circle at 38% 30%, #f07d3f, #a22e24 72%);
      text-shadow: 0 0 8px rgba(255, 194, 116, 0.82);
    }
    .astro-mobile-emp { grid-column: 1; grid-row: 2; color: #e4dcff; border-color: #765bc7; }
    body.astro-mobile-controls-active #app {
      height: calc(100% - 48px - 146px - env(safe-area-inset-bottom, 0px));
      align-items: flex-start;
      overflow: hidden;
    }
    body.astro-mobile-controls-active #game-container canvas {
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: calc(100dvh - 48px - 146px - env(safe-area-inset-bottom, 0px));
      object-fit: contain;
    }
    @media (max-width: 420px) {
      #astro-mobile-controls { gap: 8px; }
      .astro-mobile-joystick { width: 118px; height: 118px; flex-basis: 118px; }
      .astro-mobile-actions { max-width: 210px; }
      #title { font-size: 15px; letter-spacing: 1px; }
      #top-bar { padding-right: 8px; padding-left: 8px; }
      .wallet-status-badge { min-width: 0; max-width: 112px; overflow: hidden; text-overflow: ellipsis; }
    }
  </style>
</head>
<body>
  <div id="loader-panel">
    <div id="loader-title">Astro Blaster Recursive Loader</div>
    <pre id="loader-log"></pre>
  </div>

  <div id="top-bar">
    <span id="title">Astro Blaster</span>
    <div id="top-bar-right">
      <span id="wallet-status-badge" class="wallet-status-badge is-loading" aria-live="polite">Wallet: checking...</span>
      <button id="wallet-connect-btn" title="Connect wallet">Connect</button>
      <button id="wallet-disconnect-btn" title="Disconnect wallet" style="display:none;">Disconnect</button>
      <button id="force-next-wave-btn" title="Force next wave/level for testing" style="display:none;">Next Wave</button>
      <button id="mobile-restart-btn" type="button" title="Restart game (tap twice)">Restart</button>
      <button id="sound-toggle" title="Toggle Sound">Sound</button>
      <button id="exit-btn" style="display:none;">Exit</button>
    </div>
  </div>

  <div id="app">
    <div id="home-grid" style="display:none;"></div>
    <div id="game-container"></div>
  </div>

  <div id="astro-mobile-controls" aria-label="Astro Blaster touch controls" hidden>
    <div id="astro-joystick" class="astro-mobile-joystick" role="application" aria-label="Move joystick — slide your thumb to steer">
      <div class="astro-joystick-knob" aria-hidden="true"></div>
    </div>
    <div class="astro-mobile-actions" aria-label="Actions">
      <button class="astro-mobile-key astro-mobile-utility astro-mobile-pause" type="button" data-astro-key="p" aria-label="Pause game">PAUSE</button>
      <button class="astro-mobile-key astro-mobile-emp" type="button" data-astro-key="x" aria-label="Use EMP">EMP</button>
      <button class="astro-mobile-key astro-mobile-fire" type="button" data-astro-key="Space" aria-label="Fire">FIRE</button>
    </div>
  </div>

  <div id="error-overlay" style="display:none;">
    <div id="error-box">
      <h2>Game Error</h2>
      <p id="error-msg"></p>
      <button id="error-close">Return to Start Screen</button>
    </div>
  </div>

  <script>
    (function () {
      if (window.__astroBlasterStandaloneParentStarted) return;
      window.__astroBlasterStandaloneParentStarted = true;

      var CONFIG = {
        contentContractAddress: 'SP3JNSEXAZP4BDSHV0DN3M8R3P0MY0EEBQQZX743X',
        contentContractName: 'xtrata-v3-2-3',
        senderAddress: 'SP3JNSEXAZP4BDSHV0DN3M8R3P0MY0EEBQQZX743X',
        networkPriority: ['mainnet'],
        maxChunksPerModule: 512,

        // v4 mobile: filled after the parent itself is minted (fill-inscription-ids.mjs --parent <id>).
        // Used to build the "claim your score in the secure runtime" deep link.
        parentTokenId: 0,
        // v4 mobile: canonical host origin for the secure runtime page.
        runtimeOrigin: 'https://xtrata.xyz',

        moduleIds: {
          styles: 69,
          utils: 70,
          highscores: 2800,
          gameRuntime: 71,
          main: 2801
        },

        scoreConfig: {
          enabled: true,
          network: 'mainnet',
          contractAddress: 'SP3JNSEXAZP4BDSHV0DN3M8R3P0MY0EEBQQZX743X',
          contractName: 'xtrata-arcade-scores-v1-3',
          functionName: 'submit-score',
          leaderboardFunctionName: 'get-top10',
          apiBaseUrl: '/hiro/mainnet',
          apiFallbackBaseUrls: ["https://api.mainnet.hiro.so"],
          readSenderAddress: '',
          requiresAttestation: false,
          attestationEndpoint: '',
          attestationTimeoutMs: 10000,
          minRank: 10,
          useDenyModePostConditions: true,
          fallbackToAllowModeOnPostConditionFailure: false,
          debug: false
        }
      };

      // v3: sandbox-native API base resolution.
      // In a sandboxed srcdoc/blob iframe there is no usable origin, so relative
      // '/hiro/...' paths can never resolve. We therefore build ABSOLUTE bases:
      //  - if this document has a real http(s) origin, prefer the same-site
      //    caching proxy '<origin>/hiro/<network>' first;
      //  - always keep the absolute Hiro URL as fallback. When Xtrata embeds
      //    this HTML it rewrites absolute Hiro URLs to its own proxy, so the
      //    fallback stays proxy-friendly on embedded surfaces too.
      function hasRealHttpOrigin() {
        try {
          var origin = window.location && window.location.origin;
          return typeof origin === 'string' && /^https?:\/\//.test(origin) && origin !== 'null';
        } catch (error) {
          return false;
        }
      }

      function buildNetworkBases(network) {
        var absolute =
          network === 'testnet'
            ? 'https://api.testnet.hiro.so'
            : 'https://api.mainnet.hiro.so';
        var bases = [];
        if (hasRealHttpOrigin()) {
          bases.push(window.location.origin + '/hiro/' + network);
        }
        bases.push(absolute);
        return bases;
      }

      var NETWORK_BASE = {
        mainnet: buildNetworkBases('mainnet'),
        testnet: buildNetworkBases('testnet')
      };

      var MODULES = [
        { key: 'styles', id: Number(CONFIG.moduleIds.styles || 0), mimeType: 'text/css' },
        { key: 'utils', id: Number(CONFIG.moduleIds.utils || 0), mimeType: 'text/javascript' },
        { key: 'highscores', id: Number(CONFIG.moduleIds.highscores || 0), mimeType: 'text/javascript' },
        { key: 'game-runtime', id: Number(CONFIG.moduleIds.gameRuntime || 0), mimeType: 'text/javascript' },
        { key: 'main', id: Number(CONFIG.moduleIds.main || 0), mimeType: 'text/javascript' }
      ];

      var loaderPanel = document.getElementById('loader-panel');
      var loaderLog = document.getElementById('loader-log');
      var startMs = Date.now();
      var HOST_WALLET_BRIDGE = {
        requestType: 'xtrata:wallet:request',
        responseType: 'xtrata:wallet:response',
        intentType: 'xtrata:arcade:wallet-intent',
        // v3: handshake channel. A sandboxed srcdoc iframe has no query string,
        // so the bridge token can also be granted by the host in reply to a
        // hello broadcast instead of only via ?walletBridgeToken=.
        helloType: 'xtrata:wallet:hello',
        helloAckType: 'xtrata:wallet:hello-ack',
        helloNonce: '',
        helloAttempts: 0,
        hostOrigin: '',
        token: '',
        pending: {},
        seq: 0,
        listenerReady: false,
        session: null,
        providerShimInstalled: false
      };
      var HOST_WALLET_SHIM_METHODS = [
        'stx_getAddresses',
        'getAddresses',
        'stx_getAccounts',
        'getAccounts',
        'wallet_getAccount',
        'stx_getNetwork',
        'getNetwork',
        'stx_requestAccounts',
        'requestAccounts',
        'stx_connect',
        'connect',
        'wallet_connect',
        'stx_callContract',
        'stx_callContractV2',
        'stx_disconnect',
        'wallet_disconnect',
        'disconnect',
        'deactivate'
      ];

      function keepLoaderVisible() {
        try {
          if (typeof window === 'undefined' || !window.location) return false;
          var params = new URLSearchParams(window.location.search || '');
          return params.get('loader') === '1';
        } catch (error) {
          return false;
        }
      }

      function resolveRuntimeDebugEnabled() {
        var enabled = !!(
          window.ARCADE_ONCHAIN_CONFIG &&
          window.ARCADE_ONCHAIN_CONFIG.debug === true
        );
        try {
          var params = new URLSearchParams(window.location.search || '');
          if (params.get('debug') === '1' || params.get('arcadeDebug') === '1') {
            enabled = true;
          }
        } catch (error) {}
        return enabled;
      }

      function hideLoaderPanelAfterBoot() {
        if (keepLoaderVisible()) {
          log('Loader pinned via ?loader=1');
          return;
        }
        if (!loaderPanel) return;
        loaderPanel.classList.add('is-hidden');
        setTimeout(function () {
          if (loaderPanel && loaderPanel.parentNode) {
            loaderPanel.style.display = 'none';
          }
        }, 260);
      }

      function log(message) {
        var line = '[+' + String(Date.now() - startMs).padStart(5, ' ') + 'ms] ' + String(message);
        if (typeof console !== 'undefined' && typeof console.log === 'function') {
          console.log(line);
        }
        if (loaderLog) {
          loaderLog.textContent += line + '\n';
        }
      }

      function getHostWalletBridgeToken() {
        try {
          var params = new URLSearchParams(window.location.search || '');
          return String(params.get('walletBridgeToken') || '').trim();
        } catch (error) {
          return '';
        }
      }

      function getHostWalletBridgeTargets() {
        var out = [];
        if (window.opener && window.opener !== window) {
          out.push(window.opener);
        }
        if (window.parent && window.parent !== window) {
          out.push(window.parent);
        }
        if (window.top && window.top !== window && out.indexOf(window.top) < 0) {
          out.push(window.top);
        }
        return out;
      }

      function hasHostWalletBridge() {
        return !!HOST_WALLET_BRIDGE.token && getHostWalletBridgeTargets().length > 0;
      }

      function emitHostWalletIntent(intent, payload) {
        var targets = getHostWalletBridgeTargets();
        if (!targets.length) return;
        var message = {
          type: HOST_WALLET_BRIDGE.intentType,
          intent: String(intent || ''),
          payload: payload || {},
          bridgeToken: HOST_WALLET_BRIDGE.token || ''
        };
        var i;
        for (i = 0; i < targets.length; i += 1) {
          try {
            targets[i].postMessage(message, safePostTargetOrigin());
          } catch (error) {}
        }
      }

      function createHostWalletBridgeError(message, code) {
        var error = new Error(String(message || 'Host wallet bridge request failed.'));
        if (typeof code !== 'undefined') {
          error.code = code;
        }
        return error;
      }

      // v3: which target origin can we safely use for outgoing postMessage?
      // From a sandboxed srcdoc document window.location.origin is 'null',
      // which is not a legal targetOrigin — fall back to '*'. Authentication
      // rides on the bridge token + per-request ids, not on our own origin.
      function safePostTargetOrigin() {
        if (HOST_WALLET_BRIDGE.hostOrigin) return HOST_WALLET_BRIDGE.hostOrigin;
        return hasRealHttpOrigin() ? window.location.origin : '*';
      }

      // v3: accept a host message if it comes from the origin that answered
      // our hello handshake, or (top-level, same-origin runtime case) from our
      // own origin. Sandboxed documents never match location.origin, so the
      // handshake-established hostOrigin is the effective gate there.
      function isAcceptableHostOrigin(eventOrigin) {
        if (HOST_WALLET_BRIDGE.hostOrigin && eventOrigin === HOST_WALLET_BRIDGE.hostOrigin) {
          return true;
        }
        if (hasRealHttpOrigin() && eventOrigin === window.location.origin) {
          return true;
        }
        return false;
      }

      function createHelloNonce() {
        try {
          if (window.crypto && typeof window.crypto.randomUUID === 'function') {
            return window.crypto.randomUUID();
          }
        } catch (error) {}
        return 'astro-hello-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
      }

      // v3: broadcast a hello so a wallet-capable host (Xtrata workspace,
      // runtime page, viewer) can grant a bridge token even when we are a
      // sandboxed srcdoc iframe with no query string. Retries a few times to
      // survive hosts that attach their listener after the iframe boots.
      function sendHostWalletHello() {
        var targets = getHostWalletBridgeTargets();
        if (!targets.length) return;
        if (!HOST_WALLET_BRIDGE.helloNonce) {
          HOST_WALLET_BRIDGE.helloNonce = createHelloNonce();
        }
        HOST_WALLET_BRIDGE.helloAttempts += 1;
        var message = {
          type: HOST_WALLET_BRIDGE.helloType,
          app: 'astro-blaster-standalone',
          version: 'v3',
          nonce: HOST_WALLET_BRIDGE.helloNonce,
          wants: ['wallet-bridge']
        };
        var i;
        for (i = 0; i < targets.length; i += 1) {
          try {
            targets[i].postMessage(message, '*');
          } catch (error) {}
        }
        if (!HOST_WALLET_BRIDGE.token && HOST_WALLET_BRIDGE.helloAttempts < 5) {
          setTimeout(sendHostWalletHello, 700 * HOST_WALLET_BRIDGE.helloAttempts);
        }
      }

      function handleHostWalletHelloAck(event, data) {
        if (HOST_WALLET_BRIDGE.token) return;
        var nonce = typeof data.nonce === 'string' ? data.nonce : '';
        if (!nonce || nonce !== HOST_WALLET_BRIDGE.helloNonce) return;
        var token = typeof data.bridgeToken === 'string' ? data.bridgeToken.trim() : '';
        if (!token) return;
        HOST_WALLET_BRIDGE.token = token;
        HOST_WALLET_BRIDGE.hostOrigin =
          event.origin && event.origin !== 'null' ? event.origin : '';
        log('Host wallet bridge granted via hello handshake.');
        installHostWalletBridgeProviderShim();
        installHostWalletBridgeSubmitter();
      }

      function ensureHostWalletBridgeListener() {
        if (HOST_WALLET_BRIDGE.listenerReady) return;
        HOST_WALLET_BRIDGE.listenerReady = true;
        window.addEventListener('message', function (event) {
          var data = event && event.data ? event.data : null;
          if (!data) return;
          if (data.type === HOST_WALLET_BRIDGE.helloAckType) {
            handleHostWalletHelloAck(event, data);
            return;
          }
          if (data.type !== HOST_WALLET_BRIDGE.responseType) {
            return;
          }
          if (!isAcceptableHostOrigin(event.origin)) {
            return;
          }
          var requestId = typeof data.requestId === 'string' ? data.requestId : '';
          if (!requestId || !HOST_WALLET_BRIDGE.pending[requestId]) {
            return;
          }
          var entry = HOST_WALLET_BRIDGE.pending[requestId];
          delete HOST_WALLET_BRIDGE.pending[requestId];
          clearTimeout(entry.timer);
          if (data.ok) {
            entry.resolve(data.result);
            return;
          }
          var detail = data.error || {};
          var message =
            detail && detail.message
              ? String(detail.message)
              : 'Host wallet bridge rejected request.';
          var error = createHostWalletBridgeError(message);
          if (detail && typeof detail.code === 'number') {
            error.code = detail.code;
          }
          entry.reject(error);
        });
      }

      function requestHostWalletBridge(method, params, timeoutMs) {
        if (!HOST_WALLET_BRIDGE.token) {
          return Promise.reject(
            createHostWalletBridgeError('Host wallet bridge token missing.', -32001)
          );
        }
        var targets = getHostWalletBridgeTargets();
        if (!targets.length) {
          return Promise.reject(
            createHostWalletBridgeError('Host wallet bridge target unavailable.', -32001)
          );
        }

        ensureHostWalletBridgeListener();

        return new Promise(function (resolve, reject) {
          var requestId = 'astro-wallet-' + String(++HOST_WALLET_BRIDGE.seq);
          var timer = setTimeout(function () {
            if (HOST_WALLET_BRIDGE.pending[requestId]) {
              delete HOST_WALLET_BRIDGE.pending[requestId];
            }
            reject(
              createHostWalletBridgeError(
                'Host wallet bridge request timed out for ' + method + '.',
                -32001
              )
            );
          }, Math.max(3000, Number(timeoutMs || 90000)));

          HOST_WALLET_BRIDGE.pending[requestId] = {
            resolve: resolve,
            reject: reject,
            timer: timer
          };

          var message = {
            type: HOST_WALLET_BRIDGE.requestType,
            requestId: requestId,
            bridgeToken: HOST_WALLET_BRIDGE.token,
            method: method,
            params: typeof params === 'undefined' ? null : params
          };

          var sent = false;
          var i;
          for (i = 0; i < targets.length; i += 1) {
            try {
              targets[i].postMessage(message, safePostTargetOrigin());
              sent = true;
            } catch (error) {}
          }

          if (!sent) {
            clearTimeout(timer);
            delete HOST_WALLET_BRIDGE.pending[requestId];
            reject(
              createHostWalletBridgeError('Host wallet bridge postMessage failed.', -32001)
            );
          }
        });
      }

      function normalizeHostWalletNetwork(value, fallback) {
        if (typeof value === 'string') {
          var lower = value.toLowerCase();
          if (lower.indexOf('mainnet') >= 0 || lower === 'main') return 'mainnet';
          if (lower.indexOf('testnet') >= 0 || lower === 'test') return 'testnet';
        } else if (value && typeof value === 'object') {
          if (typeof value.network === 'string') {
            return normalizeHostWalletNetwork(value.network, fallback);
          }
          if (typeof value.name === 'string') {
            return normalizeHostWalletNetwork(value.name, fallback);
          }
          if (typeof value.id === 'string') {
            return normalizeHostWalletNetwork(value.id, fallback);
          }
        }
        if (typeof fallback === 'string' && fallback) {
          return fallback;
        }
        return 'mainnet';
      }

      function parseHostWalletRequestArgs(methodOrPayload, maybeParams) {
        if (typeof methodOrPayload === 'string') {
          return { method: methodOrPayload, params: maybeParams };
        }
        if (methodOrPayload && typeof methodOrPayload === 'object') {
          return {
            method: methodOrPayload.method,
            params: typeof methodOrPayload.params === 'undefined' ? maybeParams : methodOrPayload.params
          };
        }
        return { method: '', params: maybeParams };
      }

      function isHostWalletConnectMethod(method) {
        return (

          String((payload && payload.readSenderAddress) || '').trim() ||
          CONFIG.senderAddress;
        var i;
        var lastError = null;
        for (i = 0; i < bases.length; i += 1) {

            bases[i] +
            '/v2/contracts/call-read/' +
            String(payload.contractAddress) + '/' +
            String(payload.contractName) + '/' +
            functionName;
          try {
            var response = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                sender: sender,

      async function resolveFeePostConditionConfig(payload, walletAddress) {

      async function submitScoreViaHostWalletBridge(payload) {

          mode: payload.mode === 'time' ? 'time' : 'score',
          score: Number(payload.score || 0),
          network: network,
          contractAddress: payload.contractAddress,
          contractName: payload.contractName

          'stx_requestAccounts',
          { network: network },

      function installHostWalletBridgeProviderShim() {

            });

            if (!response.ok) {
              throw new Error('HTTP ' + response.status + ' for ' + fn + ' on ' + network + ' via ' + base);
            }

            if (fallbackCount > 0) {
              log('Read-only fallback summary for ' + fn + ' on ' + network + ': retries=' + fallbackCount + ', firstFailed=' + firstFailedBase + ', selected=' + base + '.');
            }
            return response.json();
          } catch (error) {
            lastError = error;
            if (i + 1 < bases.length) {
              fallbackCount += 1;
              if (!firstFailedBase) {
                firstFailedBase = base;
                log('Read-only fallback triggered for ' + fn + ' on ' + network + '; suppressing repetitive fallback logs.');
              }
            }
          }
        }
        if (fallbackCount > 0) {
          log('Read-only fallback exhausted for ' + fn + ' on ' + network + ': retries=' + fallbackCount + ', firstFailed=' + firstFailedBase + '.');
        }
        throw lastError || new Error('Read-only call failed on all endpoints for ' + network + '.');
      }

      async function fetchModuleBytesOnNetwork(moduleId, network) {
        var chunks = [];
        var index;
        for (index = 0; index < Number(CONFIG.maxChunksPerModule || 512); index += 1) {
          var body = await callReadOnly(network, 'get-chunk', [uintToCvHex(moduleId), uintToCvHex(index)]);

          if (!body || body.okay !== true || typeof body.result !== 'string') {
            if (index === 0) {
              throw new Error(body && body.cause ? String(body.cause) : 'Chunk read failed at index 0 for module ' + moduleId);
            }
            break;
          }

          var bytes = decodeBufferCv(body.result);
          if (!bytes.length) break;
          chunks.push(bytes);
        }

        if (!chunks.length) {
          throw new Error('No chunks loaded for module ' + moduleId + ' on ' + network);
        }

        return concatBytes(chunks);
      }

      async function fetchModuleBytes(moduleId) {
        var networks = Array.isArray(CONFIG.networkPriority) && CONFIG.networkPriority.length
          ? CONFIG.networkPriority.slice()
          : ['mainnet'];
        var i;
        var lastError = null;

        for (i = 0; i < networks.length; i += 1) {
          var network = networks[i];
          try {
            log('Fetching module ' + moduleId + ' from ' + network + '...');
            return await fetchModuleBytesOnNetwork(moduleId, network);
          } catch (error) {
            lastError = error;
            log('Module ' + moduleId + ' failed on ' + network + ': ' + (error && error.message ? error.message : String(error)));
          }
        }

        throw lastError || new Error('Failed to fetch module ' + moduleId);
      }

      function injectModule(module, sourceText) {
        if (module.mimeType === 'text/css') {
          var style = document.createElement('style');
          style.setAttribute('data-module-key', module.key);
          style.textContent = sourceText;
          document.head.appendChild(style);
          return;
        }

        var script = document.createElement('script');
        script.type = 'text/javascript';
        script.setAttribute('data-module-key', module.key);
        script.text = sourceText + '\n//# sourceURL=module-' + module.key + '-' + module.id + '.js';
        document.body.appendChild(script);
      }

      function validateConfig() {
        if (!CONFIG.contentContractAddress || !CONFIG.contentContractName || !CONFIG.senderAddress) {
          throw new Error('Set content contractAddress, contractName, and senderAddress in CONFIG.');
        }
        var i;
        for (i = 0; i < MODULES.length; i += 1) {
          if (!Number.isInteger(MODULES[i].id) || MODULES[i].id <= 0) {
            throw new Error('Set CONFIG.moduleIds.' + MODULES[i].key + ' to a minted inscription id (> 0).');
          }
        }
      }

      // v3: build the deep link to the secure runtime page where wallet
      // extensions inject real providers (top-level document). Used by the
      // "claim your score" flow on embedded surfaces.
      function buildRuntimeDeepLink() {
        var url =
          String(CONFIG.runtimeOrigin || 'https://xtrata.xyz').replace(/\/+$/, '') +
          '/runtime/?contractId=' +
          encodeURIComponent(CONFIG.contentContractAddress + '.' + CONFIG.contentContractName) +
          '&network=' +
          encodeURIComponent(CONFIG.scoreConfig.network || 'mainnet');
        if (Number(CONFIG.parentTokenId) > 0) {
          url += '&tokenId=' + encodeURIComponent(String(CONFIG.parentTokenId));
        }
        return url;
      }

      // v3: small capability API for the inscribed modules (main.js). Lets the
      // launcher ask the host to open the secure runtime without needing
      // popups (blocked in sandboxed iframes) and inspect bridge state.
      function installArcadeHostBridgeApi() {
        window.ArcadeHostBridge = {
          version: 'v3',
          hasBridge: function () {
            return hasHostWalletBridge();
          },
          getInfo: function () {
            return {
              hasBridge: hasHostWalletBridge(),
              hostOrigin: HOST_WALLET_BRIDGE.hostOrigin || null,
              sandboxed: !hasRealHttpOrigin(),
              runtimeUrl: buildRuntimeDeepLink()
            };
          },
          requestRuntimeOpen: function (payload) {
            var detail = payload && typeof payload === 'object' ? payload : {};
            detail.runtimeUrl = buildRuntimeDeepLink();
            detail.app = 'astro-blaster-standalone';
            emitHostWalletIntent('open-runtime', detail);
            return detail.runtimeUrl;
          }
        };
      }

      // v4 mobile: translate touch/pointer controls into the keyboard API the
      // existing game module already consumes. No game or scoring leaf changes.
      function installMobileControls() {
        var controls = document.getElementById('astro-mobile-controls');
        var gameContainer = document.getElementById('game-container');
        if (!controls || !gameContainer || window.AstroBlasterMobileControls) return;

        var pressed = Object.create(null);
        var pointerKeys = Object.create(null);
        var buttons = controls.querySelectorAll('[data-astro-key]');

        function resolveKey(name) {
          return name === 'Space' ? ' ' : name;
        }

        function resolveCode(key) {
          if (key === ' ') return 'Space';
          if (key.indexOf('Arrow') === 0) return key;
          return 'Key' + key.toUpperCase();
        }

        function findButton(key) {
          var wanted = key === ' ' ? 'Space' : key;
          var i;
          for (i = 0; i < buttons.length; i += 1) {
            if (buttons[i].getAttribute('data-astro-key') === wanted) return buttons[i];
          }
          return null;
        }

        function dispatchKey(type, key) {
          var event;
          try {
            event = new KeyboardEvent(type, {
              key: key,
              code: resolveCode(key),
              bubbles: true,
              cancelable: true
            });
          } catch (_) {
            event = document.createEvent('Event');
            event.initEvent(type, true, true);
            event.key = key;
            event.code = resolveCode(key);
          }
          document.dispatchEvent(event);
        }

        function press(key) {
          key = resolveKey(key);
          if (pressed[key]) return;
          pressed[key] = true;
          var button = findButton(key);
          if (button) {
            button.classList.add('is-pressed');
            button.setAttribute('aria-pressed', 'true');
          }
          dispatchKey('keydown', key);
        }

        function release(key) {
          key = resolveKey(key);
          if (!pressed[key]) return;
          delete pressed[key];
          var button = findButton(key);
          if (button) {
            button.classList.remove('is-pressed');
            button.setAttribute('aria-pressed', 'false');
          }
          dispatchKey('keyup', key);
        }

        function releaseAll() {
          Object.keys(pressed).forEach(release);
          pointerKeys = Object.create(null);
        }

        function mobilePreference() {
          var search = String(window.location && window.location.search || '');
          if (/(?:^|[?&])mobileControls=1(?:&|$)/.test(search)) return true;
          if (/(?:^|[?&])mobileControls=0(?:&|$)/.test(search)) return false;
          return (
            Number(navigator.maxTouchPoints || 0) > 0 ||
            (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
            window.innerWidth <= 760
          );
        }

        function refresh() {
          var visible = Boolean(mobilePreference() && gameContainer.querySelector('canvas'));
          controls.hidden = !visible;
          document.body.classList.toggle('astro-mobile-controls-active', visible);
          if (!visible) releaseAll();
          return visible;
        }

        function finishPointer(event) {
          var id = String(event.pointerId);
          var key = pointerKeys[id];
          if (key) {
            release(key);
            delete pointerKeys[id];
          }
          event.preventDefault();
        }

        Array.prototype.forEach.call(buttons, function (button) {
          button.setAttribute('aria-pressed', 'false');
          button.addEventListener('pointerdown', function (event) {
            var key = resolveKey(button.getAttribute('data-astro-key'));
            pointerKeys[String(event.pointerId)] = key;
            if (button.setPointerCapture) {
              try { button.setPointerCapture(event.pointerId); } catch (_) {}
            }
            press(key);
            event.preventDefault();
          });
          button.addEventListener('pointerup', finishPointer);
          button.addEventListener('pointercancel', finishPointer);
          button.addEventListener('lostpointercapture', finishPointer);
          button.addEventListener('contextmenu', function (event) { event.preventDefault(); });
        });

        // v5: floating-origin joystick. The thumb's touchdown point becomes the
        // stick origin; sliding past a small threshold presses the matching
        // arrow keys (with hysteresis so the axis doesn't flicker at the edge),
        // and lifting releases everything. Diagonals press both axes.
        var joystick = document.getElementById('astro-joystick');
        var knob = joystick ? joystick.querySelector('.astro-joystick-knob') : null;
        var JOY_PRESS_PX = 14;
        var JOY_RELEASE_PX = 8;
        var joyPointerId = null;
        var joyOrigin = null;

        function joystickAxes(dx, dy) {
          var axes = {
            ArrowLeft: dx <= -(pressed.ArrowLeft ? JOY_RELEASE_PX : JOY_PRESS_PX),
            ArrowRight: dx >= (pressed.ArrowRight ? JOY_RELEASE_PX : JOY_PRESS_PX),
            ArrowUp: dy <= -(pressed.ArrowUp ? JOY_RELEASE_PX : JOY_PRESS_PX),
            ArrowDown: dy >= (pressed.ArrowDown ? JOY_RELEASE_PX : JOY_PRESS_PX)
          };
          Object.keys(axes).forEach(function (key) {
            if (axes[key]) press(key);
            else release(key);
          });
        }

        function joystickKnob(dx, dy) {
          if (!knob || !joystick) return;
          var radius = (joystick.clientWidth || 128) / 2 - 27;
          var length = Math.sqrt(dx * dx + dy * dy);
          if (length > radius && length > 0) {
            dx = (dx / length) * radius;
            dy = (dy / length) * radius;
          }
          knob.style.transform = 'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px)';
        }

        function joystickReset() {
          joyPointerId = null;
          joyOrigin = null;
          if (joystick) joystick.classList.remove('is-active');
          if (knob) knob.style.transform = '';
          ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].forEach(release);
        }

        if (joystick) {
          joystick.addEventListener('pointerdown', function (event) {
            if (joyPointerId !== null) return;
            joyPointerId = event.pointerId;
            joyOrigin = { x: event.clientX, y: event.clientY };
            joystick.classList.add('is-active');
            if (joystick.setPointerCapture) {
              try { joystick.setPointerCapture(event.pointerId); } catch (_) {}
            }
            event.preventDefault();
          });
          joystick.addEventListener('pointermove', function (event) {
            if (event.pointerId !== joyPointerId || !joyOrigin) return;
            var dx = event.clientX - joyOrigin.x;
            var dy = event.clientY - joyOrigin.y;
            joystickAxes(dx, dy);
            joystickKnob(dx, dy);
            event.preventDefault();
          });
          var joystickEnd = function (event) {
            if (event.pointerId !== joyPointerId) return;
            joystickReset();
            event.preventDefault();
          };
          joystick.addEventListener('pointerup', joystickEnd);
          joystick.addEventListener('pointercancel', joystickEnd);
          joystick.addEventListener('lostpointercapture', joystickEnd);
          joystick.addEventListener('contextmenu', function (event) { event.preventDefault(); });
        }

        // v5: restart moved to the top bar, guarded by a two-tap confirm so a
        // stray thumb can never wipe a run mid-game.
        var restartBtn = document.getElementById('mobile-restart-btn');
        var restartConfirmTimer = null;

        function restartDisarm() {
          if (restartConfirmTimer) {
            clearTimeout(restartConfirmTimer);
            restartConfirmTimer = null;
          }
          if (restartBtn) {
            restartBtn.classList.remove('is-confirming');
            restartBtn.textContent = 'Restart';
          }
        }

        if (restartBtn) {
          restartBtn.addEventListener('click', function () {
            if (!restartBtn.classList.contains('is-confirming')) {
              restartBtn.classList.add('is-confirming');
              restartBtn.textContent = 'Sure?';
              restartConfirmTimer = setTimeout(restartDisarm, 2500);
              return;
            }
            restartDisarm();
            dispatchKey('keydown', 'r');
            dispatchKey('keyup', 'r');
          });
        }

        var observer = new MutationObserver(refresh);
        observer.observe(gameContainer, { childList: true, subtree: true });
        window.addEventListener('resize', refresh);
        window.addEventListener('orientationchange', refresh);
        window.addEventListener('blur', function () { releaseAll(); joystickReset(); restartDisarm(); });
        window.addEventListener('pagehide', function () { releaseAll(); joystickReset(); });
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) { releaseAll(); joystickReset(); }
        });

        window.AstroBlasterMobileControls = {
          version: 'v5-mobile',
          refresh: refresh,
          press: press,
          release: release,
          releaseAll: releaseAll,
          isVisible: function () { return !controls.hidden; },
          getState: function () { return { visible: !controls.hidden, pressed: Object.keys(pressed) }; }
        };
        refresh();
      }

      async function boot() {
        validateConfig();

        var debugEnabled = resolveRuntimeDebugEnabled();
        CONFIG.scoreConfig.debug = debugEnabled;
        // v3: keep score reads sandbox-safe — same absolute-first base policy
        // as module chunk loads.
        CONFIG.scoreConfig.apiBaseUrl = NETWORK_BASE[CONFIG.scoreConfig.network || 'mainnet'][0];
        CONFIG.scoreConfig.apiFallbackBaseUrls =
          NETWORK_BASE[CONFIG.scoreConfig.network || 'mainnet'].slice(1);
        window.ARCADE_ONCHAIN_CONFIG = window.ARCADE_ONCHAIN_CONFIG || CONFIG.scoreConfig;
        if (window.ARCADE_ONCHAIN_CONFIG && typeof window.ARCADE_ONCHAIN_CONFIG === 'object') {
          window.ARCADE_ONCHAIN_CONFIG.debug = debugEnabled;
        }
        window.ARCADE_ONCHAIN_DEBUG = debugEnabled;
        if (debugEnabled) {
          log('Arcade debug logging enabled via URL/config.');
        }

        installArcadeHostBridgeApi();
        installMobileControls();
        ensureHostWalletBridgeListener();
        installHostWalletBridgeProviderShim();
        installHostWalletBridgeSubmitter();
        if (!HOST_WALLET_BRIDGE.token) {
          // No token in the query string (typical for sandboxed embeds) —
          // ask any wallet-capable host to grant one.
          sendHostWalletHello();
        }

        var i;
        for (i = 0; i < MODULES.length; i += 1) {
          var module = MODULES[i];
          var bytes = await fetchModuleBytes(module.id);
          var text = decodeUtf8(bytes);
          injectModule(module, text);
          log('Loaded module ' + module.key + ' (' + module.id + ')');
        }

        log('All modules loaded. Standalone Astro Blaster should now be running.');
        hideLoaderPanelAfterBoot();
      }

      boot().catch(function (error) {
        log('FATAL: ' + (error && error.message ? error.message : String(error)));
        var errorOverlay = document.getElementById('error-overlay');
        var errorMsg = document.getElementById('error-msg');
        if (errorOverlay && errorMsg) {
          errorMsg.textContent = error && error.message ? error.message : String(error);
          errorOverlay.style.display = 'flex';
        }
      });
    })();
  </script>
</body>
</html>
