MEMORY {
    ZP:    start = $0000,   size = $0100, type = rw;
    RAM:   start = $0200,   size = $1E00, type = rw;
    ROM0:  start = $008000, size = $7FC0, type = ro, file = %O, fill = yes, fillval = $FF;
    HDR:   start = $00FFC0, size = $0040, type = ro, file = %O, fill = yes, fillval = $00;
    ROM1:  start = $018000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM2:  start = $028000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM3:  start = $038000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss;
    CODE:     load = ROM0, type = ro;
    RODATA:   load = ROM0, type = ro;
    HEADER:   load = HDR,  type = ro, offset = $00;
    VECTORS:  load = HDR,  type = ro, offset = $20;
    ASSET1:   load = ROM1, type = ro;
    ASSET2:   load = ROM2, type = ro;
    ASSET3:   load = ROM3, type = ro;
}
