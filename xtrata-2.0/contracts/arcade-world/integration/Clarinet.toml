# Integration project: the poster and world contracts against the REAL core source
# (xtrata-v3.2.3, deployed on mainnet as xtrata-v3-2-3). Generated copies of the two
# contracts live in contracts/ (see scripts/make-realcore.mjs).
[project]
name = 'xtrata-arcade-world-integration'
authors = []
telemetry = false
cache_dir = './.cache'
requirements = []

[contracts.sip009-nft-trait]
