[project]
name = "contracts"
description = ""
authors = []
telemetry = true
cache_dir = "./.cache"

[contracts.mock-xtrata-core]
path = "contracts/mock-xtrata-core.clar"
clarity_version = 3
epoch = "latest"

# Second instance of the mock used only to prove assert-core-contract rejects
# any conforming-but-unpinned core.
[contracts.mock-xtrata-core-b]
path = "contracts/mock-xtrata-core.clar"
clarity_version = 3
epoch = "latest"

[contracts.xtrata-collection-v3]
path = "contracts/xtrata-collection-v3.clar"
clarity_version = 3
epoch = "latest"

[contracts.xtrata-drops-v3]
path = "contracts/xtrata-drops-v3.clar"
clarity_version = 4
epoch = "latest"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }

# Check-checker settings:
# trusted_sender: if true, inputs are trusted after tx_sender has been checked.
# trusted_caller: if true, inputs are trusted after contract-caller has been checked.
# callee_filter: if true, untrusted data may be passed into a private function without a
# warning, if it gets checked inside. This check will also propagate up to the
# caller.
# More informations: https://www.hiro.so/blog/new-safety-checks-in-clarinet
