<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Twins collection</title>
<meta name="robots" content="noindex">
<script>
// The shared page is served at /forever-twins/collection/<key> (see public/_redirects).
// This folder index only forwards old ?key= links to that route.
(function () {
  var k = new URLSearchParams(location.search).get('key');
  location.replace(k && /^[a-z0-9-]+$/.test(k) ? '/forever-twins/collection/' + k : '/forever-twins/collections/');
})();
</script>
</head>
<body><p><a href="/forever-twins/collections/">All Forever Twins collections</a></p></body>
</html>
