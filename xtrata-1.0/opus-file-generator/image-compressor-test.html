<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image Compressor — self test</title>
<style>
  body { font-family: ui-monospace, Menlo, monospace; background:#101114; color:#e7ecf5; padding:20px; }
  .case { border:1px solid #333; border-radius:8px; padding:12px; margin:10px 0; }
  .ok { color:#74f0b4; } .bad { color:#ff7882; } .warn { color:#ffd479; }
  img { max-width:120px; border:1px solid #444; vertical-align:middle; margin-right:10px; }
  h2 { font-size:15px; }
  #summary { font-size:16px; margin:14px 0; }
</style>
</head>
<body>
<h1>Image Compressor — automated self test</h1>
<div id="summary">Running…</div>
<div id="out"></div>

<script type="module">
import { compressImage, humanSize, isCompressibleImage } from './image-compressor.js';

const out = document.getElementById('out');
const summary = document.getElementById('summary');
let pass = 0, fail = 0;

function log(html) { const d = document.createElement('div'); d.className='case'; d.innerHTML = html; out.appendChild(d); }
function assert(cond, msg) { if (cond) { pass++; return `<span class="ok">PASS</span> ${msg}`; } fail++; return `<span class="bad">FAIL</span> ${msg}`; }

// --- build synthetic test images as Files -----------------------------------
function canvasToFile(canvas, type, name) {
  return new Promise((res) => canvas.toBlob((b) => res(new File([b], name, { type })), type, 0.98));
}

function photoCanvas(w, h) {
  // Noisy gradient — behaves like a photo (many colours, no alpha).
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let y=0; y<h; y++) for (let x=0; x<w; x++) {
    const i=(y*w+x)*4;
    img.data[i]   = (x*255/w + Math.random()*40) & 255;
    img.data[i+1] = (y*255/h + Math.random()*40) & 255;
    img.data[i+2] = ((x+y)*255/(w+h) + Math.random()*40) & 255;
    img.data[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

function graphicCanvas(w, h) {
  // Flat blocks — few colours, opaque (logo/graphic-like).
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  const cols = ['#1b9e77','#d95f02','#7570b3','#e7298a'];
  for (let i=0;i<4;i++){ ctx.fillStyle=cols[i]; ctx.fillRect((i%2)*w/2,(i<2?0:h/2),w/2,h/2); }
  return c;
}

function alphaCanvas(w, h) {
  // Transparent background with a solid circle — has alpha.
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#ff5500';
  ctx.beginPath(); ctx.arc(w/2, h/2, Math.min(w,h)/3, 0, Math.PI*2); ctx.fill();
  return c;
}

async function run() {
  // 1) Photo, balanced auto -> should compress and pick JPEG or WebP, smaller.
  const photo = await canvasToFile(photoCanvas(900,700), 'image/png', 'photo.png');
  let r = await compressImage(photo, { mode:'balanced', outputFormat:'auto' });
  log(`<h2>Photo (PNG in, auto)</h2>
    <img src="${r.dataUrl || ''}">
    ${assert(r.status==='ok', 'status ok')}<br>
    ${assert(['JPEG','WEBP'].includes(r.report.format), 'chose JPEG/WebP, got '+r.report.format)}<br>
    ${assert(r.report.compressedBytes < r.report.originalBytes, `smaller (${humanSize(r.report.originalBytes)} → ${humanSize(r.report.compressedBytes)})`)}`);

  // 2) Graphic auto -> alpha false, should include PNG/WebP candidates, smaller.
  const gfx = await canvasToFile(graphicCanvas(600,600), 'image/png', 'logo.png');
  r = await compressImage(gfx, { mode:'small', outputFormat:'auto' });
  log(`<h2>Graphic (PNG in, smallest)</h2>
    <img src="${r.dataUrl || ''}">
    ${assert(r.status==='ok' || r.status==='skipped', 'status ok/skipped: '+r.status)}<br>
    ${assert(r.report.format!=null, 'picked a format: '+r.report.format)}`);

  // 3) Alpha image, auto -> must keep alpha => WebP or PNG, never JPEG.
  const alpha = await canvasToFile(alphaCanvas(500,500), 'image/png', 'sticker.png');
  r = await compressImage(alpha, { mode:'balanced', outputFormat:'auto' });
  log(`<h2>Alpha image (PNG in, auto)</h2>
    <img src="${r.dataUrl || ''}" style="background:repeating-conic-gradient(#444 0% 25%, #222 0% 50%) 0/16px 16px">
    ${assert(r.report.format !== 'JPEG', 'did NOT flatten alpha to JPEG, got '+r.report.format)}`);

  // 4) Resize: max long edge 200 on a 900px image.
  r = await compressImage(photo, { mode:'balanced', outputFormat:'webp', maxLongEdge:200 });
  log(`<h2>Resize to 200px long edge (WebP)</h2>
    ${assert(Math.max(r.report.compressedWidth, r.report.compressedHeight) === 200, `long edge = ${r.report.compressedWidth}×${r.report.compressedHeight}`)}<br>
    ${assert(r.report.format==='WEBP', 'forced WebP')}`);

  // 5) Forced PNG keeps alpha and is lossless.
  r = await compressImage(alpha, { mode:'high', outputFormat:'png' });
  log(`<h2>Forced PNG</h2>${assert(r.report.format==='PNG', 'format PNG')}`);

  // 6) Skip-if-larger: re-compressing an already tiny webp should skip.
  const tinyWebp = await canvasToFile(graphicCanvas(40,40), 'image/webp', 't.webp');
  r = await compressImage(tinyWebp, { mode:'high', outputFormat:'png', skipLarger:true });
  log(`<h2>Skip-if-larger (tiny webp → forced PNG)</h2>
    ${assert(r.status==='skipped' || r.report.compressedBytes < r.report.originalBytes, 'skipped or smaller: '+r.status)}`);

  // 7) Type gating
  log(`<h2>isCompressibleImage gating</h2>
    ${assert(isCompressibleImage({type:'image/png',name:'a.png'}), 'png allowed')}<br>
    ${assert(!isCompressibleImage({type:'video/mp4',name:'a.mp4'}), 'mp4 rejected')}<br>
    ${assert(!isCompressibleImage({type:'image/gif',name:'a.gif'}), 'gif rejected (animation safety)')}`);

  summary.innerHTML = fail===0
    ? `<span class="ok">ALL ${pass} CHECKS PASSED</span>`
    : `<span class="bad">${fail} FAILED</span>, ${pass} passed`;
  document.title = fail===0 ? `PASS ${pass}` : `FAIL ${fail}`;
}
run().catch(e => { summary.innerHTML = `<span class="bad">CRASH: ${e.message}</span>`; console.error(e); });
</script>
</body>
</html>
