<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proof of Free — three families</title>
<style>
  /* Live 3-up: one representative edition per family, rendered by the real
     engine rather than pasted stills, so the image is always truthful.
     ?a=1&b=15&c=28 overrides which editions are shown. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; height: 100%; }
  body { display: grid; place-items: center; font-family: Arial, Helvetica, sans-serif; color: #fff; }
  .sheet { width: 100vw; height: 100vh; display: grid; grid-template-rows: 1fr auto; gap: 3vmin; padding: 4vmin; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3vmin; min-height: 0; }
  .cell { position: relative; min-height: 0; display: grid; grid-template-rows: 1fr auto; gap: 1.6vmin; }
  .frame { position: relative; overflow: hidden; background: #000; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .label { text-align: center; font-size: 2.1vmin; letter-spacing: .18em; text-transform: uppercase; opacity: .62; }
  .label b { display: block; font-weight: 400; opacity: 1; margin-bottom: .35em; letter-spacing: .1em; }
  .foot { text-align: center; font-size: 2.4vmin; letter-spacing: .16em; text-transform: uppercase; opacity: .38; }
</style>
</head>
<body>
<div class="sheet">
  <div class="row" id="row"></div>
  <div class="foot">One system · three ways through</div>
</div>
<script>
const ENGINE = '../../artifacts/proof-of-free-recursive-engine-v3.html';
const TITLES = ["First Light","Free Passage","No Toll","Clear Threshold","Open Circuit","Zero Barrier","Unlocked Field","Common Key","Public Door","The Bare Minimum","The Way Through","Open Signal","Free Frequency","Unmetered","Clear Channel","No Interference","One Pulse","Public Wave","Silent Charge","Released Current","Zero Noise","Broadcast Free","One Name","Named Light","Public Key","Unbound Mark","Open Signature","Free State","Known Here","No Alias","Single Claim","Proof Held","Proof of Free"];
const p = new URLSearchParams(location.search);
const picks = [
  { n: Number(p.get('a') || 1),  family: 'Thresholds', range: '01–11' },
  { n: Number(p.get('b') || 15), family: 'Signals',    range: '12–22' },
  { n: Number(p.get('c') || 28), family: 'Names',      range: '23–33' }
];
document.getElementById('row').innerHTML = picks.map(({ n, family, range }) => `
  <div class="cell">
    <div class="frame"><iframe src="${ENGINE}#${n}" title="Proof of Free ${n}" scrolling="no"></iframe></div>
    <div class="label"><b>${family} · ${range}</b>${String(n).padStart(2,'0')} ${TITLES[n-1]}</div>
  </div>`).join('');
</script>
</body>
</html>
