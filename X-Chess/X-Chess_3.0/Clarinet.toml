[project]
name = "xchess-v3-local"
description = "Local X-Chess V3 contract; preserves V2 log ABI and adds immutable descriptors"
authors = ["Xtrata"]
telemetry = false
cache_dir = ".cache"
requirements = []

[contracts.xchess-core-v3]
path = "contracts/xchess-core-v3.clar"
clarity_version = 4
epoch = "latest"

[contracts.xchess-peer-v1]
path = "contracts/xchess-peer-v1.clar"
clarity_version = 4
epoch = "latest"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }
