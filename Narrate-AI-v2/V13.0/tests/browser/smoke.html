<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Narrate.AI — Frontend Smoke Tests</title>
<style>
    body { font-family: system-ui, sans-serif; background:#121214; color:#e1e1e6; margin:0; padding:24px; }
    h1 { font-size:1.2rem; }
    .muted { color:#a8a8b3; font-size:0.9rem; }
    #summary { font-weight:700; margin:14px 0; padding:10px 14px; border-radius:8px; display:inline-block; }
    #summary.pass { background:rgba(4,211,97,0.12); border:1px solid #04d361; color:#04d361; }
    #summary.fail { background:rgba(255,71,87,0.12); border:1px solid #ff4757; color:#ff4757; }
    #summary.run  { background:rgba(241,196,15,0.12); border:1px solid #f1c40f; color:#f1c40f; }
    ul { list-style:none; padding:0; max-width:900px; }
    li { padding:8px 12px; border-radius:6px; margin-bottom:6px; background:#1e1e24; border-left:3px solid #323238; font-size:0.9rem; }
    li.ok { border-left-color:#04d361; }
    li.bad { border-left-color:#ff4757; }
    li .err { color:#ff8a93; display:block; margin-top:4px; font-family:monospace; font-size:0.8rem; white-space:pre-wrap; }
    .tag { font-family:monospace; color:#6c5ce7; }
    iframe { width:1px; height:1px; opacity:0; position:absolute; pointer-events:none; }
</style>
</head>
<body>
<h1>Narrate.AI — Frontend Smoke Tests <span class="muted">(loads the real app in a hidden frame)</span></h1>
<div id="summary" class="run">Running…</div>
<ul id="results"></ul>
<iframe id="app" src="/"></iframe>

<script>
const results = [];
function record(name, ok, err){
    results.push({ name, ok, err });
    const li = document.createElement('li');
    li.className = ok ? 'ok' : 'bad';
    li.innerHTML = `<span class="tag">${ok ? 'PASS' : 'FAIL'}</span> ${name}` + (err ? `<span class="err">${String(err && err.stack || err)}</span>` : '');
    document.getElementById('results').appendChild(li);
}
async function run(name, fn){ try { await fn(); record(name, true); } catch(e){ record(name, false, e); } }
const assert = (cond, msg) => { if(!cond) throw new Error(msg || 'assertion failed'); };
const sleep = ms => new Promise(r=>setTimeout(r, ms));

const SAMPLE = [
    'Chapter 1',
    '',
    'This is the first chapter. It is short and sweet. The narrator speaks plainly.',
    '',
    'Chapter 2',
    '',
    'This is the second chapter. It also has a couple of sentences for good measure.'
].join('\n');

async function main(){
    const frame = document.getElementById('app');
    // Wait for the app frame + its deferred scripts (core.js, script.js init) to settle.
    await new Promise(res => { if(frame.contentWindow && frame.contentDocument && frame.contentDocument.readyState === 'complete') res(); else frame.addEventListener('load', res, { once:true }); });
    await sleep(600);

    const win = frame.contentWindow;
    const doc = frame.contentDocument;

    await run('core.js helpers are exposed on the app window', async () => {
        assert(win.NarrateCore, 'NarrateCore missing');
        assert(typeof win.splitTextIntoChunks === 'function', 'splitTextIntoChunks global missing');
        assert(typeof win.generateProjectId === 'function', 'generateProjectId global missing');
    });

    await run('splitTextIntoChunks respects the max length', async () => {
        const chunks = win.splitTextIntoChunks('The cat sat on the mat. '.repeat(60), 400);
        assert(chunks.length > 1, 'expected multiple chunks');
        assert(chunks.every(c => c.length <= 400), 'a chunk exceeded the max');
    });

    await run('generateProjectId is unique across calls', async () => {
        const a = win.generateProjectId({title:'X'}), b = win.generateProjectId({title:'X'});
        assert(a !== b, 'ids should be unique');
    });

    await run('escapeHtml neutralizes markup', async () => {
        assert(win.escapeHtml('<b>"x"</b>') === '&lt;b&gt;&quot;x&quot;&lt;/b&gt;', 'escape failed');
    });

    await run('Analyze parses the manuscript into chapters', async () => {
        doc.getElementById('manuscript').value = SAMPLE;
        doc.getElementById('btn-analyze').click();
        await sleep(100);
        assert(win.STATE.chapters.length === 2, 'expected 2 chapters, got ' + win.STATE.chapters.length);
        assert(win.STATE.chapters[0].chunks.length >= 1, 'chapter 1 should have chunks');
    });

    await run('Analyze assigns a unique, filesystem-safe project id', async () => {
        assert(/^[a-z0-9]+_[a-z0-9]+$/.test(win.STATE.project.id), 'unexpected id: ' + win.STATE.project.id);
    });

    await run('Re-analyzing identical text keeps the same id (cache reuse)', async () => {
        const id1 = win.STATE.project.id;
        doc.getElementById('btn-analyze').click();
        await sleep(80);
        assert(win.STATE.project.id === id1, 'id should be stable for identical text');
    });

    await run('Analyzing clearly different text mints a new id (no cross-book mixing)', async () => {
        const id1 = win.STATE.project.id;
        doc.getElementById('manuscript').value = 'Chapter 1\n\nA totally different book with different words entirely.';
        doc.getElementById('btn-analyze').click();
        await sleep(80);
        assert(win.STATE.project.id !== id1, 'a new id should be minted for new content');
        // restore the 2-chapter sample for later DOM tests
        doc.getElementById('manuscript').value = SAMPLE;
        doc.getElementById('btn-analyze').click();
        await sleep(80);
    });

    await run('renderTimeline builds one card per chapter', async () => {
        const cards = doc.querySelectorAll('#timeline-container .chapter-card');
        assert(cards.length === win.STATE.chapters.length, `expected ${win.STATE.chapters.length} cards, got ${cards.length}`);
    });

    await run('Expanding a chapter renders its chunk rows', async () => {
        win.STATE.chapters[0].collapsed = false;
        win.renderTimeline();
        const chunkNodes = doc.querySelectorAll('#timeline-container .chunk-item');
        assert(chunkNodes.length >= 1, 'expected chunk rows after expand');
    });

    await run('updatePlaybackHighlight is incremental (does NOT rebuild the timeline)', async () => {
        const firstChunk = win.STATE.chapters[0].chunks[0];
        const node = doc.getElementById('chunk-' + firstChunk.id);
        assert(node, 'chunk node should exist');
        node.dataset.sentinel = 'keep-me';                 // mark the live node
        win.STATE.activePlaybackId = 'chunk_' + firstChunk.id;
        win.updatePlaybackHighlight();
        const same = doc.getElementById('chunk-' + firstChunk.id);
        assert(same.dataset.sentinel === 'keep-me', 'node was rebuilt — highlight is not incremental');
        assert(same.classList.contains('status-playing'), 'active chunk should be highlighted');
    });

    await run('updatePlaybackHighlight clears the highlight when playback stops', async () => {
        win.STATE.activePlaybackId = null;
        win.updatePlaybackHighlight();
        const node = doc.querySelector('#timeline-container .chunk-item.status-playing');
        assert(!node, 'no chunk should remain highlighted');
    });

    await run('Inline header name updates the project custom title', async () => {
        const el = doc.getElementById('header-project-name');
        assert(el, 'header field missing');
        el.value = 'My Renamed Book';
        el.dispatchEvent(new win.Event('input', { bubbles:true }));
        assert(win.STATE.project.customTitle === 'My Renamed Book', 'customTitle not updated');
        assert(win.getEffectiveProjectName() === 'My Renamed Book', 'effective name not updated');
    });

    await run('importTextFromFile loads a .txt file into the manuscript', async () => {
        const file = new win.File(['Imported chapter text from a file.'], 'sample.txt', { type:'text/plain' });
        await win.importTextFromFile(file);
        assert(doc.getElementById('manuscript').value.indexOf('Imported chapter text') === 0, 'import did not populate manuscript');
    });

    const failed = results.filter(r => !r.ok).length;
    const summary = document.getElementById('summary');
    summary.className = failed ? 'fail' : 'pass';
    summary.textContent = failed ? `${failed} / ${results.length} tests FAILED` : `All ${results.length} tests passed ✓`;
    window.__SMOKE_RESULTS__ = { total: results.length, failed, results };
}

main().catch(e => {
    const summary = document.getElementById('summary');
    summary.className = 'fail';
    summary.textContent = 'Harness error: ' + (e && e.message || e);
    window.__SMOKE_RESULTS__ = { total: 0, failed: 1, error: String(e && e.stack || e) };
});
</script>
</body>
</html>
