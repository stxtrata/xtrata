      const dly=ac.createDelay(1.5),fb=ac.createGain(),wet=ac.createGain(),damp=ac.createBiquadFilter();
      damp.type="lowpass";
      if(data.audioFxIndex===1){dly.delayTime.value=.27;fb.gain.value=.32;wet.gain.value=.28;damp.frequency.value=2600}
      else if(data.audioFxIndex===2){dly.delayTime.value=.46;fb.gain.value=.55;wet.gain.value=.38;damp.frequency.value=1500}
      else{dly.delayTime.value=.11;fb.gain.value=.45;wet.gain.value=.33;damp.frequency.value=5200}
      master.connect(dly);dly.connect(damp);damp.connect(fb);fb.connect(dly);dly.connect(wet);wet.connect(ac.destination);
    }
    return ac;
  }
  const SCALESETS=[[0,2,4,7,9],[0,3,5,7,10],[0,2,3,5,7,9,10],[0,2,4,6,7,9,11],[0,1,3,5,7,8,10]];
  const rootHz=110*Math.pow(2,data.rootSemi/12);
  function hz(semi){return rootHz*Math.pow(2,semi/12)}
  function degHz(deg,oct){
    const sc=SCALESETS[data.tonalityIndex],L=sc.length;
    const o2=Math.floor(deg/L),i2=((deg%L)+L)%L;
    return hz(sc[i2]+12*(o2+(oct||0)));
  }
  function osc(freq,start,dur,type,gain,detune){
    const A=audio();if(!A||muted||!data.soundEnabled)return;
    const o=A.createOscillator(),g=A.createGain(),now=A.currentTime;
    o.type=type;o.frequency.setValueAtTime(freq,now+start);o.detune.value=detune||0;
    g.gain.setValueAtTime(.0001,now+start);
    g.gain.exponentialRampToValueAtTime(gain,now+start+.014);
    g.gain.exponentialRampToValueAtTime(.0001,now+start+dur);
    o.connect(g).connect(master);o.start(now+start);o.stop(now+start+dur+.05);
  }
  function brass(freq,start,dur,gain){
    const A=audio();if(!A||muted||!data.soundEnabled)return;
    const o=A.createOscillator(),f2=A.createBiquadFilter(),g=A.createGain(),now=A.currentTime;
    o.type="sawtooth";o.frequency.setValueAtTime(freq,now+start);
    f2.type="lowpass";f2.Q.value=1.2;
    f2.frequency.setValueAtTime(Math.max(80,freq*1.4),now+start);
    f2.frequency.exponentialRampToValueAtTime(freq*6,now+start+dur*.35);
    f2.frequency.exponentialRampToValueAtTime(Math.max(80,freq*1.8),now+start+dur);
    g.gain.setValueAtTime(.0001,now+start);
    g.gain.exponentialRampToValueAtTime(gain,now+start+.02);
    g.gain.exponentialRampToValueAtTime(.0001,now+start+dur);
    o.connect(f2).connect(g).connect(master);o.start(now+start);o.stop(now+start+dur+.05);
  }
  function voiceHz(f,start,dur,gain){
    switch(data.voiceIndex){
      case 0:osc(f,start,dur,"sine",gain);break;
      case 1:osc(f,start,dur,"triangle",gain*.8);osc(f,start,dur,"sine",gain*.35,9);break;
      case 2:brass(f,start,dur,gain*.75);break;
      case 3:osc(f,start,Math.min(dur,.35),"square",gain*.5);break;
      case 4:osc(f,start,dur,"sine",gain*.6);osc(f*2,start,dur*.9,"sine",gain*.28);osc(f*3,start,dur*.8,"sine",gain*.13);break;
    }
  }
  function note(deg,oct,start,dur,gain){voiceHz(degHz(deg,oct),start,dur,gain)}
  function noise(start,dur,gain,center,q){
    const A=audio();if(!A||muted||!data.soundEnabled)return;
    const len=Math.floor(A.sampleRate*dur),buf=A.createBuffer(1,len,A.sampleRate),ch=buf.getChannelData(0);
    let n=data.seed>>>0;for(let i=0;i<len;i++){n=(Math.imul(n,1664525)+1013904223)>>>0;ch[i]=((n/4294967295)*2-1)*(1-i/len)}
    const src=A.createBufferSource(),g=A.createGain();src.buffer=buf;g.gain.value=gain;
    if(center){const bp=A.createBiquadFilter();bp.type="bandpass";bp.frequency.value=center;bp.Q.value=q||4;src.connect(bp).connect(g).connect(master)}
    else src.connect(g).connect(master);
    src.start(A.currentTime+start);
  }
  function ceremony(){
    activateField();
    const A=audio();if(A&&A.state==="suspended")A.resume();
    burst=1;const T=data.tempo;
    switch(data.signalIndex){
      case 0: // FREE FIFTH — root, fifth and octave in a staggered swell
        voiceHz(hz(0),0,.95,.055);voiceHz(hz(7),.1,.9,.045);voiceHz(hz(12),.22,.95,.032);
        break;
      case 1: // ZERO BASS — sub root with a chip blip reply
        osc(hz(-12),0,.75,"sine",.11);osc(hz(-5),.04,.6,"sine",.04);
        noise(0,.05,.03,900,2);voiceHz(hz(12),.34,.18,.025);
        break;
      case 2: // CLAIM ARP — six steps up the scale, resolving an octave up
        for(let i=0;i<6;i++)note(i,0,i*T,.32,.042);
        note(0,1,6*T,.85,.05);
        break;
      case 3: // RECEIPT NOISE — thermal printer ticks, then the tear-off ding
        for(let i=0;i<8;i++)noise(i*T*.6,.04,.032,1100+i*380,7);
        voiceHz(hz(12),8*T*.6+.06,.55,.045);
        break;
      case 4: // PROOF BELL — inharmonic partials with long decay
        [1,2.76,5.40,8.93].forEach((r,i)=>osc(hz(12)*r,.006*i,1.5-.26*i,"sine",.05/(i+1)));
        break;
      case 5: // OPEN PING — two rising pings that bloom in the FX space
        voiceHz(hz(12),0,.3,.05);voiceHz(hz(19),.17,.55,.04);
        break;
      case 6: // PUBLIC CHORD — four scale tones sounded almost together
        [0,2,4,6].forEach((d,i)=>note(d,0,i*.02,1.15,.03));
        break;
      case 7: // SPONSOR SWEEP — a fast run up the scale under a rising noise wash
        for(let i=0;i<8;i++)note(i,0,i*T*.55,.22,.03);
        noise(0,.5,.016,700,1.5);noise(.28,.5,.016,2400,1.5);
        break;
      case 8: // ZERO PULSE — three rhythmic pulses, the last an octave up
        [0,T*1.7,T*3.4].forEach((t,i)=>{osc(hz(i===2?12:0),t,.13,"square",.04);noise(t,.03,.012,1500,4)});
        break;
      case 9: // WITNESS HEART — a two-beat heart, twice
        [[0],[.14],[.56],[.7]].forEach((x,i)=>osc(hz(-12),x[0],i%2?.12:.18,"sine",.08));
        break;
    }
    const fl=byId("flash");fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");
    byId("instructions").style.opacity="0";
    setTimeout(()=>byId("instructions").style.opacity="1",1800);
  }
  const stage=byId("stage");
  stage.addEventListener("pointerdown",e=>{if(e.target.closest("button")||e.target.closest("#info"))return;ceremony()});
  byId("audioBtn").addEventListener("click",e=>{e.stopPropagation();muted=!muted;setIconControl(byId("audioBtn"),muted?"◖":"◖))",muted?"Unmute sound":"Mute sound",!muted);if(!muted)ceremony()});
  byId("infoBtn").addEventListener("click",e=>{e.stopPropagation();byId("info").hidden=false});
  byId("closeInfo").addEventListener("click",()=>byId("info").hidden=true);
  addEventListener("keydown",e=>{
    if(e.code==="Space"){e.preventDefault();ceremony()}
    if(e.key.toLowerCase()==="m"){muted=!muted;setIconControl(byId("audioBtn"),muted?"◖":"◖))",muted?"Unmute sound":"Mute sound",!muted)}
    if(e.key.toLowerCase()==="i")byId("info").hidden=!byId("info").hidden;
    if(e.key.toLowerCase()==="r"){activateField();reset();burst=.55;queueFrame()}
    if(e.key==="Escape")byId("info").hidden=true;
  });
}
function makeArtifact(edition,cfg){
  const meta=deriveMeta(edition,cfg);
  const title=meta.name.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="${meta.palette[0]}">

<style>${ARTIFACT_CSS}</style>
</head>
<body>
<main id="stage" tabindex="0" aria-label="${title}">

  </div>
  <div class="controls">

  </div>
  <section class="hero">

      <div class="claim" id="claim"></div>
      <div class="message" id="message"></div>
    </div>
  </section>
  <div id="instructions">CLICK / TAP FOR THE SOUND CEREMONY · SPACE REPLAYS · I OPENS THE PROOF</div>
  <footer class="bottom">
    <div class="traits"><span class="pill" id="engine"></span><span class="pill" id="palette"></span><span class="pill" id="signal"></span><span class="pill" id="glyphPill"></span><span class="pill" id="markPill"></span><span class="pill" id="fxPill"></span><span class="pill accent" id="modifierPill" hidden></span></div>
    <div class="proof"><b id="proofCode"></b><span id="release"></span></div>
  </footer>
  <aside id="info" hidden>
    <button class="close" id="closeInfo" type="button" aria-label="Close proof information" title="Close proof information">×</button>

}

const QUERY=new URLSearchParams(location.search);
const requested=Number.parseInt(QUERY.get("edition"),10);
if(Number.isFinite(requested)&&requested>=1&&requested<=CFG.count){
  document.open();
  document.write(makeArtifact(requested,CFG));
  document.close();
}else{
  bootCollectionMaster();
}

function bootCollectionMaster(){
  const byId=id=>document.getElementById(id);
  const K=Math.round(Math.sqrt(CFG.count));
  const canvas=byId("mosaic"),ctx=canvas.getContext("2d"),tile=canvas.width/K;
  const stage=byId("stage"),world=byId("world"),selection=byId("selection"),musicOverlay=byId("musicOverlay");
  const cells=Array.from({length:CFG.count},(_,i)=>deriveMeta(i+1,CFG));
  let registry=new Map(),selected=0,scale=1,fit=.1,tx=0,ty=0;
  let drag=false,moved=false,sx=0,sy=0,stx=0,sty=0,refreshTimer=0;
  // The public master is always claim-gated. ?reveal=1 is an explicit,
  // pre-inscription test view and never changes claim state.
  const GATED=QUERY.get("reveal")!=="1";
  function isClaimed(ed){const c=registry.get(ed);return !!(c&&c.claimed)}
  function isRevealed(ed){return !GATED||isClaimed(ed)}
  const music=createMosaicMusicEngine({cfg:CFG,maxActive:32,allow:isRevealed,onState:s=>{
    renderMusicMarkers(musicOverlay,s,ed=>({row:cells[ed-1].gridRow,col:cells[ed-1].gridCol}),tile);
    byId("activeCount").textContent=s.active.size;
    byId("playStatus").textContent=s.active.size?(s.playing?"PLAYING":"PAUSED"):"CLICK A CLAIMED SQUARE";
    stage.classList.toggle("music-mode",s.active.size>0)
  }});
  // Start the recursive master as an instrument so a single cell click queues
  // that edition's loop without requiring a separate mode-switch interaction.
  music.setMode(true);
  function normaliseRegistry(input){
    const map=new Map();
    let list=input;
    if(input&&typeof input==="object"&&!Array.isArray(input)){
      if(Array.isArray(input.items))list=input.items;
      else if(Array.isArray(input.claims))list=input.claims;
      else list=Object.entries(input).map(([edition,value])=>Object.assign({edition:Number(edition)},value&&typeof value==="object"?value:{}));
    }
    if(!Array.isArray(list))list=[];
    for(const raw of list){
      if(!raw||typeof raw!=="object")continue;
      const edition=Number(raw.edition??raw.index??raw.tokenId??raw.id);
      if(!Number.isFinite(edition)||edition<1||edition>CFG.count)continue;
      const claim={
        edition,
        claimed:raw.claimed!==undefined?!!raw.claimed:!!(raw.owner||raw.inscription||raw.tx),
        inscription:String(raw.inscription??raw.inscriptionId??raw.itemId??""),
        contentUrl:String(raw.contentUrl??raw.itemUrl??raw.url??""),
        owner:String(raw.owner??raw.wallet??raw.address??""),
        ownerName:String(raw.ownerName??raw.name??raw.bns??raw.label??""),
        tx:String(raw.tx??raw.txid??raw.transaction??"")
      };
      map.set(edition,claim);
    }
    return map;
  }
  function mergeRegistry(next){for(const [k,v] of next)registry.set(k,Object.assign({},registry.get(k)||{},v))}
  mergeRegistry(normaliseRegistry(EMBEDDED_REGISTRY));

  function templateUrl(template,data){
    if(!template)return"";
    return String(template).replace(/\{(edition|inscription|owner|tx)\}/g,(_,k)=>encodeURIComponent(data[k]??""));
  }
  function artworkUrl(ed){
    const u=new URL(location.href);u.search="";u.hash="";u.searchParams.set("edition",ed);return u.toString();
  }
  function inscriptionUrl(claim,ed){
    if(claim&&claim.contentUrl)return claim.contentUrl;
    if(claim&&claim.inscription)return templateUrl(CFG.itemExplorerTemplate,{edition:ed,inscription:claim.inscription,owner:claim.owner,tx:claim.tx});
    return"";
  }
  function ownerUrl(claim,ed){
    return claim&&claim.owner?templateUrl(CFG.ownerExplorerTemplate,{edition:ed,inscription:claim.inscription,owner:claim.owner,tx:claim.tx}):"";
  }
  function txUrl(claim,ed){
    return claim&&claim.tx?templateUrl(CFG.txExplorerTemplate,{edition:ed,inscription:claim.inscription,owner:claim.owner,tx:claim.tx}):"";
  }
  function short(s,n=15){s=String(s||"");return s.length>n?s.slice(0,7)+"…"+s.slice(-6):s}
  function claimedCount(){let n=0;for(const c of registry.values())if(c.claimed)n++;return n}

  function draw(){
    ctx.fillStyle="#050607";ctx.fillRect(0,0,canvas.width,canvas.height);
    for(const m of cells){
      const x=m.gridCol*tile,y=m.gridRow*tile;
      const claim=registry.get(m.edition);
      if(GATED&&!(claim&&claim.claimed)){
        ctx.fillStyle="#08090a";ctx.fillRect(x,y,tile,tile);
        ctx.strokeStyle="rgba(255,255,255,.045)";ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,tile-1,tile-1);
        continue;
      }
      drawNftThumbnail(ctx,m,x,y,tile,tile);
      ctx.strokeStyle="rgba(255,255,255,.72)";ctx.lineWidth=Math.max(2,tile*.028);
      ctx.strokeRect(x+1,y+1,tile-2,tile-2);
    }
    byId("claimCount").textContent=claimedCount().toLocaleString();
  }

  function bounds(){return stage.getBoundingClientRect()}
  function calculateFit(){const r=bounds();fit=Math.min(r.width/canvas.width,r.height/canvas.height)*.965}
  function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;highlight(selected)}
  function fitAll(){calculateFit();scale=fit;const r=bounds();tx=(r.width-canvas.width*scale)/2;ty=(r.height-canvas.height*scale)/2;apply()}
  function zoom(factor,cx,cy){const r=bounds(),px=(cx??r.left+r.width/2)-r.left,py=(cy??r.top+r.height/2)-r.top,wx=(px-tx)/scale,wy=(py-ty)/scale;calculateFit();const next=Math.max(fit*.8,Math.min(Math.max(6,fit*24),scale*factor));tx=px-wx*next;ty=py-wy*next;scale=next;apply()}
  function editionAt(clientX,clientY){const r=bounds(),x=(clientX-r.left-tx)/scale,y=(clientY-r.top-ty)/scale;if(x<0||y<0||x>=canvas.width||y>=canvas.height)return 0;return Math.floor(y/tile)*K+Math.floor(x/tile)+1}
  function highlight(ed){
    if(!ed||!isRevealed(ed)){selection.hidden=true;return}
    const m=cells[ed-1];selection.hidden=false;selection.style.left=(m.gridCol*tile)+"px";selection.style.top=(m.gridRow*tile)+"px";selection.style.width=tile+"px";selection.style.height=tile+"px"
  }

  function setLink(id,url,enabled=true){
    const a=byId(id);a.href=url||"#";a.classList.toggle("disabled",!url||!enabled);a.setAttribute("aria-disabled",(!url||!enabled)?"true":"false")
  }
  function show(ed){
    if(!ed||!isRevealed(ed))return;selected=ed;highlight(ed);
    const m=cells[ed-1],claim=registry.get(ed)||null;
    byId("editionLabel").textContent=m.name;
    byId("traitLabel").textContent=`${m.engine} · ${m.paletteName} · ${m.signal}`;
    const ownerText=claim?(claim.ownerName||short(claim.owner)||"Owner pending"):"Owner pending";
    const ownerA=byId("ownerLink");ownerA.textContent=ownerText;
    const ownUrl=ownerUrl(claim,ed);ownerA.href=ownUrl||"#";ownerA.classList.toggle("disabled",!ownUrl);
    setLink("viewInscription",inscriptionUrl(claim,ed)||artworkUrl(ed),true);
    byId("selectedInfo").hidden=false;
  }

  function showFirstClaimed(){
    if(selected&&isRevealed(selected)){show(selected);return}
    const first=cells.find(m=>isRevealed(m.edition));
    selected=first?first.edition:0;highlight(selected);
    byId("selectedInfo").hidden=!selected
  }

  async function loadRegistry(manual=false){
    const url=QUERY.get("registry")==="off"?"":CFG.claimRegistryUrl;
    if(!url){byId("registryStatus").textContent="SNAPSHOT";draw();showFirstClaimed();return}
    byId("registryStatus").textContent="REFRESHING…";
    try{
      const res=await fetch(url,{cache:"no-store",headers:{accept:"application/json"}});
      if(!res.ok)throw new Error("HTTP "+res.status);
      const json=await res.json();registry=normaliseRegistry(json);draw();showFirstClaimed();
      byId("registryStatus").textContent="LIVE · "+new Date().toLocaleTimeString();
    }catch(err){
      byId("registryStatus").textContent="REGISTRY ERROR · USING SNAPSHOT";
      if(manual)console.error(err);
      draw();showFirstClaimed();
    }
    clearTimeout(refreshTimer);
    if(CFG.registryRefreshSeconds>0)refreshTimer=setTimeout(()=>loadRegistry(false),CFG.registryRefreshSeconds*1000);
  }

  stage.addEventListener("wheel",e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.00135),e.clientX,e.clientY)},{passive:false});
  stage.addEventListener("pointerdown",e=>{if(e.target.closest("button,a"))return;drag=true;moved=false;sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;stage.setPointerCapture(e.pointerId);stage.classList.add("drag")});
  stage.addEventListener("pointermove",e=>{if(drag){const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)>4)moved=true;tx=stx+dx;ty=sty+dy;apply()}});
  stage.addEventListener("pointerup",()=>{drag=false;stage.classList.remove("drag")});
  stage.addEventListener("click",e=>{
    if(moved||e.target.closest("button,a"))return;
    const ed=editionAt(e.clientX,e.clientY);if(!ed||!isRevealed(ed))return;
    show(ed);music.toggle(ed)
  });
  byId("fitAll").onclick=fitAll;
  byId("refreshRegistry").onclick=()=>loadRegistry(true);
  for(const id of ["viewInscription","ownerLink"])byId(id).addEventListener("click",e=>{if(e.currentTarget.classList.contains("disabled"))e.preventDefault()});
  const ro=typeof ResizeObserver!=="undefined"?new ResizeObserver(fitAll):null;if(ro)ro.observe(stage);
  draw();showFirstClaimed();requestAnimationFrame(fitAll);loadRegistry(false);
}
</script></body></html>
