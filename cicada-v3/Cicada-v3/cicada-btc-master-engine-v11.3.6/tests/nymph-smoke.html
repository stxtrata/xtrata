<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nymph Smoke</title>
    <style>
        html,body{margin:0;width:100%;height:100%;background:#0b110e;color:#d9c29a;font:13px ui-monospace,Menlo,Consolas,monospace;}
        #stage{position:absolute;inset:0;}
        #report{position:fixed;left:12px;top:12px;z-index:5;background:rgba(0,0,0,.72);padding:8px 10px;border:1px solid rgba(255,255,255,.2);max-width:420px;white-space:pre-wrap;}
    </style>
</head>
<body>
    <div id="stage"></div>
    <pre id="report">Running nymph smoke...</pre>
    <script type="module">
        import { renderCicadaNymph } from '../src/cicada-core.js?v=11.3.5';

        const rendered = renderCicadaNymph({
            seed: 42,
            mount: '#stage',
            pageStyles: false,
            interactive: false,
            instructionOverrides: { idleWander: false }
        });
        const root = rendered.cicada.root;
        const legIds = [
            'front-leg-left',
            'front-leg-right',
            'middle-leg-left',
            'middle-leg-right',
            'hind-leg-left',
            'hind-leg-right'
        ];
        const checks = {
            exported: typeof renderCicadaNymph === 'function',
            lifeStage: rendered.instructions.lifeStage === 'nymph',
            viewBox: root.querySelector('svg')?.getAttribute('viewBox') === '-100 -150 600 900',
            allLegs: legIds.every(id => root.getElementById(id)),
            fidget: root.querySelectorAll('#legs-layer .leg-ground-fidget').length === 6,
            noAdultWings: !root.querySelector('#left-wing,#right-wing,#left-hindwing,#right-hindwing,.wing-element'),
            noAntennae: !root.querySelector('#antennae'),
            nymphBody: Boolean(root.querySelector('#nymph-thorax') && root.querySelector('#head') && root.querySelector('#abdomen') && root.querySelector('#nymph-foreclaw-left') && root.querySelector('#nymph-foreclaw-right'))
        };
        checks.pass = Object.values(checks).every(Boolean);
        document.body.dataset.pass = String(checks.pass);
        document.getElementById('report').textContent = JSON.stringify(checks, null, 2);
        if (!checks.pass) throw new Error('Nymph smoke failed: ' + JSON.stringify(checks));
    </script>
</body>
</html>
