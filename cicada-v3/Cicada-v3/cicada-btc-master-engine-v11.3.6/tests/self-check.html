<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cicada.btc v11.3.4 — Self Check</title>
    <style>
        body{margin:0;padding:24px;background:#0b110e;color:#e8f5ee;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;line-height:1.5;}
        h1{color:#00ff88;font-size:18px;letter-spacing:.08em;}
        p{color:rgba(255,255,255,.62);max-width:760px;}
        #summary{margin:14px 0;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.12);font-size:14px;}
        #summary.pass{border-color:#00ff88;color:#7df0aa;}
        #summary.fail{border-color:#f06e6e;color:#ff9d9d;}
        ul{list-style:none;padding:0;max-width:760px;}
        li{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;gap:16px;font-size:13px;}
        .ok{color:#7df0aa;} .bad{color:#f06e6e;} .name{color:rgba(255,255,255,.85);}
        .detail{color:rgba(255,255,255,.5);font-size:12px;text-align:right;}
    </style>
</head>
<body>
    <h1>Cicada.btc Master Engine v11.3.4 — Self Check</h1>
    <p>Deterministic integrity checks for the generative engine. Serve the folder
       (<code>python3 -m http.server</code>) and open this page. Run
       <code>node tools/scaffold-from-v10.mjs</code> first so the renderer module is present.</p>
    <div id="summary">Running…</div>
    <ul id="results"></ul>

    <script type="module">
        import {
            COLLECTION_SIZE,
            buildCollectionMetadataAsync,
            getMetadataCSV,
            renderSignatureCall,
            decodeAudioFingerprint
        } from '../src/cicada-core.js?v=11.3.5';

        const results = document.getElementById('results');
        const summary = document.getElementById('summary');
        let passed = 0, failed = 0;

        function record(name, ok, detail = '') {
            ok ? passed++ : failed++;
            const li = document.createElement('li');
            li.innerHTML = `<span class="name">${ok ? '<span class="ok">PASS</span>' : '<span class="bad">FAIL</span>'} ${name}</span><span class="detail">${detail}</span>`;
            results.appendChild(li);
        }

        async function run() {
            // 1. Whole collection builds with no gaps.
            const meta = await buildCollectionMetadataAsync();
            record('All seeds build', meta.items.length === COLLECTION_SIZE, `${meta.items.length} / ${COLLECTION_SIZE} items`);

            const seedsSeen = new Set(meta.items.map(it => it.seed));
            let allSeeds = true;
            for (let s = 1; s <= COLLECTION_SIZE; s++) if (!seedsSeen.has(s)) { allSeeds = false; break; }
            record('Every seed 1..N present', allSeeds && seedsSeen.size === COLLECTION_SIZE, `${seedsSeen.size} unique seeds`);

            // 2. Ranks are a clean 1..N permutation.
            const ranks = meta.items.map(it => it.rank).sort((a, b) => a - b);
            let ranksOk = ranks.length === COLLECTION_SIZE;
            for (let i = 0; i < ranks.length; i++) if (ranks[i] !== i + 1) { ranksOk = false; break; }
            record('Ranks are a 1..N permutation', ranksOk, `min ${ranks[0]} max ${ranks[ranks.length - 1]}`);

            // 3. Metadata CSV has a header + one row per seed.
            const csvLines = getMetadataCSV().split('\n');
            record('metadata.csv row count', csvLines.length === COLLECTION_SIZE + 1, `${csvLines.length} lines`);

            // 4. Deterministic, byte-identical re-render + fingerprint round-trip.
            const sampleSeeds = [1, 2, 3, 33, 165, 495, 777, 1320, 2024, 3301];
            let determinismOk = true, fingerprintOk = true;
            const fpDetail = [];
            for (const seed of sampleSeeds) {
                const tier = meta.bySeed[seed].rarityTier;
                const a = renderSignatureCall(seed, tier);
                const b = renderSignatureCall(seed, tier);
                let identical = a.data.length === b.data.length;
                if (identical) for (let i = 0; i < a.data.length; i++) if (a.data[i] !== b.data[i]) { identical = false; break; }
                if (!identical) determinismOk = false;
                const decoded = decodeAudioFingerprint(a.data, a.sr);
                const recovered = decoded.seed === seed && decoded.ok;
                if (!recovered) { fingerprintOk = false; fpDetail.push(`#${seed}→${decoded.seed}${decoded.ok ? '' : '!'}`); }
                await new Promise(r => setTimeout(r, 0));
            }
            record('Byte-identical re-render (determinism)', determinismOk, `${sampleSeeds.length} sample seeds`);
            record('Fingerprint round-trip recovers seed', fingerprintOk, fingerprintOk ? `${sampleSeeds.length}/${sampleSeeds.length} recovered` : fpDetail.join(' '));

            // v11.3: bark placement and family checks.
            let barkPlacementOk = true;
            for (const seed of sampleSeeds) {
                const inst = mod.getRenderInstructionsForSeed(seed);
                if (!inst.barkPlacement || !Number.isFinite(inst.barkPlacement.scale)) { barkPlacementOk = false; break; }
            }
            record('Every seed has a bark placement', barkPlacementOk, `${sampleSeeds.length} sample seeds`);
            const barkFamilies = new Set(meta.items.map(it => it.barkFamily));
            const expectedFamilies = new Set(['deciduous-hardwood', 'australian-native', 'orchard-fruit', 'softwood-weeping']);
            record('Bark family distribution covers expected families', [...expectedFamilies].every(f => barkFamilies.has(f)), `${barkFamilies.size} families`);

            summary.textContent = failed === 0
                ? `ALL CHECKS PASSED (${passed}/${passed})`
                : `${failed} CHECK(S) FAILED — ${passed} passed, ${failed} failed`;
            summary.className = failed === 0 ? 'pass' : 'fail';
        }

        run().catch(err => {
            summary.textContent = 'Self check crashed: ' + err.message;
            summary.className = 'fail';
            console.error(err);
        });
    </script>
</body>
</html>
